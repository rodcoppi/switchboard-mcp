     * Recognizes the hub's own typed knock. Two shapes (dispatcher.ts):
     * "[switchboard] N new message(s) from: a, b. Use the check_messages …"
     * and the manual poke. Returns {count, senders} or null.
     */
    function parseNudgeLine(text) {
      const m = /^\s*\[switchboard\] (\d+) new message\(s\) from: (.+?)\. Use the check_messages tool/.exec(text || "");
      if (m) return { count: Number(m[1]), senders: m[2].split(",").map((x) => x.trim()).filter(Boolean) };
      if (/^\s*\[switchboard\] Manual nudge from operator\./.test(text || "")) return { count: 0, senders: [] };
      return null;
    }

    /**
     * The message(s) behind a nudge, from a message pool: sent BY one of the
     * nudge's senders TO this agent, at or before the nudge (60s of clock
     * slack), the `count` most recent, oldest first for reading order.
     */
    function nudgeQuoteCandidates(nudge, agentName, ts, pool) {
      const cutoff = ts ? Date.parse(ts) + 60000 : Infinity;
      const senders = new Set(nudge.senders);
      return pool
        .filter((m) => senders.has(m.from) && m.to === agentName && Date.parse(m.createdAt) <= cutoff)
        .sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt))
        .slice(-Math.max(nudge.count, 1));
    }

    /**
     * A nudge turn: the SWITCHBOARD's voice, flat — not the operator's card
     * (the line was typed into the pane by the hub, not by the human). The
     * peek unfolds the actual message(s): they live in the hub's own store,
     * the pane only ever carried the knock.
     */
    function buildNudgeTurn(nudge, it, agentName) {
      const turn = el("div", "chat-turn nudge");
      const avatar = el("div", "chat-avatar sb", "⇄");
      const body = el("div", "chat-turn-body");
      const meta = el("div", "chat-meta");
      meta.appendChild(el("span", "chat-role", "switchboard"));
      if (it.ts) {
        const t = el("span", "chat-time", fmtTime(it.ts));
        t.title = fmtFull(it.ts);
        meta.appendChild(t);
      }
      const bubble = el("div", "chat-bubble");
      bubble.textContent = String(it.text || "").replace(/^\s*\[switchboard\]\s*/, "");
      body.append(meta, bubble);
      if (nudge.senders.length) {
        const who = nudge.senders.map(displayOf).join(", ");
        const peek = el("button", "nudge-peek", `show what ${who} sent ▸`);
        peek.type = "button";
        const quotes = el("div", "nudge-quotes");
        quotes.hidden = true;
        peek.addEventListener("click", async () => {
          if (!quotes.hidden) {
            quotes.hidden = true;
            peek.textContent = `show what ${who} sent ▸`;
            return;
          }
          if (!quotes.childElementCount) {
            let found = nudgeQuoteCandidates(nudge, agentName, it.ts, state.messages);
            if (!found.length) {
              // Older than the loaded feed window — ask the store directly.
              try {
                const res = await fetch(`/api/messages?agent=${encodeURIComponent(agentName)}&limit=500`);
                const data = await res.json();
                const pool = Array.isArray(data) ? data : data.messages || [];
                found = nudgeQuoteCandidates(nudge, agentName, it.ts, pool);
              } catch { /* the miss note below says it */ }
            }
            if (!found.length) {
              quotes.appendChild(el("div", "nudge-quote-miss", "Message not in the loaded history."));
            }
            for (const m of found) {
              const q = el("div", "nudge-quote");
              q.append(
                el("div", "nudge-quote-head", `${displayOf(m.from)} · ${fmtTime(m.createdAt)}`),
                el("div", "nudge-quote-body", m.body),
              );
              quotes.appendChild(q);
            }
          }
          quotes.hidden = false;
          peek.textContent = `hide what ${who} sent ▾`;
        });
        body.append(peek, quotes);
      }
      turn.append(avatar, body);
      turn.__text = it.text;
      return turn;
    }

    function buildChatTurn(it, agentName) {
      const isUser = it.kind === "user";
      // The hub's typed knock is the SYSTEM's line, not the operator's words.
      if (isUser) {
        const nudge = parseNudgeLine(it.text || "");
        if (nudge) return buildNudgeTurn(nudge, it, agentName);
      }
      // An interrupt marker is a centred divider, not a bubble — the text came
      // from the CLI, not the operator (reference app's isInterruptMarker).
      if (isUser && /^\s*\[Request interrupted/i.test(it.text || "")) {
        const label = /for tool use/i.test(it.text)
          ? "Interrupted — tool use declined"
          : "Interrupted by the operator";
        const div = el("div", "chat-interrupt");
        div.append(el("span", "chat-interrupt-mark", "■"), el("span", null, label));
        return div;
      }
      // A provider API error the CLI injected as an assistant turn: a WARNING
      // callout, not a normal reply.
      if (!isUser && /^\s*API Error:/i.test(it.text || "")) {
        const box = el("div", "chat-apierror");
        box.append(
          el("div", "chat-apierror-eyebrow", "⚠ engine API error"),
          el("div", "chat-apierror-msg", it.text.replace(/^\s*API Error:\s*/i, "")),
          el("div", "chat-apierror-hint", "Provider-side failure — the reply above may be incomplete. Usually temporary; the agent can retry."),
        );
        return box;
      }
      const turn = el("div", `chat-turn ${it.kind}`);
      const shown = agentName ? displayOf(agentName) : "agent";
      const avatar = buildChatAvatar(isUser, agentName);
      const body = el("div", "chat-turn-body");
      const meta = el("div", "chat-meta");
      meta.appendChild(el("span", "chat-role", isUser ? "you" : shown));
      if (it.ts) {
        const t = el("span", "chat-time", fmtTime(it.ts));
        t.title = fmtFull(it.ts);
        meta.appendChild(t);
      }
      const bubble = el("div", "chat-bubble");
      renderMarkdownInto(bubble, it.text);
      body.append(meta, bubble);
      turn.append(avatar, body);
      // Stash the raw text (a JS property, not dataset — it carries newlines) so
      // markEditableUserTurns can refill the composer from it.
      turn.__text = it.text;
      return turn;
    }

    // The pencil glyph, via createElementNS to match agentLogo (never innerHTML).
    function editPencilSvg() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: "13", height: "13", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) svg.setAttribute(k, v);
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", "M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z");
      svg.appendChild(p);
      return svg;
    }
    // Read-only mirror: "editing" a sent message = loading it back into the
    // composer to change and resend. Dispatching 'input' runs autogrow.
    function loadIntoComposer(text) {
      const input = $("#chat-input");
      if (!input) return;
      input.disabled = false;
      input.value = text;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    function actionRailFor(turn) {
      let rail = turn.querySelector(":scope > .chat-turn-actions");
      if (!rail) {
        rail = el("div", "chat-turn-actions");
        turn.appendChild(rail);
      }
      return rail;
    }

    function copyGlyphSvg() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) svg.setAttribute(k, v);
      const front = document.createElementNS(ns, "rect");
      front.setAttribute("x", "8"); front.setAttribute("y", "8"); front.setAttribute("width", "12"); front.setAttribute("height", "12"); front.setAttribute("rx", "2");
      const back = document.createElementNS(ns, "path");
      back.setAttribute("d", "M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2");
      svg.append(back, front);
      return svg;
    }

    /**
     * Un-hard-wraps text for WhatsApp: agents draft messages wrapped at ~75
     * columns (and often INSIDE a code fence), and pasting that into WhatsApp
     * shows every ragged line break. Per paragraph block, when MOST lines are
     * long (the hard-wrap signature) the plain lines are joined into one —
     * bullets/numbered/quoted lines keep their own line, and their indented
     * continuations fold back into them. Blocks of short lines are left alone:
     * those breaks are intentional writing, not wrapping.
     */
    function unwrapForWhatsApp(sourceText) {
      const isMarker = (l) => /^\s*(?:•|☐|☑|>|\d+[.)]\s|[-*+]\s)/.test(l) || /^[BCP]\d+$/.test(l.trim());
      return String(sourceText)
        .split(/\n{2,}/)
        .map((block) => {
          const lines = block.split("\n");
          const plainLines = lines.filter((l) => l.trim() !== "" && !isMarker(l));
          const hardWrapped =
            plainLines.length >= 2 && plainLines.filter((l) => l.trim().length >= 55).length >= plainLines.length * 0.6;
          if (!hardWrapped) return block;
          const out = [];
          let buf = [];
          let lastWasMarker = false;
          for (const l of lines) {
            if (isMarker(l)) {
              if (buf.length) { out.push(buf.join(" ")); buf = []; }
              out.push(l.trimEnd());
              lastWasMarker = true;
            } else if (l.trim() === "") {
              if (buf.length) { out.push(buf.join(" ")); buf = []; }
            } else if (!buf.length && lastWasMarker && /^\s+/.test(l)) {
              out[out.length - 1] += " " + l.trim(); // a wrapped bullet's continuation
            } else {
              buf.push(l.trim());
              lastWasMarker = false;
            }
          }
          if (buf.length) out.push(buf.join(" "));
          return out.join("\n");
        })
        .join("\n\n");
    }

    /** Markdown → the small formatting subset WhatsApp actually understands. */
    function toWhatsAppText(source) {
      let text = String(source || "").replace(/\r\n?/g, "\n");
      const code = [];
      const bold = [];
      const plain = [];
      const hold = (list, value, kind) => {
        const token = `${kind}${list.length}`;
        list.push(value);
        return token;
      };
      // Fences: an agent drafting a MESSAGE often puts the prose in a fence,
      // and it must unwrap like any other text (fence markers dropped) — while
      // real code keeps its fence and every byte (``` is WhatsApp monospace).
      text = text.replace(/```[^\n]*\n?([\s\S]*?)```/g, (whole, body) => {
        const looksLikeCode =
          /[{};=\\]|<[a-zA-Z/]|^\s{4,}\S|\/\/|#!|^\s*(?:import|const|let|var|function|def|class|SELECT|curl|npm|git)\b/m.test(body);
        const lines = body.split("\n").filter((l) => l.trim() !== "");
        const avg = lines.length ? lines.reduce((s, l) => s + l.length, 0) / lines.length : 0;
        if (!looksLikeCode && avg >= 40) return hold(plain, unwrapForWhatsApp(body.trim()), "P");
        return hold(code, whole, "C");
      });
      // Inline code still passes through byte-for-byte: markdown punctuation
      // inside it is content, not formatting.
      text = text.replace(/`[^`\n]+`/g, (v) => hold(code, v, "C"));
      text = text.replace(/^#{1,6}\s+(.+)$/gm, (_, v) => hold(bold, v.replace(/^\*\*|\*\*$/g, ""), "B"));
      text = text.replace(/\*\*([^*\n](?:.*?[^*\n])?)\*\*/g, (_, v) => hold(bold, v, "B"));
      text = text.replace(/__([^_\n](?:.*?[^_\n])?)__/g, (_, v) => hold(bold, v, "B"));
      // Markdown's single-asterisk italic would become WhatsApp bold.
      text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1_$2_");
      text = text.replace(/~~([^~\n]+)~~/g, "~$1~");
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, "$1 — $2");
      text = text.replace(/^\s*[-*+]\s+\[ \]\s+/gm, "☐ ");
      text = text.replace(/^\s*[-*+]\s+\[[xX]\]\s+/gm, "☑ ");
      text = text.replace(/^\s*[-*+]\s+/gm, "• ");
      text = text.replace(/\n{3,}/g, "\n\n").trim();
      // Join the hard-wrapped lines (tokens survive as opaque line content).
      text = unwrapForWhatsApp(text);
      text = text.replace(/B(\d+)/g, (_, i) => `*${bold[Number(i)]}*`);
      text = text.replace(/C(\d+)/g, (_, i) => code[Number(i)]);
      text = text.replace(/P(\d+)/g, (_, i) => plain[Number(i)]);
      return text;
    }

    async function copyChatText(btn, text, whatsapp) {
      const value = whatsapp ? toWhatsAppText(text) : text;
      try {
        await navigator.clipboard.writeText(value);
        btn.classList.add("copied");
        const old = btn.title;
        btn.title = whatsapp ? "Copied for WhatsApp" : "Copied";
        setTimeout(() => { btn.classList.remove("copied"); btn.title = old; }, 1200);
      } catch {
        toast("Clipboard access was blocked by the browser.", "warn");
      }
    }

    function markCopyableTurns(threadEl) {
      if (!threadEl) return;
      for (const turn of threadEl.querySelectorAll(".chat-turn.user, .chat-turn.assistant")) {
        if (typeof turn.__text !== "string") continue;
        const rail = actionRailFor(turn);
        const copy = el("button", "chat-copy-btn");
        copy.type = "button";
        copy.title = "Copy message";
        copy.setAttribute("aria-label", "Copy message");
        copy.appendChild(copyGlyphSvg());
        copy.addEventListener("click", (ev) => { ev.stopPropagation(); copyChatText(copy, turn.__text, false); });
        const wa = el("button", "chat-copy-btn whatsapp", "WA");
        wa.type = "button";
        wa.title = "Copy for WhatsApp — convert Markdown formatting";
        wa.setAttribute("aria-label", "Copy message formatted for WhatsApp");
        wa.addEventListener("click", (ev) => { ev.stopPropagation(); copyChatText(wa, turn.__text, true); });
        rail.append(copy, wa);
      }
    }

    // After each render, only the LAST 5 user turns carry an edit pencil.
    function markEditableUserTurns(threadEl) {
      if (!threadEl) return;
      const turns = threadEl.querySelectorAll(".chat-turn.user");
      for (let i = Math.max(0, turns.length - 5); i < turns.length; i++) {
        const turn = turns[i];
        if (typeof turn.__text !== "string") continue;
        const btn = el("button", "chat-edit-btn");
        btn.type = "button";
        btn.title = "Edit — load this message into the composer";
        btn.setAttribute("aria-label", "Edit and resend this message");
        btn.appendChild(editPencilSvg());
        btn.addEventListener("click", (e) => { e.stopPropagation(); loadIntoComposer(turn.__text); });
        actionRailFor(turn).appendChild(btn);
      }
    }

    // The forward arrow glyph (corner-up-right), via createElementNS to match
    // editPencilSvg / agentLogo — never innerHTML.
    function fwdArrowSvg() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: "13", height: "13", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) svg.setAttribute(k, v);
      const poly = document.createElementNS(ns, "polyline");
      poly.setAttribute("points", "15 14 20 9 15 4");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M4 20v-7a4 4 0 0 1 4-4h12");
      svg.append(poly, path);
      return svg;
    }

    /** One forward popover open at a time; outside click / Esc close. */
    function closeFwdMenus() {
      document.querySelectorAll(".fwd-menu").forEach((m) => {
        m.hidden = true;
        const btn = m.previousElementSibling;
        if (btn) btn.setAttribute("aria-expanded", "false");
      });
    }
    document.addEventListener("click", closeFwdMenus);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeFwdMenus();
    });

    // The target list is rebuilt on every OPEN, not at render time: who is
    // online changes while the transcript sits still.
    function fillFwdMenu(menu, text) {
      menu.textContent = "";
      menu.appendChild(el("div", "fwd-menu-label", "forward to"));
      const targets = [...state.agents.values()].filter(
        (a) => a.status === "online" && a.name !== screenState.name,
      );
      if (targets.length === 0) {
        menu.appendChild(el("div", "fwd-menu-empty", "no other agent online"));
        return;
      }
      for (const a of targets) {
        const item = el("button", "fwd-menu-item", a.name);
        item.type = "button";
        item.title = `Type this message into ${a.name}'s pane (with a "forwarded from" prefix)`;
        item.addEventListener("click", (ev) => {
          ev.stopPropagation();
          closeFwdMenus();
          forwardChatText(a.name, text);
        });
        menu.appendChild(item);
      }
    }

    // Optimistic: the toast fires as the send starts; a failure follows up.
    function forwardChatText(target, text) {
      const prefixed = `[forwarded from ${screenState.name}] ${text}`;
      toast(`Forwarded to "${target}".`);
      sendChatMessage(target, prefixed).catch((err) => {
        toast(`Forward to "${target}" failed: ${err && err.message ? err.message : err}`, "warn");
      });
    }

    // After each render, the LAST 8 turns — user AND assistant — carry a
    // forward arrow. Same remove-and-recreate pass as markEditableUserTurns.
    function markForwardableTurns(threadEl) {
      if (!threadEl) return;
      const turns = threadEl.querySelectorAll(".chat-turn.user, .chat-turn.assistant");
      for (let i = Math.max(0, turns.length - 8); i < turns.length; i++) {
        const turn = turns[i];
        if (typeof turn.__text !== "string") continue;
        const wrap = el("div", "chat-fwd-wrap");
        const btn = el("button", "chat-fwd-btn");
        btn.type = "button";
        btn.title = "Forward — send this message to another agent";
        btn.setAttribute("aria-label", "Forward this message to another agent");
        btn.setAttribute("aria-expanded", "false");
        btn.appendChild(fwdArrowSvg());
        const menu = el("div", "fwd-menu");
        menu.hidden = true;
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const wasHidden = menu.hidden;
          closeMenus(); // the card kebab menus
          closeFwdMenus(); // any other forward popover
          if (!wasHidden) return; // this one was open — the closes above shut it
          fillFwdMenu(menu, turn.__text);
          menu.hidden = false;
          btn.setAttribute("aria-expanded", "true");
          // The casca scrolls: flip the menu up when the space below is short.
          menu.classList.remove("up");
          const view = $("#screen-chat");
          if (view) {
            const spaceBelow = view.getBoundingClientRect().bottom - btn.getBoundingClientRect().bottom;
            if (menu.getBoundingClientRect().height + 10 > spaceBelow) menu.classList.add("up");
          }
        });
        wrap.append(btn, menu);
        actionRailFor(turn).appendChild(wrap);
      }
    }

    // Monochrome operator marks, not a row of unrelated emoji. The eye still
    // reads the kind of action first, but it belongs to the terminal surface.
    const TOOL_ICON = {
      Bash: "$", exec: "$", Read: "R", Edit: "Δ", Write: "W", MultiEdit: "Δ",
      NotebookEdit: "Δ", Grep: "⌕", Glob: "⌕", WebFetch: "↗",
      WebSearch: "↗", Task: "⇥", TodoWrite: "✓",
    };
    function toolIcon(name) {
      return TOOL_ICON[name] || (name && name.startsWith("mcp__") ? "◇" : "·");
    }

    function wireDisclosure(trigger, owner, label) {
      trigger.tabIndex = 0;
      trigger.setAttribute("role", "button");
      trigger.setAttribute("aria-label", label);
      trigger.setAttribute("aria-expanded", "false");
      const toggle = () => {
        const open = owner.classList.toggle("open");
        trigger.setAttribute("aria-expanded", String(open));
      };
      trigger.addEventListener("click", toggle);
      trigger.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        toggle();
      });
    }

    // The agent's reasoning — a collapsible block, dim and set aside, like the
    // reference transcript's Thinking section. Collapsed by default.
    function buildThinkingBlock(it) {
      const box = el("div", "chat-thinking");
      const head = el("div", "chat-thinking-head");
      head.append(el("span", "chat-tool-caret", "▸"), el("span", "chat-thinking-label", "thinking"));
      const body = el("div", "chat-thinking-body");
      renderMarkdownInto(body, it.text);
      box.append(head, body);
      wireDisclosure(head, box, "Show agent thinking");
      return box;
    }

    function buildToolChip(it) {
      const chip = el("div", `chat-tool${it.isError ? " error" : ""}`);
      const head = el("div", "chat-tool-head");
      head.append(
        el("span", "chat-tool-caret", "▸"),
        el("span", "chat-tool-icon", toolIcon(it.name)),
        el("span", "chat-tool-name", it.name),
        el("span", "chat-tool-summary", it.summary.replace(new RegExp("^" + it.name + ":?\\s*"), "")),
      );
      if (it.isError) head.appendChild(el("span", "chat-tool-name", "· error"));
      const body = el("div", "chat-tool-body");
      // The call's input (command / file / pattern) …
      const inputText = toolInputText(it);
      if (inputText) body.appendChild(buildToolPre(it.name, inputText, it.name));
      // … then its result, diff-coloured for edits.
      if (it.result) body.appendChild(buildToolPre(null, it.result, it.name));
      chip.append(head, body);
      wireDisclosure(head, chip, `Show ${it.name} action details`);
      return chip;
    }

    // A small copy button that lifts `text` to the clipboard, with a brief tick.
    function copyButton(text) {
      const btn = el("button", "copy-btn", "copy");
      btn.type = "button";
      btn.title = "Copy to clipboard";
      btn.setAttribute("aria-label", "Copy action output");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(text).then(
          () => {
            btn.textContent = "copied";
            setTimeout(() => (btn.textContent = "copy"), 1200);
          },
          () => {
            btn.textContent = "failed";
            setTimeout(() => (btn.textContent = "copy"), 1200);
          },
        );
      });
      return btn;
    }

    function toolInputText(it) {
      const i = it.input || {};
      if (typeof i.command === "string") return i.command;
      if (typeof i.pattern === "string") return i.pattern;
      // Edit: show the before→after; Write: the content.
      if (typeof i.old_string === "string" || typeof i.new_string === "string") {
        return `- ${i.old_string || ""}\n+ ${i.new_string || ""}`;
      }
      if (typeof i.content === "string") return i.content;
      if (typeof i.file_path === "string") return i.file_path;
      return "";
    }

    // A <pre> for a tool's input/result, wrapped with a hover copy button.
    // `diffFor` set → colour +/- lines like a diff.
    function buildToolPre(label, text, diffFor) {
      const wrap = el("div", "chat-tool-pre");
      const pre = el("pre");
      const isDiff = diffFor === "Edit" || diffFor === "Write" || diffFor === "MultiEdit" || /^[-+] /m.test(text);
      if (isDiff) {
        for (const line of text.split("\n")) {
          const span = el(
            "span",
            line.startsWith("+") ? "diff-add" : line.startsWith("-") ? "diff-del" : null,
            line + "\n",
          );
          pre.appendChild(span);
        }
      } else {
        pre.textContent = text.length > 8000 ? text.slice(0, 8000) + "\n… (truncated)" : text;
      }
      wrap.append(pre, copyButton(text));
      return wrap;
    }

    /**
     * Real markdown via `marked` — tables, lists, code, the lot, like the
     * reference app (it uses react-markdown+remark-gfm; this is the vanilla
     * equivalent). marked emits an HTML string, so it is parsed into a detached
     * document, SANITIZED (drop script/style and every on-handler and
     * javascript: URL — the content is the operator's own agent on localhost,
     * but this costs nothing), then adopted. Finally file paths in the text
     * nodes become clickable preview links.
     */
    function renderMarkdownInto(container, text) {
      let html;
      try {
        html = window.marked.parse(text, { gfm: true, breaks: true });
      } catch {
        container.appendChild(document.createTextNode(text)); // never break on bad input
        return;
      }
      const doc = new DOMParser().parseFromString(html, "text/html");
      sanitizeNode(doc.body);
      linkifyPaths(doc.body);
      linkifyBareFiles(doc.body);
      wireMarkdownLinks(doc.body);
      while (doc.body.firstChild) container.appendChild(doc.body.firstChild);
      // Syntax colours for fenced code, once it is in the live document.
      if (window.hljs) {
        for (const block of container.querySelectorAll("pre code")) {
          try {
            window.hljs.highlightElement(block);
          } catch {
            /* highlighting is cosmetic — never let it break the message */
          }
        }
      }
      // A hover copy button on every fenced code block (like the reference app).
      for (const pre of container.querySelectorAll("pre")) {
        if (pre.closest(".code-wrap")) continue;
        const code = pre.querySelector("code");
        const wrap = el("div", "code-wrap");
        pre.replaceWith(wrap);
        wrap.append(pre, copyButton((code ? code.textContent : pre.textContent) || ""));
      }
    }

    // Removes anything that could execute; keeps the structure marked built.
    function sanitizeNode(root) {
      for (const el2 of [...root.querySelectorAll("script, style, iframe, object, embed")]) {
        el2.remove();
      }
      for (const el2 of root.querySelectorAll("*")) {
        for (const attr of [...el2.attributes]) {
          const n = attr.name.toLowerCase();
          if (n.startsWith("on") || (/^(href|src)$/.test(n) && /^\s*javascript:/i.test(attr.value))) {
            el2.removeAttribute(attr.name);
          }
        }
      }
    }

    // Walks the rendered markdown's TEXT nodes and turns file paths into
    // clickable preview links.
    //
    // INLINE code is linkified: `path/to/x.md` in backticks is how an agent
    // writes a path nearly every time, so skipping <code> meant skipping the
    // real case. A <pre> block is different — that is source code, where a path
    // is a string, not a thing to open — and <a> already points somewhere.
    function linkifyPaths(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement.closest("pre, a")) continue;
        FILE_PATH_RE.lastIndex = 0; // global regex: reset before each test
        BARE_URL_RE.lastIndex = 0;
        if (FILE_PATH_RE.test(node.nodeValue) || BARE_URL_RE.test(node.nodeValue)) targets.push(node);
      }
      for (const textNode of targets) {
        const frag = document.createDocumentFragment();
        appendTextWithPaths(frag, textNode.nodeValue);
        textNode.replaceWith(frag);
      }
    }

    /**
     * Markdown links whose href is a LOCAL file must never fall through to the
     * browser. `/home/x/file:48` otherwise becomes
     * `http://localhost:4577/home/x/file:48`, which looks like a broken site.
     * Return the actual path plus an optional source line.
     */
    function localFileTarget(value) {
      if (typeof value !== "string") return null;
      let raw = value.trim();
      if (!raw) return null;
      let filePath = null;
      let hashLine = null;
      if (/^file:/i.test(raw)) {
        try {
          const url = new URL(raw);
          if (url.protocol !== "file:") return null;
          filePath = decodeURIComponent(url.pathname);
          if (url.hostname && url.hostname !== "localhost") filePath = `//${url.hostname}${filePath}`;
          const hm = url.hash.match(/^#L?(\d+)$/i);
          if (hm) hashLine = Number(hm[1]);
        } catch {
          return null;
        }
      } else {
        try { raw = decodeURIComponent(raw); } catch { /* keep the literal href */ }
        // Known workstation roots only: a site-relative `/docs` link stays a
        // normal web link, while real local files route to the preview dock.
        if (!/^(?:~\/|\/(?:home|root|tmp|mnt|Users|opt|workspace|var\/tmp)\/)/.test(raw)) return null;
        filePath = raw.replace(/#L?\d+$/i, (h) => {
          hashLine = Number(h.replace(/\D/g, ""));
          return "";
        });
      }
      const suffix = filePath.match(/^(.*):(\d+)(?::\d+)?$/);
      if (suffix) {
        filePath = suffix[1];
        hashLine = Number(suffix[2]);
      }
      return filePath ? { path: filePath, line: hashLine } : null;
    }

    function wireLocalPathLink(link, filePath, line) {
      const open = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        openInlineFile(filePath, line);
      };
      link.classList.add("path-link");
      link.removeAttribute("href");
      link.setAttribute("role", "button");
      link.tabIndex = 0;
      link.title = `Preview ${filePath}${line ? ` at line ${line}` : ""}`;
      link.addEventListener("click", open);
      link.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") open(ev);
      });
    }

    function wireMarkdownLinks(root) {
      for (const link of root.querySelectorAll("a[href]")) {
        const target = localFileTarget(link.getAttribute("href"));
        if (target) {
          wireLocalPathLink(link, target.path, target.line);
          continue;
        }
        // Genuine web links should not replace the live dashboard.
        if (/^https?:/i.test(link.getAttribute("href") || "")) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      }
    }

    // Plain text, but file paths become clickable preview links (same detection
    // as the transcript). A relative path resolves against the agent whose chat
    // this is — its own cwd is what it was talking about.
    function appendTextWithPaths(container, text) {
      forUrlRuns(
        text,
        (url) => container.appendChild(bareUrlAnchor(url)),
        (seg) => {
          FILE_PATH_RE.lastIndex = 0;
          let last = 0;
          for (const match of seg.matchAll(FILE_PATH_RE)) {
            const p = match[0];
            if (match.index > last) container.appendChild(document.createTextNode(seg.slice(last, match.index)));
            const full = resolveAgentPath(p, screenState.name);
            const link = el("span", "path-link", p); // shows what the agent wrote
            wireLocalPathLink(link, full, null);
            container.appendChild(link);
            last = match.index + p.length;
          }
          if (last < seg.length) container.appendChild(document.createTextNode(seg.slice(last)));
        },
      );
    }

    // Bare filenames ("report.md") are ambiguous until the hub proves which
    // real file the agent meant. They stay plain text during resolution and
    // become interactive only after an exact, scoped match — no dead links for
    // domains such as example.com or ordinary dotted prose such as node.js.
    const mentionedFileCache = new Map();
    function resolveMentionedFile(agentName, filename, downloadsHint) {
      if (!agentName) return Promise.resolve(null);
      const key = `${agentName}\n${downloadsHint ? "downloads" : "project"}\n${filename.toLowerCase()}`;
      if (!mentionedFileCache.has(key)) {
        const params = new URLSearchParams({ file: filename });
        if (downloadsHint) params.set("hint", "downloads");
        mentionedFileCache.set(
          key,
          fetch(`/api/agents/${encodeURIComponent(agentName)}/files/resolve?${params}`)
            .then(async (res) => {
              const data = await res.json().catch(() => null);
              return res.ok && data && data.ok && typeof data.path === "string" ? data.path : null;
            })
            .catch(() => null),
        );
      }
      return mentionedFileCache.get(key);
    }

    function linkifyBareFiles(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement.closest("pre, a, .path-link")) continue;
        BARE_FILE_RE.lastIndex = 0;
        if (!BARE_FILE_RE.test(node.nodeValue)) continue;
        const context = node.parentElement.closest("p, li, blockquote")?.textContent || node.nodeValue;
        targets.push({ node, downloadsHint: /\bdownloads?\b/i.test(context) });
      }
      for (const { node: textNode, downloadsHint } of targets) {
        const frag = document.createDocumentFragment();
        let last = 0;
        BARE_FILE_RE.lastIndex = 0;
        for (const match of textNode.nodeValue.matchAll(BARE_FILE_RE)) {
          const filename = match[0];
          if (match.index > last) frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, match.index)));
          const candidate = el("span", null, filename);
          frag.appendChild(candidate);
          resolveMentionedFile(screenState.name, filename, downloadsHint).then((filePath) => {
            if (filePath) wireLocalPathLink(candidate, filePath, null);
          });
          last = match.index + filename.length;
        }
        if (last < textNode.nodeValue.length) frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
        textNode.replaceWith(frag);
      }
    }

    // =====================================================================
    // File preview. A path an agent named becomes a link; clicking it fetches
    // the file (scoped server-side) and shows it in a lightbox.
    // =====================================================================

    async function openPreview(filePath) {
      $("#preview-box").hidden = false;
      $("#preview-name").textContent = filePath.split("/").pop() || filePath;
      $("#preview-path").textContent = "";
      wirePreviewActions("#preview-browser", "#preview-reveal", null);
      const body = $("#preview-body");
      body.textContent = "";
      body.appendChild(el("div", "preview-status", "Loading…"));
      try {
        const res = await fetch(`/api/files/preview?path=${encodeURIComponent(filePath)}`);
        const data = await res.json();
        body.textContent = "";
        if (!data.ok) {
          body.appendChild(el("div", "preview-status stale", data.error || `HTTP ${res.status}`));
          return;
        }
        $("#preview-name").textContent = data.name;
        $("#preview-path").textContent = `${data.path} · ${fmtBytes(data.size)}`;
        wirePreviewActions("#preview-browser", "#preview-reveal", data.path);
        renderPreview(body, data);
      } catch (err) {
        body.textContent = "";
        body.appendChild(
          el("div", "preview-status stale", `Could not load: ${err && err.message ? err.message : err}`),
        );
      }
    }

    /**
     * Shows and wires the "browser" / "folder" pair on a preview head; null
     * hides the pair (loading, failure). These are STATIC nodes reused across
     * previews, so handlers are assigned (onclick), never stacked with
     * addEventListener. Every previewed file gets both doors — the server
     * decides what a browser tab does with it (render or download).
     */
    function wirePreviewActions(browserSel, revealSel, realPath) {
      const browser = $(browserSel);
      const reveal = $(revealSel);
      browser.hidden = reveal.hidden = realPath === null;
      browser.onclick = realPath === null
        ? null
        : () => window.open(`/api/files/raw?path=${encodeURIComponent(realPath)}`, "_blank", "noopener");
      reveal.onclick = realPath === null ? null : () => revealInFolder(realPath, reveal);
    }

    /** Windows Explorer opened on the file's folder with the file selected. */
    async function revealInFolder(filePath, btn) {
      btn.disabled = true;
      try {
        const res = await fetch("/api/files/reveal", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ path: filePath }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Could not show it in the folder (HTTP ${res.status}).`, "warn", 8000);
          return;
        }
        toast(`Showing ${filePath.split("/").pop()} in Explorer.`, "ok");
      } catch (err) {
        toast(`Could not show it in the folder: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        btn.disabled = false;
      }
    }

    function renderPreview(body, data, focusLine) {
      if (data.kind === "image") {
        const img = el("img", "preview-image");
        img.src = data.content; // a data: URL from the hub; loads nothing off-machine
        img.alt = data.name;
        body.appendChild(img);
        return;
      }
      if (data.kind === "pdf" || data.kind === "binary" || data.kind === "toolarge" || data.content === null) {
        // Nothing to render here — but the machine can almost certainly play or
        // show it, so this is a door, not a dead end (see fileopen.ts).
        const wrap = el("div", "preview-blocked");
        wrap.appendChild(
          el(
            "div",
            "preview-status",
            data.kind === "toolarge"
              ? `${fmtBytes(data.size)} — too big to preview here.`
              : data.kind === "pdf"
                ? "PDF — the dashboard cannot render one."
                : "Not text — nothing to show here.",
          ),
        );
        if (data.openable) {
          const open = el("button", "btn preview-open", "open in a system app");
          open.type = "button";
          open.title = `Hand ${data.name} to Windows and let it open with the default app`;
          open.addEventListener("click", () => openInSystemApp(data.path, open));
          wrap.appendChild(open);
        }
        body.appendChild(wrap);
        return;
      }
      // text / markdown / code: monospace, as-is. No markdown rendering and no
      // syntax highlighting — that would be a dependency; the raw file is the
      // honest preview and 90% of the value.
      const pre = el("pre", "preview-text");
      if (Number.isInteger(focusLine) && focusLine > 0) {
        const lines = String(data.content).split("\n");
        for (let i = 0; i < lines.length; i++) {
          const line = el("span", `preview-line${i + 1 === focusLine ? " target" : ""}`, lines[i] || "\u200b");
          line.dataset.line = String(i + 1);
          pre.appendChild(line);
        }
      } else {
        pre.textContent = data.content; // textContent: server data never touches innerHTML
      }
      body.appendChild(pre);
      if (Number.isInteger(focusLine) && focusLine > 0) {
        requestAnimationFrame(() => pre.querySelector(`.preview-line[data-line="${focusLine}"]`)?.scrollIntoView({ block: "center" }));
      }
    }

    /**
     * Hands a file to the Windows default app. The hub is the gate (scope +
     * an allowlist — it RUNS what it opens), so a refusal comes back as a plain
     * reason to show, not something to argue with here.
     */
    async function openInSystemApp(filePath, btn) {
      const prev = btn.textContent;
      btn.disabled = true;
      btn.textContent = "opening…";
      try {
        const res = await fetch("/api/files/open", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ path: filePath }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Could not open it (HTTP ${res.status}).`, "warn", 8000);
          return;
        }
        toast(`Opening ${filePath.split("/").pop()} in your system app.`, "ok");
      } catch (err) {
        toast(`Could not open it: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    /** Opens the agent's project folder (its cwd) in Windows Explorer. */
    async function openAgentFolder(name, item) {
      if (item) item.disabled = true;
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/folder`, { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Could not open the folder (HTTP ${res.status}).`, "warn", 8000);
          return;
        }
        toast(`Opening ${data.path} in Explorer.`, "ok");
      } catch (err) {
        toast(`Could not open the folder: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        if (item) item.disabled = false;
      }
    }

    function closePreview() {
      $("#preview-box").hidden = true;
      $("#preview-body").textContent = "";
    }

    function fmtBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(1)} MB`;
    }

    // =====================================================================
    // Inline file dock. A path clicked in the CHAT opens here, docked between
    // the transcript and the composer — read the file, keep typing. Height is
    // a WINDOW FRACTION persisted in localStorage, so the size you like
    // survives reloads. The lightbox stays for the Messages feed.
    // =====================================================================

    const INLINE_FRAC_KEY = "sb.inlineFileFrac";
    const INLINE_FRAC_DEFAULT = 0.42;
    const clampInlineFrac = (f) => Math.min(0.8, Math.max(0.15, f));

    function inlineFileFrac() {
      try {
        const v = Number(localStorage.getItem(INLINE_FRAC_KEY));
        if (Number.isFinite(v) && v > 0) return clampInlineFrac(v);
      } catch { /* storage unavailable: just use the default */ }
      return INLINE_FRAC_DEFAULT;
    }

    function applyInlineFrac(f) {
      $("#inline-file").style.maxHeight = `${(f * 100).toFixed(1)}vh`;
    }

    async function openInlineFile(filePath, focusLine) {
      // The dock only makes sense over an open chat; anywhere else, fall back
      // to the lightbox.
      if (screenState.name === null || screenState.mode !== "chat") {
        openPreview(filePath);
        return;
      }
      $("#inline-file").hidden = false;
      applyInlineFrac(inlineFileFrac());
      $("#inline-file-name").textContent = filePath.split("/").pop() || filePath;
      $("#inline-file-path").textContent = `${filePath}${focusLine ? ` · line ${focusLine}` : ""}`;
      wirePreviewActions("#inline-file-browser", "#inline-file-reveal", null);
      const body = $("#inline-file-body");
      body.textContent = "";
      body.appendChild(el("div", "preview-status", "Loading…"));
      try {
        const res = await fetch(`/api/files/preview?path=${encodeURIComponent(filePath)}`);
        const data = await res.json();
        body.textContent = "";
        if (!data.ok) {
          body.appendChild(el("div", "preview-status stale", data.error || `HTTP ${res.status}`));
          return;
        }
        $("#inline-file-name").textContent = data.name;
        $("#inline-file-path").textContent = `${data.path}${focusLine ? `:${focusLine}` : ""} · ${fmtBytes(data.size)}`;
        wirePreviewActions("#inline-file-browser", "#inline-file-reveal", data.path);
        renderPreview(body, data, focusLine); // lightbox renderer + optional source line
      } catch (err) {
        body.textContent = "";
        body.appendChild(
          el("div", "preview-status stale", `Could not load: ${err && err.message ? err.message : err}`),
        );
      }
    }

    function closeInlineFile() {
      const dock = $("#inline-file");
      if (dock.hidden) return;
      dock.hidden = true;
      $("#inline-file-body").textContent = ""; // a data: URL image can be MBs — drop it
    }

    // Drag the dock's top border: up = taller, down = shorter. Pointer capture
    // keeps the drag alive outside the 8px strip; double-click resets.
    function wireInlineFileResize() {
      const handle = $("#inline-file-resizer");
      let drag = null; // { startY, startF, frac }
      const persist = (f) => {
        try { localStorage.setItem(INLINE_FRAC_KEY, f.toFixed(3)); } catch { /* not persisted */ }
      };
      handle.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        const f = inlineFileFrac();
        drag = { startY: ev.clientY, startF: f, frac: f };
        handle.setPointerCapture(ev.pointerId);
        document.body.style.cursor = "row-resize";
        document.body.style.userSelect = "none";
      });
      handle.addEventListener("pointermove", (ev) => {
        if (!drag) return;
        // Moving UP (smaller clientY) = taller panel.
        drag.frac = clampInlineFrac(drag.startF + (drag.startY - ev.clientY) / window.innerHeight);
        applyInlineFrac(drag.frac);
      });
      const endDrag = () => {
        if (!drag) return;
        persist(drag.frac);
        drag = null;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      };
      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
      handle.addEventListener("dblclick", () => {
        persist(INLINE_FRAC_DEFAULT);
        applyInlineFrac(INLINE_FRAC_DEFAULT);
      });
    }

    // Drag the sidebar's right edge to widen/narrow the rail. Width is a viewer
    // preference (localStorage), applied as the --sidebar-w custom property;
    // double-click resets to the default.
    const SIDEBAR_KEY = "sb.sidebarWidth";
    const SIDEBAR_DEFAULT = 322;
    const clampSidebar = (w) => Math.min(560, Math.max(220, w));
    function savedSidebarWidth() {
      const v = Number(localStorage.getItem(SIDEBAR_KEY));
      return Number.isFinite(v) && v > 0 ? clampSidebar(v) : SIDEBAR_DEFAULT;
    }
    function applySidebarWidth(w) {
      document.documentElement.style.setProperty("--sidebar-w", `${w}px`);
    }
    function wireSidebarResize() {
      applySidebarWidth(savedSidebarWidth());
      const handle = $("#sidebar-resizer");
      let drag = null;
      handle.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        const w = savedSidebarWidth();
        drag = { startX: ev.clientX, startW: w, w };
        handle.setPointerCapture(ev.pointerId);
        handle.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      });
      handle.addEventListener("pointermove", (ev) => {
        if (!drag) return;
        drag.w = clampSidebar(drag.startW + (ev.clientX - drag.startX));
        applySidebarWidth(drag.w);
      });
      const end = () => {
        if (!drag) return;
        try { localStorage.setItem(SIDEBAR_KEY, String(Math.round(drag.w))); } catch { /* not persisted */ }
        drag = null;
        handle.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      };
      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
      handle.addEventListener("dblclick", () => {
        localStorage.removeItem(SIDEBAR_KEY);
        applySidebarWidth(SIDEBAR_DEFAULT);
      });
    }

    async function moveAgentToGroup(name, group) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/group`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ group }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Could not move the agent: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // agent_updated arrives over SSE too; applying it here keeps the
        // clicking tab snappy.
        mergeAgent(body.agent);
        draftGroups.delete(group); // it has a member now, so the hub knows it
        renderAgents();
        renderFeed(); // the transcript is filtered by group — the card just moved
        if (!$("#groups-box").hidden) renderGroupsPanel();
        toast(`"${name}" is now in the ${group} group.`);
      } catch (err) {
        toast(`Could not move the agent: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    async function removeAgent(name) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}`, {
          method: "DELETE",
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Remove failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // The SSE agent_removed event also arrives; removing locally keeps the
        // UI snappy for the click's own tab.
        dropAgent(name);
        toast(`Agent "${name}" removed from the registry (messages kept).`);
      } catch (err) {
        toast(`Remove failed: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    function dropAgent(name) {
      // state.agents is a Map (name -> agent), not an array.
      if (!state.agents.delete(name)) return;
      if (state.filter === name) state.filter = null;
      renderAgents();
      renderFeed();
    }

    // Group broadcast records (same broadcastId) into one visual row; single
    // messages stay one row. state.messages is newest-first (the API's order,
    // and unshift keeps it), but a transcript reads like a conversation —
    // oldest at the top, the newest at the bottom where you are looking — so
    // it is walked backwards here. Day dividers are inserted on the way.
    function feedRows() {
      const filter = state.filter;
      const q = (state.search || "").trim().toLowerCase();
      const hits = (m) =>
        !q ||
        (m.body || "").toLowerCase().includes(q) ||
        (m.from || "").toLowerCase().includes(q) ||
        (m.to || "").toLowerCase().includes(q);
      const seen = new Set();
      const rows = [];
      let day = null;

      for (let i = state.messages.length - 1; i >= 0; i--) {
        const m = state.messages[i];
        if (state.group && messageGroup(m) !== state.group) continue;
        let row;
        if (m.broadcastId) {
          if (seen.has(m.broadcastId)) continue;
          seen.add(m.broadcastId);
          const group = state.messages.filter((x) => x.broadcastId === m.broadcastId);
          if (filter && !group.some((x) => x.from === filter || x.to === filter)) continue;
          if (q && !group.some(hits)) continue;
          row = { kind: "broadcast", group };
        } else {
          if (filter && m.from !== filter && m.to !== filter) continue;
          if (q && !hits(m)) continue;
          row = { kind: "single", msg: m };
        }
        const stamp = startOfDay(new Date(m.createdAt));
        if (stamp !== day) {
          day = stamp;
          rows.push({ kind: "day", label: fmtDayLabel(m.createdAt) });
        }
        rows.push(row);
      }
      return rows;
    }

    // Wraps every occurrence of the query in the feed's TEXT nodes with a
    // <mark> — safe (text nodes only, no HTML), so a search shows WHERE it hit.
    function highlightHits(container, query) {
      const q = query.toLowerCase();
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement && node.parentElement.closest("mark, script, style")) continue;
        if (node.nodeValue.toLowerCase().includes(q)) targets.push(node);
      }
      for (const textNode of targets) {
        const text = textNode.nodeValue;
        const lower = text.toLowerCase();
        const frag = document.createDocumentFragment();
        let idx = 0;
        let pos;
        while ((pos = lower.indexOf(q, idx)) !== -1) {
          if (pos > idx) frag.appendChild(document.createTextNode(text.slice(idx, pos)));
          frag.appendChild(el("mark", "hit", text.slice(pos, pos + q.length)));
          idx = pos + q.length;
        }
        if (idx < text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
        textNode.parentNode.replaceChild(frag, textNode);
      }
    }

    function renderFeed() {
      const feed = $("#feed");
      // A transcript must not yank itself out from under someone reading back
      // through history: follow the newest only when they are already at the
      // bottom (or the feed is fresh and has no scroll yet).
      const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;

      feed.textContent = "";
      const rows = feedRows();
      if (rows.length === 0) {
        const q = (state.search || "").trim();
        feed.appendChild(
          el(
            "div",
            "empty-hint",
            q
              ? `Nothing in the transcript matches “${q}”.`
              : state.filter
                ? `No messages involving "${state.filter}".`
                : "No messages yet. Anything your agents say to each other shows up here.",
          ),
        );
        return;
      }
      for (const row of rows) {
        if (row.kind === "day") feed.appendChild(el("div", "day-divider", row.label));
        else feed.appendChild(row.kind === "broadcast" ? buildBroadcastRow(row.group) : buildMsgRow(row.msg));
      }
      if ((state.search || "").trim()) highlightHits(feed, state.search.trim());

      clampOverflowingBodies(feed);
      if (atBottom) feed.scrollTop = feed.scrollHeight;
    }

    /**
     * Hides the tail of any body taller than the clamp, behind a "Show more".
     *
     * Bodies are built already clamped, because overflow can only be measured
     * against the clamp — then the ones that FIT have it taken back off. They
     * must: the clamp carries a fade mask, and a mask on a body that never
     * overflowed just dims its last line for no reason (a two-line message
     * came out looking struck through).
     *
     * One read pass over the finished feed, one write pass after it —
     * interleaving them would force a reflow per bubble.
     */
    function clampOverflowingBodies(feed) {
      const bodies = feed.querySelectorAll(".msg-body");
      const overflowing = [];
      const fitting = [];
      for (const body of bodies) {
        // reads only
        (body.scrollHeight > body.clientHeight + 4 ? overflowing : fitting).push(body);
      }
      for (const body of fitting) body.classList.remove("clamped");
      for (const body of overflowing) {
        const more = el("button", "msg-more", "Show more");
        more.type = "button";
        more.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const collapsed = body.classList.toggle("clamped");
          more.textContent = collapsed ? "Show more" : "Show less";
        });
        body.after(more);
      }
    }

    /** "alpha to beta" — a sentence, not a diagram. */
    function buildMetaLine(from, to, opts) {
      const meta = el("div", "msg-meta");
      const showFrom = from === "operator" ? "operator" : displayOf(from);
      const showTo = to === "everyone" ? "everyone" : displayOf(to);
      const fromEl = el("span", `msg-from${from === "operator" ? " operator" : ""}`, showFrom);
      fromEl.title = from;
      const toEl = el("span", `msg-to${to === "everyone" ? " all" : ""}`, showTo);
      toEl.title = to;
      meta.append(fromEl, el("span", "msg-rel", "to"), toEl);
      if (opts && opts.extra) meta.appendChild(opts.extra);
      return meta;
    }

    function buildAvatar(name) {
      const av = el("div", "msg-avatar", monogram(name === "operator" ? name : displayOf(name)));
      av.style.background = name === "operator" ? "var(--accent)" : agentHue(name);
      av.title = name === "operator" ? name : displayOf(name);
      return av;
    }

    function buildFoot(createdAt, flag) {
      const foot = el("div", "msg-foot");
      const time = el("span", "msg-time", fmtTime(createdAt));
      time.title = fmtFull(createdAt);
      foot.append(time, flag);
      return foot;
    }

    // File paths agents name in messages. Two shapes:
    //   absolute/home — "/home/rod/x.md", "~/notes/y.md"
    //   RELATIVE      — "resultados/clip.mp4": agents talk about their own cwd
    //                   far more often than they spell it out, so a relative
    //                   path is the common case, not the exception. It is
    //                   resolved against the naming agent's cwd (resolveAgentPath).
    // Both still need a dir separator AND an extension, so ordinary prose is not
    // littered with false links (a bare "node.js" is never a link). The scope
    // check on the server is the real gate; this only decides what LOOKS
    // clickable. The lookbehind keeps the relative branch from starting
    // mid-token (e.g. inside a URL that was not autolinked).
    //
    // Two traps this shape exists to avoid, both of which it USED to fall into:
    //   "~/x.md" — "~" must be glued to the slash ("~?/"). Requiring a name char
    //     after "~" made the branch fail and the scan match "/x.md" instead: a
    //     DIFFERENT, absolute path.
    //   spaces  — a path segment may not contain one. Allowing it made
    //     "/a/b.md e tambem c/d.json" match as ONE path, swallowing the prose
    //     between them. A path with a real space in it is rare; eating sentences
    //     is not, so the space loses.
    // The ABSOLUTE branch carries a lookbehind too: without it, the path part
    // of any bare URL matched on its own ("http://localhost:8737/gen/x.png"
    // grew a path-link over "/gen/x.png" and the URL died split in half).
    const FILE_PATH_RE =
      /(?<![\w:@.\-\/])~?\/[\w.\-+@]+(?:\/[\w.\-+@]+)*\.[A-Za-z0-9]{1,8}|(?<![\w:/@.\-])[\w.\-+@]+(?:\/[\w.\-+@]+)+\.[A-Za-z0-9]{1,8}/g;
    // A filename without a directory is only a CANDIDATE. The UI asks the hub
    // to resolve it before adding link semantics, so this can be permissive
    // without turning every domain or version string into a false action.
    const BARE_FILE_RE =
      /(?<![\w\/@.:-])[A-Za-z_][\w+@.-]*\.[A-Za-z][A-Za-z0-9]{0,7}(?![\w\/@.-])/g;

    /**
     * Bare URLs in prose (agents love wrapping them in backticks, which kills
     * markdown autolinking): matched with trailing punctuation trimmed, so
     * "abre em http://localhost:8737/x.png." links the URL, not the period.
     */
    const BARE_URL_RE = /https?:\/\/[^\s<>"'`]+/g;
    function matchBareUrls(text) {
      BARE_URL_RE.lastIndex = 0;
      const out = [];
      for (const m of String(text || "").matchAll(BARE_URL_RE)) {
        let url = m[0].replace(/[.,;:!?]+$/, "");
        if (!url.includes("(")) url = url.replace(/[)\]]+$/, "").replace(/[.,;:!?]+$/, "");
        if (url.length > 10) out.push({ url, index: m.index });
      }
      return out;
    }

    /** Splits `text` into URL runs and plain runs, in order. */
    function forUrlRuns(text, onUrl, onText) {
      let cursor = 0;
      for (const { url, index } of matchBareUrls(text)) {
        if (index < cursor) continue;
        if (index > cursor) onText(text.slice(cursor, index));
        onUrl(url);
        cursor = index + url.length;
      }
      if (cursor < text.length) onText(text.slice(cursor));
    }

    function bareUrlAnchor(url) {
      const a = el("a", null, url);
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      return a;
    }

    /**
     * A RELATIVE path an agent named is relative to THAT agent's cwd — resolving
     * it against the hub's own cwd (what the server would do) is meaningless and
     * just 404s. Absolute and "~" paths pass through untouched; with no agent
     * context the raw text goes to the server, which judges it.
     */
    function resolveAgentPath(p, agentName) {
      if (p.startsWith("/") || p.startsWith("~")) return p;
      const a = agentName ? state.agents.get(agentName) : null;
      if (!a || !a.cwd) return p;
      return `${a.cwd.replace(/\/+$/, "")}/${p}`;
    }

    /**
     * Builds the message body as text nodes with clickable spans for any file
     * path. Stays XSS-safe like the rest of this file: createElement + text
     * nodes, never innerHTML — the path text goes in via textContent.
     */
    function buildBodyWithPaths(body, fromAgent) {
      const el2 = el("div", "msg-body clamped");
      forUrlRuns(
        body,
        (url) => {
          const a = bareUrlAnchor(url);
          a.addEventListener("click", (ev) => ev.stopPropagation()); // never toggle the feed filter
          el2.appendChild(a);
        },
        (seg) => {
          FILE_PATH_RE.lastIndex = 0;
          let last = 0;
          for (const match of seg.matchAll(FILE_PATH_RE)) {
            const p = match[0];
            if (match.index > last) el2.appendChild(document.createTextNode(seg.slice(last, match.index)));
            // A relative path belongs to the agent that WROTE the message.
            const full = resolveAgentPath(p, fromAgent);
            const link = el("span", "path-link", p);
            link.title = `Preview ${full}`;
            link.addEventListener("click", (ev) => {
              ev.stopPropagation(); // the card click toggles the feed filter
              openPreview(full);
            });
            el2.appendChild(link);
            last = match.index + p.length;
          }
          if (last < seg.length) el2.appendChild(document.createTextNode(seg.slice(last)));
        },
      );
      return el2;
    }

    /**
     * The recipient's REACTION to a read message: its first chat entry after
     * readAt (5s clock slack, 30min window), preferring the entry that names
     * the sender — the narration line the protocol asks for ("Switchboard:
     * agent X says…"). Pure; `aliases` carries name + display name.
     */
    function pickReaction(items, readAtMs, aliases) {
      const cutoff = readAtMs + 30 * 60000;
      const after = (items || []).filter(
        (it) =>
          it.kind === "assistant" &&
          it.text &&
          it.ts &&
          Date.parse(it.ts) >= readAtMs - 5000 &&
          Date.parse(it.ts) <= cutoff,
      );
      if (!after.length) return null;
      const low = aliases.map((a) => String(a || "").toLowerCase()).filter(Boolean);
      return after.find((it) => {
        const t = it.text.toLowerCase();
        return low.some((a) => t.includes(a));
      }) || after[0];
    }

    /**
     * One-shot read of an agent's conversation: the SSE's FIRST event is the
     * full parsed dump (last 200 items) — take it and hang up.
     */
    function fetchConversationOnce(name) {
      return new Promise((resolve) => {
        const sse = new EventSource(`/api/agents/${encodeURIComponent(name)}/conversation`);
        const bail = setTimeout(() => { sse.close(); resolve(null); }, 6000);
        sse.onmessage = (ev) => {
          clearTimeout(bail);
          sse.close();
          let parsed = null;
          try { parsed = JSON.parse(ev.data); } catch { /* resolve null below */ }
          resolve(parsed && !parsed.error && Array.isArray(parsed.items) ? parsed.items : null);
        };
        sse.onerror = () => { clearTimeout(bail); sse.close(); resolve(null); };
      });
    }

    /**
     * "✓ read" answers WHEN; this answers WHAT CAME OF IT. A read message
     * to an agent gets a "reaction ▸" toggle that unfolds the recipient's
     * first chat entry after the read — no new protocol, no acks waking
     * senders: the reaction already exists in the recipient's transcript,
     * the feed just could not see it.
     */
    function attachReactionPeek(bubble, m) {
      const foot = bubble.lastElementChild;
      const peek = el("button", "nudge-peek msg-reaction", "reaction ▸");
      peek.type = "button";
      const quotes = el("div", "nudge-quotes");
      quotes.hidden = true;
      peek.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if (!quotes.hidden) {
          quotes.hidden = true;
          peek.textContent = "reaction ▸";
          return;
        }
        if (!quotes.childElementCount) {
          peek.textContent = "reaction …";
          const items = await fetchConversationOnce(m.to);
          const hit = items
            ? pickReaction(items, Date.parse(m.readAt), [m.to, displayOf(m.to)])
            : null;
          if (!hit) {
            quotes.appendChild(
              el("div", "nudge-quote-miss", "No reaction visible in the recent chat — open the agent to see more."),
            );
          } else {
            const q = el("div", "nudge-quote");
            const text = hit.text.length > 700 ? hit.text.slice(0, 700) + " …" : hit.text;
            q.append(
              el("div", "nudge-quote-head", `${displayOf(m.to)} · ${fmtTime(hit.ts)}`),
              el("div", "nudge-quote-body", text),
            );
            quotes.appendChild(q);
          }
        }
        quotes.hidden = false;
        peek.textContent = "reaction ▾";
      });
      if (foot) foot.appendChild(peek);
      bubble.appendChild(quotes);
    }

    function buildBubble(from, to, body, createdAt, flag, extra) {
      const bubble = el("div", "msg-bubble");
      bubble.appendChild(buildMetaLine(from, to, { extra }));
      bubble.appendChild(buildBodyWithPaths(body, from));
      bubble.appendChild(buildFoot(createdAt, flag));
      return bubble;
    }

    function buildMsgRow(m) {
      const row = el("div", "msg-row");
      row.classList.add(m.readAt ? "read" : "unread");
      if (m.from === "operator") row.classList.add("from-operator");
      const flag = m.readAt
        ? Object.assign(el("span", "msg-read-flag read", "✓ read"), { title: fmtFull(m.readAt) })
        : el("span", "msg-read-flag pending", "• unread");
      row.appendChild(buildAvatar(m.from));
      const bubble = buildBubble(m.from, m.to, m.body, m.createdAt, flag);
      // Reaction peek: only for READ messages addressed to an AGENT (the
      // operator has no transcript to look into).
      if (m.readAt && m.to !== "operator") attachReactionPeek(bubble, m);
      row.appendChild(bubble);
      return row;
    }

    function buildBroadcastRow(group) {
      // All records of a broadcast share from + body; each has its own to/readAt.
      const first = group[0];
      const row = el("div", "msg-row broadcast");
      if (first.from === "operator") row.classList.add("from-operator");
      const readCount = group.filter((x) => x.readAt).length;
      const flag = el(
        "span",
        `msg-read-flag ${readCount === group.length ? "read" : "pending"}`,
        `read by ${readCount} of ${group.length}`,
      );
      flag.title = group.map((x) => `${x.to}: ${x.readAt ? "read" : "unread"}`).join(" · ");
      const extra = el("span", "msg-rel", `(${group.length} agents)`);
      row.appendChild(buildAvatar(first.from));
      row.appendChild(buildBubble(first.from, "everyone", first.body, first.createdAt, flag, extra));
      return row;
    }

    /** The datalist behind the launcher's group field: the rooms you have. */
    function renderGroupOptions() {
      const list = $("#group-options");
      list.textContent = "";
      for (const group of allGroups()) {
        const opt = el("option");
        opt.value = group;
        list.appendChild(opt);
      }
    }

    function renderFilterBar() {
      const bar = $("#filter-bar");
      if (state.filter) {
        bar.classList.add("active");
        $("#filter-target").textContent = state.filter;
      } else {
        bar.classList.remove("active");
        $("#filter-target").textContent = "";
      }
    }

    function setFilter(name) {
      state.filter = state.filter === name ? null : name;
      renderFilterBar();
      renderFeed();
      // Re-render cards so the .active highlight follows the filter.
      for (const card of document.querySelectorAll(".agent-card")) {
        card.classList.toggle("active", card.dataset.name === state.filter);
      }
    }

    // =====================================================================
    // SSE handling
    // =====================================================================

    // Long-session hygiene: the server caps GET /api/messages at limit=200, but
    // the live stream unshifts forever. Bound the in-memory window so a
    // long-lived tab on a busy hub doesn't grow unbounded and feedRows() (O(n)
    // per broadcast) doesn't slow down with session length.
    const MAX_MESSAGES = 1000;

    function onMessageCreated(m) {
      if (state.msgIds.has(m.id)) return; // dedup vs bootstrap / our own POST
      state.msgIds.add(m.id);
      state.messages.unshift(m);
      if (state.messages.length > MAX_MESSAGES) {
        const dropped = state.messages.splice(MAX_MESSAGES);
        for (const d of dropped) state.msgIds.delete(d.id);
      }
      const recipient = state.agents.get(m.to);
      if (recipient) {
        recipient.unreadCount = (recipient.unreadCount || 0) + 1;
        renderAgents();
      }
      renderFeed();
    }

    // A read can reference a message outside our loaded window (older than the
    // bootstrap limit, or created during a disconnect gap): the per-message
    // delta can't apply, so pull the authoritative unreadCount from /api/agents
    // instead of letting the recipient's badge drift upward. Guarded so a burst
    // of such reads can't stampede the endpoint.
    let agentsRefetchInFlight = false;
    function refetchAgentsAuthoritative() {
      if (agentsRefetchInFlight) return;
      agentsRefetchInFlight = true;
      loadAgents()
        .then(() => {
          renderAgents();
        })
        .catch(() => {
          /* non-fatal: nudge_sent resync and the next reconnect reconcile too */
        })
        .finally(() => {
          agentsRefetchInFlight = false;
        });
    }

    function onMessageRead({ messageId, readAt }) {
      const m = state.messages.find((x) => x.id === messageId);
      if (!m) {
        refetchAgentsAuthoritative();
        return;
      }
      if (!m.readAt) {
        m.readAt = readAt;
        const recipient = state.agents.get(m.to);
        if (recipient) {
          recipient.unreadCount = Math.max(0, (recipient.unreadCount || 0) - 1);
          renderAgents();
        }
      }
      renderFeed();
    }

    function pulseNudge(name) {
      const btn = document.querySelector(`.nudge-btn[data-nudge-for="${CSS.escape(name)}"]`);
      if (!btn) return;
      btn.classList.remove("nudging");
      void btn.offsetWidth; // reflow to restart the animation
      btn.classList.add("nudging");
    }

    function onNudgeSent({ agent, at, unread }) {
      const a = state.agents.get(agent);
      if (a) {
        a.lastNudgeAt = at;
        // nudge_sent carries the authoritative unread at nudge time — resync.
        if (typeof unread === "number") a.unreadCount = unread;
        renderAgents();
      }
      pulseNudge(agent);
    }

    function handleSse(event) {
      switch (event.type) {
        case "agent_updated":
          mergeAgent(event.payload);
          renderAgents();
          break;
        case "message_created":
          onMessageCreated(event.payload);
          break;
        case "message_read":
          onMessageRead(event.payload);
          break;
        case "nudge_sent":
          onNudgeSent(event.payload);
          break;
        case "agent_removed":
          dropAgent(event.payload.name);
          break;
      }
    }

    // The stream carries NO event ids and the hub supports no Last-Event-ID
    // replay, so every event fired while we were disconnected (message_created,
    // message_read, agent_updated, nudge_sent) is lost. After ANY reconnect we
    // therefore reconcile the snapshot before trusting the stream again — this
    // mirrors the bootstrap ordering: loadMessages rebuilds state.messages +
    // msgIds and loadAgents refreshes the authoritative unreadCount, so the
    // stream once more only ever adds to a freshly reconciled view.
    let sseConnectedOnce = false;

    // The hub heartbeats every 25s, so silence past ~70s (three missed beats)
    // means the stream is dead rather than the network being quiet. EventSource
    // will not tell us: it only raises onerror when a socket visibly breaks, and
    // the way this one dies is invisible — the dashboard sits in a Windows
    // browser, the hub in WSL2, and WSL2's localhost proxy can drop the tunnel
    // (as can sleeping the laptop) with both ends still believing it is open.
    // The pill stayed green and the feed silently stopped until a reload.
    const SSE_SILENCE_LIMIT_MS = 70_000;
    let lastSseAt = 0;
    let sseWatchdog = null;

    function startSseWatchdog() {
      if (sseWatchdog) clearInterval(sseWatchdog);
      sseWatchdog = setInterval(() => {
        if (Date.now() - lastSseAt < SSE_SILENCE_LIMIT_MS) return;
        // Reopening resyncs through the onopen path, so nothing missed in the
        // gap stays missed.
        setConnState("reconnecting", "reconnecting");
        if (state.sse) state.sse.close();
        connectSse();
      }, 10_000);
    }

    function connectSse() {
      const es = new EventSource("/api/events");
      state.sse = es;
      lastSseAt = Date.now();
      startSseWatchdog();
      es.onopen = () => {
        lastSseAt = Date.now();
        if (!sseConnectedOnce) {
          // First connect: boot() already fetched the snapshot, so just go live
          // (re-fetching here would be a harmless duplicate, but we skip it).
          sseConnectedOnce = true;
          setConnState("live", "live");
          return;
        }
        // Reconnect after a gap (hub restart, laptop sleep/wake, socket drop):
        // resync before flipping the pill back to "live", so the header never
        // claims freshness over a view that silently missed events.
        Promise.all([loadAgents(), loadMessages()])
          .then(() => {
            renderAgents();
            renderFeed();
          })
          .catch(() => {
            toast("Failed to resync after reconnection.", "warn");
          })
          .finally(() => setConnState("live", "live"));
      };
      es.onmessage = (ev) => {
        lastSseAt = Date.now(); // any frame, heartbeat included, proves it lives
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return; // malformed frame
        }
        if (parsed.type === "heartbeat") return; // its only job is the timestamp above
        handleSse(parsed);
      };
      // EventSource reconnects on its own; we only surface the state so the
      // operator knows the feed is stale until it recovers.
      es.onerror = () => setConnState("reconnecting", "reconnecting");
    }

    // =====================================================================
    // Actions (REST)
    // =====================================================================

    async function toggleMute(name, muted) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/mute`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ muted }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to change mute (HTTP ${res.status}).`, "error");
          return;
        }
        mergeAgent(data.agent); // agent_updated will also arrive via SSE
        renderAgents();
        toast(`${name} ${muted ? "muted" : "unmuted"}.`, "ok");
      } catch {
        toast("Network failure while changing mute.", "error");
      }
    }

    async function forceNudge(name) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/nudge`, {
          method: "POST",
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          pulseNudge(name);
          toast(`Nudge sent to ${name}.`, "ok");
          return;
        }
        // 409 (unsafe pane / dead session), 404 (unknown), 501 (no
        // dispatcher). The hub message is already friendly — show it without breaking.
        toast(data.error || `Nudge not delivered to ${name} (HTTP ${res.status}).`, "warn");
      } catch {
        toast("Network failure while nudging.", "error");
      }
    }

    // Launch an agent from the dashboard: the hub creates the tmux session
    // running claude (POST /api/agents/launch). Success is confirmed by a
    // toast; the new agent card arrives via the agent_updated SSE. The hub
    // settles the session before answering (~2.5s, ~5s with the resume
    // fallback), so the button shows a busy state meanwhile. All feedback goes
    // through toast() → textContent (server data never touches innerHTML).
    /** The Claude|Codex segmented control's value (radios — one is always on). */
    function selectedAgentType() {
      const checked = document.querySelector('#launch-agent input[name="agentType"]:checked');
      return checked && checked.value === "codex" ? "codex" : "claude";
    }

    function closeLauncher() {
      $("#launcher-box").hidden = true;
      dirpickerClose();
      for (const id of ["#launch-dir", "#launch-name", "#launch-role", "#launch-group"]) {
        $(id).value = "";
      }
    }

    async function launchAgent(ev) {
      ev.preventDefault();
      const dir = $("#launch-dir").value.trim();
      if (dir.length === 0) {
        toast("Directory is required: the absolute path the agent should work in.", "warn");
        return;
      }
      const name = $("#launch-name").value.trim();
      const role = $("#launch-role").value.trim();
      // Empty → the hub decides: it keeps the group of an agent coming back, and
      // puts a brand new one in the default group. Sending "" would be a claim.
      const group = $("#launch-group").value.trim();
      const btn = $("#launch-btn");
      const prevLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "launching…";
      try {
        // openTerminal:false — launching no longer pops a Windows window on its
        // own. The agent comes up in tmux and on the rail; a window is something
        // you ask for, by clicking "window" on its card. (Owner's call: an
        // auto-window on every launch was noise you had to close.)
        const payload = {
          dir,
          continue: $("#launch-continue").checked,
          openTerminal: false,
          agentType: selectedAgentType(),
        };
