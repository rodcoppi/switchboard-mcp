<!DOCTYPE html>
<!-- lang=en: every string in this file is English (project convention D8), and
     a screen reader was announcing them with Portuguese pronunciation. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard</title>
  <!-- xterm.js: the ONE thing this page loads that it did not write itself, and
       the hub serves it from its own node_modules — nothing is fetched off this
       machine. It is a terminal EMULATOR, the piece you cannot hand-roll; the
       pty on the other end is tmux, not node-pty. -->
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <!-- marked: markdown for the chat casca (tables, lists, code) — the vanilla
       equivalent of the reference app's react-markdown+remark-gfm, served from
       node_modules so the page still fetches nothing off this machine. -->
  <script src="/vendor/marked/marked.umd.js"></script>
  <!-- highlight.js: syntax colours for code the agents write in the chat, also
       served from node_modules. The theme only touches .hljs elements. -->
  <link rel="stylesheet" href="/vendor/highlight/styles/atom-one-dark.min.css" />
  <script src="/vendor/highlight/highlight.min.js"></script>
  <!-- Inline favicon to avoid a /favicon.ico 404 in the hub logs. The mark is
       the "⇄" of the header and of the Windows shortcut icon (assets/switchboard.ico,
       drawn by scripts/make-icon.mjs) — same shape, same amber, one product. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230e141d'/%3E%3Cpath d='M2.6 6.2h8.1V4.3L14 7.1l-3.3 2.8V8H2.6z' fill='%23ffbf5e'/%3E%3Cpath d='M13.4 11.6H5.3v1.9L2 10.7 5.3 7.9v1.9h8.1z' fill='%23f5a623'/%3E%3C/svg%3E"
  />
  <style>
    /* =====================================================================
       SWITCHBOARD — operator's patchbay / signal console
       ---------------------------------------------------------------------
       DESIGN TOKENS live in the ONE :root block below and are a CONTRACT:
       the owner (a designer) reskins the whole console from here. The markup
       keeps stable semantic hooks (.agent-card, .msg-row, .status-dot, …)
       that the JS queries — never rename them; add/restyle freely.

       Identity: a telephone switchboard. Near-black cool slate panels, a
       single warm SIGNAL AMBER accent (telecom / CRT / brass jack), phosphor
       LEDs for presence. Mono-forward, because the subject is honest machine
       traffic. The rail is a PATCHBAY of jack rows; the feed is a TRANSCRIPT —
       chat bubbles, because that is what a human reads without being taught,
       each one naming who it was for, because these calls are directed and a
       chat room's "everyone hears everything" would be a lie here.
       ===================================================================== */
    :root {
      /* --- surfaces: zinc, tone-on-tone (owner-approved restyle 01/08) ----
         The room goes quiet: every surface is a step of the same near-black
         zinc, elevation is a shade, borders are one uniform hairline. The
         only colour left on screen is DATA — status LEDs, agent identity,
         the mascot. shadcn temperament throughout. */
      --bg:          #09090b;
      --bg-elev:     #101013;
      --bg-elev-2:   #141417;
      --bg-inset:    #050506;
      --bg-hover:    #17171a;
      --border:      #26262a;
      --border-soft: #1d1d20;
      --border-strong: #3a3a40;

      /* --- text: soft white -> dim -> faint ------------------------------ */
      --text:        #f4f4f5;
      --text-dim:    #a1a1aa;
      --text-faint:  #70707a;

      /* --- accent: quiet zinc "primary" (shadcn-style), no more amber ---- */
      --accent:        #e4e4e7;
      --accent-bright: #fafafa;
      --accent-fg:     #09090b;               /* text on filled primary */
      --accent-wash:   rgba(244, 244, 245, 0.06);
      --accent-line:   rgba(244, 244, 245, 0.28);

      /* --- selection: a lighter step of the same zinc -------------------- */
      --selected:      #d4d4d8;
      --selected-line: rgba(212, 212, 216, 0.42);
      --selected-wash: rgba(212, 212, 216, 0.06);

      /* --- status LEDs: small true dots, no glow halos ------------------- */
      --online:      #3fb950;
      --offline:     #52525b;
      --led-online:  0 0 0 3px rgba(63, 185, 80, 0.10);
      --led-offline: 0 0 0 3px rgba(82, 82, 91, 0.10);
      --led-amber:   0 0 0 3px rgba(217, 161, 61, 0.12);

      /* --- semantic roles (kept as the JS/markup expect) ---------------- */
      --unread-bg:   #fafafa;
      --unread-fg:   #09090b;
      --danger:      #e05252;
      --warn:        #d9a13d;                  /* caution amber, muted */
      --ok:          #3fb950;
      /* Links announce themselves in blue — the one convention the zinc
         tone-on-tone must not swallow (owner call: "links tem q ter cor"). */
      --link:        #60a5fa;
      --link-bright: #93c5fd;

      /* --- type: UI speaks sans; mono is reserved for DATA (paths, times,
             terminal, code) — the chique contrast of the zinc restyle ------ */
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", ui-monospace,
        SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;

      /* --- type scale ---------------------------------------------------- */
      --fs-eyebrow: 10px;
      --fs-xs:  11px;
      --fs-sm:  12px;
      --fs-body: 12.5px;
      --fs-md:  13px;
      --fs-name: 13.5px;
      --fs-wordmark: 15.5px;
      --fs-lg: 16px;

      /* --- geometry ------------------------------------------------------ */
      --sidebar-w: 322px;
      --radius: 8px;
      --radius-sm: 6px;
      --radius-lg: 10px;
      --radius-pill: 999px;
      --shadow-popover: 0 20px 48px rgba(0, 0, 0, 0.48);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }
    /* Zinc restyle: interface chrome speaks sans; mono is DATA's voice. */
    .btn, .agent-name, .agent-role, .eyebrow, .launcher-label, .launcher-title,
    .composer-route, .agent-menu button, .chat-composer-context { font-family: var(--sans); }
    .agent-name { font-weight: 600; letter-spacing: 0; }
    html, body { height: 100%; color-scheme: dark; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: var(--link); }
    a:hover { color: var(--link-bright); }

    /* Shared operator-panel eyebrow: uppercase mono, wide tracking. */
    .eyebrow {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    /* Keyboard focus — a single amber ring everywhere (accessibility floor). */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ------------------------------- Header ------------------------------ */
    .app-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 11px 18px;
      background: linear-gradient(180deg, var(--bg-elev-2), var(--bg-elev));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(245, 166, 35, 0.05);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
    }
    .brand-jack {
      font-size: 18px;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(245, 166, 35, 0.55);
    }
    .wordmark {
      font-family: var(--mono);
      font-weight: 700;
      font-size: var(--fs-wordmark);
      letter-spacing: 3.5px;
      color: var(--text);
    }

    .hub-status {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
      flex-wrap: wrap;
    }
    .hub-status .metric {
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-faint);
    }
    .hub-status .metric b { color: var(--text); font-weight: 600; }

    .conn-state {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 3px 11px; border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-inset);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.4px;
      color: var(--text-dim);
    }
    .conn-state .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-faint);
    }
    .conn-state[data-state="live"]        { color: var(--online); border-color: color-mix(in srgb, var(--online) 42%, transparent); }
    .conn-state[data-state="live"] .dot   { background: var(--online); box-shadow: var(--led-online); }
    .conn-state[data-state="connecting"]  { color: var(--warn); border-color: var(--accent-line); }
    .conn-state[data-state="connecting"] .dot { background: var(--warn); box-shadow: var(--led-amber); }
    .conn-state[data-state="reconnecting"]{ color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, transparent); }
    .conn-state[data-state="reconnecting"] .dot { background: var(--danger); box-shadow: 0 0 8px 1px rgba(229, 83, 75, 0.55); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    .header-spacer { flex: 1 1 auto; }

    /* Plan usage lives in one compact instrument at the rail's foot. Claude
       and Codex are sections of the same question (“how much room is left?”),
       not unrelated dashboard cards. Token volume is a quiet footnote. */
    .usage-card {
      flex: 0 0 auto;
      margin: 8px 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-elev);
      overflow: hidden;
      transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
    }
    .usage-card[hidden] { display: none; }
    .usage-card-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px 8px;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in srgb, var(--text) 2%, transparent);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.14s var(--ease), color 0.14s var(--ease);
    }
    .usage-card-head:hover { background: var(--bg-hover); }
    .usage-card-head .eyebrow { flex: 0 0 auto; }
    .usage-card-summary {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 0.14s var(--ease), transform 0.14s var(--ease);
    }
    .usage-reset { font-family: var(--mono); font-size: var(--fs-eyebrow); color: var(--text-faint); }
    .usage-card-caret {
      flex: 0 0 auto;
      width: 14px;
      color: var(--text-faint);
      text-align: center;
      transform: rotate(90deg);
      transition: transform 0.16s var(--ease), color 0.16s var(--ease);
    }
    .usage-card-head:hover .usage-card-caret { color: var(--text); }
    .usage-card[data-collapsed="true"] { background: var(--bg-inset); }
    .usage-card[data-collapsed="true"] .usage-card-head { border-bottom-color: transparent; }
    .usage-card[data-collapsed="true"] .usage-card-summary { opacity: 1; transform: translateY(0); }
    .usage-card[data-collapsed="true"] .usage-reset { display: none; }
    .usage-card[data-collapsed="true"] .usage-card-caret { transform: rotate(0); }
    .usage-card[data-collapsed="true"] #usage-rows { display: none; }
    .usage-engine { padding: 9px 12px 10px; }
    .usage-engine + .usage-engine { border-top: 1px solid var(--border-soft); }
    .usage-engine-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .usage-engine-mark {
      width: 18px; height: 18px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg-inset);
      color: var(--text-dim);
    }
    .usage-engine-mark .agent-logo { width: 11px; height: 11px; }
    .usage-engine-name { font-family: var(--mono); font-size: var(--fs-xs); font-weight: 650; color: var(--text); }
    .usage-engine-meta { margin-left: auto; font-family: var(--mono); font-size: var(--fs-eyebrow); color: var(--text-faint); }
    .usage-engine-state {
      padding: 2px 0 1px;
      font-family: var(--sans);
      font-size: var(--fs-xs);
      line-height: 1.4;
      color: var(--text-faint);
    }
    .usage-engine-state.warn { color: var(--warn); }
    .usage-row { display: flex; flex-direction: column; gap: 3px; }
    .usage-row + .usage-row { margin-top: 8px; }
    .usage-row-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: var(--fs-xs);
    }
    .usage-row-label { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .usage-row-pct { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
    .usage-bar { height: 6px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; }
    .usage-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s var(--ease), background 0.3s var(--ease); }
    .usage-row-reset { font-size: var(--fs-eyebrow); color: var(--text-faint); font-family: var(--mono); }
    .usage-token-note { margin-top: 7px; font-family: var(--mono); font-size: var(--fs-eyebrow); color: var(--text-faint); }
    /* [hidden] LAST, and it must exist on every rule that sets `display`: the
       attribute is only a UA-stylesheet `display:none`, so any `display` of ours
       beats it and the element stays on screen while the JS believes it hid it.
       This has now bitten the card menus and this snippet. */
    [hidden] { display: none !important; }

    .mcp-add {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 5px 4px 11px;
      max-width: 100%;
      min-width: 0;
    }
    .mcp-add code {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44ch;
    }
    .btn {
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 11px;
      font-size: var(--fs-xs);
      white-space: nowrap;
      transition: border-color 0.12s var(--ease), background 0.12s var(--ease), color 0.12s var(--ease), transform 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn-copy { color: var(--text); font-weight: 600; }

    /* ------------------------------- Layout ------------------------------ */
    .layout { flex: 1 1 auto; display: flex; min-height: 0; }

    /* ----------------------------- Sidebar (PATCHBAY) -------------------- */
    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-w);
      width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg), #090d12);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    /* Drag the right edge to widen/narrow the rail; double-click resets. */
    .sidebar-resizer {
      position: absolute;
      top: 0; bottom: 0; right: -3px;
      width: 7px;
      z-index: 6;
      cursor: col-resize;
      touch-action: none;
    }
    .sidebar-resizer::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 3px;
      width: 1px;
      background: transparent;
      transition: background 0.14s var(--ease);
    }
    .sidebar-resizer:hover::after,
    .sidebar-resizer.dragging::after { background: var(--accent-line); }
    .sidebar-head {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--border-soft);
    }
    .rail-count {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-wash);
      border: 1px solid var(--accent-line);
      border-radius: var(--radius-pill);
      padding: 1px 9px;
      min-width: 24px;
      text-align: center;
    }
    .agents { flex: 1 1 auto; overflow-y: auto; padding: 10px 10px 4px; }
    .empty-hint {
      padding: 20px 14px;
      color: var(--text-faint);
      font-family: var(--sans);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }

    /* --- the JACK ROW: one agent, not a generic dashboard card ----------- */
    /* Agents become channel rows inside a room. The name, engine state and
       job description do the identification; the small face is the live
       presence signal. Actions stay contextual instead of filling the row. */
    .agent-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 14px 12px 24px;
      margin-bottom: 8px;
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.14s var(--ease), background 0.14s var(--ease), box-shadow 0.14s var(--ease), transform 0.14s var(--ease);
    }
    /* Name line: the lamp, then the label, filling the width. */
    .agent-name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding-right: 70px;
    }
    /* Unseen reply: a small amber pip at the name's end + a brighter name, the
       familiar "unread" pairing. Quiet and static — no pulse to add to the din. */
    .unseen-pip {
      flex: none;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px 1px rgba(245, 166, 35, 0.65);
    }
    .agent-card.unseen .agent-name { color: var(--accent-bright); font-weight: 700; }
    /* Signal line + description line align under the NAME, past the lamp. */
    .agent-meta, .agent-role { padding-left: 29px; }
    /* Engine siblings (claude + its codex on the same folder) read as ONE
       project: joined vertically (no gap, shared rounded corners) with a
       "linked" bracket down the left so it is clear they are two engines of the
       same thing. */
    .agent-card.pair-top {
      margin-bottom: 0;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom: 1px dashed var(--border);
    }
    .agent-card.pair-bottom {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-top: none;
    }
    .agent-card.pair-top::after,
    .agent-card.pair-bottom::after { display: none; }

    /* Drag handle — the ONLY reorder grip, revealed on hover on the left edge. */
    .card-grab {
      position: absolute;
      left: 3px; top: 0; bottom: 0;
      width: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      font-size: 13px;
      line-height: 1;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.12s var(--ease), color 0.12s var(--ease);
    }
    .agent-card:hover .card-grab { opacity: 0.65; }
    .card-grab:hover { opacity: 1; color: var(--text); }
    .card-grab:active { cursor: grabbing; }
    /* Keep identity on the signal lamp, not as another decorative rail. */
    .agent-card::before { display: none; }
    .agent-card:hover { background: var(--bg-hover); border-color: var(--border); transform: translateY(-1px); }
    /* An OPEN ⋯ menu must outrank everything that paints after the card: the
       hover lift's transform turns the card into a stacking context (trapping
       the menu's own z-index inside it), and the NEXT .rail-group is a later
       positioned sibling — so the dropdown rendered BEHIND the following
       group. Ranking the card itself, menu inside, wins the whole chain. */
    .agent-card.menu-open { z-index: 45; }
    .agent-card:active { transform: translateY(0); }
    /* A recoloured chat carries its colour around the engine portrait. */
    .agent-card.tinted .agent-portrait {
      outline: 1px solid var(--chat-color);
      outline-offset: 1px;
    }
    /* Selection is a calm whole-card state, never another line on the left. */
    .agent-card.active {
      border-color: var(--selected);
      background: color-mix(in srgb, var(--selected) 8%, var(--bg-elev));
      box-shadow: inset 0 0 0 1px var(--selected-line);
    }
    .agent-card.active .agent-portrait { outline-color: var(--selected); }
    /* Dim an offline card's CONTENT, never the card itself: opacity on the
       container bleeds into everything positioned inside it — the ⋯ menu was
       rendering translucent (cards readable through it) on offline cards. The
       actions cluster stays full-strength: reopen/⋯ are live controls. */
    .agent-card.offline > *:not(.agent-actions) { opacity: 0.66; }

    /* Engine portrait + presence lamp. The real Claude/Codex mark says what
       this agent is; the tiny corner light says whether it is reachable. */
    .agent-portrait {
      flex: none;
      position: relative;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-inset);
      color: var(--text-dim);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      transition: border-color 0.14s var(--ease), color 0.14s var(--ease), transform 0.14s var(--ease), box-shadow 0.14s var(--ease);
    }
    .agent-portrait .agent-logo { width: 13px; height: 13px; opacity: 0.86; }
    .status-dot {
      position: absolute;
      right: -3px;
      top: -3px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--bg-elev);
      border-radius: 50%;
      background: var(--offline);
      box-shadow: var(--led-offline);
    }
    .status-dot.online { background: var(--online); box-shadow: 0 0 6px rgba(63,185,80,0.72); }
    .agent-card:hover .agent-portrait {
      color: var(--text);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .agent-name {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--mono);
      font-weight: 600;
      font-size: var(--fs-name);
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Inline rename: the name cell itself becomes the input (same flex slot,
       so the card never reflows while editing). */
    .agent-rename-input {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: var(--fs-name);
    }
    .agent-rename-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }

    /* The signal line — engine · state, quiet mono, the way a console labels a
       channel. The unread count rides its far right, a lit signal-present LED. */
    .agent-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3px;
      color: var(--text-faint);
    }
    .agent-meta .engine { color: var(--text-dim); text-transform: lowercase; }
    .agent-meta .sep { opacity: 0.5; }
    .agent-meta .activity { text-transform: lowercase; }
    .agent-meta .activity.working { color: var(--accent); }
    .agent-meta .unread-badge { margin-left: auto; }

    .agent-role {
      color: var(--text-dim);
      font-family: var(--sans);
      font-size: var(--fs-xs);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Actions live OUT of the flow — a top-right cluster that fades in only when
       the card is hovered or is the selected one, so a resting card is calm. */
    .agent-actions {
      position: absolute;
      top: 9px; right: 10px;
      z-index: 5;
      display: flex; align-items: center; gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s var(--ease);
    }
    .agent-actions > button,
    .agent-actions > .agent-menu-wrap > .menu-btn {
      background: var(--bg-elev-2);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.28);
    }
    .agent-card:hover .agent-actions,
    .agent-card.active .agent-actions,
    .agent-card:focus-within .agent-actions,
    .agent-card.menu-open .agent-actions,
    /* A relaunch in flight must stay visible after the pointer leaves the
       card — hiding "reopening…" with the rest of the hover cluster left the
       user staring at a card that looked like nothing was happening. */
    .agent-actions:has(.reopen-btn.busy) {
      opacity: 1;
      pointer-events: auto;
    }

    .mcp-icon {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 0;
      border: 0;
      color: var(--text-faint);
    }
    .mcp-icon.connected {
      color: var(--accent);
      background: transparent;
    }
    /* Idle vs working — the thing the operator actually watches for. Same chip
       metrics as .mcp-icon so it drops into the same badge slot. Working glows
       and breathes; idle is quiet. */
    /* Group leader: a gold rim + glow on the card, a crown before the name. */
    .leader-crown { font-size: 12px; line-height: 1; margin-right: 5px; }
    .agent-card.leader {
      border-color: color-mix(in srgb, #d9a521 72%, var(--border));
      background: color-mix(in srgb, #d9a521 7%, var(--bg-elev));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, #d9a521 22%, transparent);
    }
    .agent-card.leader:hover { border-color: #f2c14e; }
    /* A selected leader shows the SELECTION cyan (its crown still marks it as
       leader), so "which am I looking at" wins over the gold rim. These beat the
       gold rules above on specificity, regardless of source order. */
    .agent-card.leader.active {
      border-color: var(--selected);
      background: color-mix(in srgb, var(--selected) 8%, var(--bg-elev));
      box-shadow: inset 0 0 0 1px var(--selected-line);
    }
    .info-card {
      width: min(460px, 92vw);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      overflow: hidden;
    }
    .info-card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .info-card-title {
      flex: 1 1 auto;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--accent);
    }
    .info-card-head .dirpicker-close { margin-left: 0; }
    .confirm-foot {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 12px 16px 16px;
    }
    /* Colour picker popover — a curated swatch grid + custom + clear. */
    .color-pop {
      position: fixed;
      z-index: 70;
      padding: 10px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: var(--shadow-popover);
      transform-origin: top center;
      animation: pop-in 0.13s var(--ease);
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }
    .color-sw {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s var(--ease), box-shadow 0.1s var(--ease);
    }
    .color-sw:hover { transform: scale(1.14); }
    .color-sw.on { box-shadow: 0 0 0 2px var(--bg-elev-2), 0 0 0 3px var(--text); }
    .color-pop-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--border-soft);
    }
    .color-custom {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
      cursor: pointer;
    }
    .color-custom-dot {
      width: 16px; height: 16px; border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .color-custom input[type="color"] { width: 0; height: 0; opacity: 0; padding: 0; border: none; }
    .color-clear {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      padding: 3px 9px;
      cursor: pointer;
    }
    .color-clear:hover { color: var(--danger); border-color: var(--danger); }
    .info-card-body {
      padding: 16px;
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 60vh;
      overflow-y: auto;
    }
    .toast-action {
      margin-left: 10px;
      padding: 2px 9px;
      background: transparent;
      border: 1px solid var(--accent-line);
      border-radius: 5px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      cursor: pointer;
    }
    .toast-action:hover { background: var(--accent-wash); }
    @keyframes pulse-work {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-line); }
      50% { opacity: 0.45; box-shadow: 0 0 6px 1px var(--accent-line); }
    }
    /* Green stays presence. Working adds a quiet amber pulse to the portrait,
       so activity never changes the meaning of the status lamp. */
    .agent-portrait:has(.status-dot.working) {
      animation: agent-work 1.45s var(--ease) infinite;
    }
    @keyframes agent-work {
      0%, 100% {
        border-color: var(--border);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 0 0 0 transparent;
      }
      50% {
        border-color: var(--accent-line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 2px var(--accent-wash);
      }
    }
    .unread-badge {
      min-width: 19px;
      height: 19px;
      padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--unread-bg);
      color: var(--unread-fg);
      font-family: var(--mono);
      font-size: var(--fs-xs); font-weight: 700;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 8px rgba(245, 166, 35, 0.4);
    }
    .remove-btn.confirming {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Card actions: one primary button + a compact menu. */
    .open-btn, .reopen-btn {
      border-color: var(--border);
      color: var(--text);
    }
    .open-btn:hover, .reopen-btn:hover {
      background: color-mix(in srgb, var(--accent) 13%, var(--bg-elev-2));
    }
    /* Relaunch in flight. The rail is rebuilt on every SSE event, so this
       state must be re-derivable from state.reopening (a label swapped on
       the live node gets wiped by the next render) — and it must LOOK like
       loading: a spinner, not just different text. */
    .reopen-btn.busy { pointer-events: none; opacity: 0.85; }
    .reopen-btn.busy::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 6px;
      vertical-align: -1px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      border-top-color: transparent;
      animation: reopen-spin 0.7s linear infinite;
    }
    @keyframes reopen-spin { to { transform: rotate(360deg); } }
    .agent-menu-wrap { position: relative; }
    .agent-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 5px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* `hidden` must beat display:flex, else every card's menu renders at once. */
    .agent-menu[hidden] { display: none; }
    /* Flip: a low card's menu opens UPWARD (set by the kebab handler when the
       space below can't hold it). */
    .agent-menu.drop-up { top: auto; bottom: calc(100% + 5px); transform-origin: bottom right; }
    .agent-menu:not([hidden]) {
      padding: 5px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      min-width: 176px;
      transform-origin: top right;
      animation: pop-in 0.13s var(--ease);
    }
    .agent-menu-item { text-align: left; }
    /* Inside the ⋯ menu the items are clean full-width ROWS — icon + label on
       ONE line each (the boxed per-item borders wrapped "open codex…" onto two
       lines and read as noise). Hover is a quiet wash; remove is set apart. */
    .agent-menu .agent-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      white-space: nowrap;
      background: transparent;
      color: var(--text-dim);
    }
    .agent-menu .agent-menu-item:hover { background: var(--bg-hover); color: var(--text); border: none; }
    .agent-menu .agent-menu-item .mi-icon {
      flex: 0 0 auto;
      width: 16px;
      text-align: center;
      font-size: 12px;
      line-height: 1;
    }
    .agent-menu .remove-btn { margin-top: 3px; border-radius: 0 0 6px 6px; position: relative; }
    .agent-menu .remove-btn::before {
      content: "";
      position: absolute;
      top: -2px; left: 6px; right: 6px;
      height: 1px;
      background: var(--border-soft);
    }
    .agent-menu .remove-btn:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
    .mute-toggle, .nudge-btn, .open-btn, .reopen-btn, .rename-btn, .remove-btn, .menu-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      padding: 3px 9px;
      line-height: 1.3;
      transition: border-color 0.12s var(--ease), color 0.12s var(--ease), background 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .mute-toggle:hover, .nudge-btn:hover, .open-btn:hover, .reopen-btn:hover, .rename-btn:hover, .remove-btn:hover, .menu-btn:hover { color: var(--text); border-color: var(--accent); }
    .mute-toggle:active, .nudge-btn:active, .open-btn:active, .reopen-btn:active, .rename-btn:active, .remove-btn:active, .menu-btn:active { transform: scale(0.96); }
    .menu-btn { padding: 3px 7px; letter-spacing: 1px; }
    .mute-toggle.muted { color: var(--warn); border-color: var(--accent-line); }
    .remove-btn:hover { border-color: var(--danger); color: var(--danger); }
    /* A menu action that exists but is not available right now (rename on an
       online agent). Legible, not invisible: clicking it says what to do. */
    .agent-menu-item.disabled { color: var(--text-faint); opacity: 0.55; }
    .agent-menu-item.disabled:hover { color: var(--text-faint); border-color: var(--border); }

    /* NUDGE = a brief amber pulse. The nudge control lives in the (hidden)
       card menu, so :has() lifts the pulse onto the whole jack row — the
       operator sees the line light up even with the menu closed. */
    .nudge-btn.nudging { animation: pulse 0.6s ease-out; }
    .agent-card:has(.nudge-btn.nudging) {
      animation: rowpulse 0.7s ease-out;
    }
    .agent-card:has(.nudge-btn.nudging)::before {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.7);
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 var(--accent-line); border-color: var(--accent); color: var(--accent); }
      100% { box-shadow: 0 0 0 10px transparent; }
    }
    @keyframes rowpulse {
      0%   { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); }
      100% { background: var(--bg-elev); box-shadow: none; }
    }

    /* --------------------------- Launcher form --------------------------- */
    .launcher {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg-elev), var(--bg-elev-2));
    }
    .launcher-title {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 8px;
    }
    .launcher-title::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: var(--border-soft);
    }
    .launcher-label {
      display: block;
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow); text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-faint);
    }
    .launch-input {
      width: 100%;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
      font-family: var(--mono);
      font-size: var(--fs-sm);
      transition: border-color 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .launch-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .launch-input::placeholder { color: var(--text-faint); }
    .launcher-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .launcher-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 3px;
    }
    .launcher-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      cursor: pointer;
      user-select: none;
    }
    .launcher-toggle input { accent-color: var(--accent); margin: 0; }
    /* Agent-type choice: a 2-button segmented control. Radio inputs do the
       state (keyboard + form semantics for free); the label is the visible
       segment and :checked drives its look — no JS class juggling. */
    .launcher-segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-inset);
    }
    .launcher-segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .launcher-segment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s var(--ease), color 0.12s var(--ease);
    }
    /* Vendor marks (inline SVG — the dashboard loads no external asset). They
       inherit currentColor, so a segment's dim/amber state carries the logo
       with it instead of fighting the console palette. */
    .agent-logo { width: 13px; height: 13px; flex: none; display: block; }
    .agent-meta .agent-logo { width: 11px; height: 11px; opacity: 0.85; }
    .launcher-segment + .launcher-segment { border-left: 1px solid var(--border); }
    .launcher-segment:hover { color: var(--text-dim); }
    .launcher-segmented input:checked + .launcher-segment {
      background: var(--accent-wash);
      color: var(--accent);
    }
    .launcher-segmented input:focus-visible + .launcher-segment {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--accent-line);
    }
    .launch-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-weight: 700;
      font-size: var(--fs-sm);
      text-transform: uppercase; letter-spacing: 1.2px;
      padding: 7px 18px;
      transition: filter 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .launch-btn:hover { background: var(--accent-bright); box-shadow: 0 0 16px rgba(245, 166, 35, 0.35); }
    .launch-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

    /* ----------------------------- Dir picker ---------------------------- */
    .launcher-dir-row { display: flex; gap: 7px; }
    .launcher-dir-row .launch-input { flex: 1 1 auto; min-width: 0; }
    .dirpicker-browse { flex: 0 0 auto; font-size: var(--fs-xs); padding: 5px 11px; }
    .dirpicker {
      display: flex; flex-direction: column; gap: 6px;
      margin-top: 7px;
      padding: 9px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .dirpicker[hidden] { display: none; }
    .dirpicker-head { display: flex; align-items: center; gap: 8px; }
    .dirpicker-path {
      flex: 1 1 auto; min-width: 0;
      font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dirpicker-close {
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      padding: 2px 8px;
      line-height: 1.4;
    }
    .dirpicker-close:hover { color: var(--danger); border-color: var(--danger); }
    .dirpicker-list {
      display: flex; flex-direction: column;
      max-height: 188px; overflow-y: auto;
    }
    .dirpicker-entry {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 7px;
      border-radius: 4px;
      font-family: var(--mono); font-size: var(--fs-sm);
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .dirpicker-entry:hover { background: var(--bg-hover); }
    .dirpicker-up { color: var(--text-dim); }
    .dirpicker-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dirpicker-badge {
      flex: 0 0 auto; margin-left: auto;
      font-size: 9px; letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
      color: var(--ok);
    }
    .dirpicker-hint {
      padding: 5px 7px;
      color: var(--text-faint);
      font-family: var(--sans); font-size: var(--fs-xs);
    }
    .dirpicker-foot { display: flex; justify-content: flex-end; }
    .dirpicker-select {
      background: var(--bg-elev-2);
      color: var(--accent);
      border: 1px solid var(--accent-line);
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-size: var(--fs-xs); font-weight: 600;
      padding: 4px 12px;
    }
    .dirpicker-select:hover { background: var(--accent-wash); }

    /* ------------------------------- Main -------------------------------- */
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

    /* Messages header — the console panel label for the transcript. */
    .feed-head {
      flex: 0 0 auto;
      display: flex; align-items: baseline; gap: 12px;
      padding: 13px 18px 11px;
      border-bottom: 1px solid var(--border-soft);
    }
    .feed-search {
      margin-left: auto;
      align-self: center;
      width: 240px;
      max-width: 34vw;
      padding: 5px 11px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-sm);
    }
    .feed-search:focus { outline: none; border-color: var(--accent-line); }
    .feed-search::placeholder { color: var(--text-faint); }
    /* The group-tabs used to be pushed right by margin-auto; the search now
       holds that slot, so the tabs sit next to it. */
    .feed-head .group-tabs { margin-left: 0; }
    mark.hit { background: var(--accent-wash); color: var(--accent); border-radius: 3px; padding: 0 1px; }
    .feed-head .sub {
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }

    /* Group tabs: one room at a time. A group is a wall — agents in different
       groups cannot reach each other — so mixing their traffic in one scroll
       would show a conversation that never happened. */
    .group-tabs {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .group-tab {
      padding: 4px 9px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
      transition: color 0.12s var(--ease), background 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .group-tab:hover { color: var(--text); background: var(--bg-hover); }
    .group-tab:active { transform: scale(0.97); }
    .group-tab.active {
      color: var(--accent);
      background: var(--accent-wash);
      box-shadow: inset 0 -1px 0 var(--accent-line);
    }
    .group-tab .count { color: var(--text-faint); margin-left: 5px; }

    /* Both sit at the right end of the rail's header, together: the label and
       the count on the left, the two things you DO to this list on the right. */
    .groups-open { margin-left: auto; flex: none; }
    .launcher-open { margin-left: 6px; flex: none; }

    /* --------------------------- the tab strip ---------------------------
       Messages and every open agent, side by side. */
    .tabs {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 12px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
    }
    .tab-strip { display: flex; align-items: stretch; gap: 2px; min-width: 0; overflow-x: auto; }

    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      flex: none;
      max-width: 220px;
      padding: 9px 12px;
      background: transparent;
      border: none;
      /* The active tab is joined to the panel below it by an amber underline —
         a tab is a thing you are INSIDE, not a button you pressed. */
      border-bottom: 2px solid transparent;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-sm);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color 0.12s var(--ease), border-color 0.12s var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -2px;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: center;
      opacity: 0;
      transition: transform 0.18s var(--ease), opacity 0.18s var(--ease);
    }
    .tab.active { color: var(--accent); border-bottom-color: transparent; }
    .tab.active::after { transform: scaleX(1); opacity: 1; }
    .tab-mark { color: var(--accent); font-weight: 700; }
    /* The hub tab (the agents' own chat) is not an agent — give it a standing
       pill look so it reads as the fixed room, distinct from the agent tabs. */
    .tab-hub {
      margin: 0 6px 0 0;
      padding: 9px 12px;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .tab-hub.active {
      background: transparent;
      border-bottom-color: transparent;
    }
    .tab-hub:hover { color: var(--text); background: var(--bg-hover); }
    .tab .name { overflow: hidden; text-overflow: ellipsis; }
    .tab .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .tab .dot.online { background: var(--online); }
    .tab .dot.offline { background: var(--offline); }
    .tab-close {
      margin-left: 2px;
      padding: 0 3px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      border-radius: 3px;
    }
    .tab-close:hover { color: var(--danger); background: var(--bg-hover); }
    .tab-unread {
      min-width: 18px;
      padding: 1px 5px;
      text-align: center;
      border-radius: 9px;
      background: var(--unread-bg);
      color: var(--unread-fg);
      font-size: var(--fs-eyebrow);
      font-weight: 700;
    }

    /* Lightbox. One in the file, for the launcher — a form you touch once per
       project has no business owning half the rail, which is now the list of
       agents you switch between. */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 16px 16px;
      background: rgba(4, 7, 11, 0.72);
      backdrop-filter: blur(3px);
      overflow-y: auto;
      animation: lightin 0.12s var(--ease);
    }
    .lightbox[hidden] { display: none; }
    @keyframes lightin { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lightbox-card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      overflow: hidden;
      animation: pop-in 0.16s var(--ease);
    }
    .lightbox-head {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .lightbox-head .dirpicker-close { margin-left: auto; }
    .lightbox .launcher { border: none; background: none; padding: 16px; }
    .lightbox .launcher-title { display: none; } /* the head says it already */

    /* ------------------------- the agent's screen ------------------------
       tmux is the pty and xterm.js is the emulator, so this is the real
       terminal: colours, cursor, Ctrl-C, the lot. It exists to kill the pile
       of Windows terminal windows — the rail on the left is already the tab
       bar, so the screen simply takes over the main panel. */
    .screen {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-inset);
    }
    .screen[hidden] { display: none; }
    .screen-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 7px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.018);
    }
    .screen-identity {
      flex: 0 1 230px;
      min-width: 150px;
      display: grid;
      grid-template-columns: 24px minmax(0, auto);
      grid-template-rows: auto auto;
      column-gap: 8px;
      align-items: center;
      padding-right: 16px;
      border-right: 1px solid var(--border-soft);
    }
    .screen-engine-mark {
      grid-row: 1 / 3;
      width: 24px; height: 24px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-inset);
      color: var(--text-dim);
    }
    .screen-engine-mark .agent-logo { width: 14px; height: 14px; }
    .screen-name {
      font-family: var(--mono);
      font-size: var(--fs-name);
      font-weight: 600;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .screen-activity {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }
    .screen-activity::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
    .screen-activity.ready { color: var(--online); }
    .screen-activity.working { color: var(--accent); }
    .screen-activity.waiting { color: var(--warn); }
    .screen-activity.offline { color: var(--text-faint); }
    .screen-hint {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .screen-hint.stale { color: var(--danger); }
    /* Session-status bar UNDER the composer, like a terminal footer: the CLI's
       permission/plan mode and a running /goal with its age. */
    .chat-statusbar {
      flex: 0 0 auto;
      padding: 0;
      background: var(--bg-elev);
      border-top: 1px solid var(--border-soft);
    }
    .chat-statusbar[hidden] { display: none; }
    /* Inner rail centred on the SAME 880px column as the messages and composer,
       so the pills line up under the chat instead of hugging the far edge. */
    .chat-statusbar-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 5px 18px 7px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      letter-spacing: 0.4px;
      color: var(--pill-color, var(--text-dim));
      border: 1px solid color-mix(in srgb, var(--pill-color, var(--border)) 45%, transparent);
      background: color-mix(in srgb, var(--pill-color, var(--bg-elev)) 12%, transparent);
    }
    .status-pill::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--pill-color, var(--text-dim));
    }
    .status-pill.goal { --pill-color: var(--accent); }
    .screen-head .btn { margin-left: 0; }
    .screen-head .dirpicker-close { margin-left: 0; }

    /* View and engine are separate controls with explicit labels. */
    .screen-control { display: flex; flex-direction: column; gap: 3px; }
    .screen-control-label {
      padding-left: 2px;
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--text-faint);
      opacity: 0.82;
    }
    .screen-modes {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      background: var(--bg-inset);
    }
    .screen-modes.engine-tabs { margin-left: 0; }
    .screen-mode {
      min-height: 25px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
      transition: color 0.12s var(--ease), border-color 0.12s var(--ease), background 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .screen-mode .agent-logo { width: 11px; height: 11px; }
    .screen-mode:hover { color: var(--text); background: color-mix(in srgb, var(--text) 4%, transparent); }
    .screen-mode:active { transform: scale(0.97); }
    .screen-mode.active { color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); }
    .engine-tabs .screen-mode.active { color: var(--selected); background: var(--selected-wash); box-shadow: inset 0 0 0 1px var(--selected-line); }
    .screen-head .btn,
    .screen-head .dirpicker-close {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* --------------------- conversation ledger / workbench ---------------
       This is a running operational record, not a consumer chat app. Turns
       share one continuous sheet; identity, time and actions sit in stable
       columns while the prose gets the width. */
    .screen-chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 18px 26px;
      display: flex;
      flex-direction: column;
      gap: 0;
      background:
        linear-gradient(90deg, transparent calc(50% - 441px), var(--border-soft) calc(50% - 440px), transparent calc(50% - 439px)),
        linear-gradient(90deg, transparent calc(50% + 439px), var(--border-soft) calc(50% + 440px), transparent calc(50% + 441px)),
        var(--bg-inset);
    }
    .screen-chat[hidden] { display: none; }
    .chat-empty { color: var(--text-faint); font-family: var(--sans); font-size: var(--fs-sm); margin: auto; }

    /* Command deck: explicit recipient + keyboard contract above the input.
       It is anchored to the same 880px rail as the ledger. */
    .chat-composer {
      flex: 0 0 auto;
      display: block;
      padding: 10px 18px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .chat-composer[hidden] { display: none; }
    .chat-composer-inner {
      display: block;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      position: relative; /* anchors the slash-command popover */
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-inset);
      transition: border-color 0.14s var(--ease), box-shadow 0.14s var(--ease), background 0.14s var(--ease);
    }
    .chat-composer-inner:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-wash); }
    .chat-composer-context {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 28px;
      padding: 5px 9px;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in srgb, var(--text) 2%, transparent);
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
    }
    .composer-route {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .composer-route::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: var(--led-amber);
    }
    .composer-target {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 650;
    }
    .composer-keys { margin-left: auto; white-space: nowrap; color: var(--text-faint); }
    .composer-keys kbd {
      padding: 1px 4px;
      border: 1px solid var(--border);
      border-bottom-color: var(--border-strong);
      border-radius: 3px;
      background: var(--bg-elev);
      color: var(--text-dim);
      font: inherit;
    }
    .chat-composer-row {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      padding: 5px;
    }
    /* Slash-command autocomplete popover — opens ABOVE the textarea. */
    .slash-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 40;
      max-height: 264px;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-popover);
      transform-origin: bottom center;
      animation: pop-in 0.13s var(--ease);
    }
    .slash-menu[hidden] { display: none; }
    .slash-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .slash-item__name { flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
    .slash-item__desc {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--sans); font-size: var(--fs-sm); color: var(--text-faint);
    }
    .slash-item.active { background: var(--accent-wash); color: var(--text); }
    .slash-item.active .slash-item__name { color: var(--accent); }
    /* "@" file-mention rows reuse .slash-item; the icon is textContent (📄/📁),
       and a long path truncates instead of pushing the popover wide. */
    .slash-item__icon { flex: 0 0 auto; font-size: var(--fs-sm); line-height: 1; }
    #mention-menu .slash-item__name {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 400;
    }
    #chat-input {
      flex: 1 1 auto;
      resize: none;
      max-height: 140px;
      min-height: 38px;
      padding: 8px 10px;
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.5;
      transition: background 0.14s var(--ease);
    }
    #chat-input:focus { outline: none; }
    #chat-input:disabled { opacity: 0.5; }
    /* Drop target feedback: dashed accent ring while a file is dragged over. */
    .chat-composer-inner:has(#chat-input.drag-over) { border-style: dashed; border-color: var(--accent); background: var(--accent-wash); }
    .chat-send {
      flex: none;
      align-self: stretch;
      min-width: 64px;
      padding: 0 14px;
      border-color: var(--accent-line);
      background: var(--accent-wash);
      color: var(--accent);
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: var(--fs-xs);
    }
    .chat-send:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-bright); }
    /* Interrupt the open agent mid-turn — a danger square beside send, shown
       only while that agent is working. */
    .chat-stop {
      flex: none;
      align-self: stretch;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 0 14px;
      color: var(--danger);
      border-color: var(--danger);
      font-size: 12px;
      line-height: 1;
    }
    .chat-stop.visible { display: inline-flex; }
    .chat-stop:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    /* Dictation mic — quiet beside send; red and breathing while recording. */
    .chat-mic {
      flex: none;
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 0 12px;
      font-size: 13px;
      line-height: 1;
      border-color: transparent;
    }
    .chat-mic:hover:not(:disabled) { border-color: var(--border); background: var(--bg-hover); }
    .chat-mic[hidden] { display: none; }
    /* Live waveform while dictating — your voice, visibly arriving (the
       watchdog's analyser drawn as marching bars, voice-note style). */
    .chat-wave {
      flex: none;
      align-self: center;
      width: 120px;
      height: 30px;
      border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
      border-radius: 6px;
      background: color-mix(in srgb, var(--danger) 8%, var(--bg-elev-2));
    }
    .chat-wave[hidden] { display: none; }
    .chat-mic.rec {
      color: var(--danger);
      border-color: var(--danger);
      animation: pulse-work 1.15s ease-in-out infinite;
    }

    /* One continuous session sheet. No speech bubbles, no alternating chat
       geometry; the operator and agent are entries in the same record. */
    .chat-thread {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
    }
    .chat-turn {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      max-width: 100%;
      padding: 16px 18px 18px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
      transition: background 0.14s var(--ease);
    }
    .chat-turn:last-child { border-bottom: 0; }
    .chat-turn:hover { background: color-mix(in srgb, var(--text) 2.2%, var(--bg)); }
    /* YOUR turns are a real card — one clear elevation step with a border and
       its own corners — while the agent stays flat on the sheet. Form and
       elevation carry the who-said-what, never colour (zinc restyle: the 3%
       background mix was invisible on the near-black canvas and the owner
       could not tell his own words from the agent's). */
    .chat-turn.user {
      flex-direction: row;
      margin: 10px 12px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .chat-turn.user:hover { background: var(--bg-hover); }
    /* Optimistic-echo lane: your just-sent message, same column as the thread,
       dimmed with a dashed bubble until the agent logs it for real. */
    .chat-pending {
      width: 100%;
      max-width: 880px;
      margin: 16px auto 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      border-block: 1px dashed var(--border);
    }
    .chat-pending:empty { display: none; }
    .chat-turn.pending { opacity: 0.72; }
    .chat-sending {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      font-style: italic;
    }
    /* Interrupt divider: a centred chip flanked by hairlines. */
    .chat-interrupt {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 4px auto;
      padding: 3px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      font-style: italic;
      background: var(--bg-elev);
    }
    .chat-interrupt-mark { color: var(--danger); font-style: normal; font-size: 8px; }
    /* Harness marker (worked-for / task events / away-summary): quieter than the
       interrupt divider — no border, just a faint centred mono line. */
    .chat-marker {
      align-self: center;
      max-width: 82%;
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      margin: 2px auto;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-marker > span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .chat-marker-mark { color: var(--accent); opacity: 0.6; font-size: 10px; flex: none; }
    /* "Agent is working" — three bouncing dots at the foot of the chat. A
       FLOATING line (no border, no own background): it used to be a full-width
       band with a bottom rule, and on a short conversation that rule plus the
       composer's top edge framed the leftover empty space like a broken box. */
    .chat-typing {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 10px 18px 0;
    }
    .chat-typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 7px 3px;
    }
    .chat-typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: typing-bounce 1.2s infinite;
    }
    .chat-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .chat-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    .chat-typing-note {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .chat-typing-note:empty { display: none; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    /* API-error callout: a warning, not a reply. */
    .chat-apierror {
      align-self: stretch;
      margin-left: 40px;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      border-left: 3px solid var(--danger);
      border-radius: 10px;
      background: color-mix(in srgb, var(--danger) 9%, transparent);
    }
    .chat-apierror-eyebrow {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 6px;
    }
    .chat-apierror-msg { font-family: var(--mono); font-size: var(--fs-sm); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
    .chat-apierror-hint { font-size: var(--fs-xs); color: var(--text-dim); margin-top: 6px; }
    /* Fixed identity rail: agents read as active participants in the ledger,
       while the operator gets a quiet dispatch mark. */
    .chat-avatar {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      margin-top: 0;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--bg-elev-2);
      color: var(--selected);
      border: 1px solid var(--border-strong);
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.16);
    }
    .chat-avatar.you {
      background: var(--accent-wash);
      color: var(--accent);
      border-color: var(--accent-line);
      font-size: 8.5px;
      letter-spacing: 0;
    }
    .chat-avatar .agent-logo { width: 15px; height: 15px; opacity: 0.92; }
    .chat-turn-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
      max-width: none;
    }
    .chat-turn.user .chat-turn-body { align-items: stretch; }
    .chat-meta { display: flex; gap: 8px; align-items: baseline; padding: 0; }
    .chat-turn.user .chat-meta { flex-direction: row; }
    .chat-role {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--selected);
    }
    .chat-turn.user .chat-role { color: var(--accent); }
    .chat-role::after { content: " / entry"; color: var(--text-faint); font-weight: 400; }
    .chat-turn.user .chat-role::after { content: " / dispatch"; }
    /* The hub's nudge line: system voice, flat on the sheet — never the
       operator's elevated card. The peek unfolds the real message(s). */
    .chat-turn.nudge .chat-bubble { color: var(--text-dim); }
    .chat-turn.nudge .chat-role { color: var(--text-dim); }
    .chat-turn.nudge .chat-role::after { content: " / nudge"; }
    .chat-avatar.sb { font-family: var(--mono); color: var(--text-dim); }
    .nudge-peek {
      align-self: flex-start;
      margin-top: 6px;
      padding: 0;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--link);
      cursor: pointer;
    }
    .nudge-peek:hover { color: var(--link-bright); }
    .msg-reaction { margin-top: 0; margin-left: 10px; }
    .nudge-quotes { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .nudge-quote {
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .nudge-quote-head { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-faint); margin-bottom: 4px; }
    .nudge-quote-body { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .nudge-quote-miss { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-faint); }
    .chat-time {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      opacity: 0.7;
    }
    .chat-bubble {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    /* marked builds real block structure, so give it real spacing. */
    .chat-bubble > :first-child { margin-top: 0; }
    .chat-bubble > :last-child { margin-bottom: 0; }
    .chat-bubble p { margin: 0 0 8px; }
    .chat-bubble h1, .chat-bubble h2, .chat-bubble h3, .chat-bubble h4 {
      margin: 14px 0 6px; font-size: 1em; font-weight: 600; color: var(--text);
    }
    .chat-bubble ul, .chat-bubble ol { margin: 0 0 8px; padding-left: 22px; }
    .chat-bubble li { margin: 2px 0; }
    .chat-bubble a { color: var(--link); }
    .chat-bubble blockquote {
      margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--border);
      color: var(--text-dim);
    }
    .chat-bubble hr { border: none; border-top: 1px solid var(--border-soft); margin: 12px 0; }
    /* Tables — the whole point of switching to marked. */
    .chat-bubble table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: var(--fs-sm);
      display: block;
      overflow-x: auto;
      max-width: 100%;
    }
    .chat-bubble th, .chat-bubble td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .chat-bubble th { background: var(--bg-inset); color: var(--text); font-weight: 600; }
    .chat-turn.user .chat-bubble {
      border: 0;
      background: transparent;
      border-radius: 0;
      color: color-mix(in srgb, var(--text) 92%, var(--accent));
    }
    /* Edit pencil on your own recent user turns — reveals on hover, no reflow. */
    .chat-edit-btn {
      flex: 0 0 auto;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 0;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s var(--ease), color 0.15s var(--ease);
    }
    .chat-edit-btn svg { display: block; }
    .chat-turn.user:hover .chat-edit-btn { opacity: 1; pointer-events: auto; }
    .chat-edit-btn:hover { color: var(--accent); }

    /* Forward arrow — hover-reveal beside the bubble (next to the edit pencil
       on user turns), same no-reflow trick as .chat-edit-btn. The wrap is the
       positioning anchor for the popover. */
    .chat-fwd-wrap {
      position: relative;
      flex: 0 0 auto;
      align-self: center;
      display: inline-flex;
    }
    .chat-fwd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 0;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s var(--ease), color 0.15s var(--ease);
    }
    .chat-fwd-btn svg { display: block; }
    .chat-turn:hover .chat-fwd-btn,
    .chat-fwd-btn[aria-expanded="true"] { opacity: 1; pointer-events: auto; }
    .chat-fwd-btn:hover { color: var(--accent); }

    /* One quiet action rail per message. Copy / WhatsApp / edit / forward use
       the same 26px rhythm and appear together, so hover never sprouts a row
       of unrelated controls that shifts the bubble. */
    /* Hover toolbar, OUT of the layout flow: in-flow (a 28px flex column of
       24px buttons) it was the TALLEST child of any short turn, so a one-line
       message carried ~50px of invisible belly below the text. Absolute in the
       turn's top-right corner instead — it overlays on hover, exactly like the
       agent-card's action cluster. (.chat-turn is position:relative.) */
    .chat-turn-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(3px);
      transition: opacity 0.14s var(--ease), transform 0.14s var(--ease);
    }
    .chat-turn:hover .chat-turn-actions,
    .chat-turn:focus-within .chat-turn-actions,
    .chat-turn-actions:has([aria-expanded="true"]) {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }
    .chat-turn-actions .chat-edit-btn,
    .chat-turn-actions .chat-fwd-btn,
    .chat-copy-btn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-faint);
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.12s var(--ease), background 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .chat-turn-actions .chat-edit-btn:hover,
    .chat-turn-actions .chat-fwd-btn:hover,
    .chat-copy-btn:hover { color: var(--text); background: var(--bg-hover); }
    .chat-copy-btn:active { transform: scale(0.92); }
    .chat-copy-btn svg { width: 13px; height: 13px; }
    .chat-copy-btn.whatsapp {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .chat-copy-btn.whatsapp:hover { color: #5cdb8b; }
    .chat-copy-btn.copied { color: var(--online); background: color-mix(in srgb, var(--online) 10%, transparent); }

    /* The popover: same recipe as .agent-menu (hidden must beat display:flex). */
    .fwd-menu {
      position: absolute;
      top: calc(100% + 5px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fwd-menu[hidden] { display: none; }
    .fwd-menu:not([hidden]) {
      padding: 6px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      min-width: 148px;
    }
