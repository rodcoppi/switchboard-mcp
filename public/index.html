        if (name) payload.name = name;
        if (role) payload.role = role;
        if (group) payload.group = group;
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to launch (HTTP ${res.status}).`, "error", 8000);
          return;
        }
        const agentName = data.agent && data.agent.name ? data.agent.name : name || dir;
        if (data.fallback) {
          toast(
            `No resumable conversation in ${dir} — opened a fresh session for ${agentName}.`,
            "warn",
            7000,
          );
        }
        toast(
          `Agent ${agentName} launched` +
            `${data.replaced ? " (replaced its previous session)" : ""}. ` +
            `It'll join on its own — open a terminal window from its card if you want one.`,
          "ok",
        );
        closeLauncher(); // it launched; the form has nothing left to say
        // No render here: the agent card arrives via the agent_updated SSE.
      } catch {
        toast("Network failure while launching.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    // =====================================================================
    // Dir picker — the launcher form's "Browse…" panel
    // =====================================================================
    // Lists the hub machine's directories via GET /api/fs/dirs (directory
    // NAMES only) so the operator picks the working folder by click instead
    // of typing a POSIX path (Windows Explorer paths pasted into the input
    // are translated server-side either way). Every server value rendered
    // here (paths, folder names) goes through el()/textContent — never
    // innerHTML (same XSS rule as the rest of this file).

    const dirpickerState = { path: null };

    async function dirpickerLoad(targetPath) {
      const list = $("#dirpicker-list");
      list.textContent = "";
      list.appendChild(el("div", "dirpicker-hint", "loading…"));
      try {
        // No path → the hub answers with its home directory.
        const url = targetPath
          ? `/api/fs/dirs?path=${encodeURIComponent(targetPath)}`
          : "/api/fs/dirs";
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        list.textContent = "";
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to list folders (HTTP ${res.status}).`, "error");
          list.appendChild(el("div", "dirpicker-hint", "Could not open this folder."));
          return;
        }
        dirpickerState.path = data.path;
        const pathEl = $("#dirpicker-path");
        pathEl.textContent = data.path;
        pathEl.title = data.path;
        if (data.parent !== null) {
          const up = el("div", "dirpicker-entry dirpicker-up", "..");
          up.title = data.parent;
          up.addEventListener("click", () => dirpickerLoad(data.parent));
          list.appendChild(up);
        }
        for (const d of data.dirs) {
          const row = el("div", "dirpicker-entry");
          row.title = d.path;
          row.appendChild(el("span", "dirpicker-name", d.name));
          if (d.hasConversation) {
            const badge = el("span", "dirpicker-badge", "conversation");
            badge.title =
              "This folder has a previous Claude Code conversation " +
              "(resumable with “continue conversation”).";
            row.appendChild(badge);
          }
          row.addEventListener("click", () => dirpickerLoad(d.path));
          list.appendChild(row);
        }
        if (data.dirs.length === 0) {
          list.appendChild(el("div", "dirpicker-hint", "No subfolders."));
        }
        if (data.truncated) {
          list.appendChild(
            el("div", "dirpicker-hint", "Listing truncated at 500 folders."),
          );
        }
      } catch {
        list.textContent = "";
        list.appendChild(el("div", "dirpicker-hint", "Network failure while listing folders."));
        toast("Network failure while listing folders.", "error");
      }
    }

    /**
     * Browse… asks the hub to open the REAL Windows folder dialog — the one you
     * already know how to use. The page cannot open it itself: no browser gives
     * a page a folder's absolute path, so the hub opens it Windows-side and
     * reads the answer (see src/server/winpicker.ts).
     *
     * The built-in browser below is the fallback, for a machine with no Windows
     * to ask. Losing the native dialog must not cost you the ability to pick a
     * folder at all.
     */
    async function browseForFolder() {
      const btn = $("#dirpicker-browse");
      const prev = btn.textContent;
      btn.disabled = true;
      btn.textContent = "pick a folder…";
      try {
        const res = await fetch("/api/fs/pick", {
          method: "POST",
          headers: { "content-type": "application/json" },
          // Start where the form already points, so a second Browse resumes
          // where you were rather than at the top again.
          body: JSON.stringify({ startIn: $("#launch-dir").value.trim() || undefined }),
        });
        const body = await res.json();
        if (body.ok) {
          if (!body.cancelled) $("#launch-dir").value = body.path;
          return;
        }
        if (body.fallback) {
          toast(body.error, "warn");
          dirpickerOpen(); // still pick a folder, just not natively
          return;
        }
        toast(body.error || `Could not open the folder dialog (HTTP ${res.status}).`, "warn");
      } catch (err) {
        toast(`Could not open the folder dialog: ${err && err.message ? err.message : err}`, "warn");
        dirpickerOpen();
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    function dirpickerOpen() {
      $("#dirpicker").hidden = false;
      dirpickerLoad(null); // always starts at the hub's home directory
    }

    function dirpickerClose() {
      $("#dirpicker").hidden = true;
    }

    // =====================================================================
    // Bootstrap
    // =====================================================================

    async function loadHealth() {
      try {
        const res = await fetch("/api/health");
        if (!res.ok) return;
        const data = await res.json();
        const serverSeconds = data.uptime || 0;
        // The server floors uptime while the local ticker carries the sub-second
        // fraction, so re-anchoring on every poll makes the counter visibly tick
        // backward ~1s. Only re-anchor when the drift is meaningful (clock skew,
        // or a hub restart that legitimately resets uptime downward); otherwise
        // let the smooth 1s ticker keep running monotonically.
        const local = state.uptimeBase
          ? state.uptimeBase.seconds + (Date.now() - state.uptimeBase.at) / 1000
          : null;
        if (local == null || Math.abs(local - serverSeconds) > 2) {
          state.uptimeBase = { seconds: serverSeconds, at: Date.now() };
        }
        $("#version").textContent = data.version || "—";
        renderUptime();
      } catch {
        // health poll failure is non-fatal; SSE state already reflects trouble.
      }
    }

    async function loadAgents() {
      const res = await fetch("/api/agents");
      const list = await res.json();
      for (const agent of list) mergeAgent(agent);
    }

    async function loadMessages() {
      const res = await fetch("/api/messages?limit=200");
      const list = await res.json(); // newest-first
      state.messages = Array.isArray(list) ? list : [];
      state.msgIds = new Set(state.messages.map((m) => m.id));
    }

    function setupMcpCommand() {
      const cmd = `claude mcp add --transport http --scope user switchboard ${location.origin}/mcp`;
      const code = $("#mcp-cmd");
      code.textContent = cmd;
      code.title = cmd;
      $("#copy-mcp").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(cmd);
          toast("Command copied.", "ok", 2000);
        } catch {
          // Fallback for contexts where the async clipboard API is blocked.
          const ta = document.createElement("textarea");
          ta.value = cmd;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            toast("Command copied.", "ok", 2000);
          } catch {
            toast("Could not copy automatically — select and copy.", "warn");
          }
          ta.remove();
        }
      });
    }

    async function boot() {
      setupMcpCommand();
      loadUsageCollapsed();
      $("#usage-toggle").addEventListener("click", () => {
        setUsageCollapsed($("#usage-card").dataset.collapsed !== "true");
      });

      // Composer wiring.
      $("#filter-clear").addEventListener("click", () => setFilter(state.filter));

      // Launcher wiring. The name field sanitizes as you type for the same
      // reason rename does — it feeds the same ^[a-z0-9][a-z0-9-]{1,30}$ hub rule.
      $("#launcher").addEventListener("submit", launchAgent);
      bindAgentNameSanitizer($("#launch-name"));
      // A group name is an address too, under the same rule as an agent's, so
      // it gets the same treatment: typing "Chefe de Redes" reads back as
      // "chefe-de-redes" rather than bouncing off the hub.
      bindAgentNameSanitizer($("#launch-group"));

      // Messages: a tab like any other, so selecting it is closing the screen.
      $("#tab-messages").addEventListener("click", closeScreen);

      // File preview lightbox.
      $("#preview-close").addEventListener("click", closePreview);
      $("#preview-box").addEventListener("click", (ev) => {
        if (ev.target === $("#preview-box")) closePreview();
      });

      // Inline file dock (chat): close button + drag-resize handle.
      $("#inline-file-close").addEventListener("click", closeInlineFile);
      wireInlineFileResize();
      wireSidebarResize();

      // Launch agent (lightbox).
      $("#launcher-open").addEventListener("click", () => {
        $("#launcher-box").hidden = false;
        $("#launch-dir").focus();
      });
      $("#launcher-close").addEventListener("click", closeLauncher);
      // Clicking the backdrop closes; clicking the card must not.
      $("#launcher-box").addEventListener("click", (ev) => {
        if (ev.target === $("#launcher-box")) closeLauncher();
      });

      // The agent's screen.
      $("#screen-close").addEventListener("click", closeScreen);
      $("#screen-window").addEventListener("click", (ev) => {
        if (screenState.name) openAgentTerminal(screenState.name, ev.currentTarget);
      });
      for (const b of document.querySelectorAll(".screen-mode")) {
        b.addEventListener("click", () => setScreenMode(b.dataset.mode));
      }

      // Drag agent cards to reorder them (and drop across into another room).
      initDragReorder();

      // ⌘K / Ctrl-K opens the command palette anywhere in the app.
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
          e.preventDefault();
          if (paletteState.open) closePalette();
          else openPalette();
        }
      });

      // Free-text search over the transcript (debounced — one render per pause).
      let searchTimer = null;
      $("#feed-search").addEventListener("input", (e) => {
        const v = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.search = v;
          renderFeed();
        }, 120);
      });

      // Chat composer: type to the agent.
      const chatInput = $("#chat-input");
      const autogrow = () => {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px";
      };
      chatInput.addEventListener("input", autogrow);

      // ---- Attachments: paths first, bytes only when no path exists --------
      // Files copied from the local file manager usually expose text/uri-list.
      // In that case the composer references the ORIGINAL absolute path — no
      // duplicate in ~/.switchboard. Only an in-memory clipboard image (a real
      // screenshot, with no source path) is staged through POST /api/uploads.
      const chatPlaceholder = () => screenState.name ? "Write a dispatch…" : "Write a message…";
      const attachments = new Map(); // "[📎 name]" -> absolute path on the hub
      let uploading = 0;
      const attachToken = (name) => `[📎 ${name}]`;

      function uniqueAttachToken(name) {
        let token = attachToken(name);
        let n = 2;
        while (attachments.has(token)) token = attachToken(`${name} · ${n++}`);
        return token;
      }

      function pathsFromTransfer(data) {
        if (!data) return [];
        const raw = [];
        for (const type of ["text/uri-list", "text/plain"]) {
          try {
            const value = data.getData(type);
            if (value) raw.push(...value.split(/\r?\n/));
          } catch { /* the browser may gate one clipboard flavour */ }
        }
        for (const file of Array.from(data.files || [])) {
          // Electron exposes File.path; browsers generally do not. Honour it
          // when present without depending on it.
          if (typeof file.path === "string" && file.path.startsWith("/")) raw.push(file.path);
          if (typeof file.webkitRelativePath === "string" && file.webkitRelativePath.startsWith("/")) raw.push(file.webkitRelativePath);
        }
        const paths = [];
        for (const value of raw) {
          const candidate = value.trim();
          if (!candidate || candidate.startsWith("#")) continue;
          const target = localFileTarget(candidate);
          if (target && !paths.includes(target.path)) paths.push(target.path);
        }
        return paths;
      }

      function insertPathAttachments(paths) {
        if (!paths.length) return;
        let pos = chatInput.selectionStart ?? chatInput.value.length;
        for (const filePath of paths) {
          const name = filePath.split(/[\\/]/).filter(Boolean).pop() || filePath;
          const token = uniqueAttachToken(name);
          attachments.set(token, filePath);
          const value = chatInput.value;
          const at = Math.min(pos, value.length);
          const before = at > 0 && !/\s/.test(value[at - 1]) ? " " : "";
          const after = at < value.length && !/\s/.test(value[at]) ? " " : "";
          chatInput.value = value.slice(0, at) + before + token + after + value.slice(at);
          pos = at + before.length + token.length + after.length;
        }
        chatInput.setSelectionRange(pos, pos);
        chatInput.dispatchEvent(new Event("input"));
        chatInput.focus();
      }

      function setUploading(delta) {
        uploading += delta;
        const busy = uploading > 0;
        $("#chat-send").disabled = busy;
        chatInput.placeholder = busy ? "Staging screenshot…" : chatPlaceholder();
      }

      async function uploadFile(file, name) {
        // Content-Type is ALWAYS octet-stream: fetch would otherwise infer the
        // Blob's own type, and a dragged .json file would be eaten by the hub's
        // global JSON body parser before the raw route could see it.
        const res = await fetch(`/api/uploads?name=${encodeURIComponent(name)}`, {
          method: "POST",
          headers: { "content-type": "application/octet-stream" },
          body: file,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
        return body; // { ok, path, name }
      }

      async function attachFiles(files) {
        const list = Array.from(files || []);
        if (!list.length) return;
        let pos = chatInput.selectionStart ?? chatInput.value.length;
        for (const file of list) {
          setUploading(+1);
          try {
            // A pasted screenshot is an in-memory bitmap, not a copied file:
            // there is no original path to reference, so stage that one case.
            const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, "");
            const isPastedImage = file.type.startsWith("image/") && (file.name === "" || file.name === "image.png");
            if (!isPastedImage) {
              toast(`The browser hid ${file.name || "this file"}'s original path. Use “Copy path” and paste it — no duplicate was created.`, "warn", 7500);
              continue;
            }
            const name = `pasted-${stamp}.png`;
            const saved = await uploadFile(file, name);
            const tok = uniqueAttachToken(saved.name);
            attachments.set(tok, saved.path);
            const v = chatInput.value;
            const at = Math.min(pos, v.length);
            chatInput.value = v.slice(0, at) + tok + v.slice(at);
            pos = at + tok.length;
            chatInput.setSelectionRange(pos, pos);
            chatInput.dispatchEvent(new Event("input")); // autogrow + menus
            toast("Screenshot staged for 24h — copied files keep their original path.", "ok", 4500);
          } catch (err) {
            toast(`Attachment failed: ${err && err.message ? err.message : err}`, "warn");
          } finally {
            setUploading(-1);
          }
        }
        chatInput.focus();
      }

      chatInput.addEventListener("paste", (ev) => {
        const paths = pathsFromTransfer(ev.clipboardData);
        if (paths.length) {
          ev.preventDefault();
          insertPathAttachments(paths);
          return;
        }
        if (ev.clipboardData && ev.clipboardData.files && ev.clipboardData.files.length) {
          ev.preventDefault();
          attachFiles(ev.clipboardData.files);
        }
      });
      chatInput.addEventListener("dragover", (ev) => {
        ev.preventDefault(); // required, or the browser navigates to the file
        chatInput.classList.add("drag-over");
      });
      chatInput.addEventListener("dragleave", () => chatInput.classList.remove("drag-over"));
      chatInput.addEventListener("drop", (ev) => {
        ev.preventDefault();
        chatInput.classList.remove("drag-over");
        const paths = pathsFromTransfer(ev.dataTransfer);
        if (paths.length) {
          insertPathAttachments(paths);
          return;
        }
        if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
          attachFiles(ev.dataTransfer.files);
        }
      });
      // ---- end attachments -------------------------------------------------

      // ---- Slash-command autocomplete (composer) --------------------------
      const SLASH_DESCRIPTIONS = {
        compact: "clear context & summarize", cost: "show token cost",
        context: "show context usage", usage: "show usage limits",
        clear: "start a fresh conversation", model: "switch model",
        mcp: "manage MCP servers", agents: "manage subagents",
        approvals: "permission mode", init: "initialize CLAUDE.md",
        review: "review changes", diff: "show diff", undo: "undo last change",
        resume: "resume a conversation",
      };
      const SLASH_ALL = Object.keys(SLASH_DESCRIPTIONS);
      const SLASH_HIDDEN = new Set(["exit", "help"]);
      const slashMenuEl = $("#slash-menu");
      const slashState = { open: false, items: [], active: 0 };
      function filterSlash(query) {
        const q = query.toLowerCase();
        const matches = SLASH_ALL.filter((c) => !SLASH_HIDDEN.has(c) && c.toLowerCase().includes(q));
        return matches.sort((a, b) => SLASH_ALL.indexOf(a) - SLASH_ALL.indexOf(b));
      }
      function renderSlashMenu() {
        slashMenuEl.replaceChildren();
        slashState.items.forEach((cmd, i) => {
          const row = el("div", "slash-item" + (i === slashState.active ? " active" : ""));
          row.appendChild(el("span", "slash-item__name", "/" + cmd));
          if (SLASH_DESCRIPTIONS[cmd]) row.appendChild(el("span", "slash-item__desc", SLASH_DESCRIPTIONS[cmd]));
          row.addEventListener("mousedown", (e) => { e.preventDefault(); pickSlash(cmd); });
          row.addEventListener("mouseenter", () => { if (slashState.active !== i) { slashState.active = i; renderSlashMenu(); } });
          if (i === slashState.active) requestAnimationFrame(() => row.scrollIntoView({ block: "nearest" }));
          slashMenuEl.appendChild(row);
        });
      }
      function closeSlashMenu() {
        slashState.open = false;
        slashState.items = [];
        slashState.active = 0;
        slashMenuEl.hidden = true;
      }
      function updateSlashMenu() {
        const v = chatInput.value;
        if (!/^\/\S*$/.test(v)) return closeSlashMenu();
        const items = filterSlash(v.slice(1));
        if (!items.length) return closeSlashMenu();
        slashState.items = items;
        if (slashState.active >= items.length) slashState.active = 0;
        slashState.open = true;
        slashMenuEl.hidden = false;
        renderSlashMenu();
      }
      function pickSlash(cmd) {
        chatInput.value = "/" + cmd + " ";
        closeSlashMenu();
        autogrow();
        chatInput.focus();
        chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
      }
      function slashKeydown(ev) {
        if (!slashState.open) return false;
        const n = slashState.items.length;
        if (ev.key === "ArrowDown") { ev.preventDefault(); slashState.active = (slashState.active + 1) % n; renderSlashMenu(); return true; }
        if (ev.key === "ArrowUp") { ev.preventDefault(); slashState.active = (slashState.active - 1 + n) % n; renderSlashMenu(); return true; }
        if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pickSlash(slashState.items[slashState.active]); return true; }
        if (ev.key === "Escape") { ev.preventDefault(); closeSlashMenu(); return true; }
        return false;
      }
      chatInput.addEventListener("input", updateSlashMenu);
      chatInput.addEventListener("blur", () => closeSlashMenu());
      // ---- end slash-command autocomplete --------------------------------

      // ---- "@" file-mention autocomplete (composer) ------------------------
      // Same popover contract as the slash menu, different trigger: the token
      // ENDING at the caret matches /@([\w./-]*)$/ — so an "@" works mid-message
      // (the slash menu is start-anchored). Items come from the OPEN agent's
      // cwd via GET /api/agents/:name/files, debounced ~150ms per keystroke;
      // `seq` orphans stale responses so a slow fetch can never repaint over a
      // newer one. Picking replaces the "@query" span (including the "@") with
      // the relative path + a space.
      const mentionMenuEl = $("#mention-menu");
      const mentionState = { open: false, items: [], active: 0, start: -1, seq: 0 };
      let mentionTimer = null;
      function closeMentionMenu() {
        mentionState.open = false;
        mentionState.items = [];
        mentionState.active = 0;
        mentionState.start = -1;
        mentionState.seq += 1; // any in-flight fetch is now stale
        clearTimeout(mentionTimer);
        mentionMenuEl.hidden = true;
      }
      function renderMentionMenu() {
        mentionMenuEl.replaceChildren();
        mentionState.items.forEach((f, i) => {
          const row = el("div", "slash-item" + (i === mentionState.active ? " active" : ""));
          row.appendChild(el("span", "slash-item__icon", f.dir ? "📁" : "📄"));
          row.appendChild(el("span", "slash-item__name", f.path));
          row.addEventListener("mousedown", (e) => { e.preventDefault(); pickMention(f); });
          row.addEventListener("mouseenter", () => { if (mentionState.active !== i) { mentionState.active = i; renderMentionMenu(); } });
          if (i === mentionState.active) requestAnimationFrame(() => row.scrollIntoView({ block: "nearest" }));
          mentionMenuEl.appendChild(row);
        });
      }
      function updateMentionMenu() {
        if (slashState.open) return closeMentionMenu(); // one popover at a time
        const name = screenState.name;
        if (!name) return closeMentionMenu();
        const before = chatInput.value.slice(0, chatInput.selectionStart);
        const m = /@([\w./-]*)$/.exec(before);
        if (!m) return closeMentionMenu();
        mentionState.start = m.index;
        clearTimeout(mentionTimer);
        const seq = ++mentionState.seq;
        mentionTimer = setTimeout(async () => {
          try {
            const res = await fetch(
              `/api/agents/${encodeURIComponent(name)}/files?q=${encodeURIComponent(m[1])}&limit=50`,
            );
            const data = await res.json();
            if (seq !== mentionState.seq) return; // a newer keystroke owns the menu
            if (!res.ok || !data.ok || !data.files.length) return closeMentionMenu();
            mentionState.items = data.files;
            if (mentionState.active >= data.files.length) mentionState.active = 0;
            mentionState.open = true;
            mentionMenuEl.hidden = false;
            renderMentionMenu();
          } catch {
            if (seq === mentionState.seq) closeMentionMenu();
          }
        }, 150);
      }
      function pickMention(f) {
        // Re-derive the "@query" span at pick time: the user may have typed
        // between the fetch and the click, and the stored start could be stale.
        const caret = chatInput.selectionStart;
        const m = /@([\w./-]*)$/.exec(chatInput.value.slice(0, caret));
        const start = m ? m.index : mentionState.start;
        if (start < 0) return closeMentionMenu();
        const insert = f.path + " ";
        chatInput.value = chatInput.value.slice(0, start) + insert + chatInput.value.slice(caret);
        closeMentionMenu();
        autogrow();
        chatInput.focus();
        const pos = start + insert.length;
        chatInput.setSelectionRange(pos, pos);
      }
      function mentionKeydown(ev) {
        if (!mentionState.open) return false;
        const n = mentionState.items.length;
        if (ev.key === "ArrowDown") { ev.preventDefault(); mentionState.active = (mentionState.active + 1) % n; renderMentionMenu(); return true; }
        if (ev.key === "ArrowUp") { ev.preventDefault(); mentionState.active = (mentionState.active - 1 + n) % n; renderMentionMenu(); return true; }
        if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pickMention(mentionState.items[mentionState.active]); return true; }
        if (ev.key === "Escape") { ev.preventDefault(); closeMentionMenu(); return true; }
        return false;
      }
      chatInput.addEventListener("input", updateMentionMenu);
      chatInput.addEventListener("click", updateMentionMenu); // caret moved by mouse
      chatInput.addEventListener("blur", () => closeMentionMenu());
      // ---- end "@" file-mention autocomplete -------------------------------

      // ---- "%" agent-reference autocomplete (composer) ---------------------
      // Same contract as @/slash: typing "%word" ending at the caret opens a
      // menu of AGENTS (the "%<name>" delegation sigil the network uses). No
      // fetch — it reads state.agents. Picking inserts "%<kebab name> " (the id
      // the hub routes on, even when a display name is shown).
      const agentRefMenuEl = $("#agentref-menu");
      const agentRefState = { open: false, items: [], active: 0, start: -1 };
      function closeAgentRefMenu() {
        agentRefState.open = false;
        agentRefState.items = [];
        agentRefState.active = 0;
        agentRefState.start = -1;
        agentRefMenuEl.hidden = true;
      }
      function renderAgentRefMenu() {
        agentRefMenuEl.replaceChildren();
        agentRefState.items.forEach((a, i) => {
          const row = el("div", "slash-item" + (i === agentRefState.active ? " active" : ""));
          row.appendChild(el("span", `p-dot${a.status === "online" ? " online" : ""}`));
          row.appendChild(el("span", "slash-item__name", "%" + a.name));
          if (displayOf(a) !== a.name) row.appendChild(el("span", "slash-item__desc", displayOf(a)));
          row.addEventListener("mousedown", (e) => { e.preventDefault(); pickAgentRef(a); });
          row.addEventListener("mouseenter", () => { if (agentRefState.active !== i) { agentRefState.active = i; renderAgentRefMenu(); } });
          agentRefMenuEl.appendChild(row);
        });
      }
      function updateAgentRefMenu() {
        if (slashState.open || mentionState.open) return closeAgentRefMenu();
        if (!screenState.name) return closeAgentRefMenu();
        const before = chatInput.value.slice(0, chatInput.selectionStart);
        const m = /(?:^|\s)%([\w-]*)$/.exec(before);
        if (!m) return closeAgentRefMenu();
        const q = m[1].toLowerCase();
        const items = sortedAgents().filter(
          (a) => a.name !== screenState.name && (a.name.toLowerCase().includes(q) || displayOf(a).toLowerCase().includes(q)),
        );
        if (!items.length) return closeAgentRefMenu();
        agentRefState.items = items;
        agentRefState.start = m.index + m[0].indexOf("%");
        if (agentRefState.active >= items.length) agentRefState.active = 0;
        agentRefState.open = true;
        agentRefMenuEl.hidden = false;
        renderAgentRefMenu();
      }
      function pickAgentRef(a) {
        const caret = chatInput.selectionStart;
        const m = /(?:^|\s)%([\w-]*)$/.exec(chatInput.value.slice(0, caret));
        const start = m ? m.index + m[0].indexOf("%") : agentRefState.start;
        if (start < 0) return closeAgentRefMenu();
        const insert = "%" + a.name + " ";
        chatInput.value = chatInput.value.slice(0, start) + insert + chatInput.value.slice(caret);
        closeAgentRefMenu();
        autogrow();
        chatInput.focus();
        const pos = start + insert.length;
        chatInput.setSelectionRange(pos, pos);
      }
      function agentRefKeydown(ev) {
        if (!agentRefState.open) return false;
        const n = agentRefState.items.length;
        if (ev.key === "ArrowDown") { ev.preventDefault(); agentRefState.active = (agentRefState.active + 1) % n; renderAgentRefMenu(); return true; }
        if (ev.key === "ArrowUp") { ev.preventDefault(); agentRefState.active = (agentRefState.active - 1 + n) % n; renderAgentRefMenu(); return true; }
        if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pickAgentRef(agentRefState.items[agentRefState.active]); return true; }
        if (ev.key === "Escape") { ev.preventDefault(); closeAgentRefMenu(); return true; }
        return false;
      }
      chatInput.addEventListener("input", updateAgentRefMenu);
      chatInput.addEventListener("click", updateAgentRefMenu);
      chatInput.addEventListener("blur", () => closeAgentRefMenu());
      // ---- end "%" agent-reference autocomplete ----------------------------

      // Shell-style history of the operator's own sends (↑ recalls, ↓ steps back).
      const sentHistory = [];
      let histIdx = -1; // -1 = not navigating
      const loadHist = (i) => {
        histIdx = i;
        chatInput.value = i < 0 ? "" : sentHistory[i];
        autogrow();
        chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
      };
      const pushSent = (text) => {
        sentHistory.push(text);
        if (sentHistory.length > 30) sentHistory.shift();
        histIdx = -1;
      };
      chatInput.addEventListener("keydown", (ev) => {
        // The slash menu, when open, owns Enter/Tab/arrows/Esc — before the rest.
        if (slashKeydown(ev)) return;
        if (mentionKeydown(ev)) return;
        if (agentRefKeydown(ev)) return;
        // Enter sends; Shift+Enter is a newline.
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          $("#chat-composer").requestSubmit();
          return;
        }
        // Escape interrupts the agent mid-turn (only when it's actually working).
        if (ev.key === "Escape") {
          const a = screenState.name ? state.agents.get(screenState.name) : null;
          if (a && a.activity === "working") {
            ev.preventDefault();
            sendScreenInput(screenState.name, "\x1b");
          }
          return;
        }
        if (ev.key === "ArrowUp" && sentHistory.length && (histIdx >= 0 || (chatInput.value === "" || chatInput.selectionStart === 0))) {
          ev.preventDefault();
          loadHist(histIdx < 0 ? sentHistory.length - 1 : Math.max(0, histIdx - 1));
        } else if (ev.key === "ArrowDown" && histIdx >= 0) {
          ev.preventDefault();
          loadHist(histIdx + 1 >= sentHistory.length ? -1 : histIdx + 1);
        } else if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") {
          histIdx = -1; // any other key exits history mode
        }
      });
      $("#chat-composer").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const name = screenState.name;
        if (uploading > 0) return; // attachments still in flight (send is disabled too)
        // Expand each [📎 name] token to its absolute path — normally the
        // original file; only pathless clipboard screenshots use staging.
        let raw = chatInput.value;
        for (const [tok, p] of attachments) raw = raw.split(tok).join(p);
        const text = raw.trim();
        if (!name || text === "") return;
        // A slash command drives the CLI's own interactive UI (the autocomplete
        // menu, the model picker, /clear…) — and that UI lives on the terminal
        // SCREEN, which the chat casca (a mirror of the JSONL log) cannot show.
        // So a "/…" is sent and we FLIP to the terminal, where its menu is: the
        // command actually does something you can see and finish, instead of
        // vanishing into a view that will never render it.
        const isSlash = isSlashCommand(text);
        chatInput.disabled = true;
        // Echo the message into the chat AT ONCE — the agent may be mid-turn and
        // won't log it (so won't mirror it back) until it finishes, and a chat
        // where your own message vanishes for 30s reads as broken. The optimistic
        // bubble is reconciled away when the real one arrives from the log.
        if (!isSlash) echoUserMessage(text);
        pushSent(text);
        try {
          await sendChatMessage(name, text);
          chatInput.value = "";
          attachments.clear();
          autogrow();
          if (isSlash) {
            toast("Slash commands run in the terminal — switched you there.");
            setScreenMode("terminal");
          }
        } catch (err) {
          toast(`Could not send: ${err && err.message ? err.message : err}`, "warn");
        } finally {
          chatInput.disabled = false;
          if (!isSlash) chatInput.focus();
        }
      });
      // STOP button: interrupt the current turn with one ESC to the agent's pane.
      $("#chat-stop").addEventListener("click", () => {
        if (screenState.name) sendScreenInput(screenState.name, "\x1b");
      });

      // ---- Dictation mic (MediaRecorder -> hub -> Groq Whisper) ------------
      // This used Chrome's Web Speech API, which transcribes on GOOGLE's
      // servers — and on this network that endpoint is unreachable, so the mic
      // was simply dead ("speech service unreachable"). Now the page records
      // the audio itself and the HUB transcribes it (POST /api/stt, a Groq
      // Whisper proxy — see src/server/stt.ts). Click = record, click again =
      // stop + transcribe; the text lands at the caret position captured when
      // recording started. The button hides where recording isn't possible.
      const micBtn = $("#chat-mic");
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) {
        micBtn.hidden = true;
      } else {
        let rec = null; // { recorder, stream, chunks, base } while recording
        let transcribing = false;
        const micReset = () => {
          rec = null;
          micBtn.classList.remove("rec");
          micBtn.disabled = false;
          micBtn.textContent = "🎤";
        };
        micBtn.addEventListener("click", async () => {
          if (transcribing) return; // one at a time
          if (rec) {
            rec.recorder.stop(); // onstop transcribes + cleans up
            return;
          }
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (err) {
            toast(
              err && err.name === "NotAllowedError"
                ? "Dictation: microphone permission denied — allow it in the address bar."
                : `Dictation: could not open the microphone (${err && err.message ? err.message : err}).`,
              "warn",
            );
            return;
          }
          const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : MediaRecorder.isTypeSupported("audio/webm")
              ? "audio/webm"
              : ""; // let the browser pick (Safari → mp4)
          const recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          const pos = chatInput.selectionStart ?? chatInput.value.length;
          // Signal-level watchdog: an AnalyserNode samples the mic while
          // recording. If the peak never leaves the noise floor, the device
          // Chrome picked is muted/wrong — say THAT instead of the useless
          // "no speech heard" (this exact failure happened: 1.4 KB of pure
          // silence looked like a transcription bug).
          let peak = 0;
          let levelTimer = null;
          let audioCtx = null;
          let waveRaf = null;
          const waveEl = $("#chat-wave");
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            audioCtx.createMediaStreamSource(stream).connect(analyser);
            const buf = new Uint8Array(analyser.fftSize);
            levelTimer = setInterval(() => {
              analyser.getByteTimeDomainData(buf);
              for (const v of buf) {
                const dev = Math.abs(v - 128) / 128; // 0..1 deviation from silence
                if (dev > peak) peak = dev;
              }
              // Live feedback on the button: filled dot = signal, hollow = silence.
              micBtn.textContent = peak > 0.02 ? "⏺" : "◌";
            }, 150);
            // Waveform (#40): recent peaks march left, voice-note style. Same
            // analyser as the watchdog, own buffer, drawn on rAF; pushes are
            // throttled so the wave scrolls at a readable pace. The interval
            // above stays the watchdog authority — rAF pauses in a background
            // tab and a mid-recording tab switch must not fake "pure silence".
            const dpr = window.devicePixelRatio || 1;
            waveEl.width = 120 * dpr;
            waveEl.height = 30 * dpr;
            const wctx = waveEl.getContext("2d");
            const barColor =
              getComputedStyle(document.documentElement).getPropertyValue("--danger").trim() || "#e05555";
            const bars = new Array(24).fill(0);
            const wbuf = new Uint8Array(analyser.fftSize);
            let lastPush = 0;
            const drawWave = (ts) => {
              analyser.getByteTimeDomainData(wbuf);
              let p = 0;
              for (const v of wbuf) {
                const dev = Math.abs(v - 128) / 128;
                if (dev > p) p = dev;
              }
              if (ts - lastPush >= 50) {
                lastPush = ts;
                bars.push(Math.min(1, p * 3)); // speech peaks rarely pass ~0.3
                bars.shift();
              }
              wctx.clearRect(0, 0, waveEl.width, waveEl.height);
              wctx.fillStyle = barColor;
              const bw = waveEl.width / bars.length;
              for (let i = 0; i < bars.length; i++) {
                const h = Math.max(2 * dpr, bars[i] * (waveEl.height - 6 * dpr));
                wctx.fillRect(i * bw + bw * 0.2, (waveEl.height - h) / 2, bw * 0.6, h);
              }
              waveRaf = requestAnimationFrame(drawWave);
            };
            waveEl.hidden = false;
            waveRaf = requestAnimationFrame(drawWave);
          } catch { /* analyser is best-effort — recording works without it */ }
          rec = {
            recorder,
            stream,
            chunks: [],
            base: { before: chatInput.value.slice(0, pos), after: chatInput.value.slice(pos) },
            stopLevel: () => {
              if (levelTimer) clearInterval(levelTimer);
              if (waveRaf) cancelAnimationFrame(waveRaf);
              waveEl.hidden = true;
              if (audioCtx) audioCtx.close().catch(() => {});
              return peak;
            },
          };
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) rec && rec.chunks.push(e.data);
          };
          recorder.onstop = async () => {
            const { stream: s, chunks, base, stopLevel } = rec;
            const heardPeak = stopLevel();
            s.getTracks().forEach((t) => t.stop()); // release the mic (tab indicator off)
            const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
            rec = null;
            if (blob.size === 0) {
              micReset();
              toast("Dictation: nothing was recorded.", "warn");
              return;
            }
            // The mic never left the noise floor: the recording is silence, so
            // transcribing it is pointless — name the REAL problem instead.
            if (heardPeak < 0.02) {
              micReset();
              toast(
                "Dictation: the microphone captured pure silence — Chrome is likely on the wrong " +
                  "input device. Check Windows Sound → Input, and the mic icon in the address bar.",
                "warn",
                10000,
              );
              return;
            }
            transcribing = true;
            micBtn.classList.remove("rec");
            micBtn.disabled = true;
            micBtn.textContent = "…";
            try {
              const res = await fetch("/api/stt", {
                method: "POST",
                headers: { "content-type": blob.type || "audio/webm" },
                body: blob,
              });
              const data = await res.json().catch(() => ({}));
              if (!res.ok || !data.ok) {
                toast(data.error || `Dictation failed (HTTP ${res.status}).`, "warn", 8000);
                return;
              }
              if (!data.text) {
                toast("Dictation: no speech heard.", "warn");
                return;
              }
              // Insert at the caret captured when recording STARTED, with a
              // space seam only where one is actually needed.
              const seamL = base.before && !/\s$/.test(base.before) ? " " : "";
              const seamR = base.after && !/^\s/.test(base.after) ? " " : "";
              chatInput.value = base.before + seamL + data.text + seamR + base.after;
              const caret = (base.before + seamL + data.text).length;
              chatInput.setSelectionRange(caret, caret);
              chatInput.focus();
              autogrow();
            } catch (err) {
              toast(`Dictation failed: ${err && err.message ? err.message : err}`, "warn");
            } finally {
              transcribing = false;
              micReset();
            }
          };
          recorder.start();
          micBtn.classList.add("rec");
          micBtn.textContent = "⏺";
          chatInput.focus();
        });
      }
      // ---- end dictation ---------------------------------------------------

      // Groups panel wiring.
      $("#groups-open").addEventListener("click", () => {
        if ($("#groups-box").hidden) openGroups();
        else closeGroups();
      });
      $("#groups-close").addEventListener("click", closeGroups);
      // Backdrop closes, the card does not — same contract as the launcher.
      $("#groups-box").addEventListener("click", (ev) => {
        if (ev.target === $("#groups-box")) closeGroups();
      });
      $("#groups-create").addEventListener("click", () => {
        const input = $("#groups-new");
        const name = sanitizeAgentNameInput(input.value, false);
        if (name === "") {
          toast("Name the group first — lowercase letters, digits and hyphens.", "warn");
          return;
        }
        if (panelGroups().includes(name)) {
          toast(`The group "${name}" already exists.`, "warn");
          return;
        }
        // The hub learns a group from the agents in it, so a new one is only a
        // box on screen until you move somebody into it.
        draftGroups.add(name);
        input.value = "";
        renderGroupsPanel();
        toast(`Group "${name}" is ready — move an agent into it to make it real.`);
      });
      bindAgentNameSanitizer($("#groups-new"));
      $("#groups-new").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          $("#groups-create").click();
        }
      });

      // Dir picker wiring (the launcher form's "Browse…" panel).
      $("#dirpicker-browse").addEventListener("click", browseForFolder);
      $("#dirpicker-close").addEventListener("click", dirpickerClose);
      $("#dirpicker-select").addEventListener("click", () => {
        if (dirpickerState.path) $("#launch-dir").value = dirpickerState.path;
        dirpickerClose();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key !== "Escape") return;
        // NOT the screen: Escape belongs to the agent while you are typing at
        // it (it is how you interrupt Claude Code), so it must reach the pane
        // rather than close the view. The ✕ and the card do that.
        if (!$("#dirpicker").hidden) dirpickerClose();
        else if (!$("#preview-box").hidden) closePreview();
        else if (!$("#launcher-box").hidden) closeLauncher();
        else if (!$("#groups-box").hidden) closeGroups();
      });

      loadUnseen(); // restore "unread reply" pips before the first rail render

      // Bootstrap snapshot (agents + messages + health) BEFORE the live stream,
      // so the SSE only ever adds to a populated view (PRD Phase 6 behavior).
      try {
        await Promise.all([loadHealth(), loadAgents(), loadMessages()]);
      } catch (err) {
        toast("Failed to load the Hub's initial state.", "error");
      }
      renderAgents();
      renderFilterBar();
      renderFeed();

      connectSse();

      // Local uptime ticker (1s) resynced by the periodic /api/health poll.
      setInterval(renderUptime, 1000);
      setInterval(loadHealth, 15000);

      // Claude /usage bars: poll every 60s and on window focus (the reference's
      // cadence). Pace recolours as the window elapses.
      refreshUsage();
      setInterval(refreshUsage, 60000);
      // A lighter tick just re-renders (the "updated Xs ago" label and the pace
      // colour, which shift as the window elapses) between the 60s fetches.
      setInterval(() => { if (!$("#usage-card").hidden) renderUsage(); }, 10000);
      window.addEventListener("focus", refreshUsage);
    }

    // WAIT for the DOM. This script sits in the middle of the body, so markup
    // below it does not exist yet when it runs — boot() wires listeners onto
    // ~50 elements and the first null threw, leaving the dashboard stuck on
    // "connecting" with a live hub and four agents behind it. Nothing errored
    // visibly; it just never started.
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
  <!-- Groups: a lightbox, like the launcher. Both are things you MANAGE;
       the panel used to shove the transcript aside, which is what a view
       does, not a dialog. Two shapes for the same kind of action was the
       inconsistency. -->
  <div class="lightbox" id="groups-box" hidden>
    <div class="lightbox-card lightbox-card-wide">
        <div class="groups-panel" id="groups-panel">
          <div class="groups-head">
            <span class="eyebrow">Groups</span>
            <span class="groups-hint">An agent can only message agents in the same group.</span>
            <button class="dirpicker-close" id="groups-close" type="button"
              title="Close (Esc)">✕</button>
          </div>
          <div class="groups-body" id="groups-body"></div>
          <div class="groups-foot">
            <input class="launch-input groups-new-input" id="groups-new" spellcheck="false"
              placeholder="new group name" maxlength="31" />
            <button class="btn" id="groups-create" type="button"
              title="Create the group — then move agents into it above">Create group</button>
          </div>
        </div>
    </div>
  </div>

  <!-- File preview: a file path an agent named in a message, opened inline.
       Reads are scoped server-side (an agent working dir or your home); the
       modal just renders what comes back. -->
  <div class="lightbox" id="preview-box" hidden>
    <div class="lightbox-card lightbox-card-wide">
      <div class="lightbox-head">
        <span class="eyebrow" id="preview-name">file</span>
        <span class="preview-path" id="preview-path"></span>
        <span class="preview-actions">
          <button class="btn preview-browser" id="preview-browser" type="button" hidden
            title="Open this file in a browser tab — an .html opens as the site, an image at full size">browser</button>
          <button class="btn preview-reveal" id="preview-reveal" type="button" hidden
            title="Show this file in its folder (Windows Explorer)">folder</button>
        </span>
        <button class="dirpicker-close" id="preview-close" type="button"
          title="Close (Esc)">✕</button>
      </div>
      <div class="preview-body" id="preview-body"></div>
    </div>
  </div>

  <!-- Launch agent: a lightbox now. It used to own the bottom half of the rail
       permanently — a form you use once per project, sitting in the space the
       rail needs to be what it became: the list of agents you switch between. -->
  <div class="lightbox" id="launcher-box" hidden>
    <div class="lightbox-card">
      <div class="lightbox-head">
        <span class="eyebrow">Launch agent</span>
        <button class="dirpicker-close" id="launcher-close" type="button"
          title="Close (Esc)">✕</button>
      </div>
        <form class="launcher" id="launcher" autocomplete="off">
          <div class="launcher-title">Launch agent</div>
          <div>
            <label class="launcher-label" for="launch-dir">directory (absolute path)</label>
            <div class="launcher-dir-row">
              <input class="launch-input" id="launch-dir" name="dir"
                placeholder="/home/you/project — \\wsl$\… and C:\… accepted too"
                spellcheck="false" />
              <button class="btn dirpicker-browse" id="dirpicker-browse" type="button"
                title="Browse the WSL filesystem and pick a folder">Browse…</button>
            </div>
            <div class="dirpicker" id="dirpicker" hidden>
              <div class="dirpicker-head">
                <span class="dirpicker-path" id="dirpicker-path"></span>
                <button class="dirpicker-close" id="dirpicker-close" type="button"
                  title="Close (Esc)">✕</button>
              </div>
              <div class="dirpicker-list" id="dirpicker-list"></div>
              <div class="dirpicker-foot">
                <button class="dirpicker-select" id="dirpicker-select" type="button">
                  Use this folder
                </button>
              </div>
            </div>
          </div>
          <div class="launcher-grid">
            <div>
              <label class="launcher-label" for="launch-name">name</label>
              <input class="launch-input" id="launch-name" name="name"
                placeholder="defaults to folder name" spellcheck="false" />
            </div>
            <div>
              <label class="launcher-label" for="launch-role">role</label>
              <input class="launch-input" id="launch-role" name="role"
                placeholder="e.g. API backend" />
            </div>
          </div>
          <div>
            <label class="launcher-label" for="launch-group">group</label>
            <input class="launch-input" id="launch-group" name="group"
              list="group-options" spellcheck="false"
              placeholder="default — the agents it can talk to"
              title="An agent can only message agents in the same group. Type a new name to start a group, or pick one you already have." />
            <datalist id="group-options"></datalist>
          </div>
          <div class="launcher-row">
            <label class="launcher-label" for="launch-agent-claude">agent</label>
            <div class="launcher-segmented" id="launch-agent"
              title="Which coding agent CLI the hub opens in the tmux session.">
              <input type="radio" name="agentType" id="launch-agent-claude"
                value="claude" checked />
              <label class="launcher-segment" for="launch-agent-claude">
                <svg class="agent-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5527h3.7442L10.5363 3.541Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z"/></svg>
                Claude
              </label>
              <input type="radio" name="agentType" id="launch-agent-codex" value="codex" />
              <label class="launcher-segment" for="launch-agent-codex">
                <svg class="agent-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.4593a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>
                Codex
              </label>
            </div>
          </div>
          <div class="launcher-row">
            <label class="launcher-toggle"
              title="Resume the folder's previous conversation (claude -c / codex resume --last). Falls back to a fresh session when there is nothing to resume.">
              <input type="checkbox" id="launch-continue" checked />
              continue conversation
            </label>
            <button class="launch-btn" id="launch-btn" type="submit">launch</button>
          </div>
        </form>
    </div>
  </div>
</body>
</html>
