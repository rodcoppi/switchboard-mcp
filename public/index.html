     * wrote to. Returns null when neither end is still registered (a removed
     * agent's history), which no room should claim.
     */
    function messageGroup(m) {
      const sender = state.agents.get(m.from);
      if (sender) return groupOf(sender);
      const recipient = state.agents.get(m.to);
      return recipient ? groupOf(recipient) : null;
    }

    // Group order is a viewer preference too (drag the group heads). Arranged
    // groups lead, in the saved order; the rest stay alphabetical behind them.
    function loadGroupOrder() {
      try {
        const v = JSON.parse(localStorage.getItem("sb.groupOrder") || "[]");
        return Array.isArray(v) ? v : [];
      } catch {
        return [];
      }
    }
    function saveGroupOrder(groups) {
      localStorage.setItem("sb.groupOrder", JSON.stringify(groups));
    }

    /** Every group that has an agent, in the operator's order (else sorted). */
    function allGroups() {
      const present = [...new Set([...state.agents.values()].map(groupOf))];
      const rank = new Map(loadGroupOrder().map((g, i) => [g, i]));
      return present.sort((a, b) => {
        const ia = rank.has(a) ? rank.get(a) : -1;
        const ib = rank.has(b) ? rank.get(b) : -1;
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
    }

    function renderAgents() {
      const container = $("#agents");
      // A rebuild while a card's ⋯ menu is open closes it in the operator's
      // face — and the idle/working poll re-renders every ~2.5s, which made the
      // menu nearly unusable. Skip this pass; the next update lands in seconds.
      if (container.querySelector(".agent-menu:not([hidden])")) return;
      container.textContent = "";
      const agents = sortedAgents();
      if (agents.length === 0) {
        container.appendChild(
          el(
            "div",
            "empty-hint",
            "No registered agents. Run `switchboard start <name>`.",
          ),
        );
        renderHeader();
        return;
      }
      // Grouped, under a header each: the rail then answers "who can talk to
      // whom" by its shape, which is the question a group exists to settle.
      //
      // The one case with no header is the install that never asked for groups:
      // everyone in `default`, where a label over the whole rail says nothing.
      // The moment you NAME a room, it gets its header even if it is the only
      // one — hiding it made a group you had just created and filled look like
      // it had vanished.
      const groups = allGroups();
      if (groups.length === 1 && groups[0] === DEFAULT_GROUP) {
        appendAgentCards(container, agents);
      } else {
        for (const group of groups) {
          const inGroup = agents.filter((a) => groupOf(a) === group);
          if (state.group && group !== state.group) continue;
          const box = el("div", "rail-group");
          box.dataset.group = group;
          box.style.setProperty("--group-color", groupColor(group));
          box.appendChild(buildGroupHead(group, inGroup));
          if (!collapsedGroups.has(group)) {
            appendAgentCards(box, inGroup);
          }
          container.appendChild(box);
        }
      }
      renderHeader();
      // Both are derived from the agent set, so they belong to the one render
      // that already runs whenever an agent appears, moves group or leaves.
      renderGroupTabs();
      renderGroupOptions();
      renderTabs(); // the tabs carry each agent's dot and unread count
      updateChatTyping(); // reflect the open agent's working/idle in the chat
      updateStopButton(); // and the composer STOP button (same working signal)
      renderScreenStatus(); // permission/plan/goal pills in the screen header
      renderEngineTabs(); // Claude|Codex tabs when the open agent has a sibling
    }

    /**
     * A group's header in the rail, and its fold. Collapsed, the header is all
     * that is left of the group, so it carries the tally — how many agents are
     * in there and how many of those are up. Unread never hides: a folded group
     * with something waiting has to say so, or folding becomes a way to miss
     * messages.
     */
    function buildGroupHead(group, members) {
      const collapsed = collapsedGroups.has(group);
      const head = el("button", `group-head${collapsed ? " collapsed" : ""}`);
      head.type = "button";
      head.setAttribute("aria-expanded", String(!collapsed));
      // Drag a group head to reorder the rooms in the rail.
      if (group !== DEFAULT_GROUP) {
        head.draggable = true;
        head.addEventListener("dragstart", (e) => {
          dragGroup = group;
          e.dataTransfer.effectAllowed = "move";
          try {
            e.dataTransfer.setData("text/plain", "group:" + group);
          } catch {
            /* payload unused */
          }
        });
        head.addEventListener("dragend", () => {
          if (dragGroup) commitGroupOrder();
          dragGroup = null;
        });
      }
      const online = members.filter((a) => a.status === "online").length;
      const unread = members.reduce((n, a) => n + (a.unreadCount || 0), 0);
      head.title = collapsed
        ? `Unfold ${group} (${members.length} agents, ${online} online)`
        : `Fold ${group} away`;

      const nameSpan = el("span", "rail-group-name", groupLabelOf(group));
      if (groupLabelOf(group) !== group) nameSpan.title = group; // the id, one hover away
      head.append(
        el("span", "caret", "▾"),
        nameSpan,
        el("span", "tally", `${online}/${members.length}`),
      );
      // Relabel right here in the rail: a pencil that appears on hover turns the
      // name into an input (free text + emoji). `default` is not a room.
      if (group !== DEFAULT_GROUP) {
        const pencil = el("span", "group-rename", "✎");
        pencil.title = `Rename the ${group} group (label + emoji)`;
        pencil.addEventListener("click", (e) => {
          e.stopPropagation(); // do not fold
          startRailRelabel(group, nameSpan);
        });
        head.appendChild(pencil);
      }
      // A recolour control living on the head: a swatch you click to open a
      // native colour picker. `default` is the non-room and stays neutral.
      if (group !== DEFAULT_GROUP) {
        const swatch = el("span", "group-swatch");
        swatch.title = `Recolour the ${group} group`;
        swatch.addEventListener("click", (e) => {
          e.stopPropagation(); // do not fold the group
          openColorPicker(swatch, groupColor(group), (c) => c && setGroupColor(group, c));
        });
        head.appendChild(swatch);
      }
      if (unread > 0) {
        const badge = el("span", "unread-badge", String(unread));
        badge.title = `${unread} unread in ${group}`;
        head.appendChild(badge);
      }
      head.appendChild(el("span", "rule"));

      head.addEventListener("click", () => {
        if (collapsedGroups.has(group)) collapsedGroups.delete(group);
        else collapsedGroups.add(group);
        renderAgents();
      });
      return head;
    }

    function renderGroupTabs() {
      const tabs = $("#group-tabs");
      tabs.textContent = "";
      const groups = allGroups();
      // One room is not a choice.
      if (groups.length < 2) return;

      const mk = (label, value, count) => {
        const btn = el("button", `group-tab${state.group === value ? " active" : ""}`);
        btn.type = "button";
        btn.appendChild(document.createTextNode(label));
        if (count != null) btn.appendChild(el("span", "count", String(count)));
        btn.title =
          value === null
            ? "Every group's traffic in one scroll"
            : `Only what the ${value} group said — these agents can only talk to each other`;
        btn.addEventListener("click", () => {
          state.group = value;
          renderAgents();
          renderFeed();
        });
        return btn;
      };

      tabs.appendChild(mk("all", null));
      for (const group of groups) {
        tabs.appendChild(mk(groupLabelOf(group), group, [...state.agents.values()].filter((a) => groupOf(a) === group).length));
      }
    }

    // Appends cards, keeping engine SIBLINGS (a claude + its "-codex" in the
    // same cwd) adjacent and visually joined — same project, two engines. No
    // wrapper element: they stay DIRECT children of the box so drag-reorder
    // (which walks ":scope > .agent-card") still works; the join is CSS via
    // .pair-top/.pair-bottom classes.
    function appendAgentCards(box, list) {
      const done = new Set();
      for (const agent of list) {
        if (done.has(agent.name)) continue;
        const pair = enginePairOf(agent.name);
        const bothHere =
          pair && list.some((a) => a.name === pair.claude.name) && list.some((a) => a.name === pair.codex.name);
        if (bothHere) {
          const top = buildAgentCard(pair.claude);
          top.classList.add("pair-top");
          const bottom = buildAgentCard(pair.codex);
          bottom.classList.add("pair-bottom");
          box.append(top, bottom);
          done.add(pair.claude.name);
          done.add(pair.codex.name);
        } else {
          box.appendChild(buildAgentCard(agent));
          done.add(agent.name);
        }
      }
    }

    function buildAgentCard(agent) {
      const card = el("div", "agent-card");
      card.classList.add(agent.status === "online" ? "online" : "offline");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute(
        "aria-label",
        agent.status === "online"
          ? `Open ${displayOf(agent)} agent screen`
          : `Filter messages from offline agent ${displayOf(agent)}`,
      );
      // Reorder ONLY via the grabber on the left — dragging the whole card
      // fought the click that opens the agent. The card itself is not draggable.
      const grab = el("div", "card-grab", "⠿");
      grab.title = "Drag to reorder";
      grab.draggable = true;
      grab.addEventListener("dragstart", (e) => {
        dragName = agent.name;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try {
          e.dataTransfer.setData("text/plain", agent.name);
        } catch {
          /* some browsers require a payload; the value itself is unused */
        }
      });
      grab.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        // dragend ALWAYS fires (drop does not), so the arrangement commits here.
        if (dragName) commitDrag(dragName);
        dragName = null;
      });
      grab.addEventListener("click", (e) => e.stopPropagation()); // never open the screen
      card.appendChild(grab);
      // Selected = the agent whose screen is open, or (in the Messages view) the
      // one the transcript is filtered to. Either way its rail card lights up, so
      // "which one am I looking at" is never a guess.
      if (screenState.name === agent.name || (screenState.name === null && state.filter === agent.name)) {
        card.classList.add("active");
        card.setAttribute("aria-current", "page");
      }
      card.dataset.name = agent.name;
      const tint = chatColor(agent.name);
      if (tint) {
        card.classList.add("tinted");
        card.style.setProperty("--chat-color", tint);
      }

      const online = agent.status === "online";
      const working = online && agent.activity === "working";
      const type = agentTypeOf(agent);
      const dot = el("span", `status-dot ${online ? "online" : "offline"}${working ? " working" : ""}`);
      dot.title = online ? (working ? "online · working" : "online · idle") : "offline";
      const portrait = el("span", "agent-portrait");
      portrait.title = `${AGENT_TYPE_TITLES[type]} · ${dot.title}`;
      portrait.append(agentLogo(type), dot);

      // NAME LINE: lamp, then the label filling the width. The leader crown
      // sits BEFORE the name (its own thing, never lost among metadata), and the
      // whole card gets a gold rim. Purely visual; never on the no-group bucket.
      const nameRow = el("div", "agent-name-row");
      const name = el("div", "agent-name");
      const grp = groupOf(agent);
      const isLeader = grp !== DEFAULT_GROUP && groupLeaderOf(grp) === agent.name;
      if (isLeader) {
        card.classList.add("leader");
        const crown = el("span", "leader-crown", "👑");
        crown.title = "Leader of this group (set by you — visual only)";
        name.appendChild(crown);
      }
      name.appendChild(document.createTextNode(displayOf(agent)));
      name.title = agent.displayName ? `${agent.displayName} (${agent.name})` : agent.name;
      nameRow.append(portrait, name);
      // Unseen output: a glowing amber pip at the name's end. Set when the agent
      // finished a turn (working → idle) and cleared the moment you open it.
      if (state.unseen.has(agent.name)) {
        card.classList.add("unseen");
        const pip = el("span", "unseen-pip");
        pip.title = "New reply you haven't opened yet";
        nameRow.appendChild(pip);
      }

      // SIGNAL LINE: engine · state — quiet mono, the way a console labels a
      // channel. (The old "MCP" chip is gone: whether an agent had joined was hub
      // plumbing nobody needed on the card; a message queued for a not-yet-joined
      // agent still surfaces as the unread count.) The unread count rides the far
      // right of this line as a lit "signal present" LED.
      const meta = el("div", "agent-meta");
      const engine = el("span", "engine", AGENT_TYPE_LABELS[type].toLowerCase());
      engine.title = `This agent runs ${AGENT_TYPE_TITLES[type]}`;
      meta.append(engine);
      if (online) {
        meta.appendChild(el("span", "sep", "·"));
        const act = el("span", `activity${working ? " working" : ""}`, working ? "working" : "idle");
        act.title = working
          ? "Mid-turn — this agent is generating or running a tool right now."
          : "Idle — this agent is up and waiting for input.";
        meta.appendChild(act);
      }
      if (agent.unreadCount > 0) {
        const badge = el("span", "unread-badge", String(agent.unreadCount));
        badge.title = `${agent.unreadCount} unread`;
        meta.appendChild(badge);
      }

      const role = el("div", "agent-role", agent.role || "—");
      role.title = agent.role || "";

      // Actions (owner UX feedback: one PRIMARY action per state, the rest in
      // a compact ⋯ menu — four inline buttons crowded the card):
      //   online  → [screen] + ⋯(window, nudge, group, mute)
      //   offline → [reopen] + ⋯(group, mute, remove)
      // Stop propagation everywhere so a control click never toggles the
      // card's feed filter.
      const actions = el("div", "agent-actions");
      // `online` and `working` were computed up top (for the status lamp).

      // The agent's screen is the CARD's job now (one click, no button), so the
      // primary here is the thing the card cannot do: pop a real Windows
      // terminal, for when you want an actual window rather than the panel.
      // Re-derived from state.reopening on every render: the rail re-renders
      // on each SSE event mid-launch, and a loading label set on the live
      // button node would be wiped by the rebuild (the old "reopen blinks and
      // looks dead" bug).
      const reopening = !online && state.reopening.has(agent.name);
      const primary = el(
        "button",
        online ? "open-btn" : reopening ? "reopen-btn busy" : "reopen-btn",
        online ? "window" : reopening ? "reopening…" : "reopen",
      );
      primary.type = "button";
      primary.disabled = reopening;
      primary.title = online
        ? `Open a Windows terminal window attached to "${agent.name}" (the card alone shows its screen here)`
        : reopening
          ? `Relaunching "${agent.name}"…`
          : `Relaunch "${agent.name}" in ${agent.cwd} (continues its conversation) and open its window`;
      primary.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (online) openAgentTerminal(agent.name, primary);
        else reopenAgent(agent, primary);
      });

      const menuWrap = el("div", "agent-menu-wrap");
      const kebab = el("button", "menu-btn", "⋯");
      kebab.type = "button";
      kebab.title = "More actions";
      const menu = el("div", "agent-menu");
      menu.hidden = true;

      // One glyph per action so the menu scans by eye, not by reading.
      const MENU_ICONS = {
        "nudge-btn": "📣", "group-btn": "🚪", "codex-btn": "◆", "colour-btn": "🎨",
        "colour-reset-btn": "⭕", "mute-toggle": "🔇", "rename-btn": "✏️", "remove-btn": "🗑",
        "display-btn": "🏷", "leader-btn": "👑", "stop-btn": "⏹", "desc-btn": "📄",
        "folder-btn": "📂",
      };
      function menuItem(cls, label, title, onClick) {
        const item = el("button", `agent-menu-item ${cls}`);
        const key = cls.split(" ")[0];
        const icon = cls.includes("muted") ? "🔊" : MENU_ICONS[key];
        if (icon) item.appendChild(el("span", "mi-icon", icon));
        item.appendChild(el("span", null, label));
        item.type = "button";
        item.title = title;
        item.addEventListener("click", (ev) => {
          ev.stopPropagation();
          onClick(item);
        });
        return item;
      }

      menu.appendChild(
        menuItem(
          "nudge-btn",
          "nudge",
          "Force a manual nudge (respects the pane guard)",
          () => {
            closeMenus();
            forceNudge(agent.name);
          },
        ),
      );
      // Open the agent's project folder (its cwd) in Windows Explorer.
      if (agent.cwd) {
        menu.appendChild(
          menuItem(
            "folder-btn",
            "open folder",
            `Open ${agent.cwd} in Windows Explorer`,
            (item) => {
              closeMenus();
              openAgentFolder(agent.name, item);
            },
          ),
        );
      }
      // Opens the Groups panel rather than editing here: a group is a container
      // holding several agents, so it is managed where you can see all of them
      // at once. (This used to turn the NAME cell into a group field, which put
      // the group's name where the agent's name lives — confusing, and it left
      // no way to rename a group or put a second agent in one.)
      menu.appendChild(
        menuItem(
          "group-btn",
          "group…",
          `Move "${agent.name}" to another group — it can only message agents in the same one`,
          () => {
            closeMenus();
            openGroups(agent.name);
          },
        ),
      );
      // "Open Codex here": launch the codex sibling in the SAME cwd, so this
      // logical agent gains a second engine (the pair shows engine tabs). Only
      // offered on a claude agent that has no sibling yet.
      if (agentTypeOf(agent) === "claude" && !agent.name.endsWith("-codex") && !state.agents.has(`${agent.name}-codex`)) {
        menu.appendChild(
          menuItem(
            "codex-btn",
            "open codex…",
            `Open a Codex instance on ${agent.name}'s folder — same files, its own session`,
            (item) => {
              openCodexSibling(agent, item);
              closeMenus();
            },
          ),
        );
      }
      // Recolour this chat's cable — a swatch popover (pick a colour, or custom,
      // or clear). No native OS dialog; a click picks, nothing auto-applies.
      menu.appendChild(
        menuItem(
          "colour-btn",
          chatColor(agent.name) ? "recolour…" : "colour…",
          `Give "${agent.name}" a cable colour in the rail`,
          (item) => {
            openColorPicker(
              item,
              chatColor(agent.name),
              (c) => {
                closeMenus();
                setChatColor(agent.name, c); // c === null clears
              },
              { clearable: !!chatColor(agent.name) },
            );
          },
        ),
      );
      menu.appendChild(
        menuItem(
          `mute-toggle${agent.muted ? " muted" : ""}`,
          agent.muted ? "unmute" : "mute",
          agent.muted ? "Unmute nudges" : "Mute nudges (messages are still recorded)",
          () => {
            closeMenus();
            toggleMute(agent.name, !agent.muted);
          },
        ),
      );
      // Leader: purely visual, and only meaningful inside a real group. Set it,
      // and offer to announce it to the group (operator's voice). Toggle off if
      // this agent is already the marked leader.
      {
        const grp2 = groupOf(agent);
        if (grp2 !== DEFAULT_GROUP) {
          const isLeader = groupLeaderOf(grp2) === agent.name;
          menu.appendChild(
            menuItem(
              "leader-btn",
              isLeader ? "unset leader" : "set as leader",
              isLeader
                ? "Remove the leader badge from this agent (visual only)"
                : `Mark "${agent.name}" as this group's leader (visual only — you decide)`,
              () => {
                closeMenus();
                if (isLeader) {
                  setGroupLeader(grp2, null);
                  return;
                }
                setGroupLeader(grp2, agent.name);
                // Offer to tell the other agents. Non-blocking: a toast asks.
                openLeaderAnnouncePrompt(grp2, agent.name);
              },
            ),
          );
        }
      }
      // Read the full description (the card truncates it to one line).
      menu.appendChild(
        menuItem(
          "desc-btn",
          "description…",
          `See the full description of "${agent.name}"`,
          () => {
            closeMenus();
            showInfoDialog(`${displayOf(agent)} — description`, agent.role || "");
          },
        ),
      );
      // Nickname: the free display name (emoji ok) — works on a RUNNING agent,
      // because nothing in the protocol reads it. The name cell becomes the
      // editor, like rename, but the kebab id is untouched.
      menu.appendChild(
        menuItem(
          "display-btn",
          "nickname…",
          `Set the display name the UI shows for "${agent.name}" — emoji welcome; empty clears`,
          () => {
            closeMenus();
            startDisplayRename(agent, name);
          },
        ),
      );
      // Rename the technical ID — only OFFLINE (a live agent would re-join under
      // its old name). Now that "nickname…" covers what people usually want (the
      // shown name), the raw id rename is an advanced, rare thing — so it is
      // HIDDEN while online instead of shown greyed-and-confusing. It reappears
      // when the agent is stopped, for when you truly need to change the address.
      if (!online) menu.appendChild(
        menuItem(
          "rename-btn",
          "rename id",
          online
            ? `Stop "${agent.name}" first — a running agent would re-join under its old name`
            : "Rename this agent — its message history follows the new name",
          () => {
            closeMenus();
            if (online) {
              toast(
                `To rename "${agent.name}", stop it first: switchboard stop ${agent.name}`,
                "warn",
              );
              return;
            }
            startRename(agent, name);
          },
        ),
      );
      // Stop: kill the tmux session but KEEP the registration (offline, can be
      // reopened). Online only — an offline agent has nothing to stop.
      if (online) {
        menu.appendChild(
          menuItem(
            "stop-btn",
            "stop",
            `Stop "${agent.name}" (kills its tmux session) but keep it in the Hub — you can reopen it`,
            async () => {
              closeMenus();
              try {
                const res = await fetch(`/api/agents/${encodeURIComponent(agent.name)}/stop`, { method: "POST" });
                const body = await res.json().catch(() => ({}));
                if (!res.ok || !body.ok) {
                  toast(`Could not stop "${agent.name}": ${body.error || `HTTP ${res.status}`}`, "warn");
                  return;
                }
                toast(`Stopped "${agent.name}" — still in the rail, offline.`);
              } catch (err) {
                toast(`Could not stop "${agent.name}": ${err && err.message ? err.message : err}`, "warn");
              }
            },
          ),
        );
      }
      // Remove: ALWAYS offered (the owner's ask — deleting the codex sibling
      // took a trip to the CLI). Online, it stops the tmux session first, then
      // removes the registration. Two-click inline confirmation, no dialogs.
      const removeLabel = online ? "stop & remove" : "remove";
      menu.appendChild(
        menuItem(
          "remove-btn",
          removeLabel,
          online
            ? `Stop "${agent.name}" (kills its tmux session) and remove it from the Hub (messages are kept)`
            : "Remove this agent from the Hub registry (messages are kept)",
          async (item) => {
            if (item.dataset.confirming === "1") {
              closeMenus();
              if (online) {
                try {
                  const res = await fetch(`/api/agents/${encodeURIComponent(agent.name)}/stop`, { method: "POST" });
                  const body = await res.json().catch(() => ({}));
                  if (!res.ok || !body.ok) {
                    toast(`Could not stop "${agent.name}": ${body.error || `HTTP ${res.status}`}`, "warn");
                    return;
                  }
                } catch (err) {
                  toast(`Could not stop "${agent.name}": ${err && err.message ? err.message : err}`, "warn");
                  return;
                }
              }
              removeAgent(agent.name);
              return;
            }
            item.dataset.confirming = "1";
            item.textContent = "sure?";
            item.classList.add("confirming");
            setTimeout(() => {
              item.dataset.confirming = "";
              item.textContent = "";
              item.appendChild(el("span", "mi-icon", "🗑"));
              item.appendChild(el("span", null, removeLabel));
              item.classList.remove("confirming");
            }, 3000);
          },
        ),
      );

      kebab.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wasHidden = menu.hidden;
        closeMenus();
        menu.hidden = !wasHidden;
        // Keep the actions cluster pinned open while the menu is: its items
        // can render past the card's edge, and losing :hover there would yank
        // the whole cluster (and the open menu) out from under the cursor.
        card.classList.toggle("menu-open", !menu.hidden);
        // Flip UP when the menu doesn't fit below (a low card's 11-item menu
        // fell past the viewport / the rail's scrollport and looked truncated).
        // Measured with the menu already visible; falls back to drop-down when
        // above doesn't fit either.
        if (!menu.hidden) {
          menu.classList.remove("drop-up");
          const menuH = menu.getBoundingClientRect().height;
          const br = kebab.getBoundingClientRect();
          const port = kebab.closest(".sidebar, aside")?.getBoundingClientRect() ??
            { top: 0, bottom: window.innerHeight };
          const fitsBelow = br.bottom + 5 + menuH <= Math.min(port.bottom, window.innerHeight);
          const fitsAbove = br.top - 5 - menuH >= Math.max(port.top, 0);
          if (!fitsBelow && fitsAbove) menu.classList.add("drop-up");
        }
      });
      menuWrap.append(kebab, menu);

      actions.append(primary, menuWrap);

      // dataset hook kept for the nudge pulse animation (SSE nudge_sent).
      const pulseTarget = menu.querySelector(".nudge-btn");
      if (pulseTarget) pulseTarget.dataset.nudgeFor = agent.name;

      card.append(nameRow, meta, role, actions);
      // Clicking the agent shows the AGENT — its screen, live. The rail is the
      // tab bar and a card is the tab, so making you click a second button to
      // see the thing you just selected was friction for nothing.
      //
      // This used to filter the transcript instead. That is still there, but as
      // what it always was: a filter, living inside Messages where filters
      // belong (see renderFilterBar).
      const activateCard = () => {
        if (agent.status === "online") openScreen(agent.name);
        else setFilter(agent.name); // no screen to show — fall back to its traffic
      };
      card.addEventListener("click", activateCard);
      card.addEventListener("keydown", (ev) => {
        if (ev.target !== card || (ev.key !== "Enter" && ev.key !== " ")) return;
        ev.preventDefault();
        activateCard();
      });
      return card;
    }

    /** One menu open at a time; outside click / Esc closes (wired once below). */
    function closeMenus() {
      document.querySelectorAll(".agent-menu").forEach((m) => {
        m.hidden = true;
      });
      document.querySelectorAll(".agent-card.menu-open").forEach((c) => c.classList.remove("menu-open"));
    }
    document.addEventListener("click", closeMenus);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeMenus();
    });

    async function openAgentTerminal(name, btn) {
      if (btn) btn.disabled = true;
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/terminal`, {
          method: "POST",
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(body.error || `Could not open a window (HTTP ${res.status}).`, "warn");
          return;
        }
        toast(`Windows terminal opened for "${name}".`);
      } catch (err) {
        toast(`Could not open a window: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function reopenAgent(agent, btn) {
      if (state.reopening.has(agent.name)) return;
      state.reopening.add(agent.name);
      // Immediate feedback on the clicked node; every re-render from here on
      // re-derives the same look from state.reopening (see the card renderer).
      btn.disabled = true;
      btn.classList.add("busy");
      btn.textContent = "reopening…";
      try {
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            dir: agent.cwd,
            name: agent.name,
            continue: true,
            // openTerminal:false — reopening puts the agent back on the rail, it
            // does NOT ask for a Windows window. A window is only ever what you
            // click "window" for. (Same rule as launching; reopen used to pop one
            // and that was the annoyance, not the feedback it was meant to be.)
            openTerminal: false,
            // Relaunch with the SAME CLI it was launched with: reopening a
            // codex agent as claude would resume the wrong conversation with
            // the wrong binary. Legacy records (no agentType) → claude.
            agentType: agentTypeOf(agent),
          }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Reopen failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        const conv = body.fallback
          ? "with a FRESH conversation (no resumable one found)"
          : "continuing its conversation";
        toast(`Agent "${agent.name}" reopened ${conv}.`, "ok");
      } catch (err) {
        toast(`Reopen failed: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        // `btn` may be an orphaned node by now (the rail re-renders on SSE
        // events mid-launch) — the render below restores whichever card
        // exists NOW: online → "window", still offline (failure) → "reopen".
        state.reopening.delete(agent.name);
        renderAgents();
      }
    }

    /**
     * Swaps the card's name cell for an input prefilled with the current name:
     * Enter confirms, Esc / blur cancels — never a blocking browser dialog.
     * The `done` latch makes the three exits idempotent (confirming detaches
     * the focused input, which fires blur right behind it).
     */
    // An agent name is an ADDRESS (%name in a prompt, tmux "sb-<name>"), so the
    // hub only takes ^[a-z0-9][a-z0-9-]{1,30}$. Typing "Chefe de Redes" and
    // getting the regex back as an error makes the user guess the rule — so the
    // name inputs rewrite as you type ("chefe-de-redes") and you confirm what
    // you already see. Mirrors sanitizeAgentName in src/cli/wire.ts, which
    // derives the same shape from a folder name.
    //
    // keepTrailingHyphen: WHILE TYPING the hyphen a just-pressed space produced
    // must survive — trimming it on every keystroke makes "chefe-de"
    // impossible to type. It is trimmed on confirm instead.
    function sanitizeAgentNameInput(raw, keepTrailingHyphen) {
      let s = raw
        .toLowerCase()
        // Fold accents first: "João" → "joao", not "jo-o" (the invalid-run rule
        // below would otherwise eat the letter along with its diacritic).
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9-]+/g, "-") // any invalid run → one hyphen
        .replace(/-+/g, "-") // collapse repeats
        .replace(/^-+/, ""); // a name never starts with a hyphen
      if (!keepTrailingHyphen) s = s.replace(/-+$/, "");
      if (s.length > 31) s = s.slice(0, 31).replace(/-+$/, "");
      return s;
    }

    /**
     * Wires live sanitizing into a name input. Rewriting .value moves the caret
     * to the end, which fights anyone editing mid-string, so the caret is put
     * back where it was minus whatever the rewrite removed.
     */
    function bindAgentNameSanitizer(input) {
      input.addEventListener("input", () => {
        const before = input.value;
        const after = sanitizeAgentNameInput(before, true);
        if (after === before) return;
        const caret = input.selectionStart;
        input.value = after;
        const next = Math.max(0, caret - (before.length - after.length));
        input.setSelectionRange(next, next);
      });
    }

    function startRename(agent, nameEl) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = agent.name;
      input.spellcheck = false;
      input.maxLength = 31; // the hub's rule: ^[a-z0-9][a-z0-9-]{1,30}$
      input.title = "New name — Enter to confirm, Esc to cancel";
      input.setAttribute("aria-label", `New name for agent ${agent.name}`);

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        return false;
      }
      function confirm() {
        // Full sanitize (edge hyphens included): the input already shows the
        // sanitized text, this only settles a trailing hyphen left mid-typing.
        const next = sanitizeAgentNameInput(input.value, false);
        if (restore()) return;
        // Unchanged / emptied → the hub is not worth a round trip.
        if (next === "" || next === agent.name) return;
        renameAgent(agent.name, next);
      }

      // The card itself toggles the feed filter on click — never let the
      // editing interaction reach it.
      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);
      bindAgentNameSanitizer(input);

      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    /**
     * Inline editor for the DISPLAY name (emoji welcome, spaces welcome) — the
     * free-form label the UI shows. Unlike startRename this works on a RUNNING
     * agent: the kebab id (the protocol address) is untouched. Empty clears.
     */
    function startDisplayRename(agent, nameEl) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = agent.displayName || "";
      input.placeholder = agent.name;
      input.spellcheck = false;
      input.maxLength = 48;
      input.title = "Display name (emoji ok) — Enter saves, empty clears, Esc cancels";

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        return false;
      }
      async function confirm() {
        const next = input.value.trim();
        if (restore()) return;
        if (next === (agent.displayName || "")) return;
        try {
          const res = await fetch(`/api/agents/${encodeURIComponent(agent.name)}/display`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ displayName: next }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok || !body.ok) {
            toast(`Could not set the display name: ${body.error || `HTTP ${res.status}`}`, "warn");
            return;
          }
          mergeAgent(body.agent);
          renderAgents();
          renderTabs();
        } catch (err) {
          toast(`Could not set the display name: ${err && err.message ? err.message : err}`, "warn");
        }
      }

      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);

      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    async function renameAgent(name, next) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/rename`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: next }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Rename failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // The SSE pair (agent_removed + agent_updated) also arrives; applying
        // it locally keeps the UI snappy for the click's own tab.
        dropAgent(name);
        mergeAgent(body.agent);
        renderAgents();
        toast(`Agent "${name}" renamed to "${body.agent.name}" (history kept).`);
      } catch (err) {
        toast(`Rename failed: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // =====================================================================
    // Groups panel — one place that shows every room and who is in it.
    // A group holds several agents, so managing it one text field per card
    // meant you could never see the rooms, rename one, or put a second agent
    // into one without retyping the name from memory.
    // =====================================================================

    // Groups with no agent in them yet. The hub only knows a group because an
    // agent is in it, so a group you just created has nowhere to live until you
    // move someone in — it is kept here, in the page, so it can appear in the
    // pickers meanwhile. Nothing is lost on reload but an empty room.
    const draftGroups = new Set();

    function openGroups(focusAgent) {
      $("#groups-box").hidden = false;
      renderGroupsPanel();
      if (focusAgent) {
        const sel = document.querySelector(`.groups-member select[data-agent="${focusAgent}"]`);
        if (sel) sel.focus();
      } else {
        // Opened from "+ group": land on the create field, ready to name a room.
        const nw = $("#groups-new");
        if (nw) nw.focus();
      }
    }

    function closeGroups() {
      $("#groups-box").hidden = true;
      draftGroups.clear(); // an empty group nobody joined was never real
    }

    function panelGroups() {
      return [...new Set([...allGroups(), ...draftGroups])].sort();
    }

    function renderGroupsPanel() {
      const body = $("#groups-body");
      body.textContent = "";
      const groups = panelGroups();

      for (const group of groups) {
        const members = sortedAgents().filter((a) => groupOf(a) === group);
        const box = el("div", "groups-group");

        const head = el("div", "groups-group-head");
        const gname = el("span", "groups-group-name", groupLabelOf(group));
        if (groupLabelOf(group) !== group) gname.title = group;
        head.append(
          gname,
          el("span", "groups-group-count", members.length === 1 ? "1 agent" : `${members.length} agents`),
        );
        // Renaming a group renames it for everyone in it, in one write.
        const rename = el("button", "groups-rename", "rename");
        rename.type = "button";
        rename.title = `Rename "${group}" — every agent in it moves along`;
        rename.addEventListener("click", () => startGroupRename(group, head, rename));
        if (members.length > 0) head.appendChild(rename);
        box.appendChild(head);

        if (members.length === 0) {
          box.appendChild(
            el("div", "groups-empty", "Nobody here yet — move an agent in with the pickers below."),
          );
        }
        for (const agent of members) box.appendChild(buildGroupMemberRow(agent, groups));
        body.appendChild(box);
      }

      // Agents whose group has no box yet cannot happen (every group comes from
      // its agents), so nothing else to render.
      if (groups.length === 0) {
        body.appendChild(el("div", "groups-empty", "No agents registered yet."));
      }
    }

    function buildGroupMemberRow(agent, groups) {
      const row = el("div", "groups-member");
      row.appendChild(buildAvatar(agent.name));
      row.appendChild(el("span", "name", agent.name));
      row.appendChild(el("span", "role", agent.role || ""));

      // A picker, not a text field: the rooms already exist, so choosing beats
      // spelling one from memory. "New group…" is the escape hatch.
      const sel = el("select");
      sel.dataset.agent = agent.name;
      sel.title = `Which group ${agent.name} talks in`;
      for (const group of groups) {
        const opt = el("option", null, groupLabelOf(group));
        opt.value = group;
        if (group === groupOf(agent)) opt.selected = true;
        sel.appendChild(opt);
      }
      const newOpt = el("option", null, "new group…");
      newOpt.value = "__new__";
      sel.appendChild(newOpt);

      sel.addEventListener("change", () => {
        if (sel.value === "__new__") {
          sel.value = groupOf(agent); // undo the visual pick until one is typed
          $("#groups-new").focus();
          return;
        }
        if (sel.value !== groupOf(agent)) moveAgentToGroup(agent.name, sel.value);
      });
      row.appendChild(sel);
      return row;
    }

    /** Inline rename of a group, in the group's own header — where its name is. */
    function startGroupRename(group, head, trigger) {
      const nameEl = head.querySelector(".groups-group-name");
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = group;
      input.spellcheck = false;
      input.maxLength = 31;
      input.title = "Group name — Enter to confirm, Esc to cancel";

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        trigger.hidden = false;
        return false;
      }
      function confirm() {
        const next = sanitizeAgentNameInput(input.value, false);
        if (restore()) return;
        if (next === "" || next === group) return;
        renameGroup(group, next);
      }

      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);
      bindAgentNameSanitizer(input);

      trigger.hidden = true;
      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    // Inline rename straight in the rail: the group name becomes an input in
    // place. Enter confirms (real server rename via renameGroup), Esc/blur
    // cancels. Events are stopped so editing never folds the group.
    // Inline editor for a group's DISPLAY LABEL (free text + emoji) — a viewer
    // preference, so it never touches the kebab id / the message wall. To
    // rename the actual group id (which moves the agents), use the Groups panel.
    function startRailRelabel(group, nameSpan) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = groupLabelOf(group) === group ? "" : groupLabelOf(group);
      input.placeholder = group;
      input.spellcheck = false;
      input.maxLength = 48;
      input.title = "Group label (emoji ok) — Enter saves, empty resets, Esc cancels";
      let done = false;
      const restore = () => {
        if (done) return true;
        done = true;
        input.replaceWith(nameSpan);
        return false;
      };
      const confirm = () => {
        const next = input.value;
        if (restore()) return;
        setGroupLabel(group, next); // renderAgents redraws the head
      };
      input.addEventListener("keydown", (ev) => {
        ev.stopPropagation();
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("blur", restore);
      nameSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    async function renameGroup(group, next) {
      try {
        const res = await fetch(`/api/groups/${encodeURIComponent(group)}/rename`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: next }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Could not rename the group: ${body.error || `HTTP ${res.status}`}`, "warn");
          renderGroupsPanel();
          return;
        }
        for (const agent of body.agents) mergeAgent(agent);
        if (state.group === group) state.group = next; // keep reading the same room
        renderAgents();
        renderFeed();
        renderGroupsPanel();
        toast(`Group "${group}" is now "${next}" (${body.agents.length} agent(s) moved).`);
      } catch (err) {
        toast(`Could not rename the group: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // =====================================================================
    // The agent's screen. tmux tees the pane's bytes to the hub, the hub
    // relays them over SSE, xterm.js paints them; keystrokes go back the same
    // way. No node-pty and no websocket: tmux is already the pty, SSE is
    // already a stream, and the agent outlives this tab because the session
    // belongs to tmux, not to the dashboard.
    // =====================================================================

    const screenState = { name: null, term: null, fit: null, sse: null, ro: null, mode: "chat", chatSse: null };

    // Groups folded away in the rail. Page-local on purpose: which projects you
    // have collapsed right now is a view, not something the hub should store.
    const collapsedGroups = new Set();

    // Agents with a tab open, in the order you opened them. Only the ACTIVE one
    // streams: a tab you are not looking at does not need a live terminal, and
    // re-attaching costs a 2ms capture-pane — the pane has no scrollback to lose
    // (Claude Code redraws its own), so the switch is invisible.
    const openTabs = [];

    function renderTabs() {
      const strip = $("#tab-strip");
      strip.textContent = "";
      for (const name of openTabs) {
        const agent = state.agents.get(name);
        const tab = el("div", `tab${screenState.name === name ? " active" : ""}`);
        tab.tabIndex = 0;
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(screenState.name === name));
        tab.title = agent ? `${name} — ${agent.role || "no role"}` : name;
        tab.append(
          el("span", `dot ${agent && agent.status === "online" ? "online" : "offline"}`),
          el("span", "name", displayOf(name)),
        );
        if (agent && agent.unreadCount > 0) {
          tab.appendChild(el("span", "tab-unread", String(agent.unreadCount)));
        }
        tab.addEventListener("click", () => openScreen(name));
        tab.addEventListener("keydown", (ev) => {
          if (ev.target !== tab || (ev.key !== "Enter" && ev.key !== " ")) return;
          ev.preventDefault();
          openScreen(name);
        });

        const close = el("button", "tab-close", "✕");
        close.type = "button";
        close.title = `Close the ${name} tab`;
        close.setAttribute("aria-label", `Close the ${name} tab`);
        close.addEventListener("click", (ev) => {
          ev.stopPropagation();
          closeTab(name);
        });
        tab.appendChild(close);
        strip.appendChild(tab);
      }
      $("#tab-messages").classList.toggle("active", screenState.name === null);
      $("#tab-messages").setAttribute("aria-selected", String(screenState.name === null));
    }

    function closeTab(name) {
      const i = openTabs.indexOf(name);
      if (i !== -1) openTabs.splice(i, 1);
      // Closing the tab you are looking at lands you on its neighbour, the way
      // a browser does — not on a blank panel.
      if (screenState.name === name) {
        const next = openTabs[i] || openTabs[i - 1];
        if (next) openScreen(next);
        else closeScreen();
      } else {
        renderTabs();
      }
    }

    function openScreen(name) {
      if (screenState.name === name) return;
      closeScreen({ keepTabs: true });
      screenState.name = name;
      clearUnseen(name); // opening its screen IS reading it
      if (!openTabs.includes(name)) openTabs.push(name);

      // The whole Messages panel steps aside, header and filter bar included.
      // Leaving "MESSAGES" labelling an agent's terminal was a lie.
      $("#feed").hidden = true;
      $(".feed-head").hidden = true;
      $("#filter-bar").hidden = true;
      $("#screen").hidden = false;
      $("#screen-name").textContent = displayOf(name);
      $("#screen-name").title = name; // the kebab id stays one hover away
      $("#composer-target").textContent = displayOf(name);
      $("#composer-target").title = name;
      $("#chat-input").placeholder = "Write a dispatch…";

      // Default to the CHAT casca. The mode is remembered across agents so
      // switching tabs keeps you in the view you chose.
      setScreenMode(screenState.mode || "chat");

      renderAgents(); // the rail marks which agent is on screen
      renderTabs();
    }

    /**
     * Switches the panel between the clean chat and the raw terminal, tearing
     * down whichever it is leaving so only the active view holds a stream.
     */
    function setScreenMode(mode) {
      const name = screenState.name;
      if (!name) return;
      screenState.mode = mode;
      for (const b of document.querySelectorAll(".screen-mode")) {
        if (!b.dataset.mode) continue;
        const active = b.dataset.mode === mode;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", String(active));
      }
      if (mode === "terminal") {
        teardownChat();
        $("#screen-chat").hidden = true;
        $("#chat-composer").hidden = true;
        $("#screen-term-wrap").hidden = false;
        mountTerminal(name);
      } else {
        teardownTerminal();
        $("#screen-term-wrap").hidden = true;
        $("#screen-chat").hidden = false;
        $("#chat-composer").hidden = false;
        mountChat(name);
        updateChatTyping();
        updateStopButton();
        // This is a desktop operator console: opening an agent means you are
        // ready to dispatch to it. Wait until the chat surface is visible, then
        // place the caret in its primary control without moving the transcript.
        requestAnimationFrame(() => {
          if (screenState.name !== name || screenState.mode !== "chat") return;
          $("#chat-input").focus({ preventScroll: true });
        });
      }
      renderScreenStatus(); // show the footer pills in chat, hide in terminal
    }

    /**
     * Sends a chat message to the agent by typing it into its pane — the same
     * send-keys path the terminal uses, so the pane guard applies (you can only
     * message a live agent pane). Text first, then Enter as a SEPARATE keystroke
     * after a beat: Claude Code's TUI takes text+Enter in one write as typing
     * without submitting (pitfall P1), exactly like the nudge.
     */
    // A real slash command is one command token (`/review`, `/model opus`). An
    // absolute file path also begins with slash, but its next separator is `/`,
    // so it must stay in Chat instead of flipping the wrapper to Terminal.
    function isSlashCommand(text) {
      return /^\/[A-Za-z][\w-]*(?:\s|$)/.test(String(text || "").trimStart());
    }

    async function sendChatMessage(name, text) {
      const bytesOf = (s) => {
        const b64 = btoa(unescape(encodeURIComponent(s)));
        return fetch(`/api/agents/${encodeURIComponent(name)}/terminal/input`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ b64 }),
        });
      };
      const res = await bytesOf(text);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      await new Promise((r) => setTimeout(r, 400));
      await bytesOf("\r"); // the separate Enter that submits
    }

    function mountTerminal(name) {
      setScreenHint("live — type here to drive it", false);
      const term = new Terminal({
        convertEol: false,
        cursorBlink: true,
        // The pane has NO scrollback of its own — Claude Code runs in the
        // alternate screen (tmux reports history_size 0), and the conversation
        // you page through lives in Claude Code's own buffer, which redraws the
        // screen when you scroll it. So xterm must NOT keep a scrollback and
        // must NOT eat PageUp/PageDown to scroll one: those keys belong to the
        // agent, exactly as in a real terminal window. Verified: PageUp
        // (1b 5b 35 7e) sent as raw bytes scrolls Claude Code's history.
        scrollback: 0,
        fontFamily: getComputedStyle(document.body).getPropertyValue("--mono").trim(),
        fontSize: SCREEN_FONT_PX,
        theme: {
          background: "#050506",
          foreground: "#f4f4f5",
          cursor: "#e4e4e7",
          selectionBackground: "rgba(212,212,216,0.25)",
        },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open($("#screen-term"));
      // fit() APPLIES the container size to the local xterm right here (the
      // working reference does exactly this on open) — the terminal is the
      // right size immediately, no round-trip. pushScreenSize then tells the
      // server to match the tmux window to it.
      fit.fit();
      screenState.term = term;
      screenState.fit = fit;

      // Keystrokes → the pane. xterm hands us exactly the bytes a real terminal
      // would send (Escape is "\x1b", Ctrl-C is "\x03"), so they go over as
      // base64 and reach tmux as those same bytes.
      term.onData((data) => sendScreenInput(name, data));

      // Panel resizes → refit locally, then tell the server. ResizeObserver
      // instead of window "resize": the panel changes when the rail toggles,
      // not only when the window does.
      const ro = new ResizeObserver(() => scheduleScreenFit());
      ro.observe($("#screen-term"));
      screenState.ro = ro;
      pushScreenSize();

      const sse = new EventSource(`/api/agents/${encodeURIComponent(name)}/terminal`);
      sse.onmessage = (ev) => {
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (parsed.error) {
          setScreenHint(parsed.error, true);
          return;
        }
        // The grid the server settled on. Match the local emulator to it — the
        // server DICTATES the window size to fit our panel (see pushScreenSize),
        // so this is the size we asked for, echoed back. Native font, no
        // scaling: the terminal is exactly as crisp as a real one.
        if (typeof parsed.cols === "number") {
          if (term.cols !== parsed.cols || term.rows !== parsed.rows) {
            term.resize(parsed.cols, parsed.rows);
          }
          setScreenHint("live — type here to drive it", false);
          return;
        }
        // atob → bytes → xterm. The stream is raw terminal output, so it is
        // fed as bytes; letting the browser decode it as text would mangle
        // every escape sequence and any UTF-8 split across two chunks.
        const bin = atob(parsed.b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
      };
      sse.onerror = () => setScreenHint("reconnecting…", true);
      screenState.sse = sse;
      term.focus();
    }

    function teardownTerminal() {
      if (screenState.sse) screenState.sse.close();
      if (screenState.ro) screenState.ro.disconnect();
      if (screenState.term) screenState.term.dispose();
      screenState.sse = screenState.ro = screenState.term = screenState.fit = null;
      $("#screen-term").textContent = "";
    }

    // ---- the chat casca: renders the agent's conversation log ----------
    function mountChat(name) {
      setScreenHint("reading the conversation log", false);
      screenState.model = null; // re-derived from this agent's own log
      const view = $("#screen-chat");
      view.textContent = "";
      view.appendChild(el("div", "chat-empty", "Loading the conversation…"));
      const items = [];
      const sse = new EventSource(`/api/agents/${encodeURIComponent(name)}/conversation`);
      sse.onmessage = (ev) => {
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (parsed.error) {
          setScreenHint(parsed.error, true);
          view.textContent = "";
          view.appendChild(el("div", "chat-empty", parsed.error));
          return;
        }
        if (parsed.initial) {
          items.length = 0; // a fresh full dump replaces all
          const stale = view.querySelector(".chat-thread");
          if (stale) stale.remove(); // rebuild, don't stack onto old turns
        }
        const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 120;
        for (const it of parsed.items || []) {
          items.push(it);
          if (it.kind === "assistant" && it.model) screenState.model = it.model; // track current model
        }
        renderChat(view, items);
        setScreenHint(`${items.length} messages`, false);
        renderScreenStatus(); // the model pill follows the latest assistant turn
        if (atBottom) view.scrollTop = view.scrollHeight;
      };
      sse.onerror = () => setScreenHint("reconnecting…", true);
      screenState.chatSse = sse;
    }

    function teardownChat() {
      if (screenState.chatSse) screenState.chatSse.close();
      screenState.chatSse = null;
      $("#screen-chat").textContent = "";
      closeInlineFile(); // the file belonged to THIS chat; the next view starts clean
    }

    /**
     * Leaves the screen and shows Messages. keepTabs is for switching BETWEEN
     * agents: the views are torn down and rebuilt, but the tab strip is not the
     * view — closing tabs on every switch would be a different feature.
     */
    function closeScreen(opts) {
      teardownTerminal();
      teardownChat();
      const had = screenState.name;
      screenState.name = null;
      $("#screen").hidden = true;
      // Mid-switch: openScreen is about to show the next agent, so leaving
      // Messages visible for that instant would just flash the transcript.
      if (opts && opts.keepTabs) return;
      $("#feed").hidden = false;
      $(".feed-head").hidden = false;
      $("#filter-bar").hidden = false;
      renderFilterBar(); // it owns its own visibility
      if (had) renderAgents();
      renderTabs();
    }

    function setScreenHint(text, bad) {
      const hint = $("#screen-hint");
      hint.textContent = text;
      hint.classList.toggle("stale", !!bad);
    }

    // Native font, fixed. The dashboard tells the server what grid its panel
    // wants and the server sizes the tmux window to match, so the terminal
    // renders at its true size — no scaling, no soft text. This is what the
    // earlier "mirror and scale" approach failed to be.
    const SCREEN_FONT_PX = 13; // matches the working reference (claudinei)

    let fitTimer = null;
    function scheduleScreenFit() {
      // Debounced: a drag fires ResizeObserver dozens of times, and each fit is
      // a tmux resize-window on the other end.
      clearTimeout(fitTimer);
      fitTimer = setTimeout(pushScreenSize, 120);
    }

    /**
     * fit() the local terminal to its container, then tell the server to size
     * the tmux window to whatever grid that produced. This is the working
     * reference's sendResize, verbatim in spirit: the local xterm is the size
     * authority, the pty follows. No proposeDimensions round-trip.
     */
    async function pushScreenSize() {
      const { name, term, fit } = screenState;
      if (!name || !term || !fit) return;
      fit.fit();
      if (!term.cols || !term.rows) return;
      try {
        await fetch(`/api/agents/${encodeURIComponent(name)}/terminal/resize`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ cols: term.cols, rows: term.rows }),
        });
      } catch {
        /* the size is cosmetic; a failed resize must not break the stream */
      }
    }

    async function sendScreenInput(name, data) {
      // btoa needs latin1; the string xterm gives us is already byte-per-char
      // for control codes, and unescape(encodeURIComponent(..)) turns anything
      // typed (accents included) into its UTF-8 bytes first.
      const b64 = btoa(unescape(encodeURIComponent(data)));
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/terminal/input`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ b64 }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          // The pane guard refusing is the loudest case: it means this pane is
          // a shell, and typing into it would run commands.
          setScreenHint(body.error || `Could not send input (HTTP ${res.status}).`, true);
        }
      } catch (err) {
        setScreenHint(`Could not send input: ${err && err.message ? err.message : err}`, true);
      }
    }

    // =====================================================================
    // Chat rendering. The conversation log turned into readable turns: user
    // and assistant bubbles, and tool calls as collapsible chips.
    // =====================================================================

    /**
     * Incremental: the conversation SSE only ever APPENDS items (each pump
     * forwards the newly-parsed lines and never mutates an earlier one), so the
     * thread is grown by appending the tail rather than rebuilt from scratch —
     * no re-parsing every markdown block on each nudge, and the scroll/selection
     * survive. A shrink (a fresh `initial` dump replacing everything) rebuilds.
     */
    function renderChat(view, items) {
      let thread = view.querySelector(".chat-thread");
      if (items.length === 0) {
        view.textContent = "";
        view.appendChild(el("div", "chat-empty", "No conversation yet."));
        return;
      }
      if (!thread) {
        view.textContent = "";
        thread = el("div", "chat-thread");
        thread.__count = 0;
        view.appendChild(thread);
      }
      // Item count is tracked as a property, NOT childElementCount: action
      // grouping wraps N chips into 1 node, so the DOM child count and the item
      // count diverge.
      let start = thread.__count || 0;
      if (start > items.length) {
        thread.textContent = ""; // items replaced wholesale — rebuild
        start = 0;
      }
      const name = screenState.name;
      for (let i = start; i < items.length; i++) {
        const it = items[i];
        const node =
          it.kind === "tool"
            ? buildToolChip(it)
            : it.kind === "thinking"
              ? buildThinkingBlock(it)
              : it.kind === "marker"
                ? buildChatMarker(it)
                : buildChatTurn(it, name);
        thread.appendChild(node);
      }
      thread.__count = items.length;
      groupActions(thread);
      for (const rail of thread.querySelectorAll(".chat-turn-actions")) rail.remove();
      markCopyableTurns(thread);
      markEditableUserTurns(thread);
      markForwardableTurns(thread);
      reconcilePending(view);
    }

    /**
     * Folds runs of ≥3 consecutive tool cards into one collapsible group, like
     * the reference transcript ("5 actions · Bash ×2 · Read"). Only CLOSED
     * runs group — a run at the very end is the still-growing tail and stays
     * open so the operator watches the live action. Idempotent: already-grouped
     * chips (dataset.grouped) are skipped, so it re-runs cheaply each render.
     */
    function groupActions(thread) {
      const runs = [];
      let run = [];
      const flush = (closed) => {
        if (run.length >= 3 && closed) runs.push(run);
        run = [];
      };
      for (const node of [...thread.children]) {
        if (node.classList.contains("chat-tool") && !node.dataset.grouped) {
          run.push(node);
        } else if (!node.classList.contains("chat-tool-group")) {
          flush(true); // a non-action node closes the run
        }
      }
      flush(false); // trailing run = growing tail, leave it live
      for (const r of runs) wrapActionRun(thread, r);
    }

    function wrapActionRun(thread, run) {
      const group = el("div", "chat-tool-group");
      const head = el("div", "chat-tool-group-head");
      head.append(
        el("span", "chat-tool-caret", "▸"),
        el("span", "chat-tool-icon", "∷"),
        el("span", "chat-tool-name", `${run.length} actions`),
        el("span", "chat-tool-summary", groupSummary(run)),
      );
      const body = el("div", "chat-tool-group-body");
      thread.insertBefore(group, run[0]);
      for (const node of run) {
        node.dataset.grouped = "1";
        body.appendChild(node);
      }
      group.append(head, body);
      wireDisclosure(head, group, `${run.length} grouped actions`);
    }

    /** "Bash ×2 · Read · Edit" — tool names in first-seen order, up to 4. */
    function groupSummary(run) {
      const counts = new Map();
      for (const node of run) {
        let name = node.querySelector(".chat-tool-name")?.textContent || "tool";
        if (name.startsWith("mcp__")) name = name.split("__").pop();
        counts.set(name, (counts.get(name) || 0) + 1);
      }
      const parts = [...counts.entries()].slice(0, 4).map(([n, c]) => (c > 1 ? `${n} ×${c}` : n));
      if (counts.size > 4) parts.push("…");
      return parts.join(" · ");
    }

    /**
     * Optimistic echo: the operator's just-sent message, shown immediately in a
     * separate pending lane (kept OUT of .chat-thread so the thread's
     * append-by-index stays intact). Reconciled away by reconcilePending once
     * the agent logs it and the real bubble arrives.
     */
    function echoUserMessage(text) {
      const view = $("#screen-chat");
      // If the view still shows the empty/loading placeholder, start a thread so
      // the echo has somewhere consistent to live beneath.
      let pend = view.querySelector(".chat-pending");
      if (!pend) {
        pend = el("div", "chat-pending");
        view.appendChild(pend);
      }
      const turn = buildChatTurn({ kind: "user", text, ts: new Date().toISOString() }, screenState.name);
      turn.classList.add("pending");
      turn.dataset.echo = text.trim();
      const meta = turn.querySelector(".chat-meta");
      if (meta) meta.appendChild(el("span", "chat-sending", "sending…"));
      pend.appendChild(turn);
      view.scrollTop = view.scrollHeight;
    }

    /**
     * The "agent is working" indicator at the foot of the chat — three bouncing
     * dots while the open agent is mid-turn (activity === "working"), so you can
     * see it is chewing on your message instead of wondering if it landed.
     */
    function updateChatTyping() {
      const view = $("#screen-chat");
      if (!view) return;
      const off = () => view.querySelector(".chat-typing")?.remove();
      if (screenState.name === null || screenState.mode !== "chat") return off();
      const agent = state.agents.get(screenState.name);
      const working = !!(agent && agent.activity === "working");
      // "Waiting for N background agents to finish": the turn's text is done
      // but spawned work is still pending — without this the chat rendered
      // the conversation as FINISHED while the terminal showed the wait.
      const waiting = !working && !!(agent && agent.waitingFor);
      const busy = working || waiting;
      let ind = view.querySelector(".chat-typing");
      if (busy && !ind) {
        ind = el("div", "chat-typing");
        const dots = el("div", "chat-typing-dots");
        dots.append(el("span"), el("span"), el("span"));
        ind.append(buildChatAvatar(false, screenState.name), dots, el("span", "chat-typing-note"));
        const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 120;
        view.appendChild(ind);
        if (atBottom) view.scrollTop = view.scrollHeight;
      } else if (!busy && ind) {
        ind.remove();
        ind = null;
      }
      if (ind) {
        // The literal TUI line while waiting; nothing while actively typing.
        const note = ind.querySelector(".chat-typing-note");
        if (note) note.textContent = waiting ? agent.waitingFor : "";
      }
    }

    // Sibling of updateChatTyping(): the composer STOP button is visible iff an
    // agent is open, we're in chat mode, and that agent is mid-turn (working).
    function updateStopButton() {
      const btn = $("#chat-stop");
      if (!btn) return;
      const agent = screenState.name ? state.agents.get(screenState.name) : null;
      const working = !!(agent && agent.activity === "working");
      btn.classList.toggle("visible", working && screenState.name !== null && screenState.mode === "chat");
    }

    // The CLI's permission/plan mode and whether a /goal is running — read from
    // the footer by the hub, shown as pills UNDER the composer (terminal-style).
    // Colours: bypass = red (least safe), plan = violet, accept-edits = teal,
    // manual = amber; a running goal is blue with its age.
    const PERM_LABEL = { bypass: "bypass perms", acceptEdits: "accept edits", plan: "plan mode", default: "manual" };
    const PERM_COLOR = { bypass: "var(--danger)", acceptEdits: "#4fd6c9", plan: "#a98bff", default: "var(--warn)" };
    const GOAL_COLOR = "#4a9eff";
    // --- Engine pairing (Claude + Codex on the same logical agent) ---------
    // A codex sibling is "<base>-codex" in the SAME cwd: two tmux sessions, two
    // network identities, one logical agent. Pairing is by name convention.
    function engineBaseOf(name) {
      return name.endsWith("-codex") ? name.slice(0, -6) : name;
    }
    function enginePairOf(name) {
      const base = engineBaseOf(name);
      const claude = state.agents.get(base);
      const codex = state.agents.get(base + "-codex");
      return claude && codex ? { base, claude, codex } : null;
    }
    /** Engine tabs in the screen head — shown only when the pair exists. */
    function renderEngineTabs() {
      const box = $("#engine-tabs");
      const control = $("#engine-control");
      if (!box) return;
      const pair = screenState.name ? enginePairOf(screenState.name) : null;
      box.textContent = "";
      if (!pair) {
        if (control) control.hidden = true;
        return;
      }
      for (const [label, agent] of [["Claude", pair.claude], ["Codex", pair.codex]]) {
        const btn = el("button", `screen-mode${screenState.name === agent.name ? " active" : ""}`);
        btn.type = "button";
        btn.append(agentLogo(label.toLowerCase()), document.createTextNode(label));
        btn.setAttribute("aria-pressed", String(screenState.name === agent.name));
        btn.title = `${label} engine of ${pair.base} (${agent.status}${agent.activity ? " · " + agent.activity : ""})`;
        btn.addEventListener("click", () => {
          if (screenState.name !== agent.name) openScreen(agent.name);
        });
        box.appendChild(btn);
      }
      if (control) control.hidden = false;
    }

    /** Launches the codex sibling of a claude agent: same cwd, same group. */
    async function openCodexSibling(agent, trigger) {
      const name = `${agent.name}-codex`;
      if (trigger) {
        trigger.disabled = true;
        trigger.textContent = "launching…";
      }
      try {
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            dir: agent.cwd,
            name,
            role: `Codex engine of ${agent.name}`,
            agentType: "codex",
            group: groupOf(agent),
            continue: false,
          }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          toast(`Could not launch codex: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        toast(`Codex opening on ${agent.name} — it appears in the rail when ready.`);
      } catch (err) {
        toast(`Could not launch codex: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // A short model label from a JSONL model id: "claude-opus-4-8" -> "opus-4-8".
    function shortModel(id) {
      if (!id) return null;
      return id.replace(/^claude-/, "").replace(/-\d{8}$/, "");
    }
    function renderScreenIdentity() {
      const agent = screenState.name ? state.agents.get(screenState.name) : null;
      const mark = $("#screen-engine-mark");
      const activity = $("#screen-activity");
      if (!mark || !activity) return;
      mark.textContent = "";
      if (!agent) {
        activity.textContent = "";
        return;
      }
      mark.appendChild(agentLogo(agentTypeOf(agent)));
      const stateLabel = agent.status !== "online"
        ? "offline"
        : agent.activity === "working"
          ? "working"
          : agent.waitingFor
            ? "waiting"
            : "ready";
      activity.textContent = stateLabel;
      activity.className = `screen-activity ${stateLabel}`;
    }
    function renderScreenStatus() {
      renderScreenIdentity();
      const box = $("#chat-statusbar");
      if (!box) return;
      const agent = screenState.name === null ? null : state.agents.get(screenState.name);
      if (!agent || screenState.mode !== "chat") {
        box.hidden = true;
        return;
      }
      let inner = box.querySelector(".chat-statusbar-inner");
      if (!inner) {
        inner = el("div", "chat-statusbar-inner");
        box.appendChild(inner);
      }
      inner.textContent = "";
      const model = shortModel(screenState.model);
      if (model) {
        const m = el("span", "status-pill", model);
        m.style.setProperty("--pill-color", "var(--text-dim)");
        m.title = `Model: ${screenState.model}`;
        inner.appendChild(m);
      }
      if (agent.permission) {
        const pill = el("span", "status-pill", PERM_LABEL[agent.permission] || agent.permission);
        pill.style.setProperty("--pill-color", PERM_COLOR[agent.permission] || "var(--text-dim)");
        pill.title = `Permission mode: ${PERM_LABEL[agent.permission] || agent.permission} — change it in the Terminal with Shift+Tab`;
        inner.appendChild(pill);
      }
      if (agent.goalActive) {
        const g = el("span", "status-pill goal", `◎ goal${agent.goalFor ? " · " + agent.goalFor : ""}`);
        g.style.setProperty("--pill-color", GOAL_COLOR);
        g.title = `A /goal is active${agent.goalFor ? ` (running for ${agent.goalFor})` : ""}`;
        inner.appendChild(g);
      }

    }

    /** Drops any pending echo whose text now appears as a real user bubble. */
    function reconcilePending(view) {
      const pend = view.querySelector(".chat-pending");
      if (!pend || !pend.children.length) return;
      const thread = view.querySelector(".chat-thread");
      if (!thread) return;
      // RAW against RAW: the real turn keeps its source text on __text. The
      // old compare used the rendered bubble's textContent — markdown turns a
      // newline into <br>, whose textContent is NOTHING, so any MULTILINE
      // message never matched its echo and showed duplicated ("sending…")
      // forever. Whitespace is collapsed on both sides for the same reason:
      // rendering reflows it, and it carries no identity.
      const norm = (s) => String(s).replace(/\s+/g, " ").trim();
      const realTexts = new Set(
        [...thread.querySelectorAll(".chat-turn.user")]
          .map((t) => (typeof t.__text === "string" ? norm(t.__text) : ""))
          .filter((t) => t !== ""),
      );
      for (const node of [...pend.children]) {
        if (realTexts.has(norm(node.dataset.echo))) node.remove();
      }
    }

    function buildChatAvatar(isUser, agentName) {
      const avatar = el("div", `chat-avatar${isUser ? " you" : ""}`);
      if (isUser) {
        avatar.textContent = "you";
        avatar.title = "You";
      } else {
        const agent = agentName ? state.agents.get(agentName) : null;
        avatar.appendChild(agentLogo(agentTypeOf(agent)));
        avatar.title = agentName ? `${displayOf(agentName)} · ${agentTypeOf(agent)}` : "Agent";
      }
      return avatar;
    }

    /**
     * A harness happening (worked-for, monitor/task event, away-summary) as a
     * quiet centred line — the terminal shows these between turns, and hiding
     * them made the casca look disconnected from what the pane was doing.
     */
    function buildChatMarker(it) {
      const div = el("div", "chat-marker");
      div.append(el("span", "chat-marker-mark", "✻"), el("span", null, it.text));
      if (it.ts) div.title = fmtFull(it.ts);
      return div;
    }

    /**
