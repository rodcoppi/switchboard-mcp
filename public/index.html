    /* Opens INTO the column, never past its edge. */
    .chat-turn.assistant .fwd-menu,
    .chat-turn.user .fwd-menu { right: 0; }
    .fwd-menu.up { top: auto; bottom: calc(100% + 5px); }
    .fwd-menu-label {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      padding: 2px 4px 0;
      white-space: nowrap;
    }
    .fwd-menu-item {
      text-align: left;
      white-space: nowrap;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      padding: 3px 9px;
      line-height: 1.3;
      cursor: pointer;
      transition: border-color 0.12s var(--ease), color 0.12s var(--ease), background 0.12s var(--ease);
    }
    .fwd-menu-item:hover { color: var(--text); border-color: var(--accent); background: var(--accent-wash); }
    .fwd-menu-empty {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      padding: 3px 4px;
      white-space: nowrap;
    }
    .chat-turn.assistant .chat-bubble { border-radius: 0; }
    /* Minimal markdown: inline code, code fences, bold. */
    .chat-bubble code { font-family: var(--mono); font-size: 0.92em; background: var(--bg-inset); padding: 1px 5px; border-radius: 4px; }
    .chat-bubble pre { margin: 6px 0; padding: 9px 11px; background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 7px; overflow-x: auto; }
    .chat-bubble pre code { background: none; padding: 0; font-size: var(--fs-sm); line-height: 1.5; }
    /* highlight.js theme sits on OUR pre background, not its own dark slab. */
    .chat-bubble pre code.hljs { background: transparent; padding: 0; }
    .chat-bubble strong { color: var(--text); font-weight: 600; }

    /* Tool calls are entries in the same ledger, not floating AI chips. */
    .chat-tool {
      align-self: stretch;
      max-width: 100%;
      margin-left: 0;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      border-radius: 0;
      background: color-mix(in srgb, var(--selected) 2.5%, var(--bg));
      overflow: hidden;
    }
    .chat-tool.error { box-shadow: inset 2px 0 0 var(--danger); }
    .chat-tool-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 18px 8px 62px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
    }
    .chat-tool-head:hover { background: var(--bg-hover); }
    .chat-tool-caret { width: 8px; color: var(--text-faint); transition: transform 0.12s var(--ease); }
    .chat-tool.open .chat-tool-caret { transform: rotate(90deg); }
    .chat-tool-icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg-inset);
      font-size: 10px;
      line-height: 1;
    }
    .chat-tool-name { color: var(--accent); font-weight: 600; }
    .chat-tool-summary { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-tool.error .chat-tool-name { color: var(--danger); }
    .chat-tool-body { display: none; border-top: 1px solid var(--border-soft); }
    .chat-tool.open .chat-tool-body { display: block; }
    /* Each input/result pre is wrapped so a copy button can float over it. */
    .chat-tool-pre { position: relative; }
    .chat-tool-pre + .chat-tool-pre { border-top: 1px dashed var(--border-soft); }
    .chat-tool-body pre {
      margin: 0;
      padding: 9px 11px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      line-height: 1.45;
      color: var(--text-dim);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 320px;
      overflow-y: auto;
    }
    /* Copy button: quiet until you hover the block it sits on. */
    .copy-btn {
      position: absolute;
      top: 5px;
      right: 6px;
      padding: 1px 7px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s var(--ease), color 0.12s var(--ease);
    }
    .chat-tool-pre:hover .copy-btn,
    .code-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent-line); }
    /* Diff colouring for Edit/Write, per line, with a faint bed like the ref. */
    .diff-add { color: #7ee2a8; background: color-mix(in srgb, #12351f 55%, transparent); display: block; }
    .diff-del { color: #ff8589; background: color-mix(in srgb, #3d1418 55%, transparent); display: block; }
    /* Code blocks in assistant markdown get the same hover copy button. */
    .code-wrap { position: relative; }

    /* Thinking: one quiet, foldable ledger entry. */
    .chat-thinking {
      align-self: stretch;
      max-width: 100%;
      margin-left: 0;
      padding: 7px 18px 7px 62px;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in srgb, var(--text) 1.4%, var(--bg));
    }
    .chat-thinking-head {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      font-style: italic;
      color: var(--text-faint);
      padding: 3px 2px;
    }
    .chat-thinking-head:hover { color: var(--text-dim); }
    .chat-thinking.open .chat-thinking-head .chat-tool-caret { transform: rotate(90deg); }
    .chat-thinking-body {
      display: none;
      border-left: 2px solid var(--border-soft);
      padding: 2px 0 2px 12px;
      margin: 2px 0 2px 4px;
      color: var(--text-dim);
      font-style: italic;
      font-size: var(--fs-sm);
    }
    .chat-thinking.open .chat-thinking-body { display: block; }

    /* A folded run of actions is one indexed ledger section. */
    .chat-tool-group {
      align-self: stretch;
      max-width: 100%;
      margin-left: 0;
      position: relative;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      border-radius: 0;
      background: color-mix(in srgb, var(--selected) 2.5%, var(--bg));
    }
    .chat-tool-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 18px 8px 62px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
    }
    .chat-tool-group-head:hover { background: var(--bg-hover); }
    .chat-tool-group-head .chat-tool-name { color: var(--text); }
    .chat-tool-group.open .chat-tool-group-head .chat-tool-caret { transform: rotate(90deg); }
    .chat-tool-group-body { display: none; border-top: 1px solid var(--border-soft); padding: 0; }
    .chat-tool-group.open .chat-tool-group-body { display: block; }
    /* Chips inside a group: no double left-margin, tighter. */
    .chat-tool-group-body .chat-tool { margin-left: 0; margin-bottom: 0; background: var(--bg-inset); }
    .chat-tool-group-body .chat-tool:last-child { border-bottom: 0; }
    /* xterm paints its own grid; it just needs a box that does not collapse.
       CENTRED, and on the terminal's own colour: while mirroring, the grid is
       the pane's and its shape rarely matches the panel's, so something is
       always left over. Centred on a matching background that reads as margin;
       pinned top-left on the page's background it read as the terminal having
       fallen into the corner of a black hole. */
    /* Exactly the container the working reference uses (claudinei's
       .terminal-view__screen): flex:1, min-height:0, a little padding, and
       NOTHING forcing the .xterm's dimensions — the FitAddon reads this box and
       sizes the grid to it. Forcing width/height:100% on .xterm fought the
       addon and was the source of the "gigante" mis-sizing. */
    /* The terminal stays a centred 880px work canvas. Its dark side gutters
       separate the live PTY from the wrapper instead of stretching it into a
       wall of text across the whole desktop. */
    .screen-term-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      /* Darker than ANY chat surface: the chat is the room's paper sheet,
         the terminal is the machine — the deepest black on screen, and the
         grid sits inside a bezel instead of bleeding into the panel. */
      background: #000;
      padding: 14px 16px 16px;
    }
    .screen-term-wrap[hidden] { display: none; }
    .screen-term {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 880px;
      padding: 8px 10px;
      background: #050506; /* xterm's own background (see the theme below) */
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* The Groups panel — the body of its lightbox now. It used to drop under
       the feed header and shove the transcript down, which is what a VIEW does;
       this is a dialog, and the launcher next door was already one. */
    .groups-panel {
      max-height: 70vh;
      overflow-y: auto;
      padding: 12px 14px 14px;
    }
    /* Wider than the launcher: this one lists every room and everyone in them. */
    .lightbox-card-wide { max-width: 720px; }

    /* A file path an agent named, made clickable. Amber + dotted underline so it
       reads as "actionable" without shouting. */
    .path-link {
      /* Clickable paths are LINKS to the reader — same blue as every anchor
         (they are spans, so the global `a` rule never reaches them). */
      color: var(--link);
      border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent);
      cursor: pointer;
      word-break: break-all;
    }
    .path-link:hover {
      border-bottom-style: solid;
      color: var(--link-bright);
      background: color-mix(in srgb, var(--link) 10%, transparent);
    }

    .preview-path {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-body {
      max-height: 72vh;
      overflow: auto;
      padding: 12px 14px;
    }
    .preview-status { font-family: var(--sans); font-size: var(--fs-sm); color: var(--text-dim); padding: 20px; text-align: center; }
    .preview-status.stale { color: var(--danger); }
    /* "Cannot render this" is a door, not a dead end: the reason, then the way out. */
    .preview-blocked {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0 24px;
    }
    .preview-blocked .preview-status { padding-bottom: 4px; }
    .preview-open, .preview-browser, .preview-reveal { border-color: var(--border); color: var(--text); }
    .preview-open:hover:not(:disabled), .preview-browser:hover:not(:disabled),
    .preview-reveal:hover:not(:disabled) { background: var(--accent-wash); }
    /* Header furniture on both preview surfaces (lightbox head + inline dock
       head): every previewed file gets these two doors, whatever its kind —
       the inline image render was a dead end (no way to see it full size, no
       way to reach the file on disk). */
    .preview-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .preview-actions .btn { padding: 3px 10px; font-size: var(--fs-xs); white-space: nowrap; }
    /* The lightbox head pushes its ✕ right with margin-left:auto; with the
       actions cluster present, the cluster owns that push. */
    .preview-actions + .dirpicker-close { margin-left: 8px; }
    .preview-image { max-width: 100%; height: auto; display: block; margin: 0 auto; image-rendering: auto; }
    .preview-text {
      margin: 0;
      font-family: var(--mono);
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--text);
      white-space: pre;
      tab-size: 2;
    }
    .preview-line { display: block; min-height: 1.5em; padding: 0 4px; margin: 0 -4px; }
    .preview-line.target {
      background: var(--accent-wash);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    /* Inline file dock — sits between the chat and the composer (markup order
       does the docking; .screen is a flex column). OPAQUE on purpose —
       readability first. */
    .inline-file {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .inline-file[hidden] { display: none; }
    /* The TOP border is the handle: a thin invisible strip straddling it. */
    .inline-file-resizer {
      position: absolute;
      top: -4px; left: 0; right: 0;
      height: 8px;
      z-index: 5;
      cursor: row-resize;
      background: transparent;
      transition: background 0.15s var(--ease);
      touch-action: none;
    }
    .inline-file-resizer:hover { background: var(--accent-line); }
    .inline-file-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    .inline-file-name {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .inline-file-path {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .inline-file-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px;
    }
    .groups-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .groups-hint {
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .groups-head .dirpicker-close { margin-left: auto; }

    .groups-body { display: flex; flex-direction: column; gap: 12px; }
    .groups-group {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-inset);
      padding: 8px 10px 10px;
    }
    .groups-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .groups-group-name {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--accent);
    }
    .groups-group-count { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-faint); }
    .groups-rename {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
    }
    .groups-rename:hover { color: var(--accent); text-decoration: underline; }

    .groups-member {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .groups-member + .groups-member { border-top: 1px solid var(--border-soft); }
    .groups-member .name { color: var(--text); font-weight: 600; }
    .groups-member .role { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .groups-member select {
      margin-left: auto;
      flex: none;
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .groups-member select:hover { border-color: var(--accent-line); }
    .groups-empty { font-family: var(--sans); font-size: var(--fs-xs); color: var(--text-faint); padding: 2px 0; }

    .groups-foot { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .groups-new-input { max-width: 220px; }

    /* Group header in the rail: the agents under it are the ones that can
       actually talk to each other. Click to fold the group away — with several
       projects open the rail is the thing that gets long. */
    .group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 11px 12px 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      cursor: pointer;
      font-family: var(--sans);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-faint);
      transition: color 0.12s var(--ease), background 0.12s var(--ease);
    }
    .group-head:hover {
      color: var(--text-dim);
      background: color-mix(in srgb, var(--group-color, var(--accent)) 9%, transparent);
    }
    .group-head .caret {
      display: inline-block;
      width: 8px;
      transition: transform 0.14s var(--ease);
    }
    .group-head.collapsed .caret { transform: rotate(-90deg); }
    /* The count is the point of collapsing: folded, it is all you see of the
       group, so it has to say how much is in there. */
    .group-head .tally {
      font-variant-numeric: tabular-nums;
      color: var(--text-faint);
      margin-left: auto;
    }
    .group-head.collapsed .tally { color: var(--accent); }
    .group-head .rule { display: none; }

    /* A group is a real room: one framed rack with a tinted header and agent
       rows inside. Colour lives across the TOP, never as another left rail. */
    .rail-group {
      position: relative;
      margin: 6px 4px 16px;
      padding: 0 4px 4px;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      /* One quiet surface, one uniform border — the group's colour lives ONLY
         in its swatch dot (zinc restyle: the coloured inset top line and the
         tinted wash were the "AI-looking" trim the owner asked to kill). */
      background: var(--bg-elev);
      /* NO overflow:hidden here: it guillotined every popover that opens inside
         the box (the card's ⋯ menu showed 2 items in a 1-agent group). The only
         square-cornered full-bleed child is the head — it rounds ITSELF below. */
      transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
    }
    .rail-group:has(.group-head:hover) {
      border-color: var(--border);
    }
    .rail-group:last-child { margin-bottom: 8px; }
    .rail-group .group-head {
      margin: 0 -4px 4px;
      width: calc(100% + 8px);
      /* Matches the box's 10px radius (minus the 1px border) — this is what the
         group's overflow:hidden used to do, without clipping the popovers. */
      border-radius: 9px 9px 0 0;
    }
    .rail-group .group-head > span:nth-child(2) {
      color: var(--text-dim);
      font-weight: 600;
    }
    .rail-group .group-head .caret { color: var(--text-faint); }
    .group-head .caret { order: 0; }
    .group-head .group-swatch { order: 1; }
    .group-head .rail-group-name { order: 2; }
    .group-head .tally { order: 3; }
    .group-head .group-rename { order: 4; }
    .group-head .unread-badge { order: 5; }
    .group-head .rule { order: 6; }
    /* The colour dot on the head doubles as the "recolour this group" control. */
    .group-swatch {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--group-color, var(--accent)) 60%, transparent);
      background: var(--group-color, var(--accent));
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .group-head:hover .group-swatch { opacity: 1; }
    .group-swatch:hover { transform: scale(1.18); }
    .rail-group-name { color: inherit; }
    /* Rename pencil: hidden until you hover the group, like the swatch. */
    .group-rename {
      flex: 0 0 auto;
      font-size: 11px;
      line-height: 1;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s var(--ease), color 0.12s var(--ease);
    }
    .group-head:hover .group-rename { opacity: 0.6; }
    .group-rename:hover { opacity: 1; color: var(--accent); }
    /* The rename input sits where the name was, inside the head. */
    .group-head .agent-rename-input {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      max-width: 140px;
    }

    /* Inside a room, agents are rows in the rack — no stack of floating cards. */
    .rail-group .agent-card {
      margin: 0;
      border-color: transparent;
      border-bottom-color: var(--border-soft);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .rail-group .agent-card:last-child { border-bottom-color: transparent; }
    .rail-group .agent-card:hover {
      border-color: transparent;
      border-bottom-color: var(--border-soft);
      background: color-mix(in srgb, var(--text) 4%, transparent);
      transform: translateX(2px);
    }
    .rail-group .agent-card.active,
    .rail-group .agent-card.active:hover {
      z-index: 1;
      border-color: var(--selected);
      border-radius: 6px;
      background: color-mix(in srgb, var(--selected) 8%, var(--bg-elev));
      box-shadow: inset 0 0 0 1px var(--selected-line);
      transform: none;
    }
    .rail-group .agent-card.leader:not(.active) {
      border-color: transparent;
      border-bottom-color: var(--border-soft);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .rail-group .agent-card.leader:not(.active) .agent-name { color: #efd27a; }

    /* Drag-to-reorder: the lifted card fades and shows a dashed berth so the gap
       it will leave is legible while you place it. */
    .agent-card.dragging {
      opacity: 0.4;
      outline: 1px dashed var(--accent-line);
      outline-offset: -1px;
    }
    .agent-card[draggable="true"] { cursor: grab; }
    .agent-card.dragging { cursor: grabbing; }

    /* ------------------------- Command palette (⌘K) --------------------- */
    .palette-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 12vh;
      background: rgba(4, 7, 11, 0.62);
      backdrop-filter: blur(2px);
    }
    .palette-backdrop[hidden] { display: none; }
    .palette {
      width: min(560px, 92vw);
      max-height: 68vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      overflow: hidden;
    }
    .palette-input {
      flex: 0 0 auto;
      padding: 15px 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-lg);
    }
    .palette-input:focus { outline: none; }
    .palette-input::placeholder { color: var(--text-faint); }
    .palette-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; }
    .palette-group {
      padding: 8px 12px 4px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-faint);
    }
    .palette-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .palette-item .p-mark {
      flex: 0 0 auto;
      width: 22px;
      text-align: center;
      font-family: var(--mono);
      font-size: var(--fs-sm);
      color: var(--text-faint);
    }
    .palette-item .p-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
    .palette-item .p-dot.online { background: var(--online); box-shadow: var(--led-online); }
    .palette-item .p-name { flex: 0 0 auto; font-family: var(--mono); font-weight: 600; color: var(--text); }
    .palette-item .p-desc {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--text-faint);
    }
    .palette-item.active { background: var(--accent-wash); color: var(--text); }
    .palette-item.active .p-mark { color: var(--accent); }
    .palette-empty { padding: 22px; text-align: center; color: var(--text-faint); font-family: var(--sans); font-size: var(--fs-sm); }
    .palette-foot {
      flex: 0 0 auto;
      display: flex;
      gap: 14px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
    }
    .palette-foot kbd {
      font-family: var(--mono);
      background: var(--bg-inset);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 0 5px;
      color: var(--text-dim);
    }

    .filter-bar {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--accent-wash);
      border-bottom: 1px solid var(--accent-line);
      font-family: var(--mono);
      font-size: var(--fs-sm);
    }
    .filter-bar.active { display: flex; }
    .filter-bar .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: var(--fs-eyebrow); }
    .filter-bar .target { color: var(--accent); font-weight: 600; }
    .filter-clear {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent-line);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 2px 10px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .filter-clear:hover { color: var(--text); border-color: var(--accent); }

    .feed {
      flex: 1 1 auto;
      overflow-y: auto;
      /* NO padding-top. A sticky child cannot rise above its containing block,
         which is this element's CONTENT box — so 6px of padding here pinned the
         day divider 6px below the top and left a sliver of the previous
         message showing above it. The dividers carry their own top padding. */
      padding: 0 0 12px;
      font-family: var(--mono);
      font-size: var(--fs-body);
      background:
        repeating-linear-gradient(180deg, transparent 0 39px, rgba(255,255,255,0.014) 39px 40px),
        var(--bg);
    }
    .feed .empty-hint { font-family: var(--sans); padding: 30px 20px; max-width: 46ch; }

    /* --- the transcript: a chat, but of DIRECTED calls -------------------
       Bubbles, because that is what a human reads without training. The one
       thing an ordinary chat does not have to say is WHO a message was for —
       in a group everyone hears everything. Here "a → b" is a private call c
       never sees, so the recipient is printed in the bubble header rather than
       implied by the room. The operator (the human) is the only party with a
       side of its own: right, amber. Everything else is incoming traffic. */

    /* Day divider: the fix for "the order makes no sense". Time-only stamps on
       a multi-day history read as shuffled — 10:37 sitting above 19:02 is
       today above yesterday, and nothing said so. Sticky, so the day you are
       reading is always on screen. */
    /* The transcript is a CENTRED column — the SAME 880px reading column the
       agent chat casca uses, so switching between an agent's chat and the
       intra-agents chat never moves where your eyes read. Rows and dividers
       share the cap so the column has one spine. */
    .day-divider, .msg-row {
      width: 100%;
      max-width: 880px;
      margin-left: auto;
      margin-right: auto;
    }

    .day-divider {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 8px;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--text-faint);
    }
    .day-divider::before, .day-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-soft);
    }

    .msg-row {
      display: flex;
      /* Top, not bottom: the disc labels the NAME in the bubble header, and a
         tall bubble would strand it a screen away from the thing it names. */
      align-items: flex-start;
      gap: 9px;
      padding: 3px 18px;
      transition: background 0.12s var(--ease);
    }
    .msg-row + .msg-row { margin-top: 5px; }
    /* The operator is you: your line runs down the other side. */
    .msg-row.from-operator { flex-direction: row-reverse; }

    /* Stable identity mark. The hue is the ONLY per-agent colour on the page
       and it lives here, on a 26px disc — the amber stays the interface's
       accent (actions, the operator, unread), never an agent's identity. */
    .msg-avatar {
      flex: none;
      width: 26px; height: 26px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--bg);
      user-select: none;
    }

    .msg-bubble {
      position: relative;
      max-width: min(104ch, 88%);
      min-width: 0;
      padding: 8px 12px 6px;
      border: 1px solid var(--border-soft);
      border-radius: 8px 8px 8px 3px;   /* the tail points at the sender */
      background: var(--bg-elev);
    }
    .msg-row:hover .msg-bubble { border-color: var(--border-strong); background: var(--bg-elev-2); }
    .msg-row.from-operator .msg-bubble {
      border-radius: 8px 8px 3px 8px;
      border-color: var(--accent-line);
      background: var(--accent-wash);
    }
    .msg-row.unread .msg-bubble { border-color: var(--accent-line); }
    .msg-row.broadcast .msg-bubble {
      max-width: none;
      flex: 1;
      border-radius: 8px;
      border-style: dashed;
      border-color: var(--accent-line);
      background: linear-gradient(90deg, var(--accent-wash), transparent 70%);
    }
    /* Only the just-arrived bubble animates; the feed is chronological, so the
       newest is the LAST child. */
    .feed > .msg-row:last-child .msg-bubble { animation: rowin 0.22s var(--ease); }
    @keyframes rowin {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 3px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .msg-from { color: var(--text); font-weight: 600; }
    .msg-from.operator { color: var(--accent); }         /* the operator: amber */
    /* "alpha to beta", not "alpha → beta": the arrow is a symbol you decode,
       the word is a sentence you read. */
    .msg-rel { color: var(--text-faint); }
    .msg-to { color: var(--text-dim); font-weight: 600; }
    .msg-to.all { color: var(--accent); }
    .msg-body {
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-md);
      line-height: 1.58;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    /* Agents write essays at each other. Unclamped, one message fills the
       viewport and the transcript stops being scannable. */
    .msg-body.clamped {
      max-height: 7.75em;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 22px), transparent 100%);
      mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 22px), transparent 100%);
    }
    .msg-more {
      margin-top: 2px;
      padding: 0;
      background: none;
      border: none;
      color: var(--accent);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
    }
    .msg-more:hover { text-decoration: underline; }

    .msg-foot {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .msg-row.from-operator .msg-foot { justify-content: flex-end; }
    .msg-time {
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }
    .msg-read-flag { letter-spacing: 0.3px; }
    .msg-read-flag.pending { color: var(--accent); }
    .msg-read-flag.read { color: var(--text-faint); }

    /* ----------------------------- Composer ------------------------------ */
    .field { flex: 1 1 auto; display: flex; flex-direction: column; }
    select, textarea {
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: var(--fs-body);
      resize: none;
      transition: border-color 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    textarea { min-height: 62px; width: 100%; line-height: 1.5; }
    .send-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.4px;
      padding: 9px 18px;
      transition: filter 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .send-btn:hover { background: var(--accent-bright); box-shadow: 0 0 16px rgba(245, 166, 35, 0.35); }
    .send-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

    /* ------------------------------ Toasts ------------------------------- */
    .toasts {
      position: fixed;
      bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 9px;
      z-index: 50;
      max-width: min(420px, 90vw);
    }
    .toast {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--text);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      animation: toast-in 0.14s ease-out;
    }
    .toast.ok    { border-left-color: var(--ok); }
    .toast.warn  { border-left-color: var(--warn); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } }

    /* Scrollbars — quiet, console-appropriate. */
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ----------------------------- Responsive --------------------------- */
    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .sidebar {
        flex: 0 0 auto;
        width: 100%;
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .mcp-add code { max-width: 28ch; }
    }

    /* Motion is purposeful; honor the OS reduced-motion request. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-jack" aria-hidden="true">⇄</span><span class="wordmark">SWITCHBOARD</span></div>
    <div class="hub-status">
      <span class="conn-state" id="conn-state" data-state="connecting" role="status" aria-live="polite">
        <span class="dot"></span><span id="conn-label">connecting</span>
      </span>
    </div>
    <div class="header-spacer"></div>
    <!-- The at-a-glance metrics live on the RIGHT, off the wordmark. -->
    <div class="hub-status hub-metrics">
      <span class="metric">online <b id="online-count">0</b>/<span id="agent-count">0</span></span>
      <span class="metric">uptime <b id="uptime">—</b></span>
      <span class="metric">v<span id="version">—</span></span>
    </div>
    <!-- The one-time "register this hub in Claude Code" command. It only shows
         on a hub with no agents yet, because that is the only time it is the
         next thing to do — `switchboard setup` runs it for you, and once an
         agent exists you are long past it. It used to sit here forever. -->
    <div class="mcp-add" id="mcp-add" hidden>
      <code id="mcp-cmd" title=""></code>
      <button class="btn btn-copy" id="copy-mcp" type="button">copy</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-resizer" id="sidebar-resizer" role="separator"
        aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
      <div class="sidebar-head">
        <span class="eyebrow">Patchbay</span>
        <span id="sidebar-count" class="rail-count">0</span>
        <!-- Groups and + agent live HERE, over the rail: both are about the
             agents listed below them. Groups was up in the tab strip, which is
             about which SCREEN you are looking at — a different question. -->
        <button class="btn groups-open" id="groups-open" type="button"
          title="Create a group, and move agents between rooms">+ group</button>
        <button class="btn launcher-open" id="launcher-open" type="button"
          title="Launch a new agent">+ agent</button>
      </div>

      <div class="agents" id="agents"></div>

      <!-- Real plan windows for both engines. The card remains present during
           upstream cooldowns so “unavailable” never looks like “the feature
           disappeared”. -->
      <div class="usage-card" id="usage-card" data-collapsed="false" hidden>
        <button class="usage-card-head" id="usage-toggle" type="button"
          aria-expanded="true" aria-controls="usage-rows" aria-label="Collapse usage details">
          <span class="eyebrow">Usage</span>
          <span class="usage-card-summary" id="usage-summary"></span>
          <span class="usage-reset" id="usage-updated"></span>
          <span class="usage-card-caret" aria-hidden="true">›</span>
        </button>
        <div id="usage-rows"></div>
      </div>

    </aside>

    <main class="main">
      <!-- The tab strip. Messages is the first tab and always there; every
           agent you open becomes one beside it. The transcript used to be
           "whatever the panel showed when no screen was open", which made the
           one view that is not an agent behave unlike everything next to it. -->
      <div class="tabs" id="tabs" role="tablist" aria-label="Open views">
        <button class="tab tab-hub active" id="tab-messages" type="button"
          role="tab" aria-selected="true"
          title="The chat between your agents — what they send each other">
          <span class="tab-mark">⇄</span>
          <span>Agent traffic</span>
          <span class="tab-unread" id="tab-messages-unread" hidden></span>
        </button>
        <div class="tab-strip" id="tab-strip"></div>
      </div>

      <div class="feed-head">
        <span class="sub">what your agents said to each other — newest at the bottom</span>
        <input class="feed-search" id="feed-search" type="search"
          aria-label="Search the transcript" placeholder="Search the transcript…" autocomplete="off" spellcheck="false" />
        <div class="group-tabs" id="group-tabs"></div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <span class="label">filtering by</span>
        <span class="target" id="filter-target"></span>
        <button class="filter-clear" id="filter-clear" type="button">clear filter ✕</button>
      </div>

      <div class="feed" id="feed"></div>

      <!-- The agent's real screen. Replaces the transcript rather than sitting
           beside it: the point is to stop juggling windows, not to add a pane
           you have to juggle. -->
      <div class="screen" id="screen" hidden>
        <div class="screen-head">
          <div class="screen-identity">
            <span class="screen-engine-mark" id="screen-engine-mark"></span>
            <span class="screen-name" id="screen-name"></span>
            <span class="screen-activity" id="screen-activity"></span>
          </div>
          <!-- Chat = the clean casca (read the agent's own conversation log);
               Terminal = its raw screen (type into it). Chat is the default. -->
          <div class="screen-control">
            <span class="screen-control-label">view</span>
            <div class="screen-modes" id="screen-modes">
              <button class="screen-mode active" data-mode="chat" type="button">Chat</button>
              <button class="screen-mode" data-mode="terminal" type="button">Terminal</button>
            </div>
          </div>
          <!-- Engine tabs: when this agent has a codex sibling (same cwd, its own
               tmux session), switch which engine's screen is shown. Both stay
               alive — the tab only changes the view. Filled by renderEngineTabs. -->
          <div class="screen-control" id="engine-control" hidden>
            <span class="screen-control-label">engine</span>
            <div class="screen-modes engine-tabs" id="engine-tabs"></div>
          </div>
          <span class="screen-hint" id="screen-hint"></span>
          <button class="btn" id="screen-window" type="button"
            title="Open this agent in a real Windows terminal window instead">open window</button>
          <button class="dirpicker-close" id="screen-close" type="button"
            aria-label="Close the agent screen"
            title="Back to agent traffic (Esc)">✕</button>
        </div>
        <!-- Chat view: rendered conversation. -->
        <div class="screen-chat" id="screen-chat"></div>
        <!-- Chat composer: type to the agent. The text is sent into its pane
             (send-keys, through the pane guard), so the agent answers as if you
             typed in the terminal — and the reply shows up here, rendered,
             because the chat tails the conversation log live. -->
        <!-- Inline file dock: a path clicked in the chat opens HERE, between
             the transcript and the composer, so you read the file while you
             keep typing. The lightbox stays for the Messages feed. The top
             border is a drag handle: up = taller, double-click = reset. -->
        <div class="inline-file" id="inline-file" hidden>
          <div class="inline-file-resizer" id="inline-file-resizer" role="separator"
            aria-orientation="horizontal" title="Drag to resize · double-click to reset"></div>
          <div class="inline-file-head">
            <span class="inline-file-name" id="inline-file-name"></span>
            <span class="inline-file-path" id="inline-file-path"></span>
            <span class="preview-actions">
              <button class="btn preview-browser" id="inline-file-browser" type="button" hidden
                title="Open this file in a browser tab — an .html opens as the site, an image at full size">browser</button>
              <button class="btn preview-reveal" id="inline-file-reveal" type="button" hidden
                title="Show this file in its folder (Windows Explorer)">folder</button>
            </span>
            <button class="dirpicker-close" id="inline-file-close" type="button"
              aria-label="Close the file preview"
              title="Close the file (keep chatting)">✕</button>
          </div>
          <div class="inline-file-body" id="inline-file-body"></div>
        </div>
        <form class="chat-composer" id="chat-composer" hidden autocomplete="off">
          <div class="chat-composer-inner">
            <div class="slash-menu" id="slash-menu" hidden></div>
            <div class="slash-menu" id="mention-menu" hidden></div>
            <div class="slash-menu" id="agentref-menu" hidden></div>
            <div class="chat-composer-context">
              <span class="composer-route">dispatch to <span class="composer-target" id="composer-target">agent</span></span>
              <span class="composer-keys"><kbd>Enter</kbd> send · <kbd>Shift Enter</kbd> newline · <kbd>Esc</kbd> stop</span>
            </div>
            <div class="chat-composer-row">
              <textarea id="chat-input" name="message" rows="1" autocomplete="off"
                aria-label="Message this agent"
                placeholder="Write a dispatch…"></textarea>
              <canvas class="chat-wave" id="chat-wave" hidden aria-hidden="true"></canvas>
              <button class="btn chat-mic" id="chat-mic" type="button"
                aria-label="Dictate a message" title="Dictate (Chrome speech, pt-BR) — click to start/stop">🎤</button>
              <button class="btn chat-send" id="chat-send" type="submit">Send</button>
              <button class="btn chat-stop" id="chat-stop" type="button"
                aria-label="Stop the agent (Esc)" title="Stop (Esc)">■</button>
            </div>
          </div>
        </form>
        <!-- Session status read from the CLI footer — under the composer, like a
             terminal footer: permission/plan mode + a running /goal with its age. -->
        <div class="chat-statusbar" id="chat-statusbar" hidden></div>
        <!-- Terminal view: xterm. Hidden until you toggle to it. The wrap fills
             the panel in the terminal's own colour and centres the grid into the
             SAME reading column as the chat, so the two views line up. -->
        <div class="screen-term-wrap" id="screen-term-wrap" hidden>
          <div class="screen-term" id="screen-term"></div>
        </div>
      </div>

      <!-- The operator composer lived here: a recipient picker, a textarea and
           a broadcast. It was a way to reach an agent back when the dashboard
           could not show you one. Now a card opens the agent's real screen and
           you type AT it, which is what the composer was approximating. Sending
           as "operator" is still a thing — `switchboard send <to> <msg>` — where
           it belongs: a script, not the panel you stare at all day. -->
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    "use strict";

    // =====================================================================
    // Switchboard dashboard — vanilla JS + SSE. No framework, no build, no
    // external asset (localhost, local trust boundary — everything inline).
    //
    // SECURITY / XSS: every value that comes from the hub (agent names, roles,
    // message bodies, from/to) is treated as untrusted — an agent on the
    // network can be adversarial/hallucinated (PRD section 15). We NEVER assign
    // server data to innerHTML: the DOM is built with createElement +
    // textContent only. The capability token never leaves the hub in the
    // shapes we read (PublicAgent / Message), so it can never reach here.
    // =====================================================================

    const $ = (sel) => document.querySelector(sel);

    const state = {
      agents: new Map(),   // name -> agent object (incl. unreadCount)
      messages: [],        // newest-first (matches GET /api/messages)
      msgIds: new Set(),   // dedup guard for message_created vs bootstrap
      filter: null,        // active agent-name filter, or null
      group: null,         // active group tab, or null for "all groups"
      search: "",          // free-text filter over the transcript, or ""
      unseen: new Set(),   // agents that finished a turn you haven't opened yet
      reopening: new Set(), // agents with a relaunch in flight (see reopenAgent)
      sse: null,
      uptimeBase: null,    // { seconds, at }  — server uptime + local anchor
    };

    // --- tiny DOM helper: text is set via textContent (never innerHTML) -----
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    // Seconds are noise in a transcript — "10:37" is when it was said. The
    // locale is the READER's (undefined), not a hardcoded one: this is the
    // viewer's clock, and the rest of the product is en.
    function fmtTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    /** Full stamp for a title= — the exact instant, when someone wants it. */
    function fmtFull(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString(undefined, { dateStyle: "full", timeStyle: "medium" });
    }

    const DAY_MS = 86400000;

    /** Local midnight of a date — the boundary a human means by "day". */
    function startOfDay(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    /**
     * "Today" / "Yesterday" / "Mon, 14 Jul" — the label of a day divider.
     * Named days beat dates for the two days anyone actually reads.
     */
    function fmtDayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      const days = Math.round((startOfDay(new Date()) - startOfDay(d)) / DAY_MS);
      if (days === 0) return "Today";
      if (days === 1) return "Yesterday";
      return d.toLocaleDateString(undefined, {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: startOfDay(d) < startOfDay(new Date()) - 300 * DAY_MS ? "numeric" : undefined,
      });
    }

    // Every agent gets one stable colour, hashed from its name so it survives
    // restarts and never depends on arrival order. Muted on purpose: these sit
    // beside the amber without competing with it for "this is actionable".
    const AGENT_HUES = ["#c8873a", "#5f9ea0", "#7fa860", "#a97fa8", "#c47a5c", "#7d86c4"];

    function agentHue(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
      return AGENT_HUES[h % AGENT_HUES.length];
    }

    /** Up to 2 characters — a name's first letters, digits included. */
    function monogram(name) {
      const letters = name.replace(/[^a-z0-9]/gi, "");
      return (letters.slice(0, 2) || "?").toUpperCase();
    }

    function fmtUptime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m ${sec}s`;
      if (m > 0) return `${m}m ${sec}s`;
      return `${sec}s`;
    }

    // --- toasts -----------------------------------------------------------
    function toast(message, kind = "ok", ttl = 4200) {
      const box = $("#toasts");
      const t = el("div", `toast ${kind}`, message);
      box.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        t.style.transition = "opacity 0.25s";
        setTimeout(() => t.remove(), 260);
      }, ttl);
    }

    // A toast with an action button — for optional, non-blocking follow-ups
    // (e.g. "announce the leader to the group?"). Auto-dismisses if ignored.
    function toastAction(message, actionLabel, onAction, ttl = 8000) {
      const box = $("#toasts");
      const t = el("div", "toast ok");
      t.appendChild(el("span", null, message));
      const btn = el("button", "toast-action", actionLabel);
      btn.type = "button";
      const kill = () => {
        t.style.opacity = "0";
        t.style.transition = "opacity 0.25s";
        setTimeout(() => t.remove(), 260);
      };
      btn.addEventListener("click", () => {
        onAction();
        kill();
      });
      t.appendChild(btn);
      box.appendChild(t);
      setTimeout(kill, ttl);
    }

    // A small centred card for reading a bit of text in full (the agent's
    // description). Backdrop closes; Esc closes. No blocking browser dialog.
    function showInfoDialog(title, bodyText) {
      document.getElementById("info-dialog")?.remove();
      const bd = el("div", "palette-backdrop");
      bd.id = "info-dialog";
      const card = el("div", "info-card");
      const head = el("div", "info-card-head");
      head.appendChild(el("span", "info-card-title", title));
      const close = el("button", "dirpicker-close", "✕");
      close.type = "button";
      close.addEventListener("click", () => bd.remove());
      head.appendChild(close);
      card.append(head, el("div", "info-card-body", bodyText || "(no description)"));
      bd.appendChild(card);
      bd.addEventListener("click", (e) => { if (e.target === bd) bd.remove(); });
      const onEsc = (e) => { if (e.key === "Escape") { bd.remove(); document.removeEventListener("keydown", onEsc); } };
      document.addEventListener("keydown", onEsc);
      document.body.appendChild(bd);
    }

    // A centred confirm dialog (title + message + Cancel/Confirm). Non-blocking,
    // backdrop/Esc cancels — for the few YES/NO moments a corner toast is too
    // small or too easy to miss.
    function showConfirmDialog(title, message, confirmLabel, onConfirm) {
      document.getElementById("confirm-dialog")?.remove();
      const bd = el("div", "palette-backdrop");
      bd.id = "confirm-dialog";
      const card = el("div", "info-card");
      const head = el("div", "info-card-head");
      head.appendChild(el("span", "info-card-title", title));
      card.appendChild(head);
      card.appendChild(el("div", "info-card-body", message));
      const foot = el("div", "confirm-foot");
      const cancel = el("button", "btn ghost", "cancel");
      cancel.type = "button";
      cancel.addEventListener("click", () => bd.remove());
      const ok = el("button", "btn", confirmLabel);
      ok.type = "button";
      ok.addEventListener("click", () => {
        bd.remove();
        onConfirm();
      });
      foot.append(cancel, ok);
      card.appendChild(foot);
      bd.appendChild(card);
      bd.addEventListener("click", (e) => { if (e.target === bd) bd.remove(); });
      const onEsc = (e) => { if (e.key === "Escape") { bd.remove(); document.removeEventListener("keydown", onEsc); } };
      document.addEventListener("keydown", onEsc);
      document.body.appendChild(bd);
      ok.focus();
    }

    // A proper colour picker: a small popover of curated swatches (click a
    // swatch = pick, no drag-to-close, no native OS dialog) plus a "custom…"
    // escape hatch and, when relevant, a "clear". `anchor` positions it; the
    // pick fires onPick(hex|null). Replaces the native <input type=color>, whose
    // every drag-tick applied a colour and whose first click closed it.
    const COLOR_SWATCHES = [
      "#e0a326", "#f2c14e", "#e0623c", "#e0504e", "#d1509a", "#a371f7",
      "#6a8cff", "#4a9eff", "#2bb8a3", "#3fb950", "#8bc34a", "#9aa0bd",
    ];
    function openColorPicker(anchor, current, onPick, opts = {}) {
      document.getElementById("color-pop")?.remove();
      const pop = el("div", "color-pop");
      pop.id = "color-pop";
      const grid = el("div", "color-grid");
      for (const c of COLOR_SWATCHES) {
        const sw = el("button", "color-sw" + (current && current.toLowerCase() === c ? " on" : ""));
        sw.type = "button";
        sw.style.background = c;
        sw.title = c;
        sw.addEventListener("click", (e) => {
          e.stopPropagation();
          pop.remove();
          onPick(c);
        });
        grid.appendChild(sw);
      }
      pop.appendChild(grid);
      const foot = el("div", "color-pop-foot");
      // Custom hex via a native input, but it only applies on CHANGE (commit),
      // not on every drag-tick — so you can actually pick.
      const customWrap = el("label", "color-custom");
      const dot = el("span", "color-custom-dot");
      dot.style.background = current || "#e0a326";
      const custom = el("input");
      custom.type = "color";
      custom.value = current || "#e0a326";
      custom.addEventListener("input", (e) => (dot.style.background = e.target.value));
      custom.addEventListener("change", (e) => {
        pop.remove();
        onPick(e.target.value);
      });
      custom.addEventListener("click", (e) => e.stopPropagation());
      customWrap.append(dot, document.createTextNode("custom"), custom);
      foot.appendChild(customWrap);
      if (opts.clearable) {
        const clr = el("button", "color-clear", "clear");
        clr.type = "button";
        clr.addEventListener("click", (e) => {
          e.stopPropagation();
          pop.remove();
          onPick(null);
        });
        foot.appendChild(clr);
      }
      pop.appendChild(foot);
      document.body.appendChild(pop);
      // Position under the anchor, kept on-screen.
      const r = anchor.getBoundingClientRect();
      const pr = pop.getBoundingClientRect();
      let left = r.left;
      if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
      pop.style.left = `${Math.max(8, left)}px`;
      pop.style.top = `${Math.min(r.bottom + 6, window.innerHeight - pr.height - 8)}px`;
      const onDoc = (e) => {
        if (!pop.contains(e.target)) {
          pop.remove();
          document.removeEventListener("mousedown", onDoc);
        }
      };
      setTimeout(() => document.addEventListener("mousedown", onDoc), 0);
    }

    // "You named a leader — tell the group?" (the operator's optional signal).
    function openLeaderAnnouncePrompt(group, leaderName) {
      const peers = [...state.agents.values()].filter(
        (a) => groupOf(a) === group && a.name !== leaderName && a.status === "online",
      );
      if (peers.length === 0) return; // nobody to tell; the badge is enough
      showConfirmDialog(
        `${displayOf(leaderName)} is now the leader 👑`,
        `This badge is visual only. Want to tell the ${peers.length} other online agent(s) in this group ` +
          `— in your voice — that ${displayOf(leaderName)} leads and their instructions carry the same weight as yours?`,
        "announce to the group",
        () => announceLeader(group, leaderName),
      );
    }

    // --- agent state merge ------------------------------------------------
    // GET /api/agents carries unreadCount; the SSE agent_updated payload is a
    // PublicAgent and does NOT — so we PRESERVE the previous unreadCount when a
    // partial update arrives, and track deltas from message_created/read.
    function mergeAgent(incoming) {
      const prev = state.agents.get(incoming.name);
      const unreadCount =
        incoming.unreadCount != null
          ? incoming.unreadCount
          : prev
            ? prev.unreadCount
            : 0;
      // "Unseen output": the instant an agent finishes a turn (working → idle) it
      // has just written a reply. Flag it so the rail shows an amber pip — UNLESS
      // its screen is the one you're already looking at (then you saw it live).
      // Only a live transition counts: on the first sight of an agent (no prev)
      // or a plain refresh there is nothing new to surface.
      if (
        prev &&
        prev.activity === "working" &&
        incoming.activity === "idle" &&
        incoming.status === "online" &&
        screenState.name !== incoming.name
      ) {
        markUnseen(incoming.name);
      }
      state.agents.set(incoming.name, { ...prev, ...incoming, unreadCount });
    }

    // "Unseen output" is viewer state, persisted so an unread reply survives a
    // reload — it clears only when you actually open the agent. (Stale names for
    // vanished agents are harmless: a pip renders only for a card that exists.)
    const UNSEEN_KEY = "sb.unseen";
    function persistUnseen() {
      try { localStorage.setItem(UNSEEN_KEY, JSON.stringify([...state.unseen])); } catch { /* private mode */ }
    }
    function markUnseen(name) { state.unseen.add(name); persistUnseen(); }
    function clearUnseen(name) { if (state.unseen.delete(name)) persistUnseen(); }
    function loadUnseen() {
      try {
        const v = JSON.parse(localStorage.getItem(UNSEEN_KEY) || "[]");
        if (Array.isArray(v)) for (const n of v) if (typeof n === "string") state.unseen.add(n);
      } catch { /* malformed — start clean */ }
    }

    // Manual order (drag-to-reorder) is a viewer preference in localStorage: a
    // list of names in the order the operator arranged. A name in the list wins;
    // anything not yet arranged falls back to online-first-then-name and sits
    // after the arranged ones. Empty list => the original default ordering.
    function loadChatOrder() {
      try {
        const v = JSON.parse(localStorage.getItem("sb.chatOrder") || "[]");
        return Array.isArray(v) ? v : [];
      } catch {
        return [];
      }
    }
    function saveChatOrder(names) {
      localStorage.setItem("sb.chatOrder", JSON.stringify(names));
    }

    function sortedAgents() {
      const order = loadChatOrder();
      const rank = new Map(order.map((n, i) => [n, i]));
      return [...state.agents.values()].sort((a, b) => {
        const ia = rank.has(a.name) ? rank.get(a.name) : -1;
        const ib = rank.has(b.name) ? rank.get(b.name) : -1;
        if (ia !== -1 && ib !== -1) return ia - ib; // both arranged: keep it
        if (ia !== -1) return -1; // arranged sorts before unarranged
        if (ib !== -1) return 1;

    }

    // =====================================================================
    // Rendering
    // =====================================================================

    // --- Claude /usage bars, pace-coloured (from the reference app) --------
    // The bar fills to `percent`, coloured by how the burn compares to the clock:
    // under the window's pace = green, at/over it = warming to red.
    const USAGE_HOUR = 3_600_000;
    function usageWindow(group) {
      if (group === "session") return { windowMs: 5 * USAGE_HOUR, chunkMs: USAGE_HOUR / 3 };
      if (group === "weekly") return { windowMs: 168 * USAGE_HOUR, chunkMs: USAGE_HOUR };
      return null;
    }
    function usageExpected(resetsAt, windowMs, chunkMs, now) {
      const reset = Date.parse(resetsAt);
      const start = reset - windowMs;
      const totalChunks = Math.round(windowMs / chunkMs);
      const chunks = Math.min(totalChunks, Math.max(1, Math.ceil((now - start) / chunkMs)));
      return (chunks / totalChunks) * 100;
    }
    function usagePaceColor(percent, expected) {
      if (expected <= 0) return percent > 0 ? "var(--danger)" : "var(--online)";
      const ratio = percent / expected;
      if (ratio <= 1) return "var(--online)";
      if (ratio >= 2) return "var(--danger)";
      return `hsl(${Math.round(140 * (2 - ratio))} 70% 55%)`;
    }
    function usageLabel(l) {
      if (l.label) return l.label;
      if (l.kind === "session") return "session · 5h";
      if (l.kind === "weekly_all") return "weekly · all";
      return l.kind.replace(/_/g, " ");
    }
    function usageResetText(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
    }
    let usageClaude = null; // { limits, status, stale, updatedAt, retryAt }
    let usageCodex = null;  // tokens + real rate-limit windows from local rollouts
    const USAGE_COLLAPSED_KEY = "sb.usageCollapsed";
    function setUsageCollapsed(collapsed, persist = true) {
      const card = $("#usage-card");
      const toggle = $("#usage-toggle");
      if (!card || !toggle) return;
      card.dataset.collapsed = String(collapsed);
      toggle.setAttribute("aria-expanded", String(!collapsed));
      toggle.setAttribute("aria-label", collapsed ? "Expand usage details" : "Collapse usage details");
      if (persist) {
        try { localStorage.setItem(USAGE_COLLAPSED_KEY, String(collapsed)); } catch { /* private mode */ }
      }
    }
    function loadUsageCollapsed() {
      let collapsed = false;
      try { collapsed = localStorage.getItem(USAGE_COLLAPSED_KEY) === "true"; } catch { /* private mode */ }
      setUsageCollapsed(collapsed, false);
    }
    function usagePeak(limits, field) {
      const values = (Array.isArray(limits) ? limits : [])
        .map((limit) => Number(limit[field]))
        .filter(Number.isFinite);
      return values.length ? Math.max(...values) : null;
    }
    function renderUsageSummary() {
      const summary = $("#usage-summary");
      if (!summary) return;
      const claude = usageClaude ? usagePeak(usageClaude.limits, "percent") : null;
      const codex = usageCodex ? usagePeak(usageCodex.limits, "usedPercent") : null;
      const parts = [];
      if (usageClaude) parts.push(`Claude ${claude == null ? "—" : `${Math.round(claude)}%`}`);
      if (usageCodex) parts.push(`Codex ${codex == null ? "—" : `${Math.round(codex)}%`}`);
      summary.textContent = parts.join(" · ");
      summary.title = parts.join(" · ");
    }
    async function refreshUsage() {
      try {
        const r = await fetch("/api/usage");
        const body = r.ok ? await r.json() : null;
        if (body && body.claude && typeof body.claude === "object") {
          usageClaude = {
            ...body.claude,
            limits: Array.isArray(body.claude.limits) ? body.claude.limits : [],
          };
        } else if (body) {
          // Backward-compatible shape from a hub that has not restarted yet.
          const limits = Array.isArray(body.limits) ? body.limits : [];
          usageClaude = {
            limits,
            status: limits.length ? "ok" : "unavailable",
            stale: !limits.length,
            updatedAt: limits.length ? new Date().toISOString() : null,
            retryAt: null,
          };
        }
        if (body && "codex" in body) usageCodex = body.codex; // null = no codex agent
      } catch {
        /* keep the last good value */
      }
      renderUsage();
    }
    function fmtAgo(ms) {
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function fmtTokensShort(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
      if (n >= 1e3) return Math.round(n / 1e3) + "k";
      return String(Math.round(n));
    }
    function usageWindowFromMinutes(minutes) {
      if (!Number.isFinite(minutes) || minutes <= 0) return null;
      return {
        windowMs: minutes * 60_000,
        chunkMs: minutes <= 300 ? 20 * 60_000 : USAGE_HOUR,
      };
    }
    function usageWindowLabel(minutes) {
      if (minutes === 300) return "5h window";
      if (minutes === 10_080) return "weekly";
      if (minutes % 1_440 === 0) return `${minutes / 1_440}d window`;
      if (minutes % 60 === 0) return `${minutes / 60}h window`;
      return `${minutes}m window`;
    }
    function untilText(iso) {
      const ms = Date.parse(iso) - Date.now();
      if (!Number.isFinite(ms)) return "soon";
      if (ms <= 0) return "now";

      return `${Math.ceil(ms / USAGE_HOUR)}h`;
    }
    function appendUsageRow(container, item) {
      const row = el("div", "usage-row");
      const head = el("div", "usage-row-head");
      head.append(
        el("span", "usage-row-label", item.label),
        el("span", "usage-row-pct", `${Math.round(item.percent)}%`),
      );
      const bar = el("div", "usage-bar");
      const fill = el("div", "usage-bar-fill");
      fill.style.width = `${Math.min(100, Math.max(0, item.percent))}%`;
      fill.style.background = item.color;

    function usageEngine(type, name, meta) {
      const section = el("section", "usage-engine");

    }
    function renderUsage() {

      }

      if (updated) updated.textContent = latestIso ? fmtAgo(Date.parse(latestIso)) : "";

      const now = Date.now();
      const rows = $("#usage-rows");
      rows.textContent = "";

      if (usageClaude) {
        const meta = usageClaude.stale && usageClaude.updatedAt ? "last known" : "plan";
        const section = usageEngine("claude", "Claude", meta);
        const order = { session: 0, weekly: 1 };
        const limits = [...usageClaude.limits].sort(
          (a, b) => (order[a.group] ?? 9) - (order[b.group] ?? 9) || a.percent - b.percent,
        );
        for (const l of limits) {
          const win = usageWindow(l.group);
          appendUsageRow(section, {
            label: usageLabel(l), percent: l.percent, resetsAt: l.resetsAt,
            color: win
              ? usagePaceColor(l.percent, usageExpected(l.resetsAt, win.windowMs, win.chunkMs, now))
              : "var(--accent)",
          });
        }
        if (usageClaude.stale || limits.length === 0) {
          let message = "Usage temporarily unavailable";
          if (usageClaude.status === "rate_limited" && usageClaude.retryAt) {
            message = `${limits.length ? "Last known · " : "Endpoint cooling down · "}retry in ${untilText(usageClaude.retryAt)}`;
          } else if (usageClaude.status === "unauthorized") {
            message = "Open Claude once to refresh its sign-in";
          } else if (limits.length && usageClaude.updatedAt) {
            message = `Last updated ${fmtAgo(Date.parse(usageClaude.updatedAt))}`;
          }
          section.appendChild(el("div", `usage-engine-state${usageClaude.status === "rate_limited" ? " warn" : ""}`, message));
        }
        rows.appendChild(section);
      }

      if (usageCodex) {
        const meta = usageCodex.planType ? `${usageCodex.planType} plan` : "local rollout";
        const section = usageEngine("codex", "Codex", meta);
        const limits = Array.isArray(usageCodex.limits) ? usageCodex.limits : [];
        for (const l of limits) {
          const win = usageWindowFromMinutes(l.windowMinutes);
          appendUsageRow(section, {
            label: usageWindowLabel(l.windowMinutes), percent: l.usedPercent, resetsAt: l.resetsAt,
            color: win
              ? usagePaceColor(l.usedPercent, usageExpected(l.resetsAt, win.windowMs, win.chunkMs, now))
              : "var(--selected)",
          });
        }
        if (!limits.length) section.appendChild(el("div", "usage-engine-state", "Waiting for a Codex limit event"));
        if (usageCodex.total > 0) {
          section.appendChild(el(
            "div",
            "usage-token-note",
            `${fmtTokensShort(usageCodex.total)} tokens today · ${fmtTokensShort(usageCodex.output)} output`,
          ));
        }
        rows.appendChild(section);
      }
      card.hidden = false;
    }

    function renderHeader() {
      const agents = [...state.agents.values()];

      $("#mcp-add").hidden = agents.length > 0;

      // unread: with the panel showing a terminal, the transcript is off screen,

    }

    function renderUptime() {

    function setConnState(stateName, label) {

    // — no "pick a colour first" step. `default` stays neutral: it is the

      if (peers.length === 0) {

      saveChatOrder([...container.querySelectorAll(".agent-card")].map((c) => c.dataset.name));
      if (agent && targetGroup && groupOf(agent) !== targetGroup) {
        moveAgentToGroup(moved, targetGroup); // server + re-render, honours the saved order
      } else {
        renderAgents();
      }
    }

    function initDragReorder() {
      const container = $("#agents");
      container.addEventListener("dragover", (e) => {
        // Group reorder takes precedence: dragging a head moves whole boxes.
        if (dragGroup) {
          const box = container.querySelector(`.rail-group[data-group="${CSS.escape(dragGroup)}"]`);
          if (!box) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const after = boxAfterY(container, e.clientY, box);
          if (after == null) container.appendChild(box);
          else container.insertBefore(box, after);
          return;
        }
        if (!dragName) return;
        const dragging = container.querySelector(".agent-card.dragging");
        if (!dragging) return;
        // Only a real drop zone: a group box, or the flat container when there
        // are no groups. Dead space in grouped mode is left alone, so a card is
        // never orphaned outside every room.
        const box = e.target.closest(".rail-group");
        const grouped = !!container.querySelector(".rail-group");
        const zone = box || (grouped ? null : container);
        if (!zone) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const after = cardAfterY(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else zone.insertBefore(dragging, after);
      });
      // drop only has to ACCEPT the gesture; dragend commits (it always fires).
      container.addEventListener("drop", (e) => {
        if (dragName || dragGroup) e.preventDefault();
      });
    }

    // =====================================================================
    // Command palette (⌘K / Ctrl-K): jump to any agent or fire a core action
    // without reaching for the mouse — the fast path once the rail has more
    // than a couple of agents.
    // =====================================================================
    const paletteState = { open: false, items: [], active: 0 };

    function paletteActions() {
      return [
        {
          kind: "action", mark: "⇄", name: "Agent traffic",
          desc: "the transcript of what agents said",
          run: () => { closePalette(); if (screenState.name) closeScreen(); },
        },
        {
          kind: "action", mark: "+", name: "New agent", desc: "launch a new agent",
          run: () => { closePalette(); $("#launcher-open").click(); },
        },
        {
          kind: "action", mark: "+", name: "New group", desc: "create a room",
          run: () => { closePalette(); openGroups(); },
        },
      ];
    }

    function paletteResults(q) {
      const query = q.trim().toLowerCase();
      const agents = sortedAgents().map((a) => ({
        kind: "agent", name: displayOf(a), id: a.name, desc: a.role || "", online: a.status === "online",
        run: () => { closePalette(); openScreen(a.name); },
      }));
      let all = [...agents, ...paletteActions()];
      if (query) all = all.filter((it) => (it.name + " " + (it.id || "") + " " + (it.desc || "")).toLowerCase().includes(query));
      return all;
    }

    function ensurePalette() {
      let bd = $("#palette-backdrop");
      if (bd) return bd;
      bd = el("div", "palette-backdrop");
      bd.id = "palette-backdrop";
      bd.hidden = true;
      const p = el("div", "palette");
      const input = el("input", "palette-input");
      input.type = "text";
      input.placeholder = "Jump to an agent, or an action…";
      const list = el("div", "palette-list");
      const foot = el("div", "palette-foot");
      foot.append(
        paletteHint("↑↓", "navigate"),
        paletteHint("↵", "open"),
        paletteHint("esc", "close"),
      );
      p.append(input, list, foot);
      bd.appendChild(p);
      document.body.appendChild(bd);
      input.addEventListener("input", () => renderPalette(input.value));
      input.addEventListener("keydown", paletteKey);
      bd.addEventListener("click", (e) => { if (e.target === bd) closePalette(); });
      return bd;
    }
    function paletteHint(keys, label) {
      const span = el("span");
      span.append(el("kbd", null, keys), document.createTextNode(" " + label));
      return span;
    }

    function openPalette() {
      const bd = ensurePalette();
      bd.hidden = false;
      paletteState.open = true;
      paletteState.active = 0;
      const input = bd.querySelector(".palette-input");
      input.value = "";
      renderPalette("");
      input.focus();
    }
    function closePalette() {
      const bd = $("#palette-backdrop");
      if (bd) bd.hidden = true;
      paletteState.open = false;
    }

    function renderPalette(q) {
      const list = $("#palette-backdrop").querySelector(".palette-list");
      const results = paletteResults(q);
      paletteState.items = results;
      if (paletteState.active >= results.length) paletteState.active = Math.max(0, results.length - 1);
      list.textContent = "";
      if (!results.length) {
        list.appendChild(el("div", "palette-empty", "Nothing matches."));
        return;
      }
      let lastKind = null;
      results.forEach((it, i) => {
        if (it.kind !== lastKind) {
          list.appendChild(el("div", "palette-group", it.kind === "agent" ? "Agents" : "Actions"));
          lastKind = it.kind;
        }
        const item = el("div", `palette-item${i === paletteState.active ? " active" : ""}`);
        item.dataset.i = String(i);
        if (it.kind === "agent") {
          item.append(el("span", `p-dot${it.online ? " online" : ""}`), el("span", "p-name", it.name), el("span", "p-desc", it.desc || ""));
        } else {
          item.append(el("span", "p-mark", it.mark), el("span", "p-name", it.name), el("span", "p-desc", it.desc || ""));
        }
        item.addEventListener("mousemove", () => setPaletteActive(i));
        item.addEventListener("click", () => it.run());
        list.appendChild(item);
      });
    }
    function setPaletteActive(i) {
      paletteState.active = i;
      const list = $("#palette-backdrop").querySelector(".palette-list");
      for (const it of list.querySelectorAll(".palette-item")) {
        it.classList.toggle("active", Number(it.dataset.i) === i);
      }
    }
    function movePalette(d) {
      const n = paletteState.items.length;
      if (!n) return;
      let i = paletteState.active + d;
      if (i < 0) i = n - 1;
      if (i >= n) i = 0;
      setPaletteActive(i);
      const node = $("#palette-backdrop").querySelector(`.palette-item[data-i="${i}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }
    function paletteKey(e) {
      if (e.key === "ArrowDown") { e.preventDefault(); movePalette(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); movePalette(-1); }
      else if (e.key === "Enter") { e.preventDefault(); const it = paletteState.items[paletteState.active]; if (it) it.run(); }
      else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    }

    /**
     * Which room a message belongs to. Messages carry no group of their own —
     * they do not need to: agents can only message inside their group, so the
     * sender's group IS the conversation's. The operator is the exception, being
     * in no group and able to reach anyone, so its messages belong to whoever it
