        if (local == null || Math.abs(local - serverSeconds) > 2) {
          state.uptimeBase = { seconds: serverSeconds, at: Date.now() };
        }
        $("#version").textContent = data.version || "—";
        renderUptime();
      } catch {
        // health poll failure is non-fatal; SSE state already reflects trouble.
      }
    }

    async function loadAgents() {
      const res = await fetch("/api/agents");
      const list = await res.json();
      for (const agent of list) mergeAgent(agent);
    }

    async function loadMessages() {
      const res = await fetch("/api/messages?limit=200");
      const list = await res.json(); // newest-first
      state.messages = Array.isArray(list) ? list : [];
      state.msgIds = new Set(state.messages.map((m) => m.id));
    }

    function setupMcpCommand() {
      const cmd = `claude mcp add --transport http --scope user switchboard ${location.origin}/mcp`;
      const code = $("#mcp-cmd");
      code.textContent = cmd;
      code.title = cmd;
      $("#copy-mcp").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(cmd);
          toast("Command copied.", "ok", 2000);
        } catch {
          // Fallback for contexts where the async clipboard API is blocked.
          const ta = document.createElement("textarea");
          ta.value = cmd;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            toast("Command copied.", "ok", 2000);
          } catch {
            toast("Could not copy automatically — select and copy.", "warn");
          }
          ta.remove();
        }
      });
    }

    async function boot() {
      setupMcpCommand();

      // Composer wiring.
      $("#filter-clear").addEventListener("click", () => setFilter(state.filter));

      // Launcher wiring. The name field sanitizes as you type for the same
      // reason rename does — it feeds the same ^[a-z0-9][a-z0-9-]{1,30}$ hub rule.
      $("#launcher").addEventListener("submit", launchAgent);
      bindAgentNameSanitizer($("#launch-name"));
      // A group name is an address too, under the same rule as an agent's, so
      // it gets the same treatment: typing "Chefe de Redes" reads back as
      // "chefe-de-redes" rather than bouncing off the hub.
      bindAgentNameSanitizer($("#launch-group"));

      // Messages: a tab like any other, so selecting it is closing the screen.
      $("#tab-messages").addEventListener("click", closeScreen);

      // File preview lightbox.
      $("#preview-close").addEventListener("click", closePreview);
      $("#preview-box").addEventListener("click", (ev) => {
        if (ev.target === $("#preview-box")) closePreview();
      });

      // Inline file dock (chat): close button + drag-resize handle.
      $("#inline-file-close").addEventListener("click", closeInlineFile);
      wireInlineFileResize();

      // Launch agent (lightbox).
      $("#launcher-open").addEventListener("click", () => {
        $("#launcher-box").hidden = false;
        $("#launch-dir").focus();
      });
      $("#launcher-close").addEventListener("click", closeLauncher);
      // Clicking the backdrop closes; clicking the card must not.
      $("#launcher-box").addEventListener("click", (ev) => {
        if (ev.target === $("#launcher-box")) closeLauncher();
      });

      // The agent's screen.
      $("#screen-close").addEventListener("click", closeScreen);
      $("#screen-window").addEventListener("click", (ev) => {
        if (screenState.name) openAgentTerminal(screenState.name, ev.currentTarget);
      });
      for (const b of document.querySelectorAll(".screen-mode")) {
        b.addEventListener("click", () => setScreenMode(b.dataset.mode));
      }

      // Drag agent cards to reorder them (and drop across into another room).
      initDragReorder();

      // ⌘K / Ctrl-K opens the command palette anywhere in the app.
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
          e.preventDefault();
          if (paletteState.open) closePalette();
          else openPalette();
        }
      });

      // Free-text search over the transcript (debounced — one render per pause).
      let searchTimer = null;
      $("#feed-search").addEventListener("input", (e) => {
        const v = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.search = v;
          renderFeed();
        }, 120);
      });

      // Chat composer: type to the agent.
      const chatInput = $("#chat-input");
      const autogrow = () => {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px";
      };
      chatInput.addEventListener("input", autogrow);

      // ---- Attachments: drag-drop / paste files onto the composer ---------
      // A dropped or pasted file is uploaded to the hub (POST /api/uploads),
      // an inline "[📎 name]" token marks the spot until send, and on submit
      // each token expands to the uploaded file's ABSOLUTE path so the agent
      // can read it from disk.
      const CHAT_PLACEHOLDER = chatInput.placeholder;
      const attachments = new Map(); // "[📎 name]" -> absolute path on the hub
      let uploading = 0;
      const attachToken = (name) => `[📎 ${name}]`;

      function setUploading(delta) {
        uploading += delta;
        const busy = uploading > 0;
        $("#chat-send").disabled = busy;
        chatInput.placeholder = busy ? "Uploading attachment…" : CHAT_PLACEHOLDER;
      }

      async function uploadFile(file, name) {
        // Content-Type is ALWAYS octet-stream: fetch would otherwise infer the
        // Blob's own type, and a dragged .json file would be eaten by the hub's
        // global JSON body parser before the raw route could see it.
        const res = await fetch(`/api/uploads?name=${encodeURIComponent(name)}`, {
          method: "POST",
          headers: { "content-type": "application/octet-stream" },
          body: file,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
        return body; // { ok, path, name }
      }

      async function attachFiles(files) {
        const list = Array.from(files || []);
        if (!list.length) return;
        let pos = chatInput.selectionStart ?? chatInput.value.length;
        for (const file of list) {
          setUploading(+1);
          try {
            // A pasted screenshot arrives with a generic name — stamp it.
            const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, "");
            const isPastedImage = file.name === "" || file.name === "image.png";
            const name = isPastedImage ? `pasted-${stamp}.png` : file.name;
            const saved = await uploadFile(file, name);
            const tok = attachToken(saved.name);
            attachments.set(tok, saved.path);
            const v = chatInput.value;
            const at = Math.min(pos, v.length);
            chatInput.value = v.slice(0, at) + tok + v.slice(at);
            pos = at + tok.length;
            chatInput.setSelectionRange(pos, pos);
            chatInput.dispatchEvent(new Event("input")); // autogrow + menus
          } catch (err) {
            toast(`Attachment failed: ${err && err.message ? err.message : err}`, "warn");
          } finally {
            setUploading(-1);
          }
        }
        chatInput.focus();
      }

      chatInput.addEventListener("paste", (ev) => {
        if (ev.clipboardData && ev.clipboardData.files && ev.clipboardData.files.length) {
          ev.preventDefault();
          attachFiles(ev.clipboardData.files);
        }
      });
      chatInput.addEventListener("dragover", (ev) => {
        ev.preventDefault(); // required, or the browser navigates to the file
        chatInput.classList.add("drag-over");
      });
      chatInput.addEventListener("dragleave", () => chatInput.classList.remove("drag-over"));
      chatInput.addEventListener("drop", (ev) => {
        ev.preventDefault();
        chatInput.classList.remove("drag-over");
        if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
          attachFiles(ev.dataTransfer.files);
        }
      });
      // ---- end attachments -------------------------------------------------

      // ---- Slash-command autocomplete (composer) --------------------------
      const SLASH_DESCRIPTIONS = {
        compact: "clear context & summarize", cost: "show token cost",
        context: "show context usage", usage: "show usage limits",
        clear: "start a fresh conversation", model: "switch model",
        mcp: "manage MCP servers", agents: "manage subagents",
        approvals: "permission mode", init: "initialize CLAUDE.md",
        review: "review changes", diff: "show diff", undo: "undo last change",
        resume: "resume a conversation",
      };
      const SLASH_ALL = Object.keys(SLASH_DESCRIPTIONS);
      const SLASH_HIDDEN = new Set(["exit", "help"]);
      const slashMenuEl = $("#slash-menu");
      const slashState = { open: false, items: [], active: 0 };
      function filterSlash(query) {
        const q = query.toLowerCase();
        const matches = SLASH_ALL.filter((c) => !SLASH_HIDDEN.has(c) && c.toLowerCase().includes(q));
        return matches.sort((a, b) => SLASH_ALL.indexOf(a) - SLASH_ALL.indexOf(b));
      }
      function renderSlashMenu() {
        slashMenuEl.replaceChildren();
        slashState.items.forEach((cmd, i) => {
          const row = el("div", "slash-item" + (i === slashState.active ? " active" : ""));
          row.appendChild(el("span", "slash-item__name", "/" + cmd));
          if (SLASH_DESCRIPTIONS[cmd]) row.appendChild(el("span", "slash-item__desc", SLASH_DESCRIPTIONS[cmd]));
          row.addEventListener("mousedown", (e) => { e.preventDefault(); pickSlash(cmd); });
          row.addEventListener("mouseenter", () => { if (slashState.active !== i) { slashState.active = i; renderSlashMenu(); } });
          if (i === slashState.active) requestAnimationFrame(() => row.scrollIntoView({ block: "nearest" }));
          slashMenuEl.appendChild(row);
        });
      }
      function closeSlashMenu() {
        slashState.open = false;
        slashState.items = [];
        slashState.active = 0;
        slashMenuEl.hidden = true;
      }
      function updateSlashMenu() {
        const v = chatInput.value;
        if (!/^\/\S*$/.test(v)) return closeSlashMenu();
        const items = filterSlash(v.slice(1));
        if (!items.length) return closeSlashMenu();
        slashState.items = items;
        if (slashState.active >= items.length) slashState.active = 0;
        slashState.open = true;
        slashMenuEl.hidden = false;
        renderSlashMenu();
      }
      function pickSlash(cmd) {
        chatInput.value = "/" + cmd + " ";
        closeSlashMenu();
        autogrow();
        chatInput.focus();
        chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
      }
      function slashKeydown(ev) {
        if (!slashState.open) return false;
        const n = slashState.items.length;
        if (ev.key === "ArrowDown") { ev.preventDefault(); slashState.active = (slashState.active + 1) % n; renderSlashMenu(); return true; }
        if (ev.key === "ArrowUp") { ev.preventDefault(); slashState.active = (slashState.active - 1 + n) % n; renderSlashMenu(); return true; }
        if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pickSlash(slashState.items[slashState.active]); return true; }
        if (ev.key === "Escape") { ev.preventDefault(); closeSlashMenu(); return true; }
        return false;
      }
      chatInput.addEventListener("input", updateSlashMenu);
      chatInput.addEventListener("blur", () => closeSlashMenu());
      // ---- end slash-command autocomplete --------------------------------

      // ---- "@" file-mention autocomplete (composer) ------------------------
      // Same popover contract as the slash menu, different trigger: the token
      // ENDING at the caret matches /@([\w./-]*)$/ — so an "@" works mid-message
      // (the slash menu is start-anchored). Items come from the OPEN agent's
      // cwd via GET /api/agents/:name/files, debounced ~150ms per keystroke;
      // `seq` orphans stale responses so a slow fetch can never repaint over a
      // newer one. Picking replaces the "@query" span (including the "@") with
      // the relative path + a space.
      const mentionMenuEl = $("#mention-menu");
      const mentionState = { open: false, items: [], active: 0, start: -1, seq: 0 };
      let mentionTimer = null;
      function closeMentionMenu() {
        mentionState.open = false;
        mentionState.items = [];
        mentionState.active = 0;
        mentionState.start = -1;
        mentionState.seq += 1; // any in-flight fetch is now stale
        clearTimeout(mentionTimer);
        mentionMenuEl.hidden = true;
      }
      function renderMentionMenu() {
        mentionMenuEl.replaceChildren();
        mentionState.items.forEach((f, i) => {
          const row = el("div", "slash-item" + (i === mentionState.active ? " active" : ""));
          row.appendChild(el("span", "slash-item__icon", f.dir ? "📁" : "📄"));
          row.appendChild(el("span", "slash-item__name", f.path));
          row.addEventListener("mousedown", (e) => { e.preventDefault(); pickMention(f); });
          row.addEventListener("mouseenter", () => { if (mentionState.active !== i) { mentionState.active = i; renderMentionMenu(); } });
          if (i === mentionState.active) requestAnimationFrame(() => row.scrollIntoView({ block: "nearest" }));
          mentionMenuEl.appendChild(row);
        });
      }
      function updateMentionMenu() {
        if (slashState.open) return closeMentionMenu(); // one popover at a time
        const name = screenState.name;
        if (!name) return closeMentionMenu();
        const before = chatInput.value.slice(0, chatInput.selectionStart);
        const m = /@([\w./-]*)$/.exec(before);
        if (!m) return closeMentionMenu();
        mentionState.start = m.index;
        clearTimeout(mentionTimer);
        const seq = ++mentionState.seq;
        mentionTimer = setTimeout(async () => {
          try {
            const res = await fetch(
              `/api/agents/${encodeURIComponent(name)}/files?q=${encodeURIComponent(m[1])}&limit=50`,
            );
            const data = await res.json();
            if (seq !== mentionState.seq) return; // a newer keystroke owns the menu
            if (!res.ok || !data.ok || !data.files.length) return closeMentionMenu();
            mentionState.items = data.files;
            if (mentionState.active >= data.files.length) mentionState.active = 0;
            mentionState.open = true;
            mentionMenuEl.hidden = false;
            renderMentionMenu();
          } catch {
            if (seq === mentionState.seq) closeMentionMenu();
          }
        }, 150);
      }
      function pickMention(f) {
        // Re-derive the "@query" span at pick time: the user may have typed
        // between the fetch and the click, and the stored start could be stale.
        const caret = chatInput.selectionStart;
        const m = /@([\w./-]*)$/.exec(chatInput.value.slice(0, caret));
        const start = m ? m.index : mentionState.start;
        if (start < 0) return closeMentionMenu();
        const insert = f.path + " ";
        chatInput.value = chatInput.value.slice(0, start) + insert + chatInput.value.slice(caret);
        closeMentionMenu();
        autogrow();
        chatInput.focus();
        const pos = start + insert.length;
        chatInput.setSelectionRange(pos, pos);
      }
      function mentionKeydown(ev) {
        if (!mentionState.open) return false;
        const n = mentionState.items.length;
        if (ev.key === "ArrowDown") { ev.preventDefault(); mentionState.active = (mentionState.active + 1) % n; renderMentionMenu(); return true; }
        if (ev.key === "ArrowUp") { ev.preventDefault(); mentionState.active = (mentionState.active - 1 + n) % n; renderMentionMenu(); return true; }
        if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pickMention(mentionState.items[mentionState.active]); return true; }
        if (ev.key === "Escape") { ev.preventDefault(); closeMentionMenu(); return true; }
        return false;
      }
      chatInput.addEventListener("input", updateMentionMenu);
      chatInput.addEventListener("click", updateMentionMenu); // caret moved by mouse
      chatInput.addEventListener("blur", () => closeMentionMenu());
      // ---- end "@" file-mention autocomplete -------------------------------

      // Shell-style history of the operator's own sends (↑ recalls, ↓ steps back).
      const sentHistory = [];
      let histIdx = -1; // -1 = not navigating
      const loadHist = (i) => {
        histIdx = i;
        chatInput.value = i < 0 ? "" : sentHistory[i];
        autogrow();
        chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
      };
      const pushSent = (text) => {
        sentHistory.push(text);
        if (sentHistory.length > 30) sentHistory.shift();
        histIdx = -1;
      };
      chatInput.addEventListener("keydown", (ev) => {
        // The slash menu, when open, owns Enter/Tab/arrows/Esc — before the rest.
        if (slashKeydown(ev)) return;
        if (mentionKeydown(ev)) return;
        // Enter sends; Shift+Enter is a newline.
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          $("#chat-composer").requestSubmit();
          return;
        }
        // Escape interrupts the agent mid-turn (only when it's actually working).
        if (ev.key === "Escape") {
          const a = screenState.name ? state.agents.get(screenState.name) : null;
          if (a && a.activity === "working") {
            ev.preventDefault();
            sendScreenInput(screenState.name, "\x1b");
          }
          return;
        }
        if (ev.key === "ArrowUp" && sentHistory.length && (histIdx >= 0 || (chatInput.value === "" || chatInput.selectionStart === 0))) {
          ev.preventDefault();
          loadHist(histIdx < 0 ? sentHistory.length - 1 : Math.max(0, histIdx - 1));
        } else if (ev.key === "ArrowDown" && histIdx >= 0) {
          ev.preventDefault();
          loadHist(histIdx + 1 >= sentHistory.length ? -1 : histIdx + 1);
        } else if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") {
          histIdx = -1; // any other key exits history mode
        }
      });
      $("#chat-composer").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const name = screenState.name;
        if (uploading > 0) return; // attachments still in flight (send is disabled too)
        // Expand each [📎 name] token to the uploaded file's absolute path —
        // this is what actually reaches the agent (and the echo/history).
        let raw = chatInput.value;
        for (const [tok, p] of attachments) raw = raw.split(tok).join(p);
        const text = raw.trim();
        if (!name || text === "") return;
        // A slash command drives the CLI's own interactive UI (the autocomplete
        // menu, the model picker, /clear…) — and that UI lives on the terminal
        // SCREEN, which the chat casca (a mirror of the JSONL log) cannot show.
        // So a "/…" is sent and we FLIP to the terminal, where its menu is: the
        // command actually does something you can see and finish, instead of
        // vanishing into a view that will never render it.
        const isSlash = text.startsWith("/");
        chatInput.disabled = true;
        // Echo the message into the chat AT ONCE — the agent may be mid-turn and
        // won't log it (so won't mirror it back) until it finishes, and a chat
        // where your own message vanishes for 30s reads as broken. The optimistic
        // bubble is reconciled away when the real one arrives from the log.
        if (!isSlash) echoUserMessage(text);
        pushSent(text);
        try {
          await sendChatMessage(name, text);
          chatInput.value = "";
          attachments.clear();
          autogrow();
          if (isSlash) {
            toast("Slash commands run in the terminal — switched you there.");
            setScreenMode("terminal");
          }
        } catch (err) {
          toast(`Could not send: ${err && err.message ? err.message : err}`, "warn");
        } finally {
          chatInput.disabled = false;
          if (!isSlash) chatInput.focus();
        }
      });
      // STOP button: interrupt the current turn with one ESC to the agent's pane.
      $("#chat-stop").addEventListener("click", () => {
        if (screenState.name) sendScreenInput(screenState.name, "\x1b");
      });

      // ---- Dictation mic (Chrome's built-in speech recognition) ------------
      // Zero backend: SpeechRecognition is the browser's own service (needs
      // mic permission + network). Interim results land AT THE CARET, replacing
      // the same span as they refine — the reference app's live-dictation feel.
      // The button hides entirely where the API doesn't exist.
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const micBtn = $("#chat-mic");
      if (!SR) {
        micBtn.hidden = true;
      } else {
        let rec = null;
        let recBase = { before: "", after: "" };
        const micCleanup = () => {
          rec = null;
          micBtn.classList.remove("rec");
          micBtn.textContent = "🎤";
        };
        micBtn.addEventListener("click", () => {
          if (rec) {
            rec.stop(); // onend does the cleanup
            return;
          }
          rec = new SR();
          rec.lang = "pt-BR";
          rec.continuous = true;
          rec.interimResults = true;
          const pos = chatInput.selectionStart ?? chatInput.value.length;
          recBase = { before: chatInput.value.slice(0, pos), after: chatInput.value.slice(pos) };
          micBtn.classList.add("rec");
          micBtn.textContent = "⏺";
          rec.onresult = (e) => {
            let text = "";
            for (const r of e.results) text += r[0].transcript;
            chatInput.value = recBase.before + text + recBase.after;
            const caret = (recBase.before + text).length;
            chatInput.setSelectionRange(caret, caret);
            autogrow();
          };
          rec.onerror = (e) => {
            const why =
              e.error === "not-allowed"
                ? "microphone permission denied"
                : e.error === "no-speech"
                  ? "no speech heard"
                  : e.error === "network"
                    ? "speech service unreachable"
                    : e.error;
            toast(`Dictation: ${why}.`, "warn");
          };
          rec.onend = micCleanup; // fires after stop(), errors, or silence
          try {
            rec.start();
            chatInput.focus();
          } catch (err) {
            toast(`Dictation could not start: ${err && err.message ? err.message : err}`, "warn");
            micCleanup();
          }
        });
      }
      // ---- end dictation ---------------------------------------------------

      // Groups panel wiring.
      $("#groups-open").addEventListener("click", () => {
        if ($("#groups-box").hidden) openGroups();
        else closeGroups();
      });
      $("#groups-close").addEventListener("click", closeGroups);
      // Backdrop closes, the card does not — same contract as the launcher.
      $("#groups-box").addEventListener("click", (ev) => {
        if (ev.target === $("#groups-box")) closeGroups();
      });
      $("#groups-create").addEventListener("click", () => {
        const input = $("#groups-new");
        const name = sanitizeAgentNameInput(input.value, false);
        if (name === "") {
          toast("Name the group first — lowercase letters, digits and hyphens.", "warn");
          return;
        }
        if (panelGroups().includes(name)) {
          toast(`The group "${name}" already exists.`, "warn");
          return;
        }
        // The hub learns a group from the agents in it, so a new one is only a
        // box on screen until you move somebody into it.
        draftGroups.add(name);
        input.value = "";
        renderGroupsPanel();
        toast(`Group "${name}" is ready — move an agent into it to make it real.`);
      });
      bindAgentNameSanitizer($("#groups-new"));
      $("#groups-new").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          $("#groups-create").click();
        }
      });

      // Dir picker wiring (the launcher form's "Browse…" panel).
      $("#dirpicker-browse").addEventListener("click", browseForFolder);
      $("#dirpicker-close").addEventListener("click", dirpickerClose);
      $("#dirpicker-select").addEventListener("click", () => {
        if (dirpickerState.path) $("#launch-dir").value = dirpickerState.path;
        dirpickerClose();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key !== "Escape") return;
        // NOT the screen: Escape belongs to the agent while you are typing at
        // it (it is how you interrupt Claude Code), so it must reach the pane
        // rather than close the view. The ✕ and the card do that.
        if (!$("#dirpicker").hidden) dirpickerClose();
        else if (!$("#preview-box").hidden) closePreview();
        else if (!$("#launcher-box").hidden) closeLauncher();
        else if (!$("#groups-box").hidden) closeGroups();
      });

      // Bootstrap snapshot (agents + messages + health) BEFORE the live stream,
      // so the SSE only ever adds to a populated view (PRD Phase 6 behavior).
      try {
        await Promise.all([loadHealth(), loadAgents(), loadMessages()]);
      } catch (err) {
        toast("Failed to load the Hub's initial state.", "error");
      }
      renderAgents();
      renderFilterBar();
      renderFeed();

      connectSse();

      // Local uptime ticker (1s) resynced by the periodic /api/health poll.
      setInterval(renderUptime, 1000);
      setInterval(loadHealth, 15000);

      // Claude /usage bars: poll every 60s and on window focus (the reference's
      // cadence). Pace recolours as the window elapses.
      refreshUsage();
      setInterval(refreshUsage, 60000);
      window.addEventListener("focus", refreshUsage);
    }

    // WAIT for the DOM. This script sits in the middle of the body, so markup
    // below it does not exist yet when it runs — boot() wires listeners onto
    // ~50 elements and the first null threw, leaving the dashboard stuck on
    // "connecting" with a live hub and four agents behind it. Nothing errored
    // visibly; it just never started.
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>

            <label class="launcher-toggle"
              title="Resume the folder's previous conversation (claude -c / codex resume --last). Falls back to a fresh session when there is nothing to resume.">
              <input type="checkbox" id="launch-continue" checked />
              continue conversation
            </label>
            <button class="launch-btn" id="launch-btn" type="submit">launch</button>
          </div>
        </form>
    </div>
  </div>
</body>
</html>
