      $("#tab-messages").classList.toggle("active", screenState.name === null);
    }

    function closeTab(name) {
      const i = openTabs.indexOf(name);
      if (i !== -1) openTabs.splice(i, 1);
      // Closing the tab you are looking at lands you on its neighbour, the way
      // a browser does — not on a blank panel.
      if (screenState.name === name) {
        const next = openTabs[i] || openTabs[i - 1];
        if (next) openScreen(next);
        else closeScreen();
      } else {
        renderTabs();
      }
    }

    function openScreen(name) {
      if (screenState.name === name) return;
      closeScreen({ keepTabs: true });
      screenState.name = name;
      if (!openTabs.includes(name)) openTabs.push(name);

      // The whole Messages panel steps aside, header and filter bar included.
      // Leaving "MESSAGES" labelling an agent's terminal was a lie.
      $("#feed").hidden = true;
      $(".feed-head").hidden = true;
      $("#filter-bar").hidden = true;
      $("#screen").hidden = false;
      $("#screen-name").textContent = displayOf(name);
      $("#screen-name").title = name; // the kebab id stays one hover away

      // Default to the CHAT casca. The mode is remembered across agents so
      // switching tabs keeps you in the view you chose.
      setScreenMode(screenState.mode || "chat");

      renderAgents(); // the rail marks which agent is on screen
      renderTabs();
    }

    /**
     * Switches the panel between the clean chat and the raw terminal, tearing
     * down whichever it is leaving so only the active view holds a stream.
     */
    function setScreenMode(mode) {
      const name = screenState.name;
      if (!name) return;
      screenState.mode = mode;
      for (const b of document.querySelectorAll(".screen-mode")) {
        b.classList.toggle("active", b.dataset.mode === mode);
      }
      if (mode === "terminal") {
        teardownChat();
        $("#screen-chat").hidden = true;
        $("#chat-composer").hidden = true;
        $("#screen-term").hidden = false;
        mountTerminal(name);
      } else {
        teardownTerminal();
        $("#screen-term").hidden = true;
        $("#screen-chat").hidden = false;
        $("#chat-composer").hidden = false;
        mountChat(name);
        updateChatTyping();
        updateStopButton();
      }
      renderScreenStatus(); // show the footer pills in chat, hide in terminal
    }

    /**
     * Sends a chat message to the agent by typing it into its pane — the same
     * send-keys path the terminal uses, so the pane guard applies (you can only
     * message a live agent pane). Text first, then Enter as a SEPARATE keystroke
     * after a beat: Claude Code's TUI takes text+Enter in one write as typing
     * without submitting (pitfall P1), exactly like the nudge.
     */
    async function sendChatMessage(name, text) {
      const bytesOf = (s) => {
        const b64 = btoa(unescape(encodeURIComponent(s)));
        return fetch(`/api/agents/${encodeURIComponent(name)}/terminal/input`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ b64 }),
        });
      };
      const res = await bytesOf(text);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      await new Promise((r) => setTimeout(r, 400));
      await bytesOf("\r"); // the separate Enter that submits
    }

    function mountTerminal(name) {
      setScreenHint("live — type here to drive it", false);
      const term = new Terminal({
        convertEol: false,
        cursorBlink: true,
        // The pane has NO scrollback of its own — Claude Code runs in the
        // alternate screen (tmux reports history_size 0), and the conversation
        // you page through lives in Claude Code's own buffer, which redraws the
        // screen when you scroll it. So xterm must NOT keep a scrollback and
        // must NOT eat PageUp/PageDown to scroll one: those keys belong to the
        // agent, exactly as in a real terminal window. Verified: PageUp
        // (1b 5b 35 7e) sent as raw bytes scrolls Claude Code's history.
        scrollback: 0,
        fontFamily: getComputedStyle(document.body).getPropertyValue("--mono").trim(),
        fontSize: SCREEN_FONT_PX,
        theme: {
          background: "#070b10",
          foreground: "#e6edf3",
          cursor: "#f5a623",
          selectionBackground: "rgba(245,166,35,0.3)",
        },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open($("#screen-term"));
      // fit() APPLIES the container size to the local xterm right here (the
      // working reference does exactly this on open) — the terminal is the
      // right size immediately, no round-trip. pushScreenSize then tells the
      // server to match the tmux window to it.
      fit.fit();
      screenState.term = term;
      screenState.fit = fit;

      // Keystrokes → the pane. xterm hands us exactly the bytes a real terminal
      // would send (Escape is "\x1b", Ctrl-C is "\x03"), so they go over as
      // base64 and reach tmux as those same bytes.
      term.onData((data) => sendScreenInput(name, data));

      // Panel resizes → refit locally, then tell the server. ResizeObserver
      // instead of window "resize": the panel changes when the rail toggles,
      // not only when the window does.
      const ro = new ResizeObserver(() => scheduleScreenFit());
      ro.observe($("#screen-term"));
      screenState.ro = ro;
      pushScreenSize();

      const sse = new EventSource(`/api/agents/${encodeURIComponent(name)}/terminal`);
      sse.onmessage = (ev) => {
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (parsed.error) {
          setScreenHint(parsed.error, true);
          return;
        }
        // The grid the server settled on. Match the local emulator to it — the
        // server DICTATES the window size to fit our panel (see pushScreenSize),
        // so this is the size we asked for, echoed back. Native font, no
        // scaling: the terminal is exactly as crisp as a real one.
        if (typeof parsed.cols === "number") {
          if (term.cols !== parsed.cols || term.rows !== parsed.rows) {
            term.resize(parsed.cols, parsed.rows);
          }
          setScreenHint("live — type here to drive it", false);
          return;
        }
        // atob → bytes → xterm. The stream is raw terminal output, so it is
        // fed as bytes; letting the browser decode it as text would mangle
        // every escape sequence and any UTF-8 split across two chunks.
        const bin = atob(parsed.b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
      };
      sse.onerror = () => setScreenHint("reconnecting…", true);
      screenState.sse = sse;
      term.focus();
    }

    function teardownTerminal() {
      if (screenState.sse) screenState.sse.close();
      if (screenState.ro) screenState.ro.disconnect();
      if (screenState.term) screenState.term.dispose();
      screenState.sse = screenState.ro = screenState.term = screenState.fit = null;
      $("#screen-term").textContent = "";
    }

    // ---- the chat casca: renders the agent's conversation log ----------
    function mountChat(name) {
      setScreenHint("reading the conversation log", false);
      screenState.model = null; // re-derived from this agent's own log
      const view = $("#screen-chat");
      view.textContent = "";
      view.appendChild(el("div", "chat-empty", "Loading the conversation…"));
      const items = [];
      const sse = new EventSource(`/api/agents/${encodeURIComponent(name)}/conversation`);
      sse.onmessage = (ev) => {
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (parsed.error) {
          setScreenHint(parsed.error, true);
          view.textContent = "";
          view.appendChild(el("div", "chat-empty", parsed.error));
          return;
        }
        if (parsed.initial) {
          items.length = 0; // a fresh full dump replaces all
          const stale = view.querySelector(".chat-thread");
          if (stale) stale.remove(); // rebuild, don't stack onto old turns
        }
        const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 120;
        for (const it of parsed.items || []) {
          items.push(it);
          if (it.kind === "assistant" && it.model) screenState.model = it.model; // track current model
        }
        renderChat(view, items);
        setScreenHint(`${items.length} messages`, false);
        renderScreenStatus(); // the model pill follows the latest assistant turn
        if (atBottom) view.scrollTop = view.scrollHeight;
      };
      sse.onerror = () => setScreenHint("reconnecting…", true);
      screenState.chatSse = sse;
    }

    function teardownChat() {
      if (screenState.chatSse) screenState.chatSse.close();
      screenState.chatSse = null;
      $("#screen-chat").textContent = "";
      closeInlineFile(); // the file belonged to THIS chat; the next view starts clean
    }

    /**
     * Leaves the screen and shows Messages. keepTabs is for switching BETWEEN
     * agents: the views are torn down and rebuilt, but the tab strip is not the
     * view — closing tabs on every switch would be a different feature.
     */
    function closeScreen(opts) {
      teardownTerminal();
      teardownChat();
      const had = screenState.name;
      screenState.name = null;
      $("#screen").hidden = true;
      // Mid-switch: openScreen is about to show the next agent, so leaving
      // Messages visible for that instant would just flash the transcript.
      if (opts && opts.keepTabs) return;
      $("#feed").hidden = false;
      $(".feed-head").hidden = false;
      $("#filter-bar").hidden = false;
      renderFilterBar(); // it owns its own visibility
      if (had) renderAgents();
      renderTabs();
    }

    function setScreenHint(text, bad) {
      const hint = $("#screen-hint");
      hint.textContent = text;
      hint.classList.toggle("stale", !!bad);
    }

    // Native font, fixed. The dashboard tells the server what grid its panel
    // wants and the server sizes the tmux window to match, so the terminal
    // renders at its true size — no scaling, no soft text. This is what the
    // earlier "mirror and scale" approach failed to be.
    const SCREEN_FONT_PX = 13; // matches the working reference (claudinei)

    let fitTimer = null;
    function scheduleScreenFit() {
      // Debounced: a drag fires ResizeObserver dozens of times, and each fit is
      // a tmux resize-window on the other end.
      clearTimeout(fitTimer);
      fitTimer = setTimeout(pushScreenSize, 120);
    }

    /**
     * fit() the local terminal to its container, then tell the server to size
     * the tmux window to whatever grid that produced. This is the working
     * reference's sendResize, verbatim in spirit: the local xterm is the size
     * authority, the pty follows. No proposeDimensions round-trip.
     */
    async function pushScreenSize() {
      const { name, term, fit } = screenState;
      if (!name || !term || !fit) return;
      fit.fit();
      if (!term.cols || !term.rows) return;
      try {
        await fetch(`/api/agents/${encodeURIComponent(name)}/terminal/resize`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ cols: term.cols, rows: term.rows }),
        });
      } catch {
        /* the size is cosmetic; a failed resize must not break the stream */
      }
    }

    async function sendScreenInput(name, data) {
      // btoa needs latin1; the string xterm gives us is already byte-per-char
      // for control codes, and unescape(encodeURIComponent(..)) turns anything
      // typed (accents included) into its UTF-8 bytes first.
      const b64 = btoa(unescape(encodeURIComponent(data)));
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/terminal/input`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ b64 }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          // The pane guard refusing is the loudest case: it means this pane is
          // a shell, and typing into it would run commands.
          setScreenHint(body.error || `Could not send input (HTTP ${res.status}).`, true);
        }
      } catch (err) {
        setScreenHint(`Could not send input: ${err && err.message ? err.message : err}`, true);
      }
    }

    // =====================================================================
    // Chat rendering. The conversation log turned into readable turns: user
    // and assistant bubbles, and tool calls as collapsible chips.
    // =====================================================================

    /**
     * Incremental: the conversation SSE only ever APPENDS items (each pump
     * forwards the newly-parsed lines and never mutates an earlier one), so the
     * thread is grown by appending the tail rather than rebuilt from scratch —
     * no re-parsing every markdown block on each nudge, and the scroll/selection
     * survive. A shrink (a fresh `initial` dump replacing everything) rebuilds.
     */
    function renderChat(view, items) {
      let thread = view.querySelector(".chat-thread");
      if (items.length === 0) {
        view.textContent = "";
        view.appendChild(el("div", "chat-empty", "No conversation yet."));
        return;
      }
      if (!thread) {
        view.textContent = "";
        thread = el("div", "chat-thread");
        thread.__count = 0;
        view.appendChild(thread);
      }
      // Item count is tracked as a property, NOT childElementCount: action
      // grouping wraps N chips into 1 node, so the DOM child count and the item
      // count diverge.
      let start = thread.__count || 0;
      if (start > items.length) {
        thread.textContent = ""; // items replaced wholesale — rebuild
        start = 0;
      }
      const name = screenState.name;
      for (let i = start; i < items.length; i++) {
        const it = items[i];
        const node =
          it.kind === "tool"
            ? buildToolChip(it)
            : it.kind === "thinking"
              ? buildThinkingBlock(it)
              : buildChatTurn(it, name);
        thread.appendChild(node);
      }
      thread.__count = items.length;
      groupActions(thread);
      markEditableUserTurns(thread);
      markForwardableTurns(thread);
      reconcilePending(view);
    }

    /**
     * Folds runs of ≥3 consecutive tool cards into one collapsible group, like
     * the reference transcript ("🧰 5 actions · Bash ×2 · Read"). Only CLOSED
     * runs group — a run at the very end is the still-growing tail and stays
     * open so the operator watches the live action. Idempotent: already-grouped
     * chips (dataset.grouped) are skipped, so it re-runs cheaply each render.
     */
    function groupActions(thread) {
      const runs = [];
      let run = [];
      const flush = (closed) => {
        if (run.length >= 3 && closed) runs.push(run);
        run = [];
      };
      for (const node of [...thread.children]) {
        if (node.classList.contains("chat-tool") && !node.dataset.grouped) {
          run.push(node);
        } else if (!node.classList.contains("chat-tool-group")) {
          flush(true); // a non-action node closes the run
        }
      }
      flush(false); // trailing run = growing tail, leave it live
      for (const r of runs) wrapActionRun(thread, r);
    }

    function wrapActionRun(thread, run) {
      const group = el("div", "chat-tool-group");
      const head = el("div", "chat-tool-group-head");
      head.append(
        el("span", "chat-tool-caret", "▸"),
        el("span", "chat-tool-icon", "🧰"),
        el("span", "chat-tool-name", `${run.length} actions`),
        el("span", "chat-tool-summary", groupSummary(run)),
      );
      const body = el("div", "chat-tool-group-body");
      thread.insertBefore(group, run[0]);
      for (const node of run) {
        node.dataset.grouped = "1";
        body.appendChild(node);
      }
      group.append(head, body);
      head.addEventListener("click", () => group.classList.toggle("open"));
    }

    /** "Bash ×2 · Read · Edit" — tool names in first-seen order, up to 4. */
    function groupSummary(run) {
      const counts = new Map();
      for (const node of run) {
        let name = node.querySelector(".chat-tool-name")?.textContent || "tool";
        if (name.startsWith("mcp__")) name = name.split("__").pop();
        counts.set(name, (counts.get(name) || 0) + 1);
      }
      const parts = [...counts.entries()].slice(0, 4).map(([n, c]) => (c > 1 ? `${n} ×${c}` : n));
      if (counts.size > 4) parts.push("…");
      return parts.join(" · ");
    }

    /**
     * Optimistic echo: the operator's just-sent message, shown immediately in a
     * separate pending lane (kept OUT of .chat-thread so the thread's
     * append-by-index stays intact). Reconciled away by reconcilePending once
     * the agent logs it and the real bubble arrives.
     */
    function echoUserMessage(text) {
      const view = $("#screen-chat");
      // If the view still shows the empty/loading placeholder, start a thread so
      // the echo has somewhere consistent to live beneath.
      let pend = view.querySelector(".chat-pending");
      if (!pend) {
        pend = el("div", "chat-pending");
        view.appendChild(pend);
      }
      const turn = buildChatTurn({ kind: "user", text, ts: new Date().toISOString() }, screenState.name);
      turn.classList.add("pending");
      turn.dataset.echo = text.trim();
      const meta = turn.querySelector(".chat-meta");
      if (meta) meta.appendChild(el("span", "chat-sending", "sending…"));
      pend.appendChild(turn);
      view.scrollTop = view.scrollHeight;
    }

    /**
     * The "agent is working" indicator at the foot of the chat — three bouncing
     * dots while the open agent is mid-turn (activity === "working"), so you can
     * see it is chewing on your message instead of wondering if it landed.
     */
    function updateChatTyping() {
      const view = $("#screen-chat");
      if (!view) return;
      const off = () => view.querySelector(".chat-typing")?.remove();
      if (screenState.name === null || screenState.mode !== "chat") return off();
      const agent = state.agents.get(screenState.name);
      const working = !!(agent && agent.activity === "working");
      const ind = view.querySelector(".chat-typing");
      if (working && !ind) {
        const box = el("div", "chat-typing");
        const dots = el("div", "chat-typing-dots");
        dots.append(el("span"), el("span"), el("span"));
        box.append(el("div", "chat-avatar", initialsOf(screenState.name)), dots);
        const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 120;
        view.appendChild(box);
        if (atBottom) view.scrollTop = view.scrollHeight;
      } else if (!working && ind) {
        ind.remove();
      }
    }

    // Sibling of updateChatTyping(): the composer STOP button is visible iff an
    // agent is open, we're in chat mode, and that agent is mid-turn (working).
    function updateStopButton() {
      const btn = $("#chat-stop");
      if (!btn) return;
      const agent = screenState.name ? state.agents.get(screenState.name) : null;
      const working = !!(agent && agent.activity === "working");
      btn.classList.toggle("visible", working && screenState.name !== null && screenState.mode === "chat");
    }

    // The CLI's permission/plan mode and whether a /goal is running — read from
    // the footer by the hub, shown as pills UNDER the composer (terminal-style).
    // Colours: bypass = red (least safe), plan = violet, accept-edits = teal,
    // manual = amber; a running goal is blue with its age.
    const PERM_LABEL = { bypass: "bypass perms", acceptEdits: "accept edits", plan: "plan mode", default: "manual" };
    const PERM_COLOR = { bypass: "var(--danger)", acceptEdits: "#4fd6c9", plan: "#a98bff", default: "var(--warn)" };
    const GOAL_COLOR = "#4a9eff";
    // --- Engine pairing (Claude + Codex on the same logical agent) ---------
    // A codex sibling is "<base>-codex" in the SAME cwd: two tmux sessions, two
    // network identities, one logical agent. Pairing is by name convention.
    function engineBaseOf(name) {
      return name.endsWith("-codex") ? name.slice(0, -6) : name;
    }
    function enginePairOf(name) {
      const base = engineBaseOf(name);
      const claude = state.agents.get(base);
      const codex = state.agents.get(base + "-codex");
      return claude && codex ? { base, claude, codex } : null;
    }
    /** Engine tabs in the screen head — shown only when the pair exists. */
    function renderEngineTabs() {
      const box = $("#engine-tabs");
      if (!box) return;
      const pair = screenState.name ? enginePairOf(screenState.name) : null;
      box.textContent = "";
      if (!pair) {
        box.hidden = true;
        return;
      }
      for (const [label, agent] of [["Claude", pair.claude], ["Codex", pair.codex]]) {
        const btn = el("button", `screen-mode${screenState.name === agent.name ? " active" : ""}`, label);
        btn.type = "button";
        btn.title = `${label} engine of ${pair.base} (${agent.status}${agent.activity ? " · " + agent.activity : ""})`;
        btn.addEventListener("click", () => {
          if (screenState.name !== agent.name) openScreen(agent.name);
        });
        box.appendChild(btn);
      }
      box.hidden = false;
    }

    /** Launches the codex sibling of a claude agent: same cwd, same group. */
    async function openCodexSibling(agent, trigger) {
      const name = `${agent.name}-codex`;
      if (trigger) {
        trigger.disabled = true;
        trigger.textContent = "launching…";
      }
      try {
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            dir: agent.cwd,
            name,
            role: `Codex engine of ${agent.name}`,
            agentType: "codex",
            group: groupOf(agent),
            continue: false,
          }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          toast(`Could not launch codex: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        toast(`Codex opening on ${agent.name} — it appears in the rail when ready.`);
      } catch (err) {
        toast(`Could not launch codex: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // A short model label from a JSONL model id: "claude-opus-4-8" -> "opus-4-8".
    function shortModel(id) {
      if (!id) return null;
      return id.replace(/^claude-/, "").replace(/-\d{8}$/, "");
    }
    function renderScreenStatus() {
      const box = $("#chat-statusbar");
      if (!box) return;
      const agent = screenState.name === null ? null : state.agents.get(screenState.name);
      if (!agent || screenState.mode !== "chat") {
        box.hidden = true;
        return;
      }
      let inner = box.querySelector(".chat-statusbar-inner");
      if (!inner) {
        inner = el("div", "chat-statusbar-inner");
        box.appendChild(inner);
      }
      inner.textContent = "";
      const model = shortModel(screenState.model);
      if (model) {
        const m = el("span", "status-pill", model);
        m.style.setProperty("--pill-color", "var(--text-dim)");
        m.title = `Model: ${screenState.model}`;
        inner.appendChild(m);
      }
      if (agent.permission) {
        const pill = el("span", "status-pill", PERM_LABEL[agent.permission] || agent.permission);
        pill.style.setProperty("--pill-color", PERM_COLOR[agent.permission] || "var(--text-dim)");
        pill.title = `Permission mode: ${PERM_LABEL[agent.permission] || agent.permission} — change it in the Terminal with Shift+Tab`;
        inner.appendChild(pill);
      }
      if (agent.goalActive) {
        const g = el("span", "status-pill goal", `◎ goal${agent.goalFor ? " · " + agent.goalFor : ""}`);
        g.style.setProperty("--pill-color", GOAL_COLOR);
        g.title = `A /goal is active${agent.goalFor ? ` (running for ${agent.goalFor})` : ""}`;
        inner.appendChild(g);
      }
      box.hidden = inner.childElementCount === 0;
    }

    /** Drops any pending echo whose text now appears as a real user bubble. */
    function reconcilePending(view) {
      const pend = view.querySelector(".chat-pending");
      if (!pend || !pend.children.length) return;
      const thread = view.querySelector(".chat-thread");
      if (!thread) return;
      const realTexts = new Set(
        [...thread.querySelectorAll(".chat-turn.user .chat-bubble")].map((b) => b.textContent.trim()),
      );
      for (const node of [...pend.children]) {
        if (realTexts.has(node.dataset.echo)) node.remove();
      }
    }

    /** Two-letter identity mark for an agent — "ai-panorama" -> "AP". */
    function initialsOf(name) {
      if (!name) return "AI";
      const parts = name.split(/[^a-zA-Z0-9]+/).filter(Boolean);
      const s = parts.length >= 2 ? parts[0][0] + parts[1][0] : name.slice(0, 2);
      return s.toUpperCase();
    }

    function buildChatTurn(it, agentName) {
      const isUser = it.kind === "user";
      // An interrupt marker is a centred divider, not a bubble — the text came
      // from the CLI, not the operator (reference app's isInterruptMarker).
      if (isUser && /^\s*\[Request interrupted/i.test(it.text || "")) {
        const label = /for tool use/i.test(it.text)
          ? "Interrupted — tool use declined"
          : "Interrupted by the operator";
        const div = el("div", "chat-interrupt");
        div.append(el("span", "chat-interrupt-mark", "■"), el("span", null, label));
        return div;
      }
      // A provider API error the CLI injected as an assistant turn: a WARNING
      // callout, not a normal reply.
      if (!isUser && /^\s*API Error:/i.test(it.text || "")) {
        const box = el("div", "chat-apierror");
        box.append(
          el("div", "chat-apierror-eyebrow", "⚠ engine API error"),
          el("div", "chat-apierror-msg", it.text.replace(/^\s*API Error:\s*/i, "")),
          el("div", "chat-apierror-hint", "Provider-side failure — the reply above may be incomplete. Usually temporary; the agent can retry."),
        );
        return box;
      }
      const turn = el("div", `chat-turn ${it.kind}`);
      const shown = agentName ? displayOf(agentName) : "agent";
      const avatar = el("div", `chat-avatar${isUser ? " you" : ""}`, isUser ? "you" : initialsOf(shown));
      const body = el("div", "chat-turn-body");
      const meta = el("div", "chat-meta");
      meta.appendChild(el("span", "chat-role", isUser ? "you" : shown));
      if (it.ts) {
        const t = el("span", "chat-time", fmtTime(it.ts));
        t.title = fmtFull(it.ts);
        meta.appendChild(t);
      }
      const bubble = el("div", "chat-bubble");
      renderMarkdownInto(bubble, it.text);
      body.append(meta, bubble);
      turn.append(avatar, body);
      // Stash the raw text (a JS property, not dataset — it carries newlines) so
      // markEditableUserTurns can refill the composer from it.
      turn.__text = it.text;
      return turn;
    }

    // The pencil glyph, via createElementNS to match agentLogo (never innerHTML).
    function editPencilSvg() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: "13", height: "13", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) svg.setAttribute(k, v);
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", "M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z");
      svg.appendChild(p);
      return svg;
    }
    // Read-only mirror: "editing" a sent message = loading it back into the
    // composer to change and resend. Dispatching 'input' runs autogrow.
    function loadIntoComposer(text) {
      const input = $("#chat-input");
      if (!input) return;
      input.disabled = false;
      input.value = text;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    // After each render, only the LAST 5 user turns carry an edit pencil.
    function markEditableUserTurns(threadEl) {
      if (!threadEl) return;
      for (const b of threadEl.querySelectorAll(".chat-edit-btn")) b.remove();
      const turns = threadEl.querySelectorAll(".chat-turn.user");
      for (let i = Math.max(0, turns.length - 5); i < turns.length; i++) {
        const turn = turns[i];
        if (typeof turn.__text !== "string") continue;
        const btn = el("button", "chat-edit-btn");
        btn.type = "button";
        btn.title = "Edit — load this message into the composer";
        btn.appendChild(editPencilSvg());
        btn.addEventListener("click", (e) => { e.stopPropagation(); loadIntoComposer(turn.__text); });
        turn.appendChild(btn);
      }
    }

    // The forward arrow glyph (corner-up-right), via createElementNS to match
    // editPencilSvg / agentLogo — never innerHTML.
    function fwdArrowSvg() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: "13", height: "13", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) svg.setAttribute(k, v);
      const poly = document.createElementNS(ns, "polyline");
      poly.setAttribute("points", "15 14 20 9 15 4");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M4 20v-7a4 4 0 0 1 4-4h12");
      svg.append(poly, path);
      return svg;
    }

    /** One forward popover open at a time; outside click / Esc close. */
    function closeFwdMenus() {
      document.querySelectorAll(".fwd-menu").forEach((m) => {
        m.hidden = true;
        const btn = m.previousElementSibling;
        if (btn) btn.setAttribute("aria-expanded", "false");
      });
    }
    document.addEventListener("click", closeFwdMenus);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeFwdMenus();
    });

    // The target list is rebuilt on every OPEN, not at render time: who is
    // online changes while the transcript sits still.
    function fillFwdMenu(menu, text) {
      menu.textContent = "";
      menu.appendChild(el("div", "fwd-menu-label", "forward to"));
      const targets = [...state.agents.values()].filter(
        (a) => a.status === "online" && a.name !== screenState.name,
      );
      if (targets.length === 0) {
        menu.appendChild(el("div", "fwd-menu-empty", "no other agent online"));
        return;
      }
      for (const a of targets) {
        const item = el("button", "fwd-menu-item", a.name);
        item.type = "button";
        item.title = `Type this message into ${a.name}'s pane (with a "forwarded from" prefix)`;
        item.addEventListener("click", (ev) => {
          ev.stopPropagation();
          closeFwdMenus();
          forwardChatText(a.name, text);
        });
        menu.appendChild(item);
      }
    }

    // Optimistic: the toast fires as the send starts; a failure follows up.
    function forwardChatText(target, text) {
      const prefixed = `[forwarded from ${screenState.name}] ${text}`;
      toast(`Forwarded to "${target}".`);
      sendChatMessage(target, prefixed).catch((err) => {
        toast(`Forward to "${target}" failed: ${err && err.message ? err.message : err}`, "warn");
      });
    }

    // After each render, the LAST 8 turns — user AND assistant — carry a
    // forward arrow. Same remove-and-recreate pass as markEditableUserTurns.
    function markForwardableTurns(threadEl) {
      if (!threadEl) return;
      for (const w of threadEl.querySelectorAll(".chat-fwd-wrap")) w.remove();
      const turns = threadEl.querySelectorAll(".chat-turn.user, .chat-turn.assistant");
      for (let i = Math.max(0, turns.length - 8); i < turns.length; i++) {
        const turn = turns[i];
        if (typeof turn.__text !== "string") continue;
        const wrap = el("div", "chat-fwd-wrap");
        const btn = el("button", "chat-fwd-btn");
        btn.type = "button";
        btn.title = "Forward — send this message to another agent";
        btn.setAttribute("aria-expanded", "false");
        btn.appendChild(fwdArrowSvg());
        const menu = el("div", "fwd-menu");
        menu.hidden = true;
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const wasHidden = menu.hidden;
          closeMenus(); // the card kebab menus
          closeFwdMenus(); // any other forward popover
          if (!wasHidden) return; // this one was open — the closes above shut it
          fillFwdMenu(menu, turn.__text);
          menu.hidden = false;
          btn.setAttribute("aria-expanded", "true");
          // The casca scrolls: flip the menu up when the space below is short.
          menu.classList.remove("up");
          const view = $("#screen-chat");
          if (view) {
            const spaceBelow = view.getBoundingClientRect().bottom - btn.getBoundingClientRect().bottom;
            if (menu.getBoundingClientRect().height + 10 > spaceBelow) menu.classList.add("up");
          }
        });
        wrap.append(btn, menu);
        turn.appendChild(wrap);
      }
    }

    // A glyph per tool, like the reference app's transcript — so the eye reads
    // the KIND of action before the name.
    const TOOL_ICON = {
      Bash: "💻", Read: "📖", Edit: "✏️", Write: "📝", MultiEdit: "✏️",
      NotebookEdit: "✏️", Grep: "🔍", Glob: "🔍", WebFetch: "🌐",
      WebSearch: "🌐", Task: "🤖", TodoWrite: "📋",
    };
    function toolIcon(name) {
      return TOOL_ICON[name] || (name && name.startsWith("mcp__") ? "🔌" : "🔧");
    }

    // The agent's reasoning — a collapsible block, dim and set aside, like the
    // reference transcript's Thinking section. Collapsed by default.
    function buildThinkingBlock(it) {
      const box = el("div", "chat-thinking");
      const head = el("div", "chat-thinking-head");
      head.append(el("span", "chat-tool-caret", "▸"), el("span", "chat-thinking-label", "💭 thinking"));
      const body = el("div", "chat-thinking-body");
      renderMarkdownInto(body, it.text);
      box.append(head, body);
      head.addEventListener("click", () => box.classList.toggle("open"));
      return box;
    }

    function buildToolChip(it) {
      const chip = el("div", `chat-tool${it.isError ? " error" : ""}`);
      const head = el("div", "chat-tool-head");
      head.append(
        el("span", "chat-tool-caret", "▸"),
        el("span", "chat-tool-icon", toolIcon(it.name)),
        el("span", "chat-tool-name", it.name),
        el("span", "chat-tool-summary", it.summary.replace(new RegExp("^" + it.name + ":?\\s*"), "")),
      );
      if (it.isError) head.appendChild(el("span", "chat-tool-name", "· error"));
      const body = el("div", "chat-tool-body");
      // The call's input (command / file / pattern) …
      const inputText = toolInputText(it);
      if (inputText) body.appendChild(buildToolPre(it.name, inputText, it.name));
      // … then its result, diff-coloured for edits.
      if (it.result) body.appendChild(buildToolPre(null, it.result, it.name));
      chip.append(head, body);
      head.addEventListener("click", () => chip.classList.toggle("open"));
      return chip;
    }

    // A small copy button that lifts `text` to the clipboard, with a brief tick.
    function copyButton(text) {
      const btn = el("button", "copy-btn", "copy");
      btn.type = "button";
      btn.title = "Copy to clipboard";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(text).then(
          () => {
            btn.textContent = "copied";
            setTimeout(() => (btn.textContent = "copy"), 1200);
          },
          () => {
            btn.textContent = "failed";
            setTimeout(() => (btn.textContent = "copy"), 1200);
          },
        );
      });
      return btn;
    }

    function toolInputText(it) {
      const i = it.input || {};
      if (typeof i.command === "string") return i.command;
      if (typeof i.pattern === "string") return i.pattern;
      // Edit: show the before→after; Write: the content.
      if (typeof i.old_string === "string" || typeof i.new_string === "string") {
        return `- ${i.old_string || ""}\n+ ${i.new_string || ""}`;
      }
      if (typeof i.content === "string") return i.content;
      if (typeof i.file_path === "string") return i.file_path;
      return "";
    }

    // A <pre> for a tool's input/result, wrapped with a hover copy button.
    // `diffFor` set → colour +/- lines like a diff.
    function buildToolPre(label, text, diffFor) {
      const wrap = el("div", "chat-tool-pre");
      const pre = el("pre");
      const isDiff = diffFor === "Edit" || diffFor === "Write" || diffFor === "MultiEdit" || /^[-+] /m.test(text);
      if (isDiff) {
        for (const line of text.split("\n")) {
          const span = el(
            "span",
            line.startsWith("+") ? "diff-add" : line.startsWith("-") ? "diff-del" : null,
            line + "\n",
          );
          pre.appendChild(span);
        }
      } else {
        pre.textContent = text.length > 8000 ? text.slice(0, 8000) + "\n… (truncated)" : text;
      }
      wrap.append(pre, copyButton(text));
      return wrap;
    }

    /**
     * Real markdown via `marked` — tables, lists, code, the lot, like the
     * reference app (it uses react-markdown+remark-gfm; this is the vanilla
     * equivalent). marked emits an HTML string, so it is parsed into a detached
     * document, SANITIZED (drop script/style and every on-handler and
     * javascript: URL — the content is the operator's own agent on localhost,
     * but this costs nothing), then adopted. Finally file paths in the text
     * nodes become clickable preview links.
     */
    function renderMarkdownInto(container, text) {
      let html;
      try {
        html = window.marked.parse(text, { gfm: true, breaks: true });
      } catch {
        container.appendChild(document.createTextNode(text)); // never break on bad input
        return;
      }
      const doc = new DOMParser().parseFromString(html, "text/html");
      sanitizeNode(doc.body);
      linkifyPaths(doc.body);
      while (doc.body.firstChild) container.appendChild(doc.body.firstChild);
      // Syntax colours for fenced code, once it is in the live document.
      if (window.hljs) {
        for (const block of container.querySelectorAll("pre code")) {
          try {
            window.hljs.highlightElement(block);
          } catch {
            /* highlighting is cosmetic — never let it break the message */
          }
        }
      }
      // A hover copy button on every fenced code block (like the reference app).
      for (const pre of container.querySelectorAll("pre")) {
        if (pre.closest(".code-wrap")) continue;
        const code = pre.querySelector("code");
        const wrap = el("div", "code-wrap");
        pre.replaceWith(wrap);
        wrap.append(pre, copyButton((code ? code.textContent : pre.textContent) || ""));
      }
    }

    // Removes anything that could execute; keeps the structure marked built.
    function sanitizeNode(root) {
      for (const el2 of [...root.querySelectorAll("script, style, iframe, object, embed")]) {
        el2.remove();
      }
      for (const el2 of root.querySelectorAll("*")) {
        for (const attr of [...el2.attributes]) {
          const n = attr.name.toLowerCase();
          if (n.startsWith("on") || (/^(href|src)$/.test(n) && /^\s*javascript:/i.test(attr.value))) {
            el2.removeAttribute(attr.name);
          }
        }
      }
    }

    // Walks the rendered markdown's TEXT nodes and turns file paths into
    // clickable preview links (skipping code, where a path is not a link).
    function linkifyPaths(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement.closest("code, pre, a")) continue;
        FILE_PATH_RE.lastIndex = 0; // global regex: reset before each test
        if (FILE_PATH_RE.test(node.nodeValue)) targets.push(node);
      }
      for (const textNode of targets) {
        const frag = document.createDocumentFragment();
        appendTextWithPaths(frag, textNode.nodeValue);
        textNode.replaceWith(frag);
      }
    }

    // Plain text, but file paths become clickable preview links (same detection
    // as the transcript).
    function appendTextWithPaths(container, text) {
      FILE_PATH_RE.lastIndex = 0;
      let last = 0;
      for (const match of text.matchAll(FILE_PATH_RE)) {
        const p = match[0];
        if (match.index > last) container.appendChild(document.createTextNode(text.slice(last, match.index)));
        const link = el("span", "path-link", p);
        link.title = `Preview ${p}`;
        // Chat links open the inline DOCK (read the file while chatting); the
        // Messages feed's links keep the lightbox.
        link.addEventListener("click", (ev) => { ev.stopPropagation(); openInlineFile(p); });
        container.appendChild(link);
        last = match.index + p.length;
      }
      if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
    }

    // =====================================================================
    // File preview. A path an agent named becomes a link; clicking it fetches
    // the file (scoped server-side) and shows it in a lightbox.
    // =====================================================================

    async function openPreview(filePath) {
      $("#preview-box").hidden = false;
      $("#preview-name").textContent = filePath.split("/").pop() || filePath;
      $("#preview-path").textContent = "";
      const body = $("#preview-body");
      body.textContent = "";
      body.appendChild(el("div", "preview-status", "Loading…"));
      try {
        const res = await fetch(`/api/files/preview?path=${encodeURIComponent(filePath)}`);
        const data = await res.json();
        body.textContent = "";
        if (!data.ok) {
          body.appendChild(el("div", "preview-status stale", data.error || `HTTP ${res.status}`));
          return;
        }
        $("#preview-name").textContent = data.name;
        $("#preview-path").textContent = `${data.path} · ${fmtBytes(data.size)}`;
        renderPreview(body, data);
      } catch (err) {
        body.textContent = "";
        body.appendChild(
          el("div", "preview-status stale", `Could not load: ${err && err.message ? err.message : err}`),
        );
      }
    }

    function renderPreview(body, data) {
      if (data.kind === "image") {
        const img = el("img", "preview-image");
        img.src = data.content; // a data: URL from the hub; loads nothing off-machine
        img.alt = data.name;
        body.appendChild(img);
        return;
      }
      if (data.kind === "pdf" || data.kind === "binary" || data.content === null) {
        body.appendChild(
          el(
            "div",
            "preview-status",
            data.kind === "pdf"
              ? "PDF — open it in your editor to view."
              : "Binary file — nothing to show as text.",
          ),
        );
        return;
      }
      // text / markdown / code: monospace, as-is. No markdown rendering and no
      // syntax highlighting — that would be a dependency; the raw file is the
      // honest preview and 90% of the value.
      const pre = el("pre", "preview-text");
      pre.textContent = data.content; // textContent: server data never touches innerHTML
      body.appendChild(pre);
    }

    function closePreview() {
      $("#preview-box").hidden = true;
      $("#preview-body").textContent = "";
    }

    function fmtBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(1)} MB`;
    }

    // =====================================================================
    // Inline file dock. A path clicked in the CHAT opens here, docked between
    // the transcript and the composer — read the file, keep typing. Height is
    // a WINDOW FRACTION persisted in localStorage, so the size you like
    // survives reloads. The lightbox stays for the Messages feed.
    // =====================================================================

    const INLINE_FRAC_KEY = "sb.inlineFileFrac";
    const INLINE_FRAC_DEFAULT = 0.42;
    const clampInlineFrac = (f) => Math.min(0.8, Math.max(0.15, f));

    function inlineFileFrac() {
      try {
        const v = Number(localStorage.getItem(INLINE_FRAC_KEY));
        if (Number.isFinite(v) && v > 0) return clampInlineFrac(v);
      } catch { /* storage unavailable: just use the default */ }
      return INLINE_FRAC_DEFAULT;
    }

    function applyInlineFrac(f) {
      $("#inline-file").style.maxHeight = `${(f * 100).toFixed(1)}vh`;
    }

    async function openInlineFile(filePath) {
      // The dock only makes sense over an open chat; anywhere else, fall back
      // to the lightbox.
      if (screenState.name === null || screenState.mode !== "chat") {
        openPreview(filePath);
        return;
      }
      $("#inline-file").hidden = false;
      applyInlineFrac(inlineFileFrac());
      $("#inline-file-name").textContent = filePath.split("/").pop() || filePath;
      $("#inline-file-path").textContent = filePath;
      const body = $("#inline-file-body");
      body.textContent = "";
      body.appendChild(el("div", "preview-status", "Loading…"));
      try {
        const res = await fetch(`/api/files/preview?path=${encodeURIComponent(filePath)}`);
        const data = await res.json();
        body.textContent = "";
        if (!data.ok) {
          body.appendChild(el("div", "preview-status stale", data.error || `HTTP ${res.status}`));
          return;
        }
        $("#inline-file-name").textContent = data.name;
        $("#inline-file-path").textContent = `${data.path} · ${fmtBytes(data.size)}`;
        renderPreview(body, data); // the lightbox's renderer: text/image/pdf/binary
      } catch (err) {
        body.textContent = "";
        body.appendChild(
          el("div", "preview-status stale", `Could not load: ${err && err.message ? err.message : err}`),
        );
      }
    }

    function closeInlineFile() {
      const dock = $("#inline-file");
      if (dock.hidden) return;
      dock.hidden = true;
      $("#inline-file-body").textContent = ""; // a data: URL image can be MBs — drop it
    }

    // Drag the dock's top border: up = taller, down = shorter. Pointer capture
    // keeps the drag alive outside the 8px strip; double-click resets.
    function wireInlineFileResize() {
      const handle = $("#inline-file-resizer");
      let drag = null; // { startY, startF, frac }
      const persist = (f) => {
        try { localStorage.setItem(INLINE_FRAC_KEY, f.toFixed(3)); } catch { /* not persisted */ }
      };
      handle.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        const f = inlineFileFrac();
        drag = { startY: ev.clientY, startF: f, frac: f };
        handle.setPointerCapture(ev.pointerId);
        document.body.style.cursor = "row-resize";
        document.body.style.userSelect = "none";
      });
      handle.addEventListener("pointermove", (ev) => {
        if (!drag) return;
        // Moving UP (smaller clientY) = taller panel.
        drag.frac = clampInlineFrac(drag.startF + (drag.startY - ev.clientY) / window.innerHeight);
        applyInlineFrac(drag.frac);
      });
      const endDrag = () => {
        if (!drag) return;
        persist(drag.frac);
        drag = null;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      };
      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
      handle.addEventListener("dblclick", () => {
        persist(INLINE_FRAC_DEFAULT);
        applyInlineFrac(INLINE_FRAC_DEFAULT);
      });
    }

    async function moveAgentToGroup(name, group) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/group`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ group }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Could not move the agent: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // agent_updated arrives over SSE too; applying it here keeps the
        // clicking tab snappy.
        mergeAgent(body.agent);
        draftGroups.delete(group); // it has a member now, so the hub knows it
        renderAgents();
        renderFeed(); // the transcript is filtered by group — the card just moved
        if (!$("#groups-box").hidden) renderGroupsPanel();
        toast(`"${name}" is now in the ${group} group.`);
      } catch (err) {
        toast(`Could not move the agent: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    async function removeAgent(name) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}`, {
          method: "DELETE",
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Remove failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // The SSE agent_removed event also arrives; removing locally keeps the
        // UI snappy for the click's own tab.
        dropAgent(name);
        toast(`Agent "${name}" removed from the registry (messages kept).`);
      } catch (err) {
        toast(`Remove failed: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    function dropAgent(name) {
      // state.agents is a Map (name -> agent), not an array.
      if (!state.agents.delete(name)) return;
      if (state.filter === name) state.filter = null;
      renderAgents();
      renderFeed();
    }

    // Group broadcast records (same broadcastId) into one visual row; single
    // messages stay one row. state.messages is newest-first (the API's order,
    // and unshift keeps it), but a transcript reads like a conversation —
    // oldest at the top, the newest at the bottom where you are looking — so
    // it is walked backwards here. Day dividers are inserted on the way.
    function feedRows() {
      const filter = state.filter;
      const q = (state.search || "").trim().toLowerCase();
      const hits = (m) =>
        !q ||
        (m.body || "").toLowerCase().includes(q) ||
        (m.from || "").toLowerCase().includes(q) ||
        (m.to || "").toLowerCase().includes(q);
      const seen = new Set();
      const rows = [];
      let day = null;

      for (let i = state.messages.length - 1; i >= 0; i--) {
        const m = state.messages[i];
        if (state.group && messageGroup(m) !== state.group) continue;
        let row;
        if (m.broadcastId) {
          if (seen.has(m.broadcastId)) continue;
          seen.add(m.broadcastId);
          const group = state.messages.filter((x) => x.broadcastId === m.broadcastId);
          if (filter && !group.some((x) => x.from === filter || x.to === filter)) continue;
          if (q && !group.some(hits)) continue;
          row = { kind: "broadcast", group };
        } else {
          if (filter && m.from !== filter && m.to !== filter) continue;
          if (q && !hits(m)) continue;
          row = { kind: "single", msg: m };
        }
        const stamp = startOfDay(new Date(m.createdAt));
        if (stamp !== day) {
          day = stamp;
          rows.push({ kind: "day", label: fmtDayLabel(m.createdAt) });
        }
        rows.push(row);
      }
      return rows;
    }

    // Wraps every occurrence of the query in the feed's TEXT nodes with a
    // <mark> — safe (text nodes only, no HTML), so a search shows WHERE it hit.
    function highlightHits(container, query) {
      const q = query.toLowerCase();
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement && node.parentElement.closest("mark, script, style")) continue;
        if (node.nodeValue.toLowerCase().includes(q)) targets.push(node);
      }
      for (const textNode of targets) {
        const text = textNode.nodeValue;
        const lower = text.toLowerCase();
        const frag = document.createDocumentFragment();
        let idx = 0;
        let pos;
        while ((pos = lower.indexOf(q, idx)) !== -1) {
          if (pos > idx) frag.appendChild(document.createTextNode(text.slice(idx, pos)));
          frag.appendChild(el("mark", "hit", text.slice(pos, pos + q.length)));
          idx = pos + q.length;
        }
        if (idx < text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
        textNode.parentNode.replaceChild(frag, textNode);
      }
    }

    function renderFeed() {
      const feed = $("#feed");
      // A transcript must not yank itself out from under someone reading back
      // through history: follow the newest only when they are already at the
      // bottom (or the feed is fresh and has no scroll yet).
      const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;

      feed.textContent = "";
      const rows = feedRows();
      if (rows.length === 0) {
        const q = (state.search || "").trim();
        feed.appendChild(
          el(
            "div",
            "empty-hint",
            q
              ? `Nothing in the transcript matches “${q}”.`
              : state.filter
                ? `No messages involving "${state.filter}".`
                : "No messages yet. Anything your agents say to each other shows up here.",
          ),
        );
        return;
      }
      for (const row of rows) {
        if (row.kind === "day") feed.appendChild(el("div", "day-divider", row.label));
        else feed.appendChild(row.kind === "broadcast" ? buildBroadcastRow(row.group) : buildMsgRow(row.msg));
      }
      if ((state.search || "").trim()) highlightHits(feed, state.search.trim());

      clampOverflowingBodies(feed);
      if (atBottom) feed.scrollTop = feed.scrollHeight;
    }

    /**
     * Hides the tail of any body taller than the clamp, behind a "Show more".
     *
     * Bodies are built already clamped, because overflow can only be measured
     * against the clamp — then the ones that FIT have it taken back off. They
     * must: the clamp carries a fade mask, and a mask on a body that never
     * overflowed just dims its last line for no reason (a two-line message
     * came out looking struck through).
     *
     * One read pass over the finished feed, one write pass after it —
     * interleaving them would force a reflow per bubble.
     */
    function clampOverflowingBodies(feed) {
      const bodies = feed.querySelectorAll(".msg-body");
      const overflowing = [];
      const fitting = [];
      for (const body of bodies) {
        // reads only
        (body.scrollHeight > body.clientHeight + 4 ? overflowing : fitting).push(body);
      }
      for (const body of fitting) body.classList.remove("clamped");
      for (const body of overflowing) {
        const more = el("button", "msg-more", "Show more");
        more.type = "button";
        more.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const collapsed = body.classList.toggle("clamped");
          more.textContent = collapsed ? "Show more" : "Show less";
        });
        body.after(more);
      }
    }

    /** "alpha to beta" — a sentence, not a diagram. */
    function buildMetaLine(from, to, opts) {
      const meta = el("div", "msg-meta");
      const showFrom = from === "operator" ? "operator" : displayOf(from);
      const showTo = to === "everyone" ? "everyone" : displayOf(to);
      const fromEl = el("span", `msg-from${from === "operator" ? " operator" : ""}`, showFrom);
      fromEl.title = from;
      const toEl = el("span", `msg-to${to === "everyone" ? " all" : ""}`, showTo);
      toEl.title = to;
      meta.append(fromEl, el("span", "msg-rel", "to"), toEl);
      if (opts && opts.extra) meta.appendChild(opts.extra);
      return meta;
    }

    function buildAvatar(name) {
      const av = el("div", "msg-avatar", monogram(name === "operator" ? name : displayOf(name)));
      av.style.background = name === "operator" ? "var(--accent)" : agentHue(name);
      av.title = name === "operator" ? name : displayOf(name);
      return av;
    }

    function buildFoot(createdAt, flag) {
      const foot = el("div", "msg-foot");
      const time = el("span", "msg-time", fmtTime(createdAt));
      time.title = fmtFull(createdAt);
      foot.append(time, flag);
      return foot;
    }

    // Absolute-ish file paths agents name in messages: "/home/..", "~/..", with
    // an extension. Kept conservative (needs a dir separator and an extension)
    // so ordinary prose is not littered with false links. The scope check on
    // the server is the real gate; this only decides what looks clickable.
    const FILE_PATH_RE = /(?:~|\/)[\w.\-+@]+(?:\/[\w.\-+@ ]+)*\.[A-Za-z0-9]{1,8}/g;

    /**
     * Builds the message body as text nodes with clickable spans for any file
     * path. Stays XSS-safe like the rest of this file: createElement + text
     * nodes, never innerHTML — the path text goes in via textContent.
     */
    function buildBodyWithPaths(body) {
      const el2 = el("div", "msg-body clamped");
      let last = 0;
      for (const match of body.matchAll(FILE_PATH_RE)) {
        const p = match[0];
        if (match.index > last) el2.appendChild(document.createTextNode(body.slice(last, match.index)));
        const link = el("span", "path-link", p);
        link.title = `Preview ${p}`;
        link.addEventListener("click", (ev) => {
          ev.stopPropagation(); // the card click toggles the feed filter
          openPreview(p);
        });
        el2.appendChild(link);
        last = match.index + p.length;
      }
      if (last < body.length) el2.appendChild(document.createTextNode(body.slice(last)));
      return el2;
    }

    function buildBubble(from, to, body, createdAt, flag, extra) {
      const bubble = el("div", "msg-bubble");
      bubble.appendChild(buildMetaLine(from, to, { extra }));
      bubble.appendChild(buildBodyWithPaths(body));
      bubble.appendChild(buildFoot(createdAt, flag));
      return bubble;
    }

    function buildMsgRow(m) {
      const row = el("div", "msg-row");
      row.classList.add(m.readAt ? "read" : "unread");
      if (m.from === "operator") row.classList.add("from-operator");
      const flag = m.readAt
        ? Object.assign(el("span", "msg-read-flag read", "✓ read"), { title: fmtFull(m.readAt) })
        : el("span", "msg-read-flag pending", "• unread");
      row.appendChild(buildAvatar(m.from));
      row.appendChild(buildBubble(m.from, m.to, m.body, m.createdAt, flag));
      return row;
    }

    function buildBroadcastRow(group) {
      // All records of a broadcast share from + body; each has its own to/readAt.
      const first = group[0];
      const row = el("div", "msg-row broadcast");
      if (first.from === "operator") row.classList.add("from-operator");
      const readCount = group.filter((x) => x.readAt).length;
      const flag = el(
        "span",
        `msg-read-flag ${readCount === group.length ? "read" : "pending"}`,
        `read by ${readCount} of ${group.length}`,
      );
      flag.title = group.map((x) => `${x.to}: ${x.readAt ? "read" : "unread"}`).join(" · ");
      const extra = el("span", "msg-rel", `(${group.length} agents)`);
      row.appendChild(buildAvatar(first.from));
      row.appendChild(buildBubble(first.from, "everyone", first.body, first.createdAt, flag, extra));
      return row;
    }

    /** The datalist behind the launcher's group field: the rooms you have. */
    function renderGroupOptions() {
      const list = $("#group-options");
      list.textContent = "";
      for (const group of allGroups()) {
        const opt = el("option");
        opt.value = group;
        list.appendChild(opt);
      }
    }

    function renderFilterBar() {
      const bar = $("#filter-bar");
      if (state.filter) {
        bar.classList.add("active");
        $("#filter-target").textContent = state.filter;
      } else {
        bar.classList.remove("active");
        $("#filter-target").textContent = "";
      }
    }

    function setFilter(name) {
      state.filter = state.filter === name ? null : name;
      renderFilterBar();
      renderFeed();
      // Re-render cards so the .active highlight follows the filter.
      for (const card of document.querySelectorAll(".agent-card")) {
        card.classList.toggle("active", card.dataset.name === state.filter);
      }
    }

    // =====================================================================
    // SSE handling
    // =====================================================================

    // Long-session hygiene: the server caps GET /api/messages at limit=200, but
    // the live stream unshifts forever. Bound the in-memory window so a
    // long-lived tab on a busy hub doesn't grow unbounded and feedRows() (O(n)
    // per broadcast) doesn't slow down with session length.
    const MAX_MESSAGES = 1000;

    function onMessageCreated(m) {
      if (state.msgIds.has(m.id)) return; // dedup vs bootstrap / our own POST
      state.msgIds.add(m.id);
      state.messages.unshift(m);
      if (state.messages.length > MAX_MESSAGES) {
        const dropped = state.messages.splice(MAX_MESSAGES);
        for (const d of dropped) state.msgIds.delete(d.id);
      }
      const recipient = state.agents.get(m.to);
      if (recipient) {
        recipient.unreadCount = (recipient.unreadCount || 0) + 1;
        renderAgents();
      }
      renderFeed();
    }

    // A read can reference a message outside our loaded window (older than the
    // bootstrap limit, or created during a disconnect gap): the per-message
    // delta can't apply, so pull the authoritative unreadCount from /api/agents
    // instead of letting the recipient's badge drift upward. Guarded so a burst
    // of such reads can't stampede the endpoint.
    let agentsRefetchInFlight = false;
    function refetchAgentsAuthoritative() {
      if (agentsRefetchInFlight) return;
      agentsRefetchInFlight = true;
      loadAgents()
        .then(() => {
          renderAgents();
        })
        .catch(() => {
          /* non-fatal: nudge_sent resync and the next reconnect reconcile too */
        })
        .finally(() => {
          agentsRefetchInFlight = false;
        });
    }

    function onMessageRead({ messageId, readAt }) {
      const m = state.messages.find((x) => x.id === messageId);
      if (!m) {
        refetchAgentsAuthoritative();
        return;
      }
      if (!m.readAt) {
        m.readAt = readAt;
        const recipient = state.agents.get(m.to);
        if (recipient) {
          recipient.unreadCount = Math.max(0, (recipient.unreadCount || 0) - 1);
          renderAgents();
        }
      }
      renderFeed();
    }

    function pulseNudge(name) {
      const btn = document.querySelector(`.nudge-btn[data-nudge-for="${CSS.escape(name)}"]`);
      if (!btn) return;
      btn.classList.remove("nudging");
      void btn.offsetWidth; // reflow to restart the animation
      btn.classList.add("nudging");
    }

    function onNudgeSent({ agent, at, unread }) {
      const a = state.agents.get(agent);
      if (a) {
        a.lastNudgeAt = at;
        // nudge_sent carries the authoritative unread at nudge time — resync.
        if (typeof unread === "number") a.unreadCount = unread;
        renderAgents();
      }
      pulseNudge(agent);
    }

    function handleSse(event) {
      switch (event.type) {
        case "agent_updated":
          mergeAgent(event.payload);
          renderAgents();
          break;
        case "message_created":
          onMessageCreated(event.payload);
          break;
        case "message_read":
          onMessageRead(event.payload);
          break;
        case "nudge_sent":
          onNudgeSent(event.payload);
          break;
        case "agent_removed":
          dropAgent(event.payload.name);
          break;
      }
    }

    // The stream carries NO event ids and the hub supports no Last-Event-ID
    // replay, so every event fired while we were disconnected (message_created,
    // message_read, agent_updated, nudge_sent) is lost. After ANY reconnect we
    // therefore reconcile the snapshot before trusting the stream again — this
    // mirrors the bootstrap ordering: loadMessages rebuilds state.messages +
    // msgIds and loadAgents refreshes the authoritative unreadCount, so the
    // stream once more only ever adds to a freshly reconciled view.
    let sseConnectedOnce = false;

    // The hub heartbeats every 25s, so silence past ~70s (three missed beats)
    // means the stream is dead rather than the network being quiet. EventSource
    // will not tell us: it only raises onerror when a socket visibly breaks, and
    // the way this one dies is invisible — the dashboard sits in a Windows
    // browser, the hub in WSL2, and WSL2's localhost proxy can drop the tunnel
    // (as can sleeping the laptop) with both ends still believing it is open.
    // The pill stayed green and the feed silently stopped until a reload.
    const SSE_SILENCE_LIMIT_MS = 70_000;
    let lastSseAt = 0;
    let sseWatchdog = null;

    function startSseWatchdog() {
      if (sseWatchdog) clearInterval(sseWatchdog);
      sseWatchdog = setInterval(() => {
        if (Date.now() - lastSseAt < SSE_SILENCE_LIMIT_MS) return;
        // Reopening resyncs through the onopen path, so nothing missed in the
        // gap stays missed.
        setConnState("reconnecting", "reconnecting");
        if (state.sse) state.sse.close();
        connectSse();
      }, 10_000);
    }

    function connectSse() {
      const es = new EventSource("/api/events");
      state.sse = es;
      lastSseAt = Date.now();
      startSseWatchdog();
      es.onopen = () => {
        lastSseAt = Date.now();
        if (!sseConnectedOnce) {
          // First connect: boot() already fetched the snapshot, so just go live
          // (re-fetching here would be a harmless duplicate, but we skip it).
          sseConnectedOnce = true;
          setConnState("live", "live");
          return;
        }
        // Reconnect after a gap (hub restart, laptop sleep/wake, socket drop):
        // resync before flipping the pill back to "live", so the header never
        // claims freshness over a view that silently missed events.
        Promise.all([loadAgents(), loadMessages()])
          .then(() => {
            renderAgents();
            renderFeed();
          })
          .catch(() => {
            toast("Failed to resync after reconnection.", "warn");
          })
          .finally(() => setConnState("live", "live"));
      };
      es.onmessage = (ev) => {
        lastSseAt = Date.now(); // any frame, heartbeat included, proves it lives
        let parsed;
        try {
          parsed = JSON.parse(ev.data);
        } catch {
          return; // malformed frame
        }
        if (parsed.type === "heartbeat") return; // its only job is the timestamp above
        handleSse(parsed);
      };
      // EventSource reconnects on its own; we only surface the state so the
      // operator knows the feed is stale until it recovers.
      es.onerror = () => setConnState("reconnecting", "reconnecting");
    }

    // =====================================================================
    // Actions (REST)
    // =====================================================================

    async function toggleMute(name, muted) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/mute`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ muted }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to change mute (HTTP ${res.status}).`, "error");
          return;
        }
        mergeAgent(data.agent); // agent_updated will also arrive via SSE
        renderAgents();
        toast(`${name} ${muted ? "muted" : "unmuted"}.`, "ok");
      } catch {
        toast("Network failure while changing mute.", "error");
      }
    }

    async function forceNudge(name) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/nudge`, {
          method: "POST",
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          pulseNudge(name);
          toast(`Nudge sent to ${name}.`, "ok");
          return;
        }
        // 409 (unsafe pane / dead session), 404 (unknown), 501 (no
        // dispatcher). The hub message is already friendly — show it without breaking.
        toast(data.error || `Nudge not delivered to ${name} (HTTP ${res.status}).`, "warn");
      } catch {
        toast("Network failure while nudging.", "error");
      }
    }

    // Launch an agent from the dashboard: the hub creates the tmux session
    // running claude (POST /api/agents/launch). Success is confirmed by a
    // toast; the new agent card arrives via the agent_updated SSE. The hub
    // settles the session before answering (~2.5s, ~5s with the resume
    // fallback), so the button shows a busy state meanwhile. All feedback goes
    // through toast() → textContent (server data never touches innerHTML).
    /** The Claude|Codex segmented control's value (radios — one is always on). */
    function selectedAgentType() {
      const checked = document.querySelector('#launch-agent input[name="agentType"]:checked');
      return checked && checked.value === "codex" ? "codex" : "claude";
    }

    function closeLauncher() {
      $("#launcher-box").hidden = true;
      dirpickerClose();
      for (const id of ["#launch-dir", "#launch-name", "#launch-role", "#launch-group"]) {
        $(id).value = "";
      }
    }

    async function launchAgent(ev) {
      ev.preventDefault();
      const dir = $("#launch-dir").value.trim();
      if (dir.length === 0) {
        toast("Directory is required: the absolute path the agent should work in.", "warn");
        return;
      }
      const name = $("#launch-name").value.trim();
      const role = $("#launch-role").value.trim();
      // Empty → the hub decides: it keeps the group of an agent coming back, and
      // puts a brand new one in the default group. Sending "" would be a claim.
      const group = $("#launch-group").value.trim();
      const btn = $("#launch-btn");
      const prevLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "launching…";
      try {
        // openTerminal: a launched agent should be VISIBLE — a Windows window
        // pops attached to its session (owner feedback; best-effort hub-side).
        const payload = {
          dir,
          continue: $("#launch-continue").checked,
          openTerminal: true,
          agentType: selectedAgentType(),
        };
        if (name) payload.name = name;
        if (role) payload.role = role;
        if (group) payload.group = group;
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to launch (HTTP ${res.status}).`, "error", 8000);
          return;
        }
        const agentName = data.agent && data.agent.name ? data.agent.name : name || dir;
        if (data.fallback) {
          toast(
            `No resumable conversation in ${dir} — opened a fresh session for ${agentName}.`,
            "warn",
            7000,
          );
        }
        toast(
          `Agent ${agentName} launched` +
            `${data.replaced ? " (replaced its previous session)" : ""}` +
            `${data.terminalOpened ? " — its window is opening" : ""}. ` +
            `The kickoff will instruct it to join.`,
          "ok",
        );
        closeLauncher(); // it launched; the form has nothing left to say
        // No render here: the agent card arrives via the agent_updated SSE.
      } catch {
        toast("Network failure while launching.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    // =====================================================================
    // Dir picker — the launcher form's "Browse…" panel
    // =====================================================================
    // Lists the hub machine's directories via GET /api/fs/dirs (directory
    // NAMES only) so the operator picks the working folder by click instead
    // of typing a POSIX path (Windows Explorer paths pasted into the input
    // are translated server-side either way). Every server value rendered
    // here (paths, folder names) goes through el()/textContent — never
    // innerHTML (same XSS rule as the rest of this file).

    const dirpickerState = { path: null };

    async function dirpickerLoad(targetPath) {
      const list = $("#dirpicker-list");
      list.textContent = "";
      list.appendChild(el("div", "dirpicker-hint", "loading…"));
      try {
        // No path → the hub answers with its home directory.
        const url = targetPath
          ? `/api/fs/dirs?path=${encodeURIComponent(targetPath)}`
          : "/api/fs/dirs";
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        list.textContent = "";
        if (!res.ok || !data.ok) {
          toast(data.error || `Failed to list folders (HTTP ${res.status}).`, "error");
          list.appendChild(el("div", "dirpicker-hint", "Could not open this folder."));
          return;
        }
        dirpickerState.path = data.path;
        const pathEl = $("#dirpicker-path");
        pathEl.textContent = data.path;
        pathEl.title = data.path;
        if (data.parent !== null) {
          const up = el("div", "dirpicker-entry dirpicker-up", "..");
          up.title = data.parent;
          up.addEventListener("click", () => dirpickerLoad(data.parent));
          list.appendChild(up);
        }
        for (const d of data.dirs) {
          const row = el("div", "dirpicker-entry");
          row.title = d.path;
          row.appendChild(el("span", "dirpicker-name", d.name));
          if (d.hasConversation) {
            const badge = el("span", "dirpicker-badge", "conversation");
            badge.title =
              "This folder has a previous Claude Code conversation " +
              "(resumable with “continue conversation”).";
            row.appendChild(badge);
          }
          row.addEventListener("click", () => dirpickerLoad(d.path));
          list.appendChild(row);
        }
        if (data.dirs.length === 0) {
          list.appendChild(el("div", "dirpicker-hint", "No subfolders."));
        }
        if (data.truncated) {
          list.appendChild(
            el("div", "dirpicker-hint", "Listing truncated at 500 folders."),
          );
        }
      } catch {
        list.textContent = "";
        list.appendChild(el("div", "dirpicker-hint", "Network failure while listing folders."));
        toast("Network failure while listing folders.", "error");
      }
    }

    /**
     * Browse… asks the hub to open the REAL Windows folder dialog — the one you
     * already know how to use. The page cannot open it itself: no browser gives
     * a page a folder's absolute path, so the hub opens it Windows-side and
     * reads the answer (see src/server/winpicker.ts).
     *
     * The built-in browser below is the fallback, for a machine with no Windows
     * to ask. Losing the native dialog must not cost you the ability to pick a
     * folder at all.
     */
    async function browseForFolder() {
      const btn = $("#dirpicker-browse");
      const prev = btn.textContent;
      btn.disabled = true;
      btn.textContent = "pick a folder…";
      try {
        const res = await fetch("/api/fs/pick", {
          method: "POST",
          headers: { "content-type": "application/json" },
          // Start where the form already points, so a second Browse resumes
          // where you were rather than at the top again.
          body: JSON.stringify({ startIn: $("#launch-dir").value.trim() || undefined }),
        });
        const body = await res.json();
        if (body.ok) {
          if (!body.cancelled) $("#launch-dir").value = body.path;
          return;
        }
        if (body.fallback) {
          toast(body.error, "warn");
          dirpickerOpen(); // still pick a folder, just not natively
          return;
        }
        toast(body.error || `Could not open the folder dialog (HTTP ${res.status}).`, "warn");
      } catch (err) {
        toast(`Could not open the folder dialog: ${err && err.message ? err.message : err}`, "warn");
        dirpickerOpen();
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    function dirpickerOpen() {
      $("#dirpicker").hidden = false;
      dirpickerLoad(null); // always starts at the hub's home directory
    }

    function dirpickerClose() {
      $("#dirpicker").hidden = true;
    }

    // =====================================================================
    // Bootstrap
    // =====================================================================

    async function loadHealth() {
      try {
        const res = await fetch("/api/health");
        if (!res.ok) return;
        const data = await res.json();
        const serverSeconds = data.uptime || 0;
        // The server floors uptime while the local ticker carries the sub-second
        // fraction, so re-anchoring on every poll makes the counter visibly tick
        // backward ~1s. Only re-anchor when the drift is meaningful (clock skew,
        // or a hub restart that legitimately resets uptime downward); otherwise
        // let the smooth 1s ticker keep running monotonically.
        const local = state.uptimeBase
          ? state.uptimeBase.seconds + (Date.now() - state.uptimeBase.at) / 1000
          : null;
