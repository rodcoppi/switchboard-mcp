<!DOCTYPE html>
<!-- lang=en: every string in this file is English (project convention D8), and
     a screen reader was announcing them with Portuguese pronunciation. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard</title>
  <!-- xterm.js: the ONE thing this page loads that it did not write itself, and
       the hub serves it from its own node_modules — nothing is fetched off this
       machine. It is a terminal EMULATOR, the piece you cannot hand-roll; the
       pty on the other end is tmux, not node-pty. -->
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <!-- marked: markdown for the chat casca (tables, lists, code) — the vanilla
       equivalent of the reference app's react-markdown+remark-gfm, served from
       node_modules so the page still fetches nothing off this machine. -->
  <script src="/vendor/marked/marked.umd.js"></script>
  <!-- highlight.js: syntax colours for code the agents write in the chat, also
       served from node_modules. The theme only touches .hljs elements. -->
  <link rel="stylesheet" href="/vendor/highlight/styles/atom-one-dark.min.css" />
  <script src="/vendor/highlight/highlight.min.js"></script>
  <!-- Inline favicon to avoid a /favicon.ico 404 in the hub logs. The mark is
       the "⇄" of the header and of the Windows shortcut icon (assets/switchboard.ico,
       drawn by scripts/make-icon.mjs) — same shape, same amber, one product. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230e141d'/%3E%3Cpath d='M2.6 6.2h8.1V4.3L14 7.1l-3.3 2.8V8H2.6z' fill='%23ffbf5e'/%3E%3Cpath d='M13.4 11.6H5.3v1.9L2 10.7 5.3 7.9v1.9h8.1z' fill='%23f5a623'/%3E%3C/svg%3E"
  />
  <style>
    /* =====================================================================
       SWITCHBOARD — operator's patchbay / signal console
       ---------------------------------------------------------------------
       DESIGN TOKENS live in the ONE :root block below and are a CONTRACT:
       the owner (a designer) reskins the whole console from here. The markup
       keeps stable semantic hooks (.agent-card, .msg-row, .status-dot, …)
       that the JS queries — never rename them; add/restyle freely.

       Identity: a telephone switchboard. Near-black cool slate panels, a
       single warm SIGNAL AMBER accent (telecom / CRT / brass jack), phosphor
       LEDs for presence. Mono-forward, because the subject is honest machine
       traffic. The rail is a PATCHBAY of jack rows; the feed is a TRANSCRIPT —
       chat bubbles, because that is what a human reads without being taught,
       each one naming who it was for, because these calls are directed and a
       chat room's "everyone hears everything" would be a lie here.
       ===================================================================== */
    :root {
      /* --- surfaces: cool near-black slate, raised panels, hairlines ------ */
      --bg:          #0a0e13;
      --bg-elev:     #111823;
      --bg-elev-2:   #141c28;
      --bg-inset:    #070b10;
      --bg-hover:    #172232;
      --border:      #232e3d;
      --border-soft: #1a2431;

      /* --- text: soft white -> dim -> faint ------------------------------ */
      --text:        #e6edf3;
      --text-dim:    #8b98a8;
      --text-faint:  #5a6673;

      /* --- SIGNATURE: warm signal amber (the whole identity) -------------- */
      --accent:        #f5a623;
      --accent-bright: #ffbf5e;
      --accent-fg:     #120b02;               /* text on filled amber */
      --accent-wash:   rgba(245, 166, 35, 0.13);
      --accent-line:   rgba(245, 166, 35, 0.42);

      /* --- status LEDs (glowing lamps, not flat dots) -------------------- */
      --online:      #3fb950;
      --offline:     #5a6673;
      --led-online:  0 0 0 3px rgba(63, 185, 80, 0.13), 0 0 9px 1px rgba(63, 185, 80, 0.55);
      --led-offline: 0 0 0 3px rgba(90, 102, 115, 0.10);
      --led-amber:   0 0 0 3px rgba(245, 166, 35, 0.14), 0 0 9px 1px rgba(245, 166, 35, 0.55);

      /* --- semantic roles (kept as the JS/markup expect) ---------------- */
      --unread-bg:   #f5a623;
      --unread-fg:   #120b02;
      --danger:      #e5534b;
      --warn:        #f5a623;                  /* caution == the signal amber */
      --ok:          #3fb950;

      /* --- type: mono-forward console; sans reserved for operator voice -- */
      --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", ui-monospace,
        SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;

      /* --- type scale ---------------------------------------------------- */
      --fs-eyebrow: 10px;
      --fs-xs:  11px;
      --fs-sm:  12px;
      --fs-body: 12.5px;
      --fs-md:  13px;
      --fs-name: 13.5px;
      --fs-wordmark: 15.5px;

      /* --- geometry ------------------------------------------------------ */
      --sidebar-w: 322px;
      --radius: 7px;
      --radius-sm: 5px;
      --radius-pill: 999px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 620px at 78% -10%, #0e1622 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: var(--accent); }

    /* Shared operator-panel eyebrow: uppercase mono, wide tracking. */
    .eyebrow {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    /* Keyboard focus — a single amber ring everywhere (accessibility floor). */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ------------------------------- Header ------------------------------ */
    .app-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 11px 18px;
      background: linear-gradient(180deg, var(--bg-elev-2), var(--bg-elev));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(245, 166, 35, 0.05);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
    }
    .brand-jack {
      font-size: 18px;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(245, 166, 35, 0.55);
    }
    .wordmark {
      font-family: var(--mono);
      font-weight: 700;
      font-size: var(--fs-wordmark);
      letter-spacing: 3.5px;
      color: var(--text);
    }

    .hub-status {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
      flex-wrap: wrap;
    }
    .hub-status .metric {
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-faint);
    }
    .hub-status .metric b { color: var(--text); font-weight: 600; }

    .conn-state {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 3px 11px; border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-inset);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.4px;
      color: var(--text-dim);
    }
    .conn-state .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-faint);
    }
    .conn-state[data-state="live"]        { color: var(--online); border-color: color-mix(in srgb, var(--online) 42%, transparent); }
    .conn-state[data-state="live"] .dot   { background: var(--online); box-shadow: var(--led-online); }
    .conn-state[data-state="connecting"]  { color: var(--warn); border-color: var(--accent-line); }
    .conn-state[data-state="connecting"] .dot { background: var(--warn); box-shadow: var(--led-amber); }
    .conn-state[data-state="reconnecting"]{ color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, transparent); }
    .conn-state[data-state="reconnecting"] .dot { background: var(--danger); box-shadow: 0 0 8px 1px rgba(229, 83, 75, 0.55); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    .header-spacer { flex: 1 1 auto; }

    /* Claude /usage bars in the rail's foot — the 5-hour and weekly limits,
       each a bar coloured by burn PACE (green if under the clock, red if you're
       spending faster than the window refills). Copied from the reference app,
       on this dashboard's own palette. */
    .usage-card {
      flex: 0 0 auto;
      margin: 8px 10px 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-elev);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .usage-card[hidden] { display: none; }
    .usage-card-head { display: flex; align-items: baseline; justify-content: space-between; }
    .usage-reset { font-family: var(--mono); font-size: var(--fs-eyebrow); color: var(--text-faint); }
    .usage-row { display: flex; flex-direction: column; gap: 3px; }
    .usage-row-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: var(--fs-xs);
    }
    .usage-row-label { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .usage-row-pct { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
    .usage-bar { height: 6px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; }
    .usage-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s var(--ease), background 0.3s var(--ease); }
    .usage-row-reset { font-size: var(--fs-eyebrow); color: var(--text-faint); font-family: var(--mono); }
    /* [hidden] LAST, and it must exist on every rule that sets `display`: the
       attribute is only a UA-stylesheet `display:none`, so any `display` of ours
       beats it and the element stays on screen while the JS believes it hid it.
       This has now bitten the card menus and this snippet. */
    [hidden] { display: none !important; }

    .mcp-add {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 5px 4px 11px;
      max-width: 100%;
      min-width: 0;
    }
    .mcp-add code {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44ch;
    }
    .btn {
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 11px;
      font-size: var(--fs-xs);
      white-space: nowrap;
      transition: border-color 0.12s var(--ease), background 0.12s var(--ease), color 0.12s var(--ease);
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn-copy { color: var(--accent); font-weight: 600; }

    /* ------------------------------- Layout ------------------------------ */
    .layout { flex: 1 1 auto; display: flex; min-height: 0; }

    /* ----------------------------- Sidebar (PATCHBAY) -------------------- */
    .sidebar {
      flex: 0 0 var(--sidebar-w);
      width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg), #090d12);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-head {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--border-soft);
    }
    .rail-count {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-wash);
      border: 1px solid var(--accent-line);
      border-radius: var(--radius-pill);
      padding: 1px 9px;
      min-width: 24px;
      text-align: center;
    }
    .agents { flex: 1 1 auto; overflow-y: auto; padding: 10px 10px 4px; }
    .empty-hint {
      padding: 20px 14px;
      color: var(--text-faint);
      font-family: var(--sans);
      font-size: var(--fs-sm);
      line-height: 1.6;
    }

    /* --- the JACK ROW: an agent patched into the board ------------------- */
    .agent-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "dot name badges"
        "dot role actions";
      column-gap: 11px;
      row-gap: 3px;
      align-items: center;
      padding: 11px 12px 11px 14px;
      margin-bottom: 8px;
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.14s var(--ease), background 0.14s var(--ease), transform 0.14s var(--ease);
    }
    /* the patch rail: a thin amber cable-end that lights when the row is live/active */
    .agent-card::before {
      content: "";
      position: absolute;
      left: 0; top: 9px; bottom: 9px;
      width: 2px;
      border-radius: 0 2px 2px 0;
      background: transparent;
      transition: background 0.14s var(--ease);
    }
    .agent-card:hover { background: var(--bg-hover); border-color: var(--border); }
    .agent-card:hover::before { background: var(--border); }
    /* A recoloured chat: its cable-end carries the chosen colour at all times,
       so the chat is identifiable in the rail at a glance. */
    .agent-card.tinted::before,
    .agent-card.tinted:hover::before { background: var(--chat-color); }
    .agent-card.active {
      border-color: var(--accent-line);
      background: linear-gradient(90deg, var(--accent-wash), transparent 82%), var(--bg-elev);
    }
    .agent-card.active::before { background: var(--accent); box-shadow: 0 0 8px rgba(245, 166, 35, 0.6); }
    .agent-card.offline { opacity: 0.66; }

    /* the LAMP: a glowing phosphor jack indicator, not a flat circle */
    .status-dot {
      grid-area: dot;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--offline);
      align-self: start;
      margin-top: 5px;
    }
    .status-dot.online  { background: var(--online); box-shadow: var(--led-online); }
    .status-dot.offline { background: var(--offline); box-shadow: var(--led-offline); }

    .agent-name {
      grid-area: name;
      font-family: var(--mono);
      font-weight: 600;
      font-size: var(--fs-name);
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Inline rename: the name cell itself becomes the input (same grid area,
       so the card never reflows while editing). */
    .agent-rename-input {
      grid-area: name;
      width: 100%;
      min-width: 0;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: var(--fs-name);
    }
    .agent-rename-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }

    .agent-role {
      grid-area: role;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .agent-badges {
      grid-area: badges;
      display: flex; align-items: center; gap: 7px; justify-self: end;
    }
    .agent-actions {
      grid-area: actions;
      display: flex; align-items: center; gap: 6px; justify-self: end;
    }

    .mcp-icon {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-faint);
    }
    .mcp-icon.connected {
      color: var(--accent);
      border-color: var(--accent-line);
      background: var(--accent-wash);
    }
    /* Idle vs working — the thing the operator actually watches for. Same chip
       metrics as .mcp-icon so it drops into the same badge slot. Working glows
       and breathes; idle is quiet. */
    .activity-chip {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-faint);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .activity-chip::before {
      content: "";
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor;
    }
    .activity-chip.working {
      color: var(--accent);
      border-color: var(--accent-line);
      background: var(--accent-wash);
    }
    .activity-chip.working::before { animation: pulse-work 1.15s ease-in-out infinite; }
    @keyframes pulse-work {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-line); }
      50% { opacity: 0.45; box-shadow: 0 0 6px 1px var(--accent-line); }
    }
    /* The lamp itself breathes amber while the agent is mid-turn. */
    .status-dot.working {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(245, 166, 35, 0.7);
      animation: pulse-work 1.15s ease-in-out infinite;
    }
    /* Which agent CLI the card's agent runs — same chip metrics as .mcp-icon
       so the two sit as one badge row. Deliberately NOT accent-colored: the
       accent means "connected/active", and the type is neutral information. */
    .agent-type-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: var(--bg-inset);
    }
    .unread-badge {
      min-width: 19px;
      height: 19px;
      padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--unread-bg);
      color: var(--unread-fg);
      font-family: var(--mono);
      font-size: var(--fs-xs); font-weight: 700;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 8px rgba(245, 166, 35, 0.4);
    }
    .remove-btn.confirming {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Card actions: one primary button + a compact menu. */
    .open-btn, .reopen-btn {
      border-color: var(--accent-line);
      color: var(--accent);
    }
    .open-btn:hover, .reopen-btn:hover { background: var(--accent-wash); }
    .agent-menu-wrap { position: relative; }
    .agent-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 5px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* `hidden` must beat display:flex, else every card's menu renders at once. */
    .agent-menu[hidden] { display: none; }
    .agent-menu:not([hidden]) {
      padding: 5px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      min-width: 176px;
    }
    .agent-menu-item { text-align: left; }
    /* Inside the ⋯ menu the items are clean full-width ROWS — icon + label on
       ONE line each (the boxed per-item borders wrapped "open codex…" onto two
       lines and read as noise). Hover is a quiet wash; remove is set apart. */
    .agent-menu .agent-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      white-space: nowrap;
      background: transparent;
      color: var(--text-dim);
    }
    .agent-menu .agent-menu-item:hover { background: var(--bg-hover); color: var(--text); border: none; }
    .agent-menu .agent-menu-item .mi-icon {
      flex: 0 0 auto;
      width: 16px;
      text-align: center;
      font-size: 12px;
      line-height: 1;
    }
    .agent-menu .remove-btn { margin-top: 3px; border-radius: 0 0 6px 6px; position: relative; }
    .agent-menu .remove-btn::before {
      content: "";
      position: absolute;
      top: -2px; left: 6px; right: 6px;
      height: 1px;
      background: var(--border-soft);
    }
    .agent-menu .remove-btn:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
    .mute-toggle, .nudge-btn, .open-btn, .reopen-btn, .rename-btn, .remove-btn, .menu-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      padding: 3px 9px;
      line-height: 1.3;
      transition: border-color 0.12s var(--ease), color 0.12s var(--ease), background 0.12s var(--ease);
    }
    .mute-toggle:hover, .nudge-btn:hover, .open-btn:hover, .reopen-btn:hover, .rename-btn:hover, .remove-btn:hover, .menu-btn:hover { color: var(--text); border-color: var(--accent); }
    .menu-btn { padding: 3px 7px; letter-spacing: 1px; }
    .mute-toggle.muted { color: var(--warn); border-color: var(--accent-line); }
    .remove-btn:hover { border-color: var(--danger); color: var(--danger); }
    /* A menu action that exists but is not available right now (rename on an
       online agent). Legible, not invisible: clicking it says what to do. */
    .agent-menu-item.disabled { color: var(--text-faint); opacity: 0.55; }
    .agent-menu-item.disabled:hover { color: var(--text-faint); border-color: var(--border); }

    /* NUDGE = a brief amber pulse. The nudge control lives in the (hidden)
       card menu, so :has() lifts the pulse onto the whole jack row — the
       operator sees the line light up even with the menu closed. */
    .nudge-btn.nudging { animation: pulse 0.6s ease-out; }
    .agent-card:has(.nudge-btn.nudging) {
      animation: rowpulse 0.7s ease-out;
    }
    .agent-card:has(.nudge-btn.nudging)::before {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.7);
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 var(--accent-line); border-color: var(--accent); color: var(--accent); }
      100% { box-shadow: 0 0 0 10px transparent; }
    }
    @keyframes rowpulse {
      0%   { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line); }
      100% { background: var(--bg-elev); box-shadow: none; }
    }

    /* --------------------------- Launcher form --------------------------- */
    .launcher {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg-elev), var(--bg-elev-2));
    }
    .launcher-title {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 8px;
    }
    .launcher-title::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: var(--border-soft);
    }
    .launcher-label {
      display: block;
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow); text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-faint);
    }
    .launch-input {
      width: 100%;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
      font-family: var(--mono);
      font-size: var(--fs-sm);
      transition: border-color 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .launch-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .launch-input::placeholder { color: var(--text-faint); }
    .launcher-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .launcher-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 3px;
    }
    .launcher-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      cursor: pointer;
      user-select: none;
    }
    .launcher-toggle input { accent-color: var(--accent); margin: 0; }
    /* Agent-type choice: a 2-button segmented control. Radio inputs do the
       state (keyboard + form semantics for free); the label is the visible
       segment and :checked drives its look — no JS class juggling. */
    .launcher-segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-inset);
    }
    .launcher-segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .launcher-segment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s var(--ease), color 0.12s var(--ease);
    }
    /* Vendor marks (inline SVG — the dashboard loads no external asset). They
       inherit currentColor, so a segment's dim/amber state carries the logo
       with it instead of fighting the console palette. */
    .agent-logo { width: 13px; height: 13px; flex: none; display: block; }
    .agent-type-chip .agent-logo { width: 10px; height: 10px; }
    .launcher-segment + .launcher-segment { border-left: 1px solid var(--border); }
    .launcher-segment:hover { color: var(--text-dim); }
    .launcher-segmented input:checked + .launcher-segment {
      background: var(--accent-wash);
      color: var(--accent);
    }
    .launcher-segmented input:focus-visible + .launcher-segment {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--accent-line);
    }
    .launch-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-weight: 700;
      font-size: var(--fs-sm);
      text-transform: uppercase; letter-spacing: 1.2px;
      padding: 7px 18px;
      transition: filter 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .launch-btn:hover { background: var(--accent-bright); box-shadow: 0 0 16px rgba(245, 166, 35, 0.35); }
    .launch-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

    /* ----------------------------- Dir picker ---------------------------- */
    .launcher-dir-row { display: flex; gap: 7px; }
    .launcher-dir-row .launch-input { flex: 1 1 auto; min-width: 0; }
    .dirpicker-browse { flex: 0 0 auto; font-size: var(--fs-xs); padding: 5px 11px; }
    .dirpicker {
      display: flex; flex-direction: column; gap: 6px;
      margin-top: 7px;
      padding: 9px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .dirpicker[hidden] { display: none; }
    .dirpicker-head { display: flex; align-items: center; gap: 8px; }
    .dirpicker-path {
      flex: 1 1 auto; min-width: 0;
      font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dirpicker-close {
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      padding: 2px 8px;
      line-height: 1.4;
    }
    .dirpicker-close:hover { color: var(--danger); border-color: var(--danger); }
    .dirpicker-list {
      display: flex; flex-direction: column;
      max-height: 188px; overflow-y: auto;
    }
    .dirpicker-entry {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 7px;
      border-radius: 4px;
      font-family: var(--mono); font-size: var(--fs-sm);
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .dirpicker-entry:hover { background: var(--bg-hover); }
    .dirpicker-up { color: var(--text-dim); }
    .dirpicker-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dirpicker-badge {
      flex: 0 0 auto; margin-left: auto;
      font-size: 9px; letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
      color: var(--ok);
    }
    .dirpicker-hint {
      padding: 5px 7px;
      color: var(--text-faint);
      font-family: var(--sans); font-size: var(--fs-xs);
    }
    .dirpicker-foot { display: flex; justify-content: flex-end; }
    .dirpicker-select {
      background: var(--bg-elev-2);
      color: var(--accent);
      border: 1px solid var(--accent-line);
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-size: var(--fs-xs); font-weight: 600;
      padding: 4px 12px;
    }
    .dirpicker-select:hover { background: var(--accent-wash); }

    /* ------------------------------- Main -------------------------------- */
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

    /* Messages header — the console panel label for the transcript. */
    .feed-head {
      flex: 0 0 auto;
      display: flex; align-items: baseline; gap: 12px;
      padding: 13px 18px 11px;
      border-bottom: 1px solid var(--border-soft);
    }
    .feed-search {
      margin-left: auto;
      align-self: center;
      width: 240px;
      max-width: 34vw;
      padding: 5px 11px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-sm);
    }
    .feed-search:focus { outline: none; border-color: var(--accent-line); }
    .feed-search::placeholder { color: var(--text-faint); }
    /* The group-tabs used to be pushed right by margin-auto; the search now
       holds that slot, so the tabs sit next to it. */
    .feed-head .group-tabs { margin-left: 0; }
    mark.hit { background: var(--accent-wash); color: var(--accent); border-radius: 3px; padding: 0 1px; }
    .feed-head .sub {
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }

    /* Group tabs: one room at a time. A group is a wall — agents in different
       groups cannot reach each other — so mixing their traffic in one scroll
       would show a conversation that never happened. */
    .group-tabs {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .group-tab {
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
      transition: color 0.12s var(--ease), border-color 0.12s var(--ease);
    }
    .group-tab:hover { color: var(--text); border-color: var(--accent-line); }
    .group-tab.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-wash);
    }
    .group-tab .count { color: var(--text-faint); margin-left: 5px; }

    /* Both sit at the right end of the rail's header, together: the label and
       the count on the left, the two things you DO to this list on the right. */
    .groups-open { margin-left: auto; flex: none; }
    .launcher-open { margin-left: 6px; flex: none; }

    /* --------------------------- the tab strip ---------------------------
       Messages and every open agent, side by side. */
    .tabs {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 12px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
    }
    .tab-strip { display: flex; align-items: stretch; gap: 2px; min-width: 0; overflow-x: auto; }

    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: none;
      max-width: 220px;
      padding: 9px 12px;
      background: transparent;
      border: none;
      /* The active tab is joined to the panel below it by an amber underline —
         a tab is a thing you are INSIDE, not a button you pressed. */
      border-bottom: 2px solid transparent;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.12s var(--ease), border-color 0.12s var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-mark { color: var(--accent); font-weight: 700; }
    /* The hub tab (the agents' own chat) is not an agent — give it a standing
       pill look so it reads as the fixed room, distinct from the agent tabs. */
    .tab-hub {
      margin: 5px 6px 5px 0;
      padding: 5px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-inset);
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .tab-hub.active {
      border-color: var(--accent-line);
      background: var(--accent-wash);
      border-bottom-color: var(--accent-line);
    }
    .tab-hub:hover { color: var(--text); border-color: var(--border-strong); }
    .tab .name { overflow: hidden; text-overflow: ellipsis; }
    .tab .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .tab .dot.online { background: var(--online); }
    .tab .dot.offline { background: var(--offline); }
    .tab-close {
      margin-left: 2px;
      padding: 0 3px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      border-radius: 3px;
    }
    .tab-close:hover { color: var(--danger); background: var(--bg-hover); }
    .tab-unread {
      min-width: 18px;
      padding: 1px 5px;
      text-align: center;
      border-radius: 9px;
      background: var(--unread-bg);
      color: var(--unread-fg);
      font-size: var(--fs-eyebrow);
      font-weight: 700;
    }

    /* Lightbox. One in the file, for the launcher — a form you touch once per
       project has no business owning half the rail, which is now the list of
       agents you switch between. */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 16px 16px;
      background: rgba(4, 7, 11, 0.72);
      overflow-y: auto;
      animation: lightin 0.12s var(--ease);
    }
    .lightbox[hidden] { display: none; }
    @keyframes lightin { from { opacity: 0 } to { opacity: 1 } }
    .lightbox-card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-elev);
      border: 1px solid var(--accent-line);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .lightbox-head {
      display: flex;
      align-items: center;
      padding: 12px 14px 0;
    }
    .lightbox-head .dirpicker-close { margin-left: auto; }
    .lightbox .launcher { border: none; background: none; padding: 12px 14px 14px; }
    .lightbox .launcher-title { display: none; } /* the head says it already */

    /* ------------------------- the agent's screen ------------------------
       tmux is the pty and xterm.js is the emulator, so this is the real
       terminal: colours, cursor, Ctrl-C, the lot. It exists to kill the pile
       of Windows terminal windows — the rail on the left is already the tab
       bar, so the screen simply takes over the main panel. */
    .screen {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-inset);
    }
    .screen[hidden] { display: none; }
    .screen-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }
    .screen-name {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--accent);
    }
    .screen-hint {
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .screen-hint.stale { color: var(--danger); }
    /* Session-status bar UNDER the composer, like a terminal footer: the CLI's
       permission/plan mode and a running /goal with its age. */
    .chat-statusbar {
      flex: 0 0 auto;
      padding: 0;
      background: var(--bg-elev);
      border-top: 1px solid var(--border-soft);
    }
    .chat-statusbar[hidden] { display: none; }
    /* Inner rail centred on the SAME 880px column as the messages and composer,
       so the pills line up under the chat instead of hugging the far edge. */
    .chat-statusbar-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 5px 18px 7px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      letter-spacing: 0.4px;
      color: var(--pill-color, var(--text-dim));
      border: 1px solid color-mix(in srgb, var(--pill-color, var(--border)) 45%, transparent);
      background: color-mix(in srgb, var(--pill-color, var(--bg-elev)) 12%, transparent);
    }
    .status-pill::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--pill-color, var(--text-dim));
    }
    .status-pill.goal { --pill-color: var(--accent); }
    .screen-head .btn { margin-left: auto; }
    .screen-head .dirpicker-close { margin-left: 0; }

    /* Chat|Terminal toggle. */
    .screen-modes { display: inline-flex; gap: 2px; margin-left: 14px; }
    .screen-mode {
      padding: 3px 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
    }
    .screen-mode:first-child { border-radius: 5px 0 0 5px; }
    .screen-mode:last-child { border-radius: 0 5px 5px 0; border-left: none; }
    .screen-mode:hover { color: var(--text); }
    .screen-mode.active { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }

    /* ---------------------- the chat casca (conversation) ---------------- */
    .screen-chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .screen-chat[hidden] { display: none; }
    .chat-empty { color: var(--text-faint); font-family: var(--sans); font-size: var(--fs-sm); margin: auto; }

    /* Composer: the bar spans the panel (border + background), but its CONTENT
       lines up with the centred message column above — same 880px, same centre.
       That alignment was the ask: read and write in the same column. */
    .chat-composer {
      flex: 0 0 auto;
      display: block;
      padding: 10px 18px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg-elev);
    }
    .chat-composer[hidden] { display: none; }
    .chat-composer-inner {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      position: relative; /* anchors the slash-command popover */
    }
    /* Slash-command autocomplete popover — opens ABOVE the textarea. */
    .slash-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 40;
      max-height: 264px;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .slash-menu[hidden] { display: none; }
    .slash-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .slash-item__name { flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
    .slash-item__desc {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--sans); font-size: var(--fs-sm); color: var(--text-faint);
    }
    .slash-item.active { background: var(--accent-wash); color: var(--text); }
    .slash-item.active .slash-item__name { color: var(--accent); }
    /* "@" file-mention rows reuse .slash-item; the icon is textContent (📄/📁),
       and a long path truncates instead of pushing the popover wide. */
    .slash-item__icon { flex: 0 0 auto; font-size: var(--fs-sm); line-height: 1; }
    #mention-menu .slash-item__name {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 400;
    }
    #chat-input {
      flex: 1 1 auto;
      resize: none;
      max-height: 140px;
      padding: 9px 12px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.5;
    }
    #chat-input:focus { outline: none; border-color: var(--accent-line); }
    #chat-input:disabled { opacity: 0.5; }
    /* Drop target feedback: dashed accent ring while a file is dragged over. */
    #chat-input.drag-over {
      border: 1px dashed var(--accent);
      background: var(--accent-wash);
    }
    .chat-send { flex: none; align-self: stretch; padding: 0 16px; }
    /* Interrupt the open agent mid-turn — a danger square beside send, shown
       only while that agent is working. */
    .chat-stop {
      flex: none;
      align-self: stretch;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 0 14px;
      color: var(--danger);
      border-color: var(--danger);
      font-size: 12px;
      line-height: 1;
    }
    .chat-stop.visible { display: inline-flex; }
    .chat-stop:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    /* Dictation mic — quiet beside send; red and breathing while recording. */
    .chat-mic {
      flex: none;
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 0 12px;
      font-size: 13px;
      line-height: 1;
    }
    .chat-mic[hidden] { display: none; }
    .chat-mic.rec {
      color: var(--danger);
      border-color: var(--danger);
      animation: pulse-work 1.15s ease-in-out infinite;
    }

    /* A centred reading column — the messages the operator liked. The composer
       below is constrained to the SAME column so the place you type lines up
       with the place you read (that mismatch was the complaint). */
    .chat-thread {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-turn { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
    .chat-turn.user { flex-direction: row-reverse; }
    /* Optimistic-echo lane: your just-sent message, same column as the thread,
       dimmed with a dashed bubble until the agent logs it for real. */
    .chat-pending {
      width: 100%;
      max-width: 880px;
      margin: 16px auto 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-pending:empty { display: none; }
    .chat-turn.pending { opacity: 0.72; }
    .chat-turn.pending .chat-bubble { border-style: dashed; }
    .chat-sending {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      font-style: italic;
    }
    /* Interrupt divider: a centred chip flanked by hairlines. */
    .chat-interrupt {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 4px auto;
      padding: 3px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      font-style: italic;
      background: var(--bg-elev);
    }
    .chat-interrupt-mark { color: var(--danger); font-style: normal; font-size: 8px; }
    /* "Agent is working" — three bouncing dots at the foot of the chat. */
    .chat-typing {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 880px;
      margin: 6px auto 0;
    }
    .chat-typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 11px 14px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 3px;
    }
    .chat-typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: typing-bounce 1.2s infinite;
    }
    .chat-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .chat-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    /* API-error callout: a warning, not a reply. */
    .chat-apierror {
      align-self: stretch;
      margin-left: 40px;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      border-left: 3px solid var(--danger);
      border-radius: 10px;
      background: color-mix(in srgb, var(--danger) 9%, transparent);
    }
    .chat-apierror-eyebrow {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 6px;
    }
    .chat-apierror-msg { font-family: var(--mono); font-size: var(--fs-sm); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
    .chat-apierror-hint { font-size: var(--fs-xs); color: var(--text-dim); margin-top: 6px; }
    /* Per-agent identity disc: initials on the signature amber. The operator's
       own disc is quiet slate — you are not one of the agents. */
    .chat-avatar {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin-top: 2px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--accent-wash);
      color: var(--accent);
      border: 1px solid var(--accent-line);
    }
    .chat-avatar.you {
      background: var(--bg-elev);
      color: var(--text-dim);
      border-color: var(--border);
      font-size: 8.5px;
      letter-spacing: 0;
    }
    .chat-turn-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      max-width: calc(100% - 42px);
    }
    .chat-turn.user .chat-turn-body { align-items: flex-end; }
    .chat-meta { display: flex; gap: 8px; align-items: baseline; padding: 0 2px; }
    .chat-turn.user .chat-meta { flex-direction: row-reverse; }
    .chat-role {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
    }
    .chat-turn.user .chat-role { color: var(--accent); }
    .chat-time {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      opacity: 0.7;
    }
    .chat-bubble {
      padding: 9px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    /* marked builds real block structure, so give it real spacing. */
    .chat-bubble > :first-child { margin-top: 0; }
    .chat-bubble > :last-child { margin-bottom: 0; }
    .chat-bubble p { margin: 0 0 8px; }
    .chat-bubble h1, .chat-bubble h2, .chat-bubble h3, .chat-bubble h4 {
      margin: 14px 0 6px; font-size: 1em; font-weight: 600; color: var(--text);
    }
    .chat-bubble ul, .chat-bubble ol { margin: 0 0 8px; padding-left: 22px; }
    .chat-bubble li { margin: 2px 0; }
    .chat-bubble a { color: var(--accent); }
    .chat-bubble blockquote {
      margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--border);
      color: var(--text-dim);
    }
    .chat-bubble hr { border: none; border-top: 1px solid var(--border-soft); margin: 12px 0; }
    /* Tables — the whole point of switching to marked. */
    .chat-bubble table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: var(--fs-sm);
      display: block;
      overflow-x: auto;
      max-width: 100%;
    }
    .chat-bubble th, .chat-bubble td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .chat-bubble th { background: var(--bg-inset); color: var(--text); font-weight: 600; }
    .chat-turn.user .chat-bubble {
      border-color: var(--accent-line);
      background: var(--accent-wash);
      border-radius: 12px 12px 3px 12px;
    }
    /* Edit pencil on your own recent user turns — reveals on hover, no reflow. */
    .chat-edit-btn {
      flex: 0 0 auto;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 0;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s var(--ease), color 0.15s var(--ease);
    }
    .chat-edit-btn svg { display: block; }
    .chat-turn.user:hover .chat-edit-btn { opacity: 1; pointer-events: auto; }
    .chat-edit-btn:hover { color: var(--accent); }

    /* Forward arrow — hover-reveal beside the bubble (next to the edit pencil
       on user turns), same no-reflow trick as .chat-edit-btn. The wrap is the
       positioning anchor for the popover. */
    .chat-fwd-wrap {
      position: relative;
      flex: 0 0 auto;
      align-self: center;
      display: inline-flex;
    }
    .chat-fwd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 0;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s var(--ease), color 0.15s var(--ease);
    }
    .chat-fwd-btn svg { display: block; }
    .chat-turn:hover .chat-fwd-btn,
    .chat-fwd-btn[aria-expanded="true"] { opacity: 1; pointer-events: auto; }
    .chat-fwd-btn:hover { color: var(--accent); }

    /* The popover: same recipe as .agent-menu (hidden must beat display:flex). */
    .fwd-menu {
      position: absolute;
      top: calc(100% + 5px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fwd-menu[hidden] { display: none; }
    .fwd-menu:not([hidden]) {
      padding: 6px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      min-width: 148px;
    }
    /* Opens INTO the column, never past its edge. */
    .chat-turn.assistant .fwd-menu { right: 0; }
    .chat-turn.user .fwd-menu { left: 0; }
    .fwd-menu.up { top: auto; bottom: calc(100% + 5px); }
    .fwd-menu-label {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      padding: 2px 4px 0;
      white-space: nowrap;
    }
    .fwd-menu-item {
      text-align: left;
      white-space: nowrap;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      padding: 3px 9px;
      line-height: 1.3;
      cursor: pointer;
      transition: border-color 0.12s var(--ease), color 0.12s var(--ease), background 0.12s var(--ease);
    }
    .fwd-menu-item:hover { color: var(--text); border-color: var(--accent); background: var(--accent-wash); }
    .fwd-menu-empty {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      padding: 3px 4px;
      white-space: nowrap;
    }
    .chat-turn.assistant .chat-bubble { border-radius: 12px 12px 12px 3px; }
    /* Minimal markdown: inline code, code fences, bold. */
    .chat-bubble code { font-family: var(--mono); font-size: 0.92em; background: var(--bg-inset); padding: 1px 5px; border-radius: 4px; }
    .chat-bubble pre { margin: 6px 0; padding: 9px 11px; background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 7px; overflow-x: auto; }
    .chat-bubble pre code { background: none; padding: 0; font-size: var(--fs-sm); line-height: 1.5; }
    /* highlight.js theme sits on OUR pre background, not its own dark slab. */
    .chat-bubble pre code.hljs { background: transparent; padding: 0; }
    .chat-bubble strong { color: var(--text); font-weight: 600; }

    /* Tool call: a compact chip that expands to input + result. */
    .chat-tool {
      align-self: stretch;
      max-width: 100%;
      margin-left: 40px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: var(--bg-inset);
      overflow: hidden;
    }
    .chat-tool.error { border-color: var(--accent-line); }
    .chat-tool-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
    }
    .chat-tool-head:hover { background: var(--bg-hover); }
    .chat-tool-caret { width: 8px; color: var(--text-faint); transition: transform 0.12s var(--ease); }
    .chat-tool.open .chat-tool-caret { transform: rotate(90deg); }
    .chat-tool-icon { font-size: 12px; line-height: 1; }
    .chat-tool-name { color: var(--accent); font-weight: 600; }
    .chat-tool-summary { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-tool.error .chat-tool-name { color: var(--danger); }
    .chat-tool-body { display: none; border-top: 1px solid var(--border-soft); }
    .chat-tool.open .chat-tool-body { display: block; }
    /* Each input/result pre is wrapped so a copy button can float over it. */
    .chat-tool-pre { position: relative; }
    .chat-tool-pre + .chat-tool-pre { border-top: 1px dashed var(--border-soft); }
    .chat-tool-body pre {
      margin: 0;
      padding: 9px 11px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      line-height: 1.45;
      color: var(--text-dim);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 320px;
      overflow-y: auto;
    }
    /* Copy button: quiet until you hover the block it sits on. */
    .copy-btn {
      position: absolute;
      top: 5px;
      right: 6px;
      padding: 1px 7px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s var(--ease), color 0.12s var(--ease);
    }
    .chat-tool-pre:hover .copy-btn,
    .code-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent-line); }
    /* Diff colouring for Edit/Write, per line, with a faint bed like the ref. */
    .diff-add { color: #7ee2a8; background: color-mix(in srgb, #12351f 55%, transparent); display: block; }
    .diff-del { color: #ff8589; background: color-mix(in srgb, #3d1418 55%, transparent); display: block; }
    /* Code blocks in assistant markdown get the same hover copy button. */
    .code-wrap { position: relative; }

    /* Thinking: the agent's reasoning, folded away, dim and set to the side. */
    .chat-thinking { align-self: stretch; max-width: 100%; margin-left: 40px; }
    .chat-thinking-head {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      font-style: italic;
      color: var(--text-faint);
      padding: 3px 2px;
    }
    .chat-thinking-head:hover { color: var(--text-dim); }
    .chat-thinking.open .chat-thinking-head .chat-tool-caret { transform: rotate(90deg); }
    .chat-thinking-body {
      display: none;
      border-left: 2px solid var(--border-soft);
      padding: 2px 0 2px 12px;
      margin: 2px 0 2px 4px;
      color: var(--text-dim);
      font-style: italic;
      font-size: var(--fs-sm);
    }
    .chat-thinking.open .chat-thinking-body { display: block; }

    /* Action group: a run of tool calls folded into one card, stacked look. */
    .chat-tool-group {
      align-self: stretch;
      max-width: 100%;
      margin-left: 40px;
      position: relative;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: var(--bg-inset);
    }
    .chat-tool-group::before {
      content: "";
      position: absolute;
      inset: -3px 6px auto 6px;
      height: 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px 8px 0 0;
      background: var(--bg-inset);
      opacity: 0.5;
      z-index: -1;
    }
    .chat-tool-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-dim);
    }
    .chat-tool-group-head:hover { background: var(--bg-hover); }
    .chat-tool-group-head .chat-tool-name { color: var(--text); }
    .chat-tool-group.open .chat-tool-group-head .chat-tool-caret { transform: rotate(90deg); }
    .chat-tool-group-body { display: none; border-top: 1px solid var(--border-soft); padding: 4px 6px; }
    .chat-tool-group.open .chat-tool-group-body { display: block; }
    /* Chips inside a group: no double left-margin, tighter. */
    .chat-tool-group-body .chat-tool { margin-left: 0; margin-bottom: 4px; }
    .chat-tool-group-body .chat-tool:last-child { margin-bottom: 0; }
    /* xterm paints its own grid; it just needs a box that does not collapse.
       CENTRED, and on the terminal's own colour: while mirroring, the grid is
       the pane's and its shape rarely matches the panel's, so something is
       always left over. Centred on a matching background that reads as margin;
       pinned top-left on the page's background it read as the terminal having
       fallen into the corner of a black hole. */
    /* Exactly the container the working reference uses (claudinei's
       .terminal-view__screen): flex:1, min-height:0, a little padding, and
       NOTHING forcing the .xterm's dimensions — the FitAddon reads this box and
       sizes the grid to it. Forcing width/height:100% on .xterm fought the
       addon and was the source of the "gigante" mis-sizing. */
    .screen-term {
      flex: 1 1 auto;
      min-height: 0;
      padding: 4px 8px;
      background: #070b10; /* xterm's own background (see the theme below) */
    }

    /* The Groups panel — the body of its lightbox now. It used to drop under
       the feed header and shove the transcript down, which is what a VIEW does;
       this is a dialog, and the launcher next door was already one. */
    .groups-panel {
      max-height: 70vh;
      overflow-y: auto;
      padding: 12px 14px 14px;
    }
    /* Wider than the launcher: this one lists every room and everyone in them. */
    .lightbox-card-wide { max-width: 720px; }

    /* A file path an agent named, made clickable. Amber + dotted underline so it
       reads as "actionable" without shouting. */
    .path-link {
      color: var(--accent);
      border-bottom: 1px dotted var(--accent-line);
      cursor: pointer;
      word-break: break-all;
    }
    .path-link:hover { border-bottom-style: solid; background: var(--accent-wash); }

    .preview-path {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-body {
      max-height: 72vh;
      overflow: auto;
      padding: 12px 14px;
    }
    .preview-status { font-family: var(--sans); font-size: var(--fs-sm); color: var(--text-dim); padding: 20px; text-align: center; }
    .preview-status.stale { color: var(--danger); }
    .preview-image { max-width: 100%; height: auto; display: block; margin: 0 auto; image-rendering: auto; }
    .preview-text {
      margin: 0;
      font-family: var(--mono);
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--text);
      white-space: pre;
      tab-size: 2;
    }

    /* Inline file dock — sits between the chat and the composer (markup order
       does the docking; .screen is a flex column). OPAQUE on purpose —
       readability first. */
    .inline-file {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .inline-file[hidden] { display: none; }
    /* The TOP border is the handle: a thin invisible strip straddling it. */
    .inline-file-resizer {
      position: absolute;
      top: -4px; left: 0; right: 0;
      height: 8px;
      z-index: 5;
      cursor: row-resize;
      background: transparent;
      transition: background 0.15s var(--ease);
      touch-action: none;
    }
    .inline-file-resizer:hover { background: var(--accent-line); }
    .inline-file-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    .inline-file-name {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .inline-file-path {
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .inline-file-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px;
    }
    .groups-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .groups-hint {
      font-family: var(--sans);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .groups-head .dirpicker-close { margin-left: auto; }

    .groups-body { display: flex; flex-direction: column; gap: 12px; }
    .groups-group {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-inset);
      padding: 8px 10px 10px;
    }
    .groups-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .groups-group-name {
      font-family: var(--mono);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--accent);
    }
    .groups-group-count { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-faint); }
    .groups-rename {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
    }
    .groups-rename:hover { color: var(--accent); text-decoration: underline; }

    .groups-member {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .groups-member + .groups-member { border-top: 1px solid var(--border-soft); }
    .groups-member .name { color: var(--text); font-weight: 600; }
    .groups-member .role { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .groups-member select {
      margin-left: auto;
      flex: none;
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .groups-member select:hover { border-color: var(--accent-line); }
    .groups-empty { font-family: var(--sans); font-size: var(--fs-xs); color: var(--text-faint); padding: 2px 0; }

    .groups-foot { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .groups-new-input { max-width: 220px; }

    /* Group header in the rail: the agents under it are the ones that can
       actually talk to each other. Click to fold the group away — with several
       projects open the rail is the thing that gets long. */
    .group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px 4px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-faint);
      transition: color 0.12s var(--ease);
    }
    .group-head:hover { color: var(--text-dim); }
    .group-head .caret {
      display: inline-block;
      width: 8px;
      transition: transform 0.14s var(--ease);
    }
    .group-head.collapsed .caret { transform: rotate(-90deg); }
    /* The count is the point of collapsing: folded, it is all you see of the
       group, so it has to say how much is in there. */
    .group-head .tally {
      font-variant-numeric: tabular-nums;
      color: var(--text-faint);
    }
    .group-head.collapsed .tally { color: var(--accent); }
    .group-head .rule {
      flex: 1;
      height: 1px;
      background: var(--border-soft);
    }

    /* A group HUGS its agents: head and cards share one container with the
       group's colour running down the left as a rail, and a faint wash of that
       colour behind them. This is what makes a group read as a container in the
       sidebar and not just a label that happens to sit above some rows. */
    .rail-group {
      position: relative;
      margin: 3px 6px 8px 8px;
      padding-left: 2px;
      border-left: 2px solid var(--group-color, var(--accent-line));
      border-radius: 0 9px 9px 0;
      background: linear-gradient(
        to right,
        color-mix(in srgb, var(--group-color, var(--accent)) 9%, transparent),
        transparent 62%
      );
    }
    .rail-group .group-head { padding-left: 10px; }
    .rail-group .group-head > span:nth-child(2) {
      color: color-mix(in srgb, var(--group-color, var(--text-dim)) 78%, var(--text));
      font-weight: 600;
    }
    .rail-group .group-head .caret { color: var(--group-color, var(--text-faint)); }
    /* The colour dot on the head doubles as the "recolour this group" control. */
    .group-swatch {
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--group-color, var(--accent)) 60%, transparent);
      background: var(--group-color, var(--accent));
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.12s var(--ease), transform 0.12s var(--ease);
    }
    .group-head:hover .group-swatch { opacity: 1; }
    .group-swatch:hover { transform: scale(1.18); }
    .rail-group-name { color: inherit; }
    /* Rename pencil: hidden until you hover the group, like the swatch. */
    .group-rename {
      flex: 0 0 auto;
      font-size: 11px;
      line-height: 1;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s var(--ease), color 0.12s var(--ease);
    }
    .group-head:hover .group-rename { opacity: 0.6; }
    .group-rename:hover { opacity: 1; color: var(--accent); }
    /* The rename input sits where the name was, inside the head. */
    .group-head .agent-rename-input {
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1px;
      max-width: 140px;
    }

    /* Drag-to-reorder: the lifted card fades and shows a dashed berth so the gap
       it will leave is legible while you place it. */
    .agent-card.dragging {
      opacity: 0.4;
      outline: 1px dashed var(--accent-line);
      outline-offset: -1px;
    }
    .agent-card[draggable="true"] { cursor: grab; }
    .agent-card.dragging { cursor: grabbing; }

    /* ------------------------- Command palette (⌘K) --------------------- */
    .palette-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 12vh;
      background: rgba(4, 7, 11, 0.62);
      backdrop-filter: blur(2px);
    }
    .palette-backdrop[hidden] { display: none; }
    .palette {
      width: min(560px, 92vw);
      max-height: 68vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .palette-input {
      flex: 0 0 auto;
      padding: 15px 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: var(--fs-lg);
    }
    .palette-input:focus { outline: none; }
    .palette-input::placeholder { color: var(--text-faint); }
    .palette-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; }
    .palette-group {
      padding: 8px 12px 4px;
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-faint);
    }
    .palette-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .palette-item .p-mark {
      flex: 0 0 auto;
      width: 22px;
      text-align: center;
      font-family: var(--mono);
      font-size: var(--fs-sm);
      color: var(--text-faint);
    }
    .palette-item .p-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
    .palette-item .p-dot.online { background: var(--online); box-shadow: var(--led-online); }
    .palette-item .p-name { flex: 0 0 auto; font-family: var(--mono); font-weight: 600; color: var(--text); }
    .palette-item .p-desc {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--text-faint);
    }
    .palette-item.active { background: var(--accent-wash); color: var(--text); }
    .palette-item.active .p-mark { color: var(--accent); }
    .palette-empty { padding: 22px; text-align: center; color: var(--text-faint); font-family: var(--sans); font-size: var(--fs-sm); }
    .palette-foot {
      flex: 0 0 auto;
      display: flex;
      gap: 14px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      color: var(--text-faint);
    }
    .palette-foot kbd {
      font-family: var(--mono);
      background: var(--bg-inset);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 0 5px;
      color: var(--text-dim);
    }

    .filter-bar {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--accent-wash);
      border-bottom: 1px solid var(--accent-line);
      font-family: var(--mono);
      font-size: var(--fs-sm);
    }
    .filter-bar.active { display: flex; }
    .filter-bar .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: var(--fs-eyebrow); }
    .filter-bar .target { color: var(--accent); font-weight: 600; }
    .filter-clear {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent-line);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 2px 10px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .filter-clear:hover { color: var(--text); border-color: var(--accent); }

    .feed {
      flex: 1 1 auto;
      overflow-y: auto;
      /* NO padding-top. A sticky child cannot rise above its containing block,
         which is this element's CONTENT box — so 6px of padding here pinned the
         day divider 6px below the top and left a sliver of the previous
         message showing above it. The dividers carry their own top padding. */
      padding: 0 0 12px;
      font-family: var(--mono);
      font-size: var(--fs-body);
      background:
        repeating-linear-gradient(180deg, transparent 0 39px, rgba(255,255,255,0.014) 39px 40px),
        var(--bg);
    }
    .feed .empty-hint { font-family: var(--sans); padding: 30px 20px; max-width: 46ch; }

    /* --- the transcript: a chat, but of DIRECTED calls -------------------
       Bubbles, because that is what a human reads without training. The one
       thing an ordinary chat does not have to say is WHO a message was for —
       in a group everyone hears everything. Here "a → b" is a private call c
       never sees, so the recipient is printed in the bubble header rather than
       implied by the room. The operator (the human) is the only party with a
       side of its own: right, amber. Everything else is incoming traffic. */

    /* Day divider: the fix for "the order makes no sense". Time-only stamps on
       a multi-day history read as shuffled — 10:37 sitting above 19:02 is
       today above yesterday, and nothing said so. Sticky, so the day you are
       reading is always on screen. */
    /* The transcript is a CENTRED column — the SAME 880px reading column the
       agent chat casca uses, so switching between an agent's chat and the
       intra-agents chat never moves where your eyes read. Rows and dividers
       share the cap so the column has one spine. */
    .day-divider, .msg-row {
      width: 100%;
      max-width: 880px;
      margin-left: auto;
      margin-right: auto;
    }

    .day-divider {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 8px;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
      font-family: var(--mono);
      font-size: var(--fs-eyebrow);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--text-faint);
    }
    .day-divider::before, .day-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-soft);
    }

    .msg-row {
      display: flex;
      /* Top, not bottom: the disc labels the NAME in the bubble header, and a
         tall bubble would strand it a screen away from the thing it names. */
      align-items: flex-start;
      gap: 9px;
      padding: 3px 18px;
      transition: background 0.12s var(--ease);
    }
    .msg-row + .msg-row { margin-top: 5px; }
    /* The operator is you: your line runs down the other side. */
    .msg-row.from-operator { flex-direction: row-reverse; }

    /* Stable identity mark. The hue is the ONLY per-agent colour on the page
       and it lives here, on a 26px disc — the amber stays the interface's
       accent (actions, the operator, unread), never an agent's identity. */
    .msg-avatar {
      flex: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--bg);
      user-select: none;
    }

    .msg-bubble {
      position: relative;
      max-width: min(104ch, 88%);
      min-width: 0;
      padding: 8px 12px 6px;
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 3px;   /* the tail points at the sender */
      background: var(--bg-elev);
    }
    .msg-row:hover .msg-bubble { border-color: var(--border); background: var(--bg-elev-2); }
    .msg-row.from-operator .msg-bubble {
      border-radius: 12px 12px 3px 12px;
      border-color: var(--accent-line);
      background: var(--accent-wash);
    }
    .msg-row.unread .msg-bubble { border-color: var(--accent-line); }
    .msg-row.broadcast .msg-bubble {
      max-width: none;
      flex: 1;
      border-radius: 12px;
      border-style: dashed;
      border-color: var(--accent-line);
      background: linear-gradient(90deg, var(--accent-wash), transparent 70%);
    }
    /* Only the just-arrived bubble animates; the feed is chronological, so the
       newest is the LAST child. */
    .feed > .msg-row:last-child .msg-bubble { animation: rowin 0.22s var(--ease); }
    @keyframes rowin {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 3px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
      color: var(--text-faint);
    }
    .msg-from { color: var(--text); font-weight: 600; }
    .msg-from.operator { color: var(--accent); }         /* the operator: amber */
    /* "alpha to beta", not "alpha → beta": the arrow is a symbol you decode,
       the word is a sentence you read. */
    .msg-rel { color: var(--text-faint); }
    .msg-to { color: var(--text-dim); font-weight: 600; }
