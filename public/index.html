    .msg-to.all { color: var(--accent); }
    .msg-body {
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--fs-body);
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    /* Agents write essays at each other. Unclamped, one message fills the
       viewport and the transcript stops being scannable. */
    .msg-body.clamped {
      max-height: 7.75em;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent);
      mask-image: linear-gradient(180deg, #000 60%, transparent);
    }
    .msg-more {
      margin-top: 2px;
      padding: 0;
      background: none;
      border: none;
      color: var(--accent);
      font-family: var(--mono);
      font-size: var(--fs-xs);
      cursor: pointer;
    }
    .msg-more:hover { text-decoration: underline; }

    .msg-foot {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-family: var(--mono);
      font-size: var(--fs-xs);
    }
    .msg-row.from-operator .msg-foot { justify-content: flex-end; }
    .msg-time {
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }
    .msg-read-flag { letter-spacing: 0.3px; }
    .msg-read-flag.pending { color: var(--accent); }
    .msg-read-flag.read { color: var(--text-faint); }

    /* ----------------------------- Composer ------------------------------ */
    .field { flex: 1 1 auto; display: flex; flex-direction: column; }
    select, textarea {
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: var(--fs-body);
      resize: none;
      transition: border-color 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    textarea { min-height: 62px; width: 100%; line-height: 1.5; }
    .send-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.4px;
      padding: 9px 18px;
      transition: filter 0.12s var(--ease), box-shadow 0.12s var(--ease);
    }
    .send-btn:hover { background: var(--accent-bright); box-shadow: 0 0 16px rgba(245, 166, 35, 0.35); }
    .send-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

    /* ------------------------------ Toasts ------------------------------- */
    .toasts {
      position: fixed;
      bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 9px;
      z-index: 50;
      max-width: min(420px, 90vw);
    }
    .toast {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-family: var(--sans);
      font-size: var(--fs-sm);
      color: var(--text);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      animation: toast-in 0.14s ease-out;
    }
    .toast.ok    { border-left-color: var(--ok); }
    .toast.warn  { border-left-color: var(--warn); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } }

    /* Scrollbars — quiet, console-appropriate. */
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ----------------------------- Responsive --------------------------- */
    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .sidebar {
        flex: 0 0 auto;
        width: 100%;
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .mcp-add code { max-width: 28ch; }
    }

    /* Motion is purposeful; honor the OS reduced-motion request. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-jack" aria-hidden="true">⇄</span><span class="wordmark">SWITCHBOARD</span></div>
    <div class="hub-status">
      <span class="conn-state" id="conn-state" data-state="connecting">
        <span class="dot"></span><span id="conn-label">connecting</span>
      </span>
      <span class="metric">online <b id="online-count">0</b>/<span id="agent-count">0</span></span>
      <span class="metric">uptime <b id="uptime">—</b></span>
      <span class="metric">v<span id="version">—</span></span>
    </div>
    <div class="header-spacer"></div>
    <!-- The one-time "register this hub in Claude Code" command. It only shows
         on a hub with no agents yet, because that is the only time it is the
         next thing to do — `switchboard setup` runs it for you, and once an
         agent exists you are long past it. It used to sit here forever. -->
    <div class="mcp-add" id="mcp-add" hidden>
      <code id="mcp-cmd" title=""></code>
      <button class="btn btn-copy" id="copy-mcp" type="button">copy</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="eyebrow">Patchbay</span>
        <span id="sidebar-count" class="rail-count">0</span>
        <!-- Groups and + agent live HERE, over the rail: both are about the
             agents listed below them. Groups was up in the tab strip, which is
             about which SCREEN you are looking at — a different question. -->
        <button class="btn groups-open" id="groups-open" type="button"
          title="Create a group, and move agents between rooms">+ group</button>
        <button class="btn launcher-open" id="launcher-open" type="button"
          title="Launch a new agent">+ agent</button>
      </div>

      <div class="agents" id="agents"></div>

      <!-- Claude /usage bars (5h session + weekly), like the reference app —
           filled by /api/usage, coloured by burn pace. Hidden until it has data. -->
      <div class="usage-card" id="usage-card" hidden>
        <div class="usage-card-head">
          <span class="eyebrow">Claude usage</span>
          <span class="usage-reset" id="usage-updated"></span>
        </div>
        <div id="usage-rows"></div>
      </div>

    </aside>

    <main class="main">
      <!-- The tab strip. Messages is the first tab and always there; every
           agent you open becomes one beside it. The transcript used to be
           "whatever the panel showed when no screen was open", which made the
           one view that is not an agent behave unlike everything next to it. -->
      <div class="tabs" id="tabs">
        <button class="tab tab-hub active" id="tab-messages" type="button"
          title="The chat between your agents — what they send each other">
          <span class="tab-mark">⇄</span>
          <span>Intra-agents Chat</span>
          <span class="tab-unread" id="tab-messages-unread" hidden></span>
        </button>
        <div class="tab-strip" id="tab-strip"></div>
      </div>

      <div class="feed-head">
        <span class="sub">what your agents said to each other — newest at the bottom</span>
        <input class="feed-search" id="feed-search" type="search"
          placeholder="Search the transcript…" autocomplete="off" spellcheck="false" />
        <div class="group-tabs" id="group-tabs"></div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <span class="label">filtering by</span>
        <span class="target" id="filter-target"></span>
        <button class="filter-clear" id="filter-clear" type="button">clear filter ✕</button>
      </div>

      <div class="feed" id="feed"></div>

      <!-- The agent's real screen. Replaces the transcript rather than sitting
           beside it: the point is to stop juggling windows, not to add a pane
           you have to juggle. -->
      <div class="screen" id="screen" hidden>
        <div class="screen-head">
          <span class="screen-name" id="screen-name"></span>
          <!-- Chat = the clean casca (read the agent's own conversation log);
               Terminal = its raw screen (type into it). Chat is the default. -->
          <div class="screen-modes" id="screen-modes">
            <button class="screen-mode active" data-mode="chat" type="button">Chat</button>
            <button class="screen-mode" data-mode="terminal" type="button">Terminal</button>
          </div>
          <!-- Engine tabs: when this agent has a codex sibling (same cwd, its own
               tmux session), switch which engine's screen is shown. Both stay
               alive — the tab only changes the view. Filled by renderEngineTabs. -->
          <div class="screen-modes engine-tabs" id="engine-tabs" hidden></div>
          <span class="screen-hint" id="screen-hint"></span>
          <button class="btn" id="screen-window" type="button"
            title="Open this agent in a real Windows terminal window instead">window</button>
          <button class="dirpicker-close" id="screen-close" type="button"
            title="Back to the messages (Esc)">✕</button>
        </div>
        <!-- Chat view: rendered conversation. -->
        <div class="screen-chat" id="screen-chat"></div>
        <!-- Chat composer: type to the agent. The text is sent into its pane
             (send-keys, through the pane guard), so the agent answers as if you
             typed in the terminal — and the reply shows up here, rendered,
             because the chat tails the conversation log live. -->
        <!-- Inline file dock: a path clicked in the chat opens HERE, between
             the transcript and the composer, so you read the file while you
             keep typing. The lightbox stays for the Messages feed. The top
             border is a drag handle: up = taller, double-click = reset. -->
        <div class="inline-file" id="inline-file" hidden>
          <div class="inline-file-resizer" id="inline-file-resizer" role="separator"
            aria-orientation="horizontal" title="Drag to resize · double-click to reset"></div>
          <div class="inline-file-head">
            <span class="inline-file-name" id="inline-file-name"></span>
            <span class="inline-file-path" id="inline-file-path"></span>
            <button class="dirpicker-close" id="inline-file-close" type="button"
              title="Close the file (keep chatting)">✕</button>
          </div>
          <div class="inline-file-body" id="inline-file-body"></div>
        </div>
        <form class="chat-composer" id="chat-composer" hidden autocomplete="off">
          <div class="chat-composer-inner">
            <div class="slash-menu" id="slash-menu" hidden></div>
            <div class="slash-menu" id="mention-menu" hidden></div>
            <textarea id="chat-input" rows="1"
              placeholder="Message this agent…  (Enter sends · Shift+Enter for a newline)"></textarea>
            <button class="btn chat-mic" id="chat-mic" type="button"
              aria-label="Dictate a message" title="Dictate (Chrome speech, pt-BR) — click to start/stop">🎤</button>
            <button class="btn chat-send" id="chat-send" type="submit">send</button>
            <button class="btn chat-stop" id="chat-stop" type="button"
              aria-label="Stop the agent (Esc)" title="Stop (Esc)">■</button>
          </div>
        </form>
        <!-- Session status read from the CLI footer — under the composer, like a
             terminal footer: permission/plan mode + a running /goal with its age. -->
        <div class="chat-statusbar" id="chat-statusbar" hidden></div>
        <!-- Terminal view: xterm. Hidden until you toggle to it. -->
        <div class="screen-term" id="screen-term" hidden></div>
      </div>

      <!-- The operator composer lived here: a recipient picker, a textarea and
           a broadcast. It was a way to reach an agent back when the dashboard
           could not show you one. Now a card opens the agent's real screen and
           you type AT it, which is what the composer was approximating. Sending
           as "operator" is still a thing — `switchboard send <to> <msg>` — where
           it belongs: a script, not the panel you stare at all day. -->
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    "use strict";

    // =====================================================================
    // Switchboard dashboard — vanilla JS + SSE. No framework, no build, no
    // external asset (localhost, local trust boundary — everything inline).
    //
    // SECURITY / XSS: every value that comes from the hub (agent names, roles,
    // message bodies, from/to) is treated as untrusted — an agent on the
    // network can be adversarial/hallucinated (PRD section 15). We NEVER assign
    // server data to innerHTML: the DOM is built with createElement +
    // textContent only. The capability token never leaves the hub in the
    // shapes we read (PublicAgent / Message), so it can never reach here.
    // =====================================================================

    const $ = (sel) => document.querySelector(sel);

    const state = {
      agents: new Map(),   // name -> agent object (incl. unreadCount)
      messages: [],        // newest-first (matches GET /api/messages)
      msgIds: new Set(),   // dedup guard for message_created vs bootstrap
      filter: null,        // active agent-name filter, or null
      group: null,         // active group tab, or null for "all groups"
      search: "",          // free-text filter over the transcript, or ""
      sse: null,
      uptimeBase: null,    // { seconds, at }  — server uptime + local anchor
    };

    // --- tiny DOM helper: text is set via textContent (never innerHTML) -----
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    // Seconds are noise in a transcript — "10:37" is when it was said. The
    // locale is the READER's (undefined), not a hardcoded one: this is the
    // viewer's clock, and the rest of the product is en.
    function fmtTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    /** Full stamp for a title= — the exact instant, when someone wants it. */
    function fmtFull(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString(undefined, { dateStyle: "full", timeStyle: "medium" });
    }

    const DAY_MS = 86400000;

    /** Local midnight of a date — the boundary a human means by "day". */
    function startOfDay(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    /**
     * "Today" / "Yesterday" / "Mon, 14 Jul" — the label of a day divider.
     * Named days beat dates for the two days anyone actually reads.
     */
    function fmtDayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      const days = Math.round((startOfDay(new Date()) - startOfDay(d)) / DAY_MS);
      if (days === 0) return "Today";
      if (days === 1) return "Yesterday";
      return d.toLocaleDateString(undefined, {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: startOfDay(d) < startOfDay(new Date()) - 300 * DAY_MS ? "numeric" : undefined,
      });
    }

    // Every agent gets one stable colour, hashed from its name so it survives
    // restarts and never depends on arrival order. Muted on purpose: these sit
    // beside the amber without competing with it for "this is actionable".
    const AGENT_HUES = ["#c8873a", "#5f9ea0", "#7fa860", "#a97fa8", "#c47a5c", "#7d86c4"];

    function agentHue(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
      return AGENT_HUES[h % AGENT_HUES.length];
    }

    /** Up to 2 characters — a name's first letters, digits included. */
    function monogram(name) {
      const letters = name.replace(/[^a-z0-9]/gi, "");
      return (letters.slice(0, 2) || "?").toUpperCase();
    }

    function fmtUptime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m ${sec}s`;
      if (m > 0) return `${m}m ${sec}s`;
      return `${sec}s`;
    }

    // --- toasts -----------------------------------------------------------
    function toast(message, kind = "ok", ttl = 4200) {
      const box = $("#toasts");
      const t = el("div", `toast ${kind}`, message);
      box.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        t.style.transition = "opacity 0.25s";
        setTimeout(() => t.remove(), 260);
      }, ttl);
    }

    // --- agent state merge ------------------------------------------------
    // GET /api/agents carries unreadCount; the SSE agent_updated payload is a
    // PublicAgent and does NOT — so we PRESERVE the previous unreadCount when a
    // partial update arrives, and track deltas from message_created/read.
    function mergeAgent(incoming) {
      const prev = state.agents.get(incoming.name);
      const unreadCount =
        incoming.unreadCount != null
          ? incoming.unreadCount
          : prev
            ? prev.unreadCount
            : 0;
      state.agents.set(incoming.name, { ...prev, ...incoming, unreadCount });
    }

    // Manual order (drag-to-reorder) is a viewer preference in localStorage: a
    // list of names in the order the operator arranged. A name in the list wins;
    // anything not yet arranged falls back to online-first-then-name and sits
    // after the arranged ones. Empty list => the original default ordering.
    function loadChatOrder() {
      try {
        const v = JSON.parse(localStorage.getItem("sb.chatOrder") || "[]");
        return Array.isArray(v) ? v : [];
      } catch {
        return [];
      }
    }
    function saveChatOrder(names) {
      localStorage.setItem("sb.chatOrder", JSON.stringify(names));
    }

    function sortedAgents() {
      const order = loadChatOrder();
      const rank = new Map(order.map((n, i) => [n, i]));
      return [...state.agents.values()].sort((a, b) => {
        const ia = rank.has(a.name) ? rank.get(a.name) : -1;
        const ib = rank.has(b.name) ? rank.get(b.name) : -1;
        if (ia !== -1 && ib !== -1) return ia - ib; // both arranged: keep it
        if (ia !== -1) return -1; // arranged sorts before unarranged
        if (ib !== -1) return 1;
        if (a.status !== b.status) return a.status === "online" ? -1 : 1;
        return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
      });
    }

    // =====================================================================
    // Rendering
    // =====================================================================

    // --- Claude /usage bars, pace-coloured (from the reference app) --------
    // The bar fills to `percent`, coloured by how the burn compares to the clock:
    // under the window's pace = green, at/over it = warming to red.
    const USAGE_HOUR = 3_600_000;
    function usageWindow(group) {
      if (group === "session") return { windowMs: 5 * USAGE_HOUR, chunkMs: USAGE_HOUR / 3 };
      if (group === "weekly") return { windowMs: 168 * USAGE_HOUR, chunkMs: USAGE_HOUR };
      return null;
    }
    function usageExpected(resetsAt, windowMs, chunkMs, now) {
      const reset = Date.parse(resetsAt);
      const start = reset - windowMs;
      const totalChunks = Math.round(windowMs / chunkMs);
      const chunks = Math.min(totalChunks, Math.max(1, Math.ceil((now - start) / chunkMs)));
      return (chunks / totalChunks) * 100;
    }
    function usagePaceColor(percent, expected) {
      if (expected <= 0) return percent > 0 ? "var(--danger)" : "var(--online)";
      const ratio = percent / expected;
      if (ratio <= 1) return "var(--online)";
      if (ratio >= 2) return "var(--danger)";
      return `hsl(${Math.round(140 * (2 - ratio))} 70% 55%)`;
    }
    function usageLabel(l) {
      if (l.label) return l.label;
      if (l.kind === "session") return "session · 5h";
      if (l.kind === "weekly_all") return "weekly · all";
      return l.kind.replace(/_/g, " ");
    }
    function usageResetText(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
    }
    let usageLimits = [];
    async function refreshUsage() {
      try {
        const r = await fetch("/api/usage");
        const body = r.ok ? await r.json() : null;
        usageLimits = Array.isArray(body && body.limits) ? body.limits : [];
      } catch {
        /* keep the last good value */
      }
      renderUsage();
    }
    function renderUsage() {
      const card = $("#usage-card");
      if (!usageLimits.length) {
        card.hidden = true;
        return;
      }
      const now = Date.now();
      const order = { session: 0, weekly: 1 };
      const sorted = [...usageLimits].sort(
        (a, b) => (order[a.group] ?? 9) - (order[b.group] ?? 9) || a.percent - b.percent,
      );
      const rows = $("#usage-rows");
      rows.textContent = "";
      for (const l of sorted) {
        const win = usageWindow(l.group);
        const color = win
          ? usagePaceColor(l.percent, usageExpected(l.resetsAt, win.windowMs, win.chunkMs, now))
          : "var(--accent)";
        const row = el("div", "usage-row");
        const head = el("div", "usage-row-head");
        head.append(el("span", "usage-row-label", usageLabel(l)), el("span", "usage-row-pct", `${l.percent}%`));
        const bar = el("div", "usage-bar");
        const fill = el("div", "usage-bar-fill");
        fill.style.width = `${Math.min(100, l.percent)}%`;
        fill.style.background = color;
        bar.appendChild(fill);
        row.append(head, bar, el("div", "usage-row-reset", `resets ${usageResetText(l.resetsAt)}`));
        rows.appendChild(row);
      }
      card.hidden = false;
    }

    function renderHeader() {
      const agents = [...state.agents.values()];
      const online = agents.filter((a) => a.status === "online").length;
      $("#online-count").textContent = String(online);
      $("#agent-count").textContent = String(agents.length);
      $("#sidebar-count").textContent = String(agents.length);
      // The MCP registration line is a first-run instruction, not furniture.
      $("#mcp-add").hidden = agents.length > 0;

      // The Messages tab is active whenever no agent's screen is. And it counts
      // unread: with the panel showing a terminal, the transcript is off screen,
      // and a message arriving there would otherwise be invisible.
      $("#tab-messages").classList.toggle("active", screenState.name === null);
      const unread = agents.reduce((n, a) => n + (a.unreadCount || 0), 0);
      const badge = $("#tab-messages-unread");
      badge.hidden = unread === 0;
      badge.textContent = String(unread);
    }

    function renderUptime() {
      if (!state.uptimeBase) return;
      const secs =
        state.uptimeBase.seconds + (Date.now() - state.uptimeBase.at) / 1000;
      $("#uptime").textContent = fmtUptime(secs);
    }

    function setConnState(stateName, label) {
      const node = $("#conn-state");
      node.dataset.state = stateName;
      $("#conn-label").textContent = label;
    }

    // Agent types (mirrors src/shared/agent-types.ts). An agent record written
    // before the field existed has no agentType — every one of those was Claude
    // Code, so undefined resolves to "claude" rather than rendering blank.
    const AGENT_TYPE_LABELS = { claude: "CLAUDE", codex: "CODEX" };
    const AGENT_TYPE_TITLES = { claude: "Claude Code", codex: "Codex CLI" };

    // Vendor marks, same paths as the launcher's segmented control (the file
    // ships no external asset). Built with createElementNS — the "never
    // innerHTML" rule of this file holds even for these static constants.
    const AGENT_LOGO_PATHS = {
      claude:
        "M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5527h3.7442L10.5363 3.541Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z",
      codex:
        "M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.4593a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z",
    };

    function agentLogo(type) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("class", "agent-logo");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("fill", "currentColor");
      p.setAttribute("d", AGENT_LOGO_PATHS[type] || AGENT_LOGO_PATHS.claude);
      svg.appendChild(p);
      return svg;
    }

    function agentTypeOf(agent) {
      return agent && agent.agentType === "codex" ? "codex" : "claude";
    }

    // Groups (mirrors resolveGroup in src/server/store.ts). An agent registered
    // before groups existed has no field and belongs with the rest of them.
    const DEFAULT_GROUP = "default";

    function groupOf(agent) {
      return (agent && agent.group) || DEFAULT_GROUP;
    }

    /**
     * What the UI SHOWS for an agent: the free display name (emoji welcome)
     * when set, else the kebab id. Accepts an agent object or a name string
     * (looked up; an unregistered name just shows itself).
     */
    function displayOf(agentOrName) {
      const a = typeof agentOrName === "string" ? state.agents.get(agentOrName) : agentOrName;
      if (!a) return typeof agentOrName === "string" ? agentOrName : "?";
      return a.displayName || a.name;
    }

    // --- Per-group colour ------------------------------------------------
    // A group's colour is a VIEWER preference (this is one operator's console),
    // so it lives in localStorage, not on the server. Unset groups get a stable
    // colour derived from the name, so rooms look distinct the moment they exist
    // — no "pick a colour first" step. `default` stays neutral: it is the
    // absence of a room, not a room.
    const GROUP_PALETTE = [
      "#e0a326", "#4a9eff", "#3fb950", "#d1509a",
      "#a371f7", "#e0623c", "#2bb8a3", "#c9a227",
    ];
    const DEFAULT_GROUP_COLOR = "#3a424d";
    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return Math.abs(h);
    }
    function groupColor(group) {
      const saved = localStorage.getItem("sb.groupColor." + group);
      if (saved) return saved;
      if (group === DEFAULT_GROUP) return DEFAULT_GROUP_COLOR;
      return GROUP_PALETTE[hashStr(group) % GROUP_PALETTE.length];
    }
    function setGroupColor(group, color) {
      localStorage.setItem("sb.groupColor." + group, color);
      renderAgents();
    }

    // Per-chat colour: tints the card's left cable-end. Unset => no tint (the
    // cable stays the default patchbay behaviour). Also a viewer preference.
    function chatColor(name) {
      return localStorage.getItem("sb.chatColor." + name) || null;
    }
    function setChatColor(name, color) {
      if (color) localStorage.setItem("sb.chatColor." + name, color);
      else localStorage.removeItem("sb.chatColor." + name);
      renderAgents();
    }

    // --- Drag to reorder chats (and drop into another room) --------------
    let dragName = null;
    let dragGroup = null;
    function cardAfterY(box, y) {
      const cards = [...box.querySelectorAll(":scope > .agent-card:not(.dragging)")];
      for (const c of cards) {
        const r = c.getBoundingClientRect();
        if (y < r.top + r.height / 2) return c;
      }
      return null;
    }
    function boxAfterY(container, y, exclude) {
      const boxes = [...container.querySelectorAll(":scope > .rail-group")].filter((b) => b !== exclude);
      for (const b of boxes) {
        const r = b.getBoundingClientRect();
        if (y < r.top + r.height / 2) return b;
      }
      return null;
    }
    function commitGroupOrder() {
      const container = $("#agents");
      const groups = [...container.querySelectorAll(":scope > .rail-group")].map((b) => b.dataset.group);
      saveGroupOrder(groups);
      renderAgents();
    }
    // Read the arrangement out of the DOM and persist it. If the card ended in a
    // different room's box, that is also a move-to-group. Never falls back to
    // `default`: a card dropped outside every box keeps its current room.
    function commitDrag(moved) {
      const container = $("#agents");
      const agent = state.agents.get(moved);
      const card = container.querySelector(`.agent-card[data-name="${CSS.escape(moved)}"]`);
      const box = card ? card.closest(".rail-group") : null;
      const targetGroup = box ? box.dataset.group : agent ? groupOf(agent) : DEFAULT_GROUP;
      saveChatOrder([...container.querySelectorAll(".agent-card")].map((c) => c.dataset.name));
      if (agent && targetGroup && groupOf(agent) !== targetGroup) {
        moveAgentToGroup(moved, targetGroup); // server + re-render, honours the saved order
      } else {
        renderAgents();
      }
    }

    function initDragReorder() {
      const container = $("#agents");
      container.addEventListener("dragover", (e) => {
        // Group reorder takes precedence: dragging a head moves whole boxes.
        if (dragGroup) {
          const box = container.querySelector(`.rail-group[data-group="${CSS.escape(dragGroup)}"]`);
          if (!box) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const after = boxAfterY(container, e.clientY, box);
          if (after == null) container.appendChild(box);
          else container.insertBefore(box, after);
          return;
        }
        if (!dragName) return;
        const dragging = container.querySelector(".agent-card.dragging");
        if (!dragging) return;
        // Only a real drop zone: a group box, or the flat container when there
        // are no groups. Dead space in grouped mode is left alone, so a card is
        // never orphaned outside every room.
        const box = e.target.closest(".rail-group");
        const grouped = !!container.querySelector(".rail-group");
        const zone = box || (grouped ? null : container);
        if (!zone) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const after = cardAfterY(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else zone.insertBefore(dragging, after);
      });
      // drop only has to ACCEPT the gesture; dragend commits (it always fires).
      container.addEventListener("drop", (e) => {
        if (dragName || dragGroup) e.preventDefault();
      });
    }

    // =====================================================================
    // Command palette (⌘K / Ctrl-K): jump to any agent or fire a core action
    // without reaching for the mouse — the fast path once the rail has more
    // than a couple of agents.
    // =====================================================================
    const paletteState = { open: false, items: [], active: 0 };

    function paletteActions() {
      return [
        {
          kind: "action", mark: "⇄", name: "Messages",
          desc: "the transcript of what agents said",
          run: () => { closePalette(); if (screenState.name) closeScreen(); },
        },
        {
          kind: "action", mark: "+", name: "New agent", desc: "launch a new agent",
          run: () => { closePalette(); $("#launcher-open").click(); },
        },
        {
          kind: "action", mark: "+", name: "New group", desc: "create a room",
          run: () => { closePalette(); openGroups(); },
        },
      ];
    }

    function paletteResults(q) {
      const query = q.trim().toLowerCase();
      const agents = sortedAgents().map((a) => ({
        kind: "agent", name: displayOf(a), id: a.name, desc: a.role || "", online: a.status === "online",
        run: () => { closePalette(); openScreen(a.name); },
      }));
      let all = [...agents, ...paletteActions()];
      if (query) all = all.filter((it) => (it.name + " " + (it.id || "") + " " + (it.desc || "")).toLowerCase().includes(query));
      return all;
    }

    function ensurePalette() {
      let bd = $("#palette-backdrop");
      if (bd) return bd;
      bd = el("div", "palette-backdrop");
      bd.id = "palette-backdrop";
      bd.hidden = true;
      const p = el("div", "palette");
      const input = el("input", "palette-input");
      input.type = "text";
      input.placeholder = "Jump to an agent, or an action…";
      const list = el("div", "palette-list");
      const foot = el("div", "palette-foot");
      foot.append(
        paletteHint("↑↓", "navigate"),
        paletteHint("↵", "open"),
        paletteHint("esc", "close"),
      );
      p.append(input, list, foot);
      bd.appendChild(p);
      document.body.appendChild(bd);
      input.addEventListener("input", () => renderPalette(input.value));
      input.addEventListener("keydown", paletteKey);
      bd.addEventListener("click", (e) => { if (e.target === bd) closePalette(); });
      return bd;
    }
    function paletteHint(keys, label) {
      const span = el("span");
      span.append(el("kbd", null, keys), document.createTextNode(" " + label));
      return span;
    }

    function openPalette() {
      const bd = ensurePalette();
      bd.hidden = false;
      paletteState.open = true;
      paletteState.active = 0;
      const input = bd.querySelector(".palette-input");
      input.value = "";
      renderPalette("");
      input.focus();
    }
    function closePalette() {
      const bd = $("#palette-backdrop");
      if (bd) bd.hidden = true;
      paletteState.open = false;
    }

    function renderPalette(q) {
      const list = $("#palette-backdrop").querySelector(".palette-list");
      const results = paletteResults(q);
      paletteState.items = results;
      if (paletteState.active >= results.length) paletteState.active = Math.max(0, results.length - 1);
      list.textContent = "";
      if (!results.length) {
        list.appendChild(el("div", "palette-empty", "Nothing matches."));
        return;
      }
      let lastKind = null;
      results.forEach((it, i) => {
        if (it.kind !== lastKind) {
          list.appendChild(el("div", "palette-group", it.kind === "agent" ? "Agents" : "Actions"));
          lastKind = it.kind;
        }
        const item = el("div", `palette-item${i === paletteState.active ? " active" : ""}`);
        item.dataset.i = String(i);
        if (it.kind === "agent") {
          item.append(el("span", `p-dot${it.online ? " online" : ""}`), el("span", "p-name", it.name), el("span", "p-desc", it.desc || ""));
        } else {
          item.append(el("span", "p-mark", it.mark), el("span", "p-name", it.name), el("span", "p-desc", it.desc || ""));
        }
        item.addEventListener("mousemove", () => setPaletteActive(i));
        item.addEventListener("click", () => it.run());
        list.appendChild(item);
      });
    }
    function setPaletteActive(i) {
      paletteState.active = i;
      const list = $("#palette-backdrop").querySelector(".palette-list");
      for (const it of list.querySelectorAll(".palette-item")) {
        it.classList.toggle("active", Number(it.dataset.i) === i);
      }
    }
    function movePalette(d) {
      const n = paletteState.items.length;
      if (!n) return;
      let i = paletteState.active + d;
      if (i < 0) i = n - 1;
      if (i >= n) i = 0;
      setPaletteActive(i);
      const node = $("#palette-backdrop").querySelector(`.palette-item[data-i="${i}"]`);
      if (node) node.scrollIntoView({ block: "nearest" });
    }
    function paletteKey(e) {
      if (e.key === "ArrowDown") { e.preventDefault(); movePalette(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); movePalette(-1); }
      else if (e.key === "Enter") { e.preventDefault(); const it = paletteState.items[paletteState.active]; if (it) it.run(); }
      else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    }

    /**
     * Which room a message belongs to. Messages carry no group of their own —
     * they do not need to: agents can only message inside their group, so the
     * sender's group IS the conversation's. The operator is the exception, being
     * in no group and able to reach anyone, so its messages belong to whoever it
     * wrote to. Returns null when neither end is still registered (a removed
     * agent's history), which no room should claim.
     */
    function messageGroup(m) {
      const sender = state.agents.get(m.from);
      if (sender) return groupOf(sender);
      const recipient = state.agents.get(m.to);
      return recipient ? groupOf(recipient) : null;
    }

    // Group order is a viewer preference too (drag the group heads). Arranged
    // groups lead, in the saved order; the rest stay alphabetical behind them.
    function loadGroupOrder() {
      try {
        const v = JSON.parse(localStorage.getItem("sb.groupOrder") || "[]");
        return Array.isArray(v) ? v : [];
      } catch {
        return [];
      }
    }
    function saveGroupOrder(groups) {
      localStorage.setItem("sb.groupOrder", JSON.stringify(groups));
    }

    /** Every group that has an agent, in the operator's order (else sorted). */
    function allGroups() {
      const present = [...new Set([...state.agents.values()].map(groupOf))];
      const rank = new Map(loadGroupOrder().map((g, i) => [g, i]));
      return present.sort((a, b) => {
        const ia = rank.has(a) ? rank.get(a) : -1;
        const ib = rank.has(b) ? rank.get(b) : -1;
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
    }

    function renderAgents() {
      const container = $("#agents");
      // A rebuild while a card's ⋯ menu is open closes it in the operator's
      // face — and the idle/working poll re-renders every ~2.5s, which made the
      // menu nearly unusable. Skip this pass; the next update lands in seconds.
      if (container.querySelector(".agent-menu:not([hidden])")) return;
      container.textContent = "";
      const agents = sortedAgents();
      if (agents.length === 0) {
        container.appendChild(
          el(
            "div",
            "empty-hint",
            "No registered agents. Run `switchboard start <name>`.",
          ),
        );
        renderHeader();
        return;
      }
      // Grouped, under a header each: the rail then answers "who can talk to
      // whom" by its shape, which is the question a group exists to settle.
      //
      // The one case with no header is the install that never asked for groups:
      // everyone in `default`, where a label over the whole rail says nothing.
      // The moment you NAME a room, it gets its header even if it is the only
      // one — hiding it made a group you had just created and filled look like
      // it had vanished.
      const groups = allGroups();
      if (groups.length === 1 && groups[0] === DEFAULT_GROUP) {
        for (const agent of agents) container.appendChild(buildAgentCard(agent));
      } else {
        for (const group of groups) {
          const inGroup = agents.filter((a) => groupOf(a) === group);
          if (state.group && group !== state.group) continue;
          const box = el("div", "rail-group");
          box.dataset.group = group;
          box.style.setProperty("--group-color", groupColor(group));
          box.appendChild(buildGroupHead(group, inGroup));
          if (!collapsedGroups.has(group)) {
            for (const agent of inGroup) box.appendChild(buildAgentCard(agent));
          }
          container.appendChild(box);
        }
      }
      renderHeader();
      // Both are derived from the agent set, so they belong to the one render
      // that already runs whenever an agent appears, moves group or leaves.
      renderGroupTabs();
      renderGroupOptions();
      renderTabs(); // the tabs carry each agent's dot and unread count
      updateChatTyping(); // reflect the open agent's working/idle in the chat
      updateStopButton(); // and the composer STOP button (same working signal)
      renderScreenStatus(); // permission/plan/goal pills in the screen header
      renderEngineTabs(); // Claude|Codex tabs when the open agent has a sibling
    }

    /**
     * A group's header in the rail, and its fold. Collapsed, the header is all
     * that is left of the group, so it carries the tally — how many agents are
     * in there and how many of those are up. Unread never hides: a folded group
     * with something waiting has to say so, or folding becomes a way to miss
     * messages.
     */
    function buildGroupHead(group, members) {
      const collapsed = collapsedGroups.has(group);
      const head = el("button", `group-head${collapsed ? " collapsed" : ""}`);
      head.type = "button";
      // Drag a group head to reorder the rooms in the rail.
      if (group !== DEFAULT_GROUP) {
        head.draggable = true;
        head.addEventListener("dragstart", (e) => {
          dragGroup = group;
          e.dataTransfer.effectAllowed = "move";
          try {
            e.dataTransfer.setData("text/plain", "group:" + group);
          } catch {
            /* payload unused */
          }
        });
        head.addEventListener("dragend", () => {
          if (dragGroup) commitGroupOrder();
          dragGroup = null;
        });
      }
      const online = members.filter((a) => a.status === "online").length;
      const unread = members.reduce((n, a) => n + (a.unreadCount || 0), 0);
      head.title = collapsed
        ? `Unfold ${group} (${members.length} agents, ${online} online)`
        : `Fold ${group} away`;

      const nameSpan = el("span", "rail-group-name", group);
      head.append(
        el("span", "caret", "▾"),
        nameSpan,
        el("span", "tally", `${online}/${members.length}`),
      );
      // Rename right here in the rail: a pencil that appears on hover turns the
      // name into an input. `default` is not a room you rename.
      if (group !== DEFAULT_GROUP) {
        const pencil = el("span", "group-rename", "✎");
        pencil.title = `Rename the ${group} group`;
        pencil.addEventListener("click", (e) => {
          e.stopPropagation(); // do not fold
          startRailRename(group, nameSpan);
        });
        head.appendChild(pencil);
      }
      // A recolour control living on the head: a swatch you click to open a
      // native colour picker. `default` is the non-room and stays neutral.
      if (group !== DEFAULT_GROUP) {
        const swatch = el("span", "group-swatch");
        swatch.title = `Recolour the ${group} group`;
        const picker = el("input");
        picker.type = "color";
        picker.value = groupColor(group);
        picker.style.cssText = "position:absolute;width:0;height:0;opacity:0;pointer-events:none;";
        picker.addEventListener("input", (e) => setGroupColor(group, e.target.value));
        picker.addEventListener("click", (e) => e.stopPropagation());
        swatch.addEventListener("click", (e) => {
          e.stopPropagation(); // do not fold the group
          picker.click();
        });
        swatch.appendChild(picker);
        head.appendChild(swatch);
      }
      if (unread > 0) {
        const badge = el("span", "unread-badge", String(unread));
        badge.title = `${unread} unread in ${group}`;
        head.appendChild(badge);
      }
      head.appendChild(el("span", "rule"));

      head.addEventListener("click", () => {
        if (collapsedGroups.has(group)) collapsedGroups.delete(group);
        else collapsedGroups.add(group);
        renderAgents();
      });
      return head;
    }

    function renderGroupTabs() {
      const tabs = $("#group-tabs");
      tabs.textContent = "";
      const groups = allGroups();
      // One room is not a choice.
      if (groups.length < 2) return;

      const mk = (label, value, count) => {
        const btn = el("button", `group-tab${state.group === value ? " active" : ""}`);
        btn.type = "button";
        btn.appendChild(document.createTextNode(label));
        if (count != null) btn.appendChild(el("span", "count", String(count)));
        btn.title =
          value === null
            ? "Every group's traffic in one scroll"
            : `Only what the ${value} group said — these agents can only talk to each other`;
        btn.addEventListener("click", () => {
          state.group = value;
          renderAgents();
          renderFeed();
        });
        return btn;
      };

      tabs.appendChild(mk("all", null));
      for (const group of groups) {
        tabs.appendChild(mk(group, group, [...state.agents.values()].filter((a) => groupOf(a) === group).length));
      }
    }

    function buildAgentCard(agent) {
      const card = el("div", "agent-card");
      card.classList.add(agent.status === "online" ? "online" : "offline");
      // Drag to reorder within a group, or across into another group's box.
      card.draggable = true;
      card.addEventListener("dragstart", (e) => {
        dragName = agent.name;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try {
          e.dataTransfer.setData("text/plain", agent.name);
        } catch {
          /* some browsers require a payload; the value itself is unused */
        }
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        // dragend ALWAYS fires (drop does not, e.g. dropped outside a zone), so
        // this is where the arrangement is committed — the drop handler only has
        // to accept the gesture.
        if (dragName) commitDrag(dragName);
        dragName = null;
      });
      if (state.filter === agent.name) card.classList.add("active");
      card.dataset.name = agent.name;
      const tint = chatColor(agent.name);
      if (tint) {
        card.classList.add("tinted");
        card.style.setProperty("--chat-color", tint);
      }

      const online = agent.status === "online";
      const working = online && agent.activity === "working";
      const dot = el("span", `status-dot ${online ? "online" : "offline"}${working ? " working" : ""}`);
      dot.title = online ? (working ? "online · working" : "online · idle") : "offline";

      const name = el("div", "agent-name", displayOf(agent));
      name.title = agent.displayName ? `${agent.displayName} (${agent.name})` : agent.name;
      const role = el("div", "agent-role", agent.role || "—");
      role.title = agent.role || "";

      // Badges: agent-type chip + MCP chip + unread count.
      const badges = el("div", "agent-badges");
      const type = agentTypeOf(agent);
      const typeChip = el("span", "agent-type-chip");
      typeChip.appendChild(agentLogo(type));
      typeChip.appendChild(document.createTextNode(AGENT_TYPE_LABELS[type]));
      typeChip.title = `This agent runs ${AGENT_TYPE_TITLES[type]}`;
      badges.appendChild(typeChip);
      // Idle vs working — what the operator actually watches. (The old "MCP"
      // chip is gone: whether an agent had joined was hub plumbing nobody needed
      // on the card. Its one real use — a queued message waiting for a not-yet-
      // joined agent — surfaces as the unread count regardless.)
      if (online) {
        const act = el("span", `activity-chip${working ? " working" : " idle"}`, working ? "working" : "idle");
        act.title = working
          ? "Mid-turn — this agent is generating or running a tool right now."
          : "Idle — this agent is up and waiting for input.";
        badges.appendChild(act);
      }
      if (agent.unreadCount > 0) {
        const badge = el("span", "unread-badge", String(agent.unreadCount));
        badge.title = `${agent.unreadCount} unread`;
        badges.appendChild(badge);
      }

      // Actions (owner UX feedback: one PRIMARY action per state, the rest in
      // a compact ⋯ menu — four inline buttons crowded the card):
      //   online  → [screen] + ⋯(window, nudge, group, mute)
      //   offline → [reopen] + ⋯(group, mute, remove)
      // Stop propagation everywhere so a control click never toggles the
      // card's feed filter.
      const actions = el("div", "agent-actions");
      // `online` and `working` were computed up top (for the status lamp).

      // The agent's screen is the CARD's job now (one click, no button), so the
      // primary here is the thing the card cannot do: pop a real Windows
      // terminal, for when you want an actual window rather than the panel.
      const primary = el("button", online ? "open-btn" : "reopen-btn", online ? "window" : "reopen");
      primary.type = "button";
      primary.title = online
        ? `Open a Windows terminal window attached to "${agent.name}" (the card alone shows its screen here)`
        : `Relaunch "${agent.name}" in ${agent.cwd} (continues its conversation) and open its window`;
      primary.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (online) openAgentTerminal(agent.name, primary);
        else reopenAgent(agent, primary);
      });

      const menuWrap = el("div", "agent-menu-wrap");
      const kebab = el("button", "menu-btn", "⋯");
      kebab.type = "button";
      kebab.title = "More actions";
      const menu = el("div", "agent-menu");
      menu.hidden = true;

      // One glyph per action so the menu scans by eye, not by reading.
      const MENU_ICONS = {
        "nudge-btn": "📣", "group-btn": "🚪", "codex-btn": "◆", "colour-btn": "🎨",
        "colour-reset-btn": "⭕", "mute-toggle": "🔇", "rename-btn": "✏️", "remove-btn": "🗑",
        "display-btn": "🏷",
      };
      function menuItem(cls, label, title, onClick) {
        const item = el("button", `agent-menu-item ${cls}`);
        const key = cls.split(" ")[0];
        const icon = cls.includes("muted") ? "🔊" : MENU_ICONS[key];
        if (icon) item.appendChild(el("span", "mi-icon", icon));
        item.appendChild(el("span", null, label));
        item.type = "button";
        item.title = title;
        item.addEventListener("click", (ev) => {
          ev.stopPropagation();
          onClick(item);
        });
        return item;
      }

      menu.appendChild(
        menuItem(
          "nudge-btn",
          "nudge",
          "Force a manual nudge (respects the pane guard)",
          () => {
            closeMenus();
            forceNudge(agent.name);
          },
        ),
      );
      // Opens the Groups panel rather than editing here: a group is a container
      // holding several agents, so it is managed where you can see all of them
      // at once. (This used to turn the NAME cell into a group field, which put
      // the group's name where the agent's name lives — confusing, and it left
      // no way to rename a group or put a second agent in one.)
      menu.appendChild(
        menuItem(
          "group-btn",
          "group…",
          `Move "${agent.name}" to another group — it can only message agents in the same one`,
          () => {
            closeMenus();
            openGroups(agent.name);
          },
        ),
      );
      // "Open Codex here": launch the codex sibling in the SAME cwd, so this
      // logical agent gains a second engine (the pair shows engine tabs). Only
      // offered on a claude agent that has no sibling yet.
      if (agentTypeOf(agent) === "claude" && !agent.name.endsWith("-codex") && !state.agents.has(`${agent.name}-codex`)) {
        menu.appendChild(
          menuItem(
            "codex-btn",
            "open codex…",
            `Open a Codex instance on ${agent.name}'s folder — same files, its own session`,
            (item) => {
              openCodexSibling(agent, item);
              closeMenus();
            },
          ),
        );
      }
      // Recolour this chat's cable — a native picker, no blocking dialog. A
      // hidden colour input lives on the item; the item click opens it.
      const colourItem = menuItem(
        "colour-btn",
        chatColor(agent.name) ? "recolour…" : "colour…",
        `Give "${agent.name}" a cable colour in the rail`,
        () => colourPicker.click(),
      );
      const colourPicker = el("input");
      colourPicker.type = "color";
      colourPicker.value = chatColor(agent.name) || "#e0a326";
      colourPicker.style.cssText = "position:absolute;width:0;height:0;opacity:0;pointer-events:none;";
      colourPicker.addEventListener("input", (e) => {
        closeMenus();
        setChatColor(agent.name, e.target.value);
      });
      colourPicker.addEventListener("click", (e) => e.stopPropagation());
      colourItem.appendChild(colourPicker);
      menu.appendChild(colourItem);
      if (chatColor(agent.name)) {
        menu.appendChild(
          menuItem("colour-reset-btn", "clear colour", `Remove "${agent.name}"'s cable colour`, () => {
            closeMenus();
            setChatColor(agent.name, null);
          }),
        );
      }
      menu.appendChild(
        menuItem(
          `mute-toggle${agent.muted ? " muted" : ""}`,
          agent.muted ? "unmute" : "mute",
          agent.muted ? "Unmute nudges" : "Mute nudges (messages are still recorded)",
          () => {
            closeMenus();
            toggleMute(agent.name, !agent.muted);
          },
        ),
      );
      // Nickname: the free display name (emoji ok) — works on a RUNNING agent,
      // because nothing in the protocol reads it. The name cell becomes the
      // editor, like rename, but the kebab id is untouched.
      menu.appendChild(
        menuItem(
          "display-btn",
          "nickname…",
          `Set the display name the UI shows for "${agent.name}" — emoji welcome; empty clears`,
          () => {
            closeMenus();
            startDisplayRename(agent, name);
          },
        ),
      );
      // Rename: the name cell becomes an inline input (no blocking dialogs).
      // Only an OFFLINE agent can be renamed — a live one would re-join under
      // its old name. The item stays VISIBLE while online (greyed, saying why)
      // rather than vanishing: hiding it made the feature look nonexistent to
      // anyone whose agents are all up.
      menu.appendChild(
        menuItem(
          `rename-btn${online ? " disabled" : ""}`,
          "rename id",
          online
            ? `Stop "${agent.name}" first — a running agent would re-join under its old name`
            : "Rename this agent — its message history follows the new name",
          () => {
            closeMenus();
            if (online) {
              toast(
                `To rename "${agent.name}", stop it first: switchboard stop ${agent.name}`,
                "warn",
              );
              return;
            }
            startRename(agent, name);
          },
        ),
      );
      // Remove: ALWAYS offered (the owner's ask — deleting the codex sibling
      // took a trip to the CLI). Online, it stops the tmux session first, then
      // removes the registration. Two-click inline confirmation, no dialogs.
      const removeLabel = online ? "stop & remove" : "remove";
      menu.appendChild(
        menuItem(
          "remove-btn",
          removeLabel,
          online
            ? `Stop "${agent.name}" (kills its tmux session) and remove it from the Hub (messages are kept)`
            : "Remove this agent from the Hub registry (messages are kept)",
          async (item) => {
            if (item.dataset.confirming === "1") {
              closeMenus();
              if (online) {
                try {
                  const res = await fetch(`/api/agents/${encodeURIComponent(agent.name)}/stop`, { method: "POST" });
                  const body = await res.json().catch(() => ({}));
                  if (!res.ok || !body.ok) {
                    toast(`Could not stop "${agent.name}": ${body.error || `HTTP ${res.status}`}`, "warn");
                    return;
                  }
                } catch (err) {
                  toast(`Could not stop "${agent.name}": ${err && err.message ? err.message : err}`, "warn");
                  return;
                }
              }
              removeAgent(agent.name);
              return;
            }
            item.dataset.confirming = "1";
            item.textContent = "sure?";
            item.classList.add("confirming");
            setTimeout(() => {
              item.dataset.confirming = "";
              item.textContent = "";
              item.appendChild(el("span", "mi-icon", "🗑"));
              item.appendChild(el("span", null, removeLabel));
              item.classList.remove("confirming");
            }, 3000);
          },
        ),
      );

      kebab.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wasHidden = menu.hidden;
        closeMenus();
        menu.hidden = !wasHidden;
      });
      menuWrap.append(kebab, menu);

      actions.append(primary, menuWrap);

      // dataset hook kept for the nudge pulse animation (SSE nudge_sent).
      const pulseTarget = menu.querySelector(".nudge-btn");
      if (pulseTarget) pulseTarget.dataset.nudgeFor = agent.name;

      card.append(dot, name, badges, role, actions);
      // Clicking the agent shows the AGENT — its screen, live. The rail is the
      // tab bar and a card is the tab, so making you click a second button to
      // see the thing you just selected was friction for nothing.
      //
      // This used to filter the transcript instead. That is still there, but as
      // what it always was: a filter, living inside Messages where filters
      // belong (see renderFilterBar).
      card.addEventListener("click", () => {
        if (agent.status === "online") openScreen(agent.name);
        else setFilter(agent.name); // no screen to show — fall back to its traffic
      });
      return card;
    }

    /** One menu open at a time; outside click / Esc closes (wired once below). */
    function closeMenus() {
      document.querySelectorAll(".agent-menu").forEach((m) => {
        m.hidden = true;
      });
    }
    document.addEventListener("click", closeMenus);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeMenus();
    });

    async function openAgentTerminal(name, btn) {
      if (btn) btn.disabled = true;
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/terminal`, {
          method: "POST",
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(body.error || `Could not open a window (HTTP ${res.status}).`, "warn");
          return;
        }
        toast(`Windows terminal opened for "${name}".`);
      } catch (err) {
        toast(`Could not open a window: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function reopenAgent(agent, btn) {
      btn.disabled = true;
      btn.textContent = "reopening…";
      try {
        const res = await fetch("/api/agents/launch", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            dir: agent.cwd,
            name: agent.name,
            continue: true,
            openTerminal: true,
            // Relaunch with the SAME CLI it was launched with: reopening a
            // codex agent as claude would resume the wrong conversation with
            // the wrong binary. Legacy records (no agentType) → claude.
            agentType: agentTypeOf(agent),
          }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Reopen failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        const conv = body.fallback
          ? "with a FRESH conversation (no resumable one found)"
          : "continuing its conversation";
        toast(
          body.terminalOpened
            ? `Agent "${agent.name}" reopened ${conv} — its window is opening.`
            : `Agent "${agent.name}" reopened ${conv}. No window could open — ` +
                `use the card's "open" button or: tmux attach -t ${agent.tmuxSession}`,
          body.terminalOpened ? "ok" : "warn",
        );
      } catch (err) {
        toast(`Reopen failed: ${err && err.message ? err.message : err}`, "warn");
      } finally {
        btn.disabled = false;
        btn.textContent = "reopen";
      }
    }

    /**
     * Swaps the card's name cell for an input prefilled with the current name:
     * Enter confirms, Esc / blur cancels — never a blocking browser dialog.
     * The `done` latch makes the three exits idempotent (confirming detaches
     * the focused input, which fires blur right behind it).
     */
    // An agent name is an ADDRESS (%name in a prompt, tmux "sb-<name>"), so the
    // hub only takes ^[a-z0-9][a-z0-9-]{1,30}$. Typing "Chefe de Redes" and
    // getting the regex back as an error makes the user guess the rule — so the
    // name inputs rewrite as you type ("chefe-de-redes") and you confirm what
    // you already see. Mirrors sanitizeAgentName in src/cli/wire.ts, which
    // derives the same shape from a folder name.
    //
    // keepTrailingHyphen: WHILE TYPING the hyphen a just-pressed space produced
    // must survive — trimming it on every keystroke makes "chefe-de"
    // impossible to type. It is trimmed on confirm instead.
    function sanitizeAgentNameInput(raw, keepTrailingHyphen) {
      let s = raw
        .toLowerCase()
        // Fold accents first: "João" → "joao", not "jo-o" (the invalid-run rule
        // below would otherwise eat the letter along with its diacritic).
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9-]+/g, "-") // any invalid run → one hyphen
        .replace(/-+/g, "-") // collapse repeats
        .replace(/^-+/, ""); // a name never starts with a hyphen
      if (!keepTrailingHyphen) s = s.replace(/-+$/, "");
      if (s.length > 31) s = s.slice(0, 31).replace(/-+$/, "");
      return s;
    }

    /**
     * Wires live sanitizing into a name input. Rewriting .value moves the caret
     * to the end, which fights anyone editing mid-string, so the caret is put
     * back where it was minus whatever the rewrite removed.
     */
    function bindAgentNameSanitizer(input) {
      input.addEventListener("input", () => {
        const before = input.value;
        const after = sanitizeAgentNameInput(before, true);
        if (after === before) return;
        const caret = input.selectionStart;
        input.value = after;
        const next = Math.max(0, caret - (before.length - after.length));
        input.setSelectionRange(next, next);
      });
    }

    function startRename(agent, nameEl) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = agent.name;
      input.spellcheck = false;
      input.maxLength = 31; // the hub's rule: ^[a-z0-9][a-z0-9-]{1,30}$
      input.title = "New name — Enter to confirm, Esc to cancel";
      input.setAttribute("aria-label", `New name for agent ${agent.name}`);

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        return false;
      }
      function confirm() {
        // Full sanitize (edge hyphens included): the input already shows the
        // sanitized text, this only settles a trailing hyphen left mid-typing.
        const next = sanitizeAgentNameInput(input.value, false);
        if (restore()) return;
        // Unchanged / emptied → the hub is not worth a round trip.
        if (next === "" || next === agent.name) return;
        renameAgent(agent.name, next);
      }

      // The card itself toggles the feed filter on click — never let the
      // editing interaction reach it.
      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);
      bindAgentNameSanitizer(input);

      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    /**
     * Inline editor for the DISPLAY name (emoji welcome, spaces welcome) — the
     * free-form label the UI shows. Unlike startRename this works on a RUNNING
     * agent: the kebab id (the protocol address) is untouched. Empty clears.
     */
    function startDisplayRename(agent, nameEl) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = agent.displayName || "";
      input.placeholder = agent.name;
      input.spellcheck = false;
      input.maxLength = 48;
      input.title = "Display name (emoji ok) — Enter saves, empty clears, Esc cancels";

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        return false;
      }
      async function confirm() {
        const next = input.value.trim();
        if (restore()) return;
        if (next === (agent.displayName || "")) return;
        try {
          const res = await fetch(`/api/agents/${encodeURIComponent(agent.name)}/display`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ displayName: next }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok || !body.ok) {
            toast(`Could not set the display name: ${body.error || `HTTP ${res.status}`}`, "warn");
            return;
          }
          mergeAgent(body.agent);
          renderAgents();
          renderTabs();
        } catch (err) {
          toast(`Could not set the display name: ${err && err.message ? err.message : err}`, "warn");
        }
      }

      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);

      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    async function renameAgent(name, next) {
      try {
        const res = await fetch(`/api/agents/${encodeURIComponent(name)}/rename`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: next }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Rename failed: ${body.error || `HTTP ${res.status}`}`, "warn");
          return;
        }
        // The SSE pair (agent_removed + agent_updated) also arrives; applying
        // it locally keeps the UI snappy for the click's own tab.
        dropAgent(name);
        mergeAgent(body.agent);
        renderAgents();
        toast(`Agent "${name}" renamed to "${body.agent.name}" (history kept).`);
      } catch (err) {
        toast(`Rename failed: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // =====================================================================
    // Groups panel — one place that shows every room and who is in it.
    // A group holds several agents, so managing it one text field per card
    // meant you could never see the rooms, rename one, or put a second agent
    // into one without retyping the name from memory.
    // =====================================================================

    // Groups with no agent in them yet. The hub only knows a group because an
    // agent is in it, so a group you just created has nowhere to live until you
    // move someone in — it is kept here, in the page, so it can appear in the
    // pickers meanwhile. Nothing is lost on reload but an empty room.
    const draftGroups = new Set();

    function openGroups(focusAgent) {
      $("#groups-box").hidden = false;
      renderGroupsPanel();
      if (focusAgent) {
        const sel = document.querySelector(`.groups-member select[data-agent="${focusAgent}"]`);
        if (sel) sel.focus();
      } else {
        // Opened from "+ group": land on the create field, ready to name a room.
        const nw = $("#groups-new");
        if (nw) nw.focus();
      }
    }

    function closeGroups() {
      $("#groups-box").hidden = true;
      draftGroups.clear(); // an empty group nobody joined was never real
    }

    function panelGroups() {
      return [...new Set([...allGroups(), ...draftGroups])].sort();
    }

    function renderGroupsPanel() {
      const body = $("#groups-body");
      body.textContent = "";
      const groups = panelGroups();

      for (const group of groups) {
        const members = sortedAgents().filter((a) => groupOf(a) === group);
        const box = el("div", "groups-group");

        const head = el("div", "groups-group-head");
        head.append(
          el("span", "groups-group-name", group),
          el("span", "groups-group-count", members.length === 1 ? "1 agent" : `${members.length} agents`),
        );
        // Renaming a group renames it for everyone in it, in one write.
        const rename = el("button", "groups-rename", "rename");
        rename.type = "button";
        rename.title = `Rename "${group}" — every agent in it moves along`;
        rename.addEventListener("click", () => startGroupRename(group, head, rename));
        if (members.length > 0) head.appendChild(rename);
        box.appendChild(head);

        if (members.length === 0) {
          box.appendChild(
            el("div", "groups-empty", "Nobody here yet — move an agent in with the pickers below."),
          );
        }
        for (const agent of members) box.appendChild(buildGroupMemberRow(agent, groups));
        body.appendChild(box);
      }

      // Agents whose group has no box yet cannot happen (every group comes from
      // its agents), so nothing else to render.
      if (groups.length === 0) {
        body.appendChild(el("div", "groups-empty", "No agents registered yet."));
      }
    }

    function buildGroupMemberRow(agent, groups) {
      const row = el("div", "groups-member");
      row.appendChild(buildAvatar(agent.name));
      row.appendChild(el("span", "name", agent.name));
      row.appendChild(el("span", "role", agent.role || ""));

      // A picker, not a text field: the rooms already exist, so choosing beats
      // spelling one from memory. "New group…" is the escape hatch.
      const sel = el("select");
      sel.dataset.agent = agent.name;
      sel.title = `Which group ${agent.name} talks in`;
      for (const group of groups) {
        const opt = el("option", null, group);
        opt.value = group;
        if (group === groupOf(agent)) opt.selected = true;
        sel.appendChild(opt);
      }
      const newOpt = el("option", null, "new group…");
      newOpt.value = "__new__";
      sel.appendChild(newOpt);

      sel.addEventListener("change", () => {
        if (sel.value === "__new__") {
          sel.value = groupOf(agent); // undo the visual pick until one is typed
          $("#groups-new").focus();
          return;
        }
        if (sel.value !== groupOf(agent)) moveAgentToGroup(agent.name, sel.value);
      });
      row.appendChild(sel);
      return row;
    }

    /** Inline rename of a group, in the group's own header — where its name is. */
    function startGroupRename(group, head, trigger) {
      const nameEl = head.querySelector(".groups-group-name");
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = group;
      input.spellcheck = false;
      input.maxLength = 31;
      input.title = "Group name — Enter to confirm, Esc to cancel";

      let done = false;
      function restore() {
        if (done) return true;
        done = true;
        input.replaceWith(nameEl);
        trigger.hidden = false;
        return false;
      }
      function confirm() {
        const next = sanitizeAgentNameInput(input.value, false);
        if (restore()) return;
        if (next === "" || next === group) return;
        renameGroup(group, next);
      }

      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);
      bindAgentNameSanitizer(input);

      trigger.hidden = true;
      nameEl.replaceWith(input);
      input.focus();
      input.select();
    }

    // Inline rename straight in the rail: the group name becomes an input in
    // place. Enter confirms (real server rename via renameGroup), Esc/blur
    // cancels. Events are stopped so editing never folds the group.
    function startRailRename(group, nameSpan) {
      const input = el("input", "agent-rename-input");
      input.type = "text";
      input.value = group;
      input.spellcheck = false;
      input.maxLength = 31;
      input.title = "Group name — Enter to confirm, Esc to cancel";
      let done = false;
      const restore = () => {
        if (done) return true;
        done = true;
        input.replaceWith(nameSpan);
        return false;
      };
      const confirm = () => {
        const next = sanitizeAgentNameInput(input.value, false);
        if (restore()) return;
        if (next === "" || next === group) return;
        renameGroup(group, next);
      };
      input.addEventListener("keydown", (ev) => {
        ev.stopPropagation();
        if (ev.key === "Enter") confirm();
        else if (ev.key === "Escape") restore();
      });
      input.addEventListener("click", (ev) => ev.stopPropagation());
      input.addEventListener("blur", restore);
      bindAgentNameSanitizer(input);
      nameSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    async function renameGroup(group, next) {
      try {
        const res = await fetch(`/api/groups/${encodeURIComponent(group)}/rename`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: next }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) {
          toast(`Could not rename the group: ${body.error || `HTTP ${res.status}`}`, "warn");
          renderGroupsPanel();
          return;
        }
        for (const agent of body.agents) mergeAgent(agent);
        if (state.group === group) state.group = next; // keep reading the same room
        renderAgents();
        renderFeed();
        renderGroupsPanel();
        toast(`Group "${group}" is now "${next}" (${body.agents.length} agent(s) moved).`);
      } catch (err) {
        toast(`Could not rename the group: ${err && err.message ? err.message : err}`, "warn");
      }
    }

    // =====================================================================
    // The agent's screen. tmux tees the pane's bytes to the hub, the hub
    // relays them over SSE, xterm.js paints them; keystrokes go back the same
    // way. No node-pty and no websocket: tmux is already the pty, SSE is
    // already a stream, and the agent outlives this tab because the session
    // belongs to tmux, not to the dashboard.
    // =====================================================================

    const screenState = { name: null, term: null, fit: null, sse: null, ro: null, mode: "chat", chatSse: null };

    // Groups folded away in the rail. Page-local on purpose: which projects you
    // have collapsed right now is a view, not something the hub should store.
    const collapsedGroups = new Set();

    // Agents with a tab open, in the order you opened them. Only the ACTIVE one
    // streams: a tab you are not looking at does not need a live terminal, and
    // re-attaching costs a 2ms capture-pane — the pane has no scrollback to lose
    // (Claude Code redraws its own), so the switch is invisible.
    const openTabs = [];

    function renderTabs() {
      const strip = $("#tab-strip");
      strip.textContent = "";
      for (const name of openTabs) {
        const agent = state.agents.get(name);
        const tab = el("button", `tab${screenState.name === name ? " active" : ""}`);
        tab.type = "button";
        tab.title = agent ? `${name} — ${agent.role || "no role"}` : name;
        tab.append(
          el("span", `dot ${agent && agent.status === "online" ? "online" : "offline"}`),
          el("span", "name", displayOf(name)),
        );
        if (agent && agent.unreadCount > 0) {
          tab.appendChild(el("span", "tab-unread", String(agent.unreadCount)));
        }
        tab.addEventListener("click", () => openScreen(name));

        const close = el("button", "tab-close", "✕");
        close.type = "button";
        close.title = `Close the ${name} tab`;
        close.addEventListener("click", (ev) => {
          ev.stopPropagation();
          closeTab(name);
        });
        tab.appendChild(close);
        strip.appendChild(tab);
      }
